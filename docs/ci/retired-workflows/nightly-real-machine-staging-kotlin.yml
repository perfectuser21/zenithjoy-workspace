name: Nightly Real-Machine Regression (staging)

# Current nightly lane: generic Android account-scan. This is not Android
# customer-service delivery proof. The obsolete web Douyin check is retired.
# API releases separately require same-SHA frozen Brain business acceptance S2/S3.
# Android customer-service CI's 83 offline cases are not physical acceptance.
# Two completed main runs / 36h / complete jobs remain release evidence policy.

on:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 北京 03:00，避开白天真机占用
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-real-machine
  cancel-in-progress: false

jobs:
  # ─── 真安卓 account-scan 真机验证车道 full check（刀D，2026-07-30 接入）───
  # envfail(exit 3,环境未就绪)与真机 bug 同级计红（decision 2f11ae25，supersede 07292330
  # 合同 infra-skip 条款）：exit_code 仍写 job output 供 nightly-report 区分标签，
  # 但 job 一律以真实退出码收尾——车道瘫痪必须红+报警，不准包装成绿。
  account-scan:
    name: 真安卓 — account-scan 真机验证车道
    if: always()
    runs-on: [self-hosted, android-capable]
    timeout-minutes: 10
    outputs:
      exit_code: ${{ steps.run.outputs.code }}
    env:
      # 公网直连路由（SYSTEM 无 Tailscale 身份，run 30794878185 实锤）：hk-vps 公网
      # 高位端口 6443（跨境22被墙）+ runner 专用受限密钥（forced-command 只放行 staging psql）
      # pc4 runner ACL 已在 PR#1593 注入 DB_SSH_HOST/PORT/KEY（公网受限密钥）
      DB_SSH_HOST: root@124.156.138.116
      DB_SSH_PORT: '6443'
      DB_SSH_KEY: /c/actions-runner/.ssh/zjdb_ed25519
    steps:
      - name: Verify GitHub checkout proxy
        shell: bash
        run: |
          # Job-only Git config; never alter the shared machine routing or global Git config.
          # Verify the existing proxy with normal TLS before allowing checkout.
          curl --proxy http://127.0.0.1:7890 --noproxy '' --connect-timeout 3 --max-time 10 -fsSI https://github.com/ -o /dev/null || { echo 'GitHub checkout proxy unavailable' >&2; exit 1; }
          count=${GIT_CONFIG_COUNT:-0}
          case "$count" in ''|*[!0-9]*) echo 'Invalid inherited Git config count' >&2; exit 1;; esac
          if [ "${#count}" -gt 9 ]; then echo 'Invalid inherited Git config count' >&2; exit 1; fi
          count=$((10#$count))
          {
            printf 'GIT_CONFIG_KEY_%s=http.https://github.com/.proxy\n' "$count"
            printf 'GIT_CONFIG_VALUE_%s=http://127.0.0.1:7890\n' "$count"
            printf 'GIT_CONFIG_COUNT=%s\n' "$((count + 1))"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/scripts/smoke
          sparse-checkout-cone-mode: false

      - name: Run account-scan-realmachine-smoke.sh
        id: run
        shell: bash
        run: |
          chmod +x .github/workflows/scripts/smoke/account-scan-realmachine-smoke.sh
          set +e
          bash .github/workflows/scripts/smoke/account-scan-realmachine-smoke.sh
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"

  # ─── 汇总 + 红→自动开 Issue（值班闭环最小版）───
  nightly-report:
    name: Nightly 真机回归汇总（红→开 Issue）
    needs: [account-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Summarize and open issue on failure
        run: |
          ACCOUNT_SCAN="${{ needs.account-scan.result }}"
          ACCOUNT_SCAN_CODE="${{ needs.account-scan.outputs.exit_code }}"
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo "account-scan=$ACCOUNT_SCAN(code=$ACCOUNT_SCAN_CODE)"

          ACCOUNT_SCAN_LABEL="$ACCOUNT_SCAN"
          if [ "$ACCOUNT_SCAN_CODE" = "3" ]; then
            ACCOUNT_SCAN_LABEL="envfail(环境未就绪)"
          fi

          {
            echo "## Nightly 真机回归 $TODAY"
            echo ""
            echo "| 真机能力 | 结果 |"
            echo "|---|---|"
            echo "| 真安卓 account-scan 真机验证车道 | $ACCOUNT_SCAN_LABEL |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACCOUNT_SCAN" != "success" ]; then
            TITLE="[nightly-red] 真机回归失败 $TODAY (account-scan=$ACCOUNT_SCAN_LABEL)"
            # 同日去重：已有同标题 open issue 则不重复开
            EXIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title [nightly-red] $TODAY" --json number --jq 'length')
            if [ "$EXIST" = "0" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" \
                --body "$(printf 'Nightly 真机回归（staging）失败。\n\n| job | 结果 |\n|---|---|\n| account-scan | %s |\n\nRun: %s/%s/actions/runs/%s\n\n处理约定：真机 flaky 先 rerun 一次；连续 2 晚红=真 bug，走 /dev 修。account-scan=envfail(环境未就绪) 同样要处理——车道瘫痪不是噪音（decision 2f11ae25）。' "$ACCOUNT_SCAN_LABEL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
              echo "issue created"
            else
              echo "same-day nightly-red issue already open, skip"
            fi
            exit 1
          fi
          echo "nightly ALL GREEN"
