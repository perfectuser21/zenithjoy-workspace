# Line02 安卓智能获客验收规程 SSOT
#
# 唯一真相源：员工验收网页(scripts/acceptance-spec/cli.mjs generate 生成)与未来的
# evaluator 发版验收机器打表，都从这份文件读取判据，不再各自维护一份。
#
# verifiable_by 三值枚举：
#   machine_db      — 能查预发库/调接口验证（对应 golden-path-2-smoke.sh 或合同断言）
#   machine_visual  — 需要看截图/录屏，未来可能由视觉模型辅助，但本期仍人工
#   human_only      — 真机操作/视觉判断，本期无自动化观测手段
#
# 改这份文件 = 改验收标准的唯一入口；改完跑 `node scripts/acceptance-spec/cli.mjs generate`。

version: "2.1.19"
environment: "预发环境（客户端里地址前缀带「预发-」）"

steps:
  - n: 1
    name: 安装与绑定
    op: 装好本轮安装包；扫码或输入授权码完成绑定
    ev: ["01-状态页截图"]
    cells:
      c1:
        t: 注册成功有提示；失败时页面写清具体原因，不能只说「没绑定成功」
        verifiable_by: human_only
        kind: FR
        fails:
          - 安装包下载失败（已知问题）
          - 扫码/输授权码后没反应
          - 显示失败但没写原因
          - 提示授权码格式不对
          - 注册成功但状态页没显示出来
      c2:
        na: true
      c3:
        t: 用的是本轮发的测试授权码，绑进的是预发环境
        verifiable_by: machine_db
        kind: SOP
        fails:
          - 绑到了生产环境
          - 用错了授权码
      c4:
        na: true
        t: 下载失败属已知问题，照实点选即可

  - n: 2
    name: 版本与环境
    op: 打开客户端状态页，核对版本号和当前连的环境
    ev: ["01-状态页截图"]
    cells:
      c1:
        t: 状态页显示版本号 2.1.19
        verifiable_by: human_only
        kind: FR
        fails:
          - 版本号不对（可能装错包或没更新）
          - 状态页打不开
      c2:
        na: true
      c3:
        t: 环境地址前缀是「预发-」，以客户端实际显示为准
        verifiable_by: human_only
        kind: FR
        fails:
          - 地址不是「预发-」开头
          - 地址栏显示为空
      c4:
        t: 红线1：不能凭安装包文件名或网页地址去猜环境
        hard: true
        verifiable_by: human_only
        kind: SOP
        fails:
          - 没看客户端就凭文件名判断了环境（红线1）

  - n: 3
    name: 运行权限
    op: 把无障碍、截屏、录音三个权限都打开
    ev: ["01-状态页截图"]
    cells:
      c1:
        t: 客户端页面三项权限都清楚显示「已开启」
        verifiable_by: human_only
        kind: FR
        fails:
          - 无障碍开了但显示未开启
          - 截屏权限开不了
          - 录音权限开不了
          - 状态显示含糊看不懂
      c2:
        na: true
      c3:
        na: true
      c4:
        na: true

  - n: 4
    name: 客户端在线
    op: 冷启动客户端一次；重启手机一次，观察恢复
    ev: ["01-状态页截图"]
    cells:
      c1:
        t: 重启或重开后能自己连上线，不用手动杀进程
        verifiable_by: human_only
        kind: FR
        fails:
          - 重启后不自动上线，要手动杀进程重开
          - 冷启动后一直离线
      c2:
        t: 在约定时间窗内恢复在线，不是等半天才连上
        verifiable_by: machine_db
        kind: NFR
        scenario_class: mandatory
        fails:
          - 等了很久才恢复在线
      c3:
        t: 后台看到在线的确实是这台测试机
        verifiable_by: machine_db
        kind: FR
        scenario_class: mandatory
        fails:
          - 后台显示在线的不是这台机
          - 手机已关机后台还显示在线
      c4:
        na: true

  - n: 5
    name: 抖音账号识别
    op: 手机登录2到3个测试小号，触发一次账号扫描；手动让其中一个小号退出登录或断网，制造一次掉线
    ev: ["02-账号扫描截图"]
    cells:
      c1:
        t: 扫出来的是真实账号昵称，不是乱码或占位符
        verifiable_by: human_only
        kind: FR
        fails:
          - 一个账号都扫不出来
          - 昵称是乱码或占位符
          - 扫描一直转圈不结束
      c2:
        na: true
      c3:
        t: 掉线的小号不再显示「可用」
        verifiable_by: machine_db
        kind: FR
        scenario_class: mandatory
        fails:
          - 掉线小号仍显示可用
          - 新扫描结果被旧数据覆盖（红线11）
      c4:
        t: 红线9/10：掉线号不被强行派任务；一个小号出问题不连坐其它小号
        hard: true
        verifiable_by: machine_db
        kind: Invariant
        scenario_class: mandatory
        fails:
          - 掉线号还是被派了任务（红线9）
          - 一个号出问题其它号也被停用（红线10）

  - n: 6
    name: 发起采集
    op: 在预发环境用本轮关键词发起一个采集任务
    ev: ["03-采集开始录屏"]
    cells:
      c1:
        t: 客户端自动打开抖音、进入搜索流程
        verifiable_by: human_only
        kind: FR
        fails:
          - 客户端没拉起抖音
          - 拉起了抖音但没进搜索
      c2:
        na: true
      c3:
        t: 任务记录绑定的是正确的客户账号、这台手机、本轮关键词（红线2）
        verifiable_by: machine_db
        kind: Invariant
        fails:
          - 任务绑错了账号/设备/关键词（红线2）
      c4:
        t: 红线3：不能碰到别的客户的数据
        hard: true
        verifiable_by: machine_db
        kind: Invariant
        fails:
          - 看到了别的客户的数据（红线3）

  - n: 7
    name: 关键词采集
    op: 等任务跑完
    ev: ["03-采集开始录屏"]
    cells:
      c1:
        t: 任务有明确结果不卡死；失败时有具体原因，不是笼统「未知错误」
        verifiable_by: machine_db
        kind: FR
        fails:
          - 一直卡着没有终态
          - 失败只报「未知错误」（已知问题）
          - 失败原因写得看不懂
      c2:
        t: 5分钟内进入终态
        verifiable_by: machine_db
        kind: NFR
        fails:
          - 超过5分钟才出结果
      c3:
        na: true
      c4:
        na: true

  - n: 8
    name: 视频结果
    op: 看这次任务采到了哪些视频
    ev: ["04-视频与判定截图"]
    cells:
      c1:
        t: 至少采到2条真实存在的抖音视频
        verifiable_by: machine_db
        kind: FR
        fails:
          - 一条都没采到
          - 只采到1条
      c2:
        na: true
      c3:
        t: 视频编号是真实长编号（15位以上）
        verifiable_by: machine_db
        kind: FR
        fails:
          - 编号太短明显不真实
      c4:
        t: 红线4：禁止本地随手生成的假编号
        hard: true
        verifiable_by: machine_db
        kind: Invariant
        fails:
          - 出现假编号/占位编号（红线4）

  - n: 9
    name: 内容判定
    op: 观察判定结果变化
    ev: ["04-视频与判定截图"]
    cells:
      c1:
        t: 至少1条视频判出结果，不永远卡在「判定中」
        verifiable_by: machine_db
        kind: FR
        fails:
          - 全部卡在「判定中」不动
      c2:
        t: 3分钟内出结果
        verifiable_by: machine_db
        kind: NFR
        fails:
          - 超过3分钟才出结果
      c3:
        t: 判定结论跟视频实际内容对得上
        verifiable_by: human_only
        kind: FR
        fails:
          - 判定结论和视频内容明显对不上
      c4:
        na: true

  - n: 10
    name: 评论与线索
    op: 看命中视频评论区抓到的内容；用同一关键词再发起一次采集，对照同一视频评论是否被覆盖
    ev: ["05-线索截图"]
    cells:
      c1:
        t: 产出真实线索：昵称、评论、目标身份都能核实
        verifiable_by: machine_db
        kind: FR
        fails:
          - 没产出任何线索
          - 昵称/评论核实不上
      c2:
        na: true
      c3:
        t: 线索里没有按钮名、坐标数字这类系统技术垃圾
        verifiable_by: human_only
        kind: FR
        fails:
          - 线索混入了按钮名/坐标等技术垃圾
      c4:
        t: 红线11：旧评论数据不能覆盖新的
        hard: true
        verifiable_by: machine_db
        kind: Invariant
        scenario_class: mandatory
        fails:
          - 新评论被旧数据覆盖了（红线11）

  - n: 11
    name: 私信派单
    op: 确认本轮线索被派给本轮测试的手机
    ev: ["06-私信执行录屏"]
    cells:
      c1:
        t: 派单目标来自本轮真实产生的线索，不是人工填的固定数据
        verifiable_by: machine_db
        kind: FR
        fails:
          - 没派单
          - 派的目标不是本轮产生的线索
      c2:
        na: true
      c3:
        t: 客户账号、任务、线索、派单串成同一条链（红线2）
        verifiable_by: machine_db
        kind: Invariant
        fails:
          - 链条对不上：任务/线索/设备不一致（红线2）
      c4:
        t: 红线3：不能触达其他客户的数据
        hard: true
        verifiable_by: machine_db
        kind: Invariant
        fails:
          - 碰到了其他客户的数据（红线3）

  - n: 12
    name: 安卓真机私信执行
    op: 从抖音干净首页开始全程连续录屏；搜目标账号进主页核对；没做过就先关注点赞；进私信输入本轮暗号，只点一次发送
    ev: ["06-私信执行录屏", "07-发送端截图"]
    cells:
      c1:
        t: 找对人、私信内容与暗号一字不差不截断、看到提交回执
        verifiable_by: human_only
        kind: FR
        fails:
          - 搜不到目标账号
          - 找错了人
          - 私信内容被截断或不一致
          - 点了发送但没看到回执
          - 找不到私信入口或发送按钮
      c2:
        t: 单个目标90秒内完成或熔断报错；同设备10分钟内最多发3条；关注每小时不超10次、点赞不超15次
        verifiable_by: human_only
        kind: NFR
        fails:
          - 单个目标超90秒也没熔断
          - 10分钟内发了超过3条
          - 关注或点赞超出频控
      c3:
        t: 全程录屏从干净首页开始、连续不剪辑
        verifiable_by: human_only
        kind: SOP
        fails:
          - 录屏没从干净首页开始
          - 录屏中断或被剪辑
      c4:
        t: 红线5/6/7：主页对不上号必须停；无回执不能报成功；同一暗号不重发
        hard: true
        verifiable_by: human_only
        kind: Invariant
        fails:
          - 主页对不上还继续发了（红线5）
          - 没回执却报了成功（红线6）
          - 同一暗号发了两次（红线7）

  - n: 13
    name: 结果确认
    op: 用受控收信账号核对是否收到同一条暗号消息
    ev: ["07-发送端截图", "08-收信端截图"]
    cells:
      c1:
        t: 后台显示的发送结果与收信端真实情况完全一致
        verifiable_by: human_only
        kind: FR
        fails:
          - 后台说发了，收信端没收到
          - 后台说失败，其实收到了
      c2:
        na: true
      c3:
        t: 收信端确认收到的正是本轮暗号，时间对得上
        verifiable_by: human_only
        kind: FR
        fails:
          - 收到的不是本轮暗号
          - 时间对不上
      c4:
        t: 红线8：「被频控限制」不能显示成「已私信」
        hard: true
        verifiable_by: human_only
        kind: Invariant
        scenario_class: unverifiable_this_version
        fails:
          - 「被限制」显示成了「已私信」（红线8）

  - n: 14
    name: 公开评论区自动回复
    op: 不用操作——这个版本没做这个功能
    ev: []
    fixedNa: true
    cells:
      c1:
        t: 固定不适用。红线13：员工手工回评也不能把这步改判通过
        verifiable_by: human_only
        kind: SOP
      c2:
        na: true
      c3:
        na: true
      c4:
        na: true
