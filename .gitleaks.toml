title = "ZenithJoy gitleaks config"

# Inherit gitleaks default rules
[extend]
useDefault = true

# ─── Allowlists (false positives) ─────────────────────────────────────────────

[[allowlists]]
description = "Path 2 — feature key strings 'p2-*' are dashboard navigation keys, not secrets"
regexes = [
  '''p2-[a-z][a-z0-9-]*'''
]

[[allowlists]]
description = "Feishu Bitable test fixtures — bascn* (app_token) / tbl1* (table_id) clearly-fake patterns used in unit tests + plan docs"
regexes = [
  '''bascn[A-Za-z0-9]{6,}''',
  '''tbl1[a-z]{4,}'''
]

[[allowlists]]
description = "ZenithJoy E2E test license key ZJ-F-FBFYTLFR — demo/CI license used in smoke tests, contract DoD, and E2E workflows, not a real production secret"
regexes = [
  '''ZJ-F-FBFYTLFR'''
]

[[allowlists]]
description = "Sprint contract planning docs — contain demo license keys in manual bash test curl examples, not source code"
paths = [
  '''sprints/.*\.md$''',
  '''sprints/.*task-plan\.json$'''
]
