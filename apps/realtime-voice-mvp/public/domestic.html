<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>豆包语音验证（国内版）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0b0e14; color: #e6e6e6; min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #8a8f98; font-size: 13px; margin-bottom: 24px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: #1a1d26; border: 1px solid #2a2f3a; margin-bottom: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .status.connected .dot { background: #3ddc84; }
  .status.listening .dot, .status.speaking .dot, .status.connecting .dot { background: #4f9bff; animation: pulse 1s infinite; }
  .status.error .dot { background: #ff5c5c; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .btns { display: flex; gap: 12px; margin-bottom: 24px; }
  button {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #startBtn { background: #4f9bff; color: #fff; }
  #startBtn:disabled { background: #2a2f3a; color: #666; }
  #stopBtn { background: #23262f; color: #e6e6e6; border: 1px solid #33384a; }
  #stopBtn:disabled { background: #1a1d26; color: #555; }
  .log-title { font-size: 13px; color: #8a8f98; margin-bottom: 8px; }
  #log {
    background: #12151c; border: 1px solid #232733; border-radius: 12px;
    padding: 12px; height: 40vh; overflow-y: auto; font-size: 12px; line-height: 1.7;
    font-family: "SF Mono", Menlo, monospace; color: #9fa8b8;
  }
  #log div { border-bottom: 1px solid #1c2029; padding: 4px 0; }
  #log .err { color: #ff7a7a; }
  #log .evt { color: #4f9bff; }
</style>
</head>
<body>
  <h1>豆包语音验证（国内版）</h1>
  <div class="sub">服务端中继（阿里/豆包链路走服务器转发，规避国内网络直连限制）</div>

  <div id="status" class="status"><span class="dot"></span><span id="statusText">Disconnected</span></div>

  <div class="btns">
    <button id="startBtn">开始</button>
    <button id="stopBtn" disabled>停止</button>
  </div>

  <div class="log-title">事件日志</div>
  <div id="log"></div>

<script>
(function () {
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const logEl = document.getElementById('log');

  let ws = null;
  let micStream = null;
  let micContext = null;
  let micSource = null;
  let micProcessor = null;
  let playContext = null;
  let nextPlayTime = 0;

  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
    line.textContent = `[${t}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
    console.log(`[domestic] ${msg}`);
  }

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusText.textContent = text;
  }

  function downsampleTo16k(float32Input, inputSampleRate) {
    const ratio = inputSampleRate / 16000;
    const outLength = Math.floor(float32Input.length / ratio);
    const out = new Int16Array(outLength);
    for (let i = 0; i < outLength; i++) {
      const srcIndex = Math.floor(i * ratio);
      let s = float32Input[srcIndex];
      s = Math.max(-1, Math.min(1, s));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function playPcmChunk(arrayBuffer) {
    if (!playContext) {
      playContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      nextPlayTime = playContext.currentTime;
    }
    const int16 = new Int16Array(arrayBuffer);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 0x8000;

    const buffer = playContext.createBuffer(1, float32.length, 24000);
    buffer.copyToChannel(float32, 0);

    const source = playContext.createBufferSource();
    source.buffer = buffer;
    source.connect(playContext.destination);

    const startAt = Math.max(nextPlayTime, playContext.currentTime);
    source.start(startAt);
    nextPlayTime = startAt + buffer.duration;
  }

  async function start() {
    startBtn.disabled = true;
    setStatus('connecting', 'Connecting');
    log('请求麦克风权限...');

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      log('麦克风权限获取成功');

      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/ws/domestic`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        log('WebSocket 已连接，通知服务器开始');
        ws.send(JSON.stringify({ type: 'start' }));
        stopBtn.disabled = false;
        startMicStreaming();
      };

      ws.onmessage = (e) => {
        if (typeof e.data === 'string') {
          const msg = JSON.parse(e.data);
          if (msg.type === 'status') {
            const labelMap = { connecting: 'Connecting', connected: 'Connected', listening: 'Listening', speaking: 'Speaking', '': 'Disconnected' };
            setStatus(msg.state, labelMap[msg.state] || msg.state);
          } else if (msg.type === 'log') {
            log(msg.message, 'evt');
          } else if (msg.type === 'error') {
            log(`错误: ${msg.message}`, 'err');
            setStatus('error', 'Error');
          }
        } else {
          playPcmChunk(e.data);
        }
      };

      ws.onerror = () => {
        log('WebSocket 错误', 'err');
        setStatus('error', 'Error');
      };

      ws.onclose = () => {
        log('WebSocket 已断开');
        cleanup();
      };
    } catch (err) {
      log(`错误: ${err.message}`, 'err');
      setStatus('error', 'Error');
      startBtn.disabled = false;
      cleanup();
    }
  }

  function startMicStreaming() {
    micContext = new (window.AudioContext || window.webkitAudioContext)();
    micSource = micContext.createMediaStreamSource(micStream);
    micProcessor = micContext.createScriptProcessor(4096, 1, 1);
    micProcessor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16k = downsampleTo16k(input, micContext.sampleRate);
      ws.send(pcm16k.buffer);
    };
    micSource.connect(micProcessor);
    micProcessor.connect(micContext.destination);
  }

  function cleanup() {
    if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micContext) { micContext.close(); micContext = null; }
    if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    if (playContext) { playContext.close(); playContext = null; }
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function stop() {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'stop' }));
      ws.close();
    }
    cleanup();
    setStatus('', 'Disconnected');
    log('已停止');
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
})();
</script>
</body>
</html>
