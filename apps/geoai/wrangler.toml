# Cloudflare Pages 配置
name = "zenithjoyai"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-01"

# ⚠️ 非机密运行参数必须写在这里，不能只在 Cloudflare 后台 PATCH。
# 原因：`wrangler pages deploy` 会以本地配置为准覆盖远端 env_vars，
# 后台单独 PATCH 的 plain_text 变量会在下一次部署时被清掉
# （2026-09-16 实测：PATCH 写入的 META_GRAPH_API_VERSION / META_PUBLISH_ENABLED
#  部署后消失，只有 secret_text 类型幸存）。
#
# 机密（secret_text）仍只存在于 Cloudflare 后台与 1Password，绝不入库：
#   META_PUBLISH_API_KEY, META_PAGE_ACCESS_TOKEN, META_APP_SECRET
[vars]
META_GRAPH_API_VERSION = "v24.0"
# 初次上线保持关闭。开启前需徐啸对具体内容与账号逐次批准。
META_PUBLISH_ENABLED = "false"

# D1 绑定同样必须写在这里，理由与上面的 [vars] 一致。
# 2026-09-16 实测：只在 Cloudflare 后台 PATCH 出来的 d1_databases，
# 在下一次 `wrangler pages deploy` 之后变成 null（整块配置被本地配置覆盖）。
# 绑定一旦丢失，publish 接口会退化为"无幂等存储"，重复发帖风险直接回归，
# 因此这段不是可选优化，是防重复发布的必要条件。
[[d1_databases]]
binding = "META_PUBLISH_DB"
database_name = "zenithjoy-meta-publish"
database_id = "f93ff6f6-7976-4b9b-9ea4-0842653a927b"
