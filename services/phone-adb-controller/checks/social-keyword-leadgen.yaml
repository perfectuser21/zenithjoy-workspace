# social-keyword-leadgen 声明式探针文件（决策 702949b6 / e2cef2c9）
#
# 这份文件是"写完读回"断言的 SSOT（同 dbt tests / Dagster asset checks）。
# Brain 经 cecelia 仓 scripts/sync-step-probes.mjs 登记本文件 sha256，并把 journey cell 的
# assertion_ref 写成 probe:<key>。改探针 = 改这里发 PR（形状由 checks/schema.json +
# __tests__/checks-social-keyword-leadgen.test.mjs 守）。
#
# 占位符（由执行探针的一方在 run 结束时替换）：
#   $RUN_TAG   本 run 归属键：harvest-cron-v4.sh:35 的 TAG=auto$(date +%m%d%H%M)
#              → 飞书原始评论池「运行批次」列（push-raw-comments.js:46）
#              → PG zenithjoy.leadgen_videos.harvest_batch（leadgen-db-lib.js:26）
#   $LINE_KEY  业务线键 jinuo|yuesheng（line-routes.js:17/36）。调用方 workflow-result.sh 传的是 profile 名
#              （jinoshengyuan-work），verify-step.mjs 经 routeOf().key 归一成路由键后才替换进 SQL；
#              认不出的原样透传。PG 里 leadgen_videos.line_key 存的是路由键（push-videos.js:57 ROUTE.key）。
#   $WORD      本轮关键词（batch2-v4.sh 循环里的 $W）
#
# 取法约定：
#   sql  → target pg_zenithjoy（leadgen-db-connect.js：DATABASE_URL 或 PG* env，库 zenithjoy），
#          query 返回单列；op 为数值比较时取 count/单值，not_null_all 时逐行看是否有空。
#   http → target feishu_jinuo|feishu_yuesheng（line-routes.js 的 base/table），url 为
#          bitable records 列表端点，filter = {列名: 值} 全等过滤（现有脚本都是拉全量后在 JS
#          过滤，同 keyword-stats-lib.js:88-107），reduce = count | field:<列名>；
#          可选 minus 子查询同形，结果 = 主查询 - minus。
#   metric → observed = 本 stage 工件的 metrics[键]（verify-step --metrics-json），只能引本 stage req_keys 的键；
#            用于 preflight/cleanup 这类没有外部数据可查的活动。
#   expect.ref 只能引 workflow-result.sh:33-41 的闭集 metrics 键（metrics.<key>）。
#
# 全部 severity=error（决策 f18f56b8：每个活动后置条件一律拦截，不设 warn/观察期）。
# stage = 契约 product-map/contracts/keyword_acquisition.yaml 的 8 个主干活动（设计顺序：判定在采集之前）。
# 运行时读回目前只接了 delivery/scoring（workflow-result.sh WFR_PROBE_STAGES），其余 6 个 stage 的运行时接线
# 挂任务 6b133a81（单测 RUNTIME_PENDING 棘轮）；其中若干探针在执行顺序纠正（8bb3af55）/真实指标（6b133a81）
# 落地前会如实判红——这是它们该做的事。
# 只写金诺（feishu_jinuo）：harvest-cron-v4.sh:34 默认 BIZ=AI人工智能训练师；悦升同形状
# 换 base H3OrbAH49aLNebs7XvOcpS1enec / 评论池 tblQzIHcmGSPUAZm / 关键词表 tblyKCp5vc7y2S40。

version: 1
workflow: social-keyword-leadgen

probes:
  # ── preflight：设备/账号/通话/锁四件就绪（无外部数据，判账本指标）──
  - key: pf_device_verified
    stage: preflight
    journey_cell: "stage:preflight"
    probe:
      type: metric
      ref: "metrics.device_verified"
    expect:
      op: "=="
      value: 1
    severity: error
    note: >
      设备 serial 在线且身份对得上。harvest-cron.sh:121-133 做 adb 在线/唤醒，workflow-result.sh:161 写 preflight 工件。

  - key: pf_account_verified
    stage: preflight
    journey_cell: "stage:preflight"
    probe:
      type: metric
      ref: "metrics.account_verified"
    expect:
      op: "=="
      value: 1
    severity: error
    note: >
      手机上登录的抖音号 = 本 run 声明的 profile。现状 workflow-result.sh:161 写死 account_verified=0（采收链不读我页），
      本探针会如实判红，直到任务 6b133a81 让预检真读账号标记（Notion 步骤「读账号标记(我页)」）。

  - key: pf_call_idle
    stage: preflight
    journey_cell: "stage:preflight"
    probe:
      type: metric
      ref: "metrics.call_state_idle"
    expect:
      op: "=="
      value: 1
    severity: error
    note: >
      手机不在通话中（通话中操作会误触）。workflow-result.sh:161 写 call_state_idle。

  - key: pf_lock_acquired
    stage: preflight
    journey_cell: "stage:preflight"
    probe:
      type: metric
      ref: "metrics.lock_acquired"
    expect:
      op: "=="
      value: 1
    severity: error
    note: >
      拿到设备锁（douyin-phone-adb lock-acquire，TTL 1800s）。现状 workflow-result.sh:161 写死 lock_acquired=0
      （锁在 harvest-keyword.sh 按词拿），判红直到 6b133a81。

  # ── discovery：候选视频落库（设计顺序下判定要从库里取待判视频）──
  - key: disc_candidates_persisted
    stage: discovery
    journey_cell: "stage:discovery"
    probe:
      type: sql
      target: pg_zenithjoy
      query: |
        SELECT count(*)
          FROM zenithjoy.leadgen_videos
         WHERE harvest_batch = '$RUN_TAG'
           AND keyword = '$WORD'
    expect:
      op: ">="
      ref: "metrics.candidates"
    severity: error
    note: >
      发现交出的对象 = 本词候选视频清单，必须落 leadgen_videos（leadgen-db-lib.js:22-31 upsertVideo，带 keyword/harvest_batch），
      否则判定无米下锅。batch2.sh:37 写 candidates=DV。现状视频在 delivery 才落库（batch2.sh:95-108），
      本探针在 discovery 时点判红，直到执行顺序纠正（8bb3af55）。

  # ── qualification：本批候选全部判完（设计顺序：判定在采集之前）──
  - key: qual_none_pending
    stage: qualification
    journey_cell: "stage:qualification"
    probe:
      type: sql
      target: pg_zenithjoy
      query: |
        SELECT count(*)
          FROM zenithjoy.leadgen_videos
         WHERE harvest_batch = '$RUN_TAG'
           AND judgment_status = 'pending'
    expect:
      op: "<="
      value: 0
    severity: error
    note: >
      判定交出 = 每个候选视频 matched/rejected（CHECK 约束见 20260922_220000_leadgen_ssot_tables.sql:44）。
      judge-video.js 经 leadgen-db-lib.js:54 回写 judgment_status；仍 pending = 没判完就往下走。

  - key: qual_reason_present
    stage: qualification
    journey_cell: "stage:qualification"
    probe:
      type: sql
      target: pg_zenithjoy
      query: |
        SELECT judgment_reason
          FROM zenithjoy.leadgen_videos
         WHERE harvest_batch = '$RUN_TAG'
           AND judgment_status <> 'pending'
    expect:
      op: not_null_all
    severity: error
    note: >
      判过的视频必须带理由（leadgen-db-lib.js:54 同时写 judgment_reason），无理由的判定不可审计。

  # ── collection：只采判定合格的视频 ──
  - key: coll_only_matched
    stage: collection
    journey_cell: "stage:collection"
    probe:
      type: sql
      target: pg_zenithjoy
      query: |
        SELECT count(*)
          FROM zenithjoy.leadgen_videos
         WHERE harvest_batch = '$RUN_TAG'
           AND judgment_status <> 'matched'
           AND process_status = '评论已采'
    expect:
      op: "<="
      value: 0
    severity: error
    note: >
      设计顺序（决策 f18f56b8）：判定合格才采评论。未 matched 却已「评论已采」= 白采。
      现状 upsertVideo 一律写 process_status 默认值「评论已采」（20260922_220000_leadgen_ssot_tables.sql:36，
      leadgen-db-lib.js:26），本探针判红直到 8bb3af55 纠正顺序并按实际写 process_status。

  # ── delivery：落池读回（batch2-v4.sh:64-65 scp TSV → push-videos.js + push-raw-comments.js）──
  - key: videos_readback
    stage: delivery
    journey_cell: "stage:delivery"
    probe:
      type: sql
      target: pg_zenithjoy
      query: |
        SELECT count(*)
          FROM zenithjoy.leadgen_videos
         WHERE harvest_batch = '$RUN_TAG'
    expect:
      op: ">="
      ref: "metrics.videos_processed"
    severity: error
    note: >
      push-videos.js:11-12,56 经 leadgen-db-lib.js:25-26 upsertVideo 写 leadgen_videos.harvest_batch=$RUN_TAG
      （ON CONFLICT DO NOTHING，重复视频不计入）。对账基准 videos_processed 是 collection 阶段按词写的
      （batch2-v4.sh:50 每词一个工件），取本 run 所有 collection 工件的 videos_processed 之和；
      delivery 自身工件不带视频数（batch2-v4.sh:68 只有 leads_written）。
      只按 harvest_batch 归属，与 line_key_not_null 同 WHERE（棒3b-2 决策 8f38f5fd）：一个 run 只跑一个 profile，
      批次键已唯一定界；09-26 实证多带 line_key='$LINE_KEY' 时 --line-key 传的是 profile 名而库里是路由键（push-videos.js:57），
      同 TAG 下本条读 0、line_key_not_null 读 7，口径分叉。

  - key: comments_readback
    stage: delivery
    journey_cell: "stage:delivery"
    probe:
      type: http
      target: feishu_jinuo
      url: "https://open.feishu.cn/open-apis/bitable/v1/apps/GNuwbzY0da8GP0sv6MGcOTu9ntd/tables/tblmrJTyVgzTj89P/records"
      filter:
        运行批次: "$RUN_TAG"
      reduce: count
    expect:
      op: ">="
      ref: "metrics.leads_written"
    severity: error
    note: >
      评论只落飞书原始评论池不落 PG：push-raw-comments.js:8 只 require line-routes，不 require
      leadgen-db-lib（leadgen_comments 表在 v4 链无写入方）。push-raw-comments.js:46 写「运行批次」=$RUN_TAG；
      leads_written = 本地 TSV ^LEAD 行数（batch2-v4.sh:61,68）。push 端内存 Set 去重（push-raw-comments.js:43-44）
      会让池内计数 < leads_written，这正是 readback 要暴露的差值（batch2-v4.sh:68 把 duplicates_skipped 硬写 0）。
      评论池表 id 见 line-routes.js:23。

  - key: line_key_not_null
    stage: delivery
    journey_cell: "stage:delivery"
    probe:
      type: sql
      target: pg_zenithjoy
      query: |
        SELECT line_key
          FROM zenithjoy.leadgen_videos
         WHERE harvest_batch = '$RUN_TAG'
    expect:
      op: not_null_all
    severity: error
    note: >
      leadgen_videos.line_key NOT NULL（apps/api/db/migrations/20260922_220000_leadgen_ssot_tables.sql:28），
      push-videos.js:10 由 routeOf() 解析业务线（line-routes.js:62）。飞书原始评论池没有「业务线」列
      （push-raw-comments.js:46-55 写入字段清单里没有；业务线由 base 本身区分），所以本探针只看 PG 行。
      探针存在的意义是把 DDL 约束以声明形式挂到 journey cell 上，DDL 漂移（约束被去掉）时能读回。

  # ── scoring：分拣推进 + 效果回写（v4 profile 标 not_in_profile，但 Brain cell 存在）──
  - key: pool_advanced
    stage: scoring
    journey_cell: "stage:scoring"
    probe:
      type: http
      target: feishu_jinuo
      url: "https://open.feishu.cn/open-apis/bitable/v1/apps/GNuwbzY0da8GP0sv6MGcOTu9ntd/tables/tblmrJTyVgzTj89P/records"
      filter:
        运行批次: "$RUN_TAG"
        处理状态: "待分拣"
      reduce: count
    expect:
      op: "<="
      value: 0
    severity: error
    note: >
      本批评论仍停在「待分拣」的计数。sort-comments-lib.js:61/98/136 三处 putPool 把「处理状态」推到
      「已分拣」并写「进入最终线索」布尔；本探针的评估时机是 sort-comments 跑完后（batch2.sh:116 落池后同步调起）。

  - key: effective_count
    stage: scoring
    journey_cell: "stage:scoring"
    probe:
      type: http
      target: feishu_jinuo
      url: "https://open.feishu.cn/open-apis/bitable/v1/apps/GNuwbzY0da8GP0sv6MGcOTu9ntd/tables/tbleP4LgzkcwAhiZ/records"
      filter:
        抖音获客-关键词配置: "$WORD"
      reduce: "field:有效线索数"
      minus:
        url: "https://open.feishu.cn/open-apis/bitable/v1/apps/GNuwbzY0da8GP0sv6MGcOTu9ntd/tables/tblmrJTyVgzTj89P/records"
        filter:
          命中关键词: "$WORD"
          进入最终线索: true
        reduce: count
    expect:
      op: "=="
      value: 0
    severity: error
    note: >
      关键词表「有效线索数」由 update-keyword-stats.js:79 PUT 回写；其值定义 = 评论池「进入最终线索」===true
      按「命中关键词」分组计数（keyword-stats-lib.js:88-107 tallyFromPool）。两边相减应为 0；
      非 0 = 回写跑在分拣之前或 PUT 失败（update-keyword-stats.js:80 UPD_FAIL 只打日志）。
      评论池/关键词表 id 见 line-routes.js:23,25。

  # ── outreach：tick 结束时没有卡在「触达中」的单（触达不走账本，只能读线索表）──
  - key: out_no_stuck_inflight
    stage: outreach
    journey_cell: "stage:outreach"
    probe:
      type: http
      target: feishu_jinuo
      url: "https://open.feishu.cn/open-apis/bitable/v1/apps/GNuwbzY0da8GP0sv6MGcOTu9ntd/tables/tblTLFj69CflUqSr/records"
      filter:
        状态: "触达中"
      reduce: count
    expect:
      op: "<="
      value: 0
    severity: error
    note: >
      next-outreach.js:106-108 取单时预写「触达中」防重入，done 时回写 已触达/待触达/触达受阻（next-outreach.js:33-57）。
      tick 收工后仍「触达中」= 单子悬空（进程被杀/回写失败），既不会再被选中也没有结果。线索表 id 见 line-routes.js:21。

  # ── cleanup：关 App、放锁、回安全桌面（无外部数据，判账本指标）──
  - key: cl_app_closed
    stage: cleanup
    journey_cell: "stage:cleanup"
    probe:
      type: metric
      ref: "metrics.close_app_attempts"
    expect:
      op: ">="
      value: 1
    severity: error
    note: >
      收工必须关抖音（douyin-phone-adb close-app）。现状 workflow-result.sh:182 写死 close_app_attempts=0（采收链没调 close-app），
      判红直到 6b133a81。

  - key: cl_lock_released
    stage: cleanup
    journey_cell: "stage:cleanup"
    probe:
      type: metric
      ref: "metrics.lock_released"
    expect:
      op: "=="
      value: 1
    severity: error
    note: >
      设备锁已释放，否则触达拿不到手机。workflow-result.sh:182 当前写死 1（锁实际由 harvest-keyword.sh trap 按词释放），
      6b133a81 改为真读锁目录。

  - key: cl_safe_desktop_visible
    stage: cleanup
    journey_cell: "stage:cleanup"
    probe:
      type: metric
      ref: "metrics.safe_desktop_visible"
    expect:
      op: "=="
      value: 1
    severity: error
    note: >
      手机回到安全桌面（不停在私信/评论页，防误触）。workflow-result.sh:182 写死 0，判红直到 6b133a81。
