[pytest]
# ASCII-only: Windows self-hosted runners parse this file with the locale (GBK)
# codec, which crashes on non-ASCII bytes. Keep comments English-only.
#
# Disable .pytest_cache writes. This module has a packaged copy at
# build-modules/line04/wechat-rpa; the L4 Gate / contract E2E run
# `diff -r src vs packaged` (excluding only *.pyc/__pycache__). pytest writes
# .pytest_cache into rootdir by default, which makes a "pytest then diff" E2E
# wrongly report the source and packaged copy as diverged.
addopts = -p no:cacheprovider
