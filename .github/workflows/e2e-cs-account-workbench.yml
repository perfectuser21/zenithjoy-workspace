name: E2E Line04 微信客服以号为中心工作台（IA 重设计刀2）

# 私域客服「以号为中心」IA 重设计刀2（2026-06-28）前端验收：
#  - vitest（ubuntu）：navigation.config 断言 /area/wechat→CsAreaEntryPage + 总览/单号工作台路由 + 旧路由保留
#  - Playwright（windows_cloud，ZenithJoy UI 死规则）：多号→总览表→下钻工作台 5 Tab；单号直进；越权兜底
# API 全部 stub（page.route），不依赖外部服务。
# windows 惯例（4 条）：npm ci 不缓存 / 装 rollup-win32 native / playwright --with-deps / VITE_SKIP_AUTH=true。

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/src/pages/CsAreaEntryPage.tsx'
      - 'apps/dashboard/src/pages/CsAccountOverviewPage.tsx'
      - 'apps/dashboard/src/pages/CsAccountWorkbenchPage.tsx'
      - 'apps/dashboard/src/pages/WechatCustomerServiceConfigPage.tsx'
      - 'apps/dashboard/src/pages/CsOneClickSetupPage.tsx'
      - 'apps/dashboard/src/pages/CustomerListPage.tsx'
      - 'apps/dashboard/src/pages/CsWorkStatsPage.tsx'
      - 'apps/dashboard/src/components/ListenerHealthSection.tsx'
      - 'apps/dashboard/src/config/navigation.config.ts'
      - 'apps/dashboard/src/config/__tests__/navigation.config.test.ts'
      - 'apps/dashboard/e2e/cs-account-workbench.spec.ts'
      - '.github/workflows/e2e-cs-account-workbench.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/src/pages/CsAreaEntryPage.tsx'
      - 'apps/dashboard/src/pages/CsAccountOverviewPage.tsx'
      - 'apps/dashboard/src/pages/CsAccountWorkbenchPage.tsx'
      - 'apps/dashboard/src/pages/WechatCustomerServiceConfigPage.tsx'
      - 'apps/dashboard/src/pages/CsOneClickSetupPage.tsx'
      - 'apps/dashboard/src/pages/CustomerListPage.tsx'
      - 'apps/dashboard/src/pages/CsWorkStatsPage.tsx'
      - 'apps/dashboard/src/components/ListenerHealthSection.tsx'
      - 'apps/dashboard/src/config/navigation.config.ts'
      - 'apps/dashboard/src/config/__tests__/navigation.config.test.ts'
      - 'apps/dashboard/e2e/cs-account-workbench.spec.ts'
      - '.github/workflows/e2e-cs-account-workbench.yml'
  workflow_dispatch:

concurrency:
  group: e2e-cs-account-workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-vitest:                       # job1：navigation.config 单测（ubuntu，纯前端断言）
    name: job1 — navigation 以号为中心 IA vitest（ubuntu）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Vitest — navigation.config（入口分诊 + 总览/工作台路由）
        working-directory: apps/dashboard
        run: npx vitest run src/config/__tests__/navigation.config.test.ts --reporter=verbose

  dashboard-ui:                            # job2：客服号总览 + 单号工作台 Playwright UI（windows，无 DB）
    name: job2 — 客服号总览 + 单号工作台 5 Tab UI（windows）
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不缓存：npm cache 是 macOS 生成的，缺 Windows optional deps（@rollup/rollup-win32-x64-msvc）

      - name: Install deps
        run: npm ci

      - name: Install Windows rollup native binding
        run: npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'dev-user-001'
          VITE_MOCK_USER_NAME: '测试用户'
        run: |
          npx vite --port 5173 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5173 >/dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5173 || (echo "Vite failed to start"; exit 1)

      - name: Run Playwright E2E — 客服号总览 + 单号工作台
        working-directory: apps/dashboard
        env:
          E2E_BASE_URL: 'http://localhost:5173'
        run: npx playwright test e2e/cs-account-workbench.spec.ts --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cs-account-workbench-artifacts
          path: |
            apps/dashboard/screenshots/
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7
