name: Deploy to HK VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'apps/api/**'
  workflow_dispatch:

concurrency:
  group: deploy-hk-vps
  cancel-in-progress: false

jobs:
  deploy-dashboard:
    name: Build & Deploy Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          rm -rf "apps/dashboard/node_modules" "node_modules"
          npm install --include=optional --workspace=apps/dashboard || {
            echo "npm install failed"
            exit 1
          }
          npm install @rollup/rollup-linux-x64-gnu --workspace=apps/dashboard --no-save --no-package-lock || true

      - name: Create .env.production
        run: |
          cat > apps/dashboard/.env.production << 'ENVEOF'
          VITE_SKIP_AUTH=false
          ENVEOF
          echo "VITE_API_URL=${{ secrets.VPS_API_URL }}" >> apps/dashboard/.env.production
          echo "VITE_SUPER_ADMIN_EMAILS=xuxiao21xx@icloud.com" >> apps/dashboard/.env.production
          echo "✅ .env.production created"
          cat apps/dashboard/.env.production

      - name: Build dashboard
        run: npm run build --workspace=apps/dashboard

      - name: Verify build artifacts
        run: bash apps/dashboard/scripts/verify-build.sh

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HK_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HK_VPS_PORT }} ${{ secrets.HK_VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist to VPS via rsync+SSH
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HK_VPS_PORT }} -o StrictHostKeyChecking=no" \
            apps/dashboard/dist/ \
            ${{ secrets.HK_VPS_USER }}@${{ secrets.HK_VPS_HOST }}:/opt/zenithjoy/autopilot-dashboard/dist/
          echo "✅ dist synced"

      - name: Restart nginx container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT }}
          script: |
            docker restart autopilot-dashboard
            echo "✅ autopilot-dashboard restarted"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & deploy API via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT }}
          script: |
            cd /opt/zenithjoy/repo
            git pull origin main
            docker build -t zenithjoy-api:latest apps/api/
            docker compose -f deploy/docker-compose.hk.yml up -d --no-deps zenithjoy-api
            echo "✅ zenithjoy-api deployed"

  on_deploy_failure:
    name: Deploy Failure Alert
    runs-on: ubuntu-latest
    needs: [deploy-dashboard, deploy-api]
    if: ${{ failure() }}
    steps:
      - name: Alert
        run: |
          curl -sf -X POST http://38.23.47.81:5221/api/brain/tasks \
            -H "Content-Type: application/json" \
            -d '{
              "title": "ZenithJoy Dashboard 部署失败",
              "priority": "P0",
              "task_type": "dev",
              "description": "deploy.yml 失败，请人工介入"
            }' || echo "Brain API 不可达，跳过告警"
