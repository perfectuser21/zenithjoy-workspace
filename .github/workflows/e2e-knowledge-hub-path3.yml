name: E2E Knowledge Hub Path3 (structured workbench)

# A33 接线：独立 workflow，on: pull_request 触发。
# 判据不是"文件存在"，是那个 windows-latest job 的 conclusion == success ——
# 静态形状为真、job 却被条件门跳过时，spec 就是个孤儿，UI 面的断言全部假绿。
# 所以本文件里的 windows job **不带任何 job 级 if 门**（见 A33(c)）。
on:
  pull_request:
    paths:
      - 'apps/api/src/**'
      - 'apps/staff-hub/**'
      - 'apps/staff-hub/e2e/structured-workbench.spec.ts'
      - 'apps/staff-hub/e2e/structured-workbench-rows.spec.ts'
      - 'apps/staff-hub/e2e/structured-workbench-views.spec.ts'
      - 'apps/staff-hub/e2e/structured-workbench-relations.spec.ts'
      - 'apps/staff-hub/e2e/structured-workbench-rollup.spec.ts'
      - 'apps/dashboard/e2e/fields-auth-regression.spec.ts'
      - 'apps/api/db/migrations/**'
      - 'apps/api/vitest.workbench-rows.config.ts'
      - 'apps/api/vitest.workbench-views.config.ts'
      - 'apps/api/vitest.workbench-relations.config.ts'
      - 'apps/api/vitest.workbench-rollup.config.ts'
      - '.github/workflows/e2e-knowledge-hub-path3.yml'
      - '.github/workflows/scripts/smoke/structured-workbench-smoke.sh'
      - 'sprints/08201151-员工知识中枢-路-结构化工作台-c86e37ff/**'
      - 'sprints/08201850-workbench-sprintB-rows/**'
      - 'sprints/08210012-workbench-sprintC-views/**'
      - 'sprints/08220300-workbench-sprintD-relations/**'
      - 'sprints/08222228-workbench-rollup-sprintE/**'
  workflow_dispatch:

concurrency:
  group: e2e-path3-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：这条 workflow 只读代码、跑测试、传截图 artifact，不写任何仓库状态
permissions:
  contents: read

jobs:
  # 段1+段2：Linux 上跑静态守卫 + 真 Postgres 全链（真浏览器在下面的 windows job）
  linux-guards-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenithjoy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
      - name: Build apps/api
        run: npm run build --workspace apps/api
      - name: Run migrations
        run: npm run migrate --workspace apps/api
      - name: 段1 静态守卫（A2 / A35 / A33 / INV 扫描器）
        run: bash .github/workflows/scripts/smoke/structured-workbench-smoke.sh --static-only
      - name: 段2 真 apps/api + 真 Postgres 双企业全链
        run: bash .github/workflows/scripts/smoke/structured-workbench-smoke.sh
      - name: 段2 补跑（无参数全跑不含的三段）
        run: |
          S=.github/workflows/scripts/smoke/structured-workbench-smoke.sh
          # A11 要真起第二个进程验"拦在 listen 之前"；INV-9 要 git grep origin/main
          # （本 job 的 checkout 是 fetch-depth: 0，有那个 ref）
          bash "$S" --a11-only
          bash "$S" --inv-table-claim
          # A4 段⑤ 的 oracle 在 Brain(cecelia) 库，runner 上不可达 —— 这里跑 ①②③④，
          # 段⑤ 由 evaluator 在宿主机用 --a4-only 验（判据见 contract-dod.md）
          bash "$S" --inv-endpoint-auth
      - name: 段1b S2 合同测试真被 vitest 收集执行（4 个文件 / ≥20 用例 / 真 Postgres）
        run: npm run test:workbench-rows --workspace apps/api
      - name: 段2 S2 行链七段（A12 / A13 / A15 / A16 / A17 / A18-A19 / 行层 A1-A3）
        run: |
          S=.github/workflows/scripts/smoke/structured-workbench-smoke.sh
          # 七段各自 fixture-up：--a15-only 必须以小 WORKBENCH_ROW_LIMIT 起服务才验得动上限闸，
          # 与其它段共享一个进程就会让前面几段建行建到一半撞上限（理由见 smoke 文件末尾注释）
          bash "$S" --a12-only
          bash "$S" --a13-only
          bash "$S" --a15-only
          bash "$S" --a16-only
          bash "$S" --a17-only
          bash "$S" --a18-a19-only
          bash "$S" --a1-a3-rows-only
      - name: 段1c S3 视图合同测试真被 vitest 收集执行（4 文件 / >=20 用例 / 真 Postgres）
        run: npm run test:workbench-views --workspace apps/api
      - name: 段2c S3 视图链六段 + 拖卡纯函数（A20 / A21 / A22 / A25 / 视图 A1-A3 / 删视图）
        run: |
          S=.github/workflows/scripts/smoke/structured-workbench-smoke.sh
          # 六段各自 fixture-up；变异证明也各自显式调用它们（判据见 contract-dod.md）
          bash "$S" --a20-only
          bash "$S" --a21-only
          bash "$S" --a22-only
          bash "$S" --a25-only
          bash "$S" --a1-a3-views-only
          bash "$S" --view-delete-only
          bash "$S" --a24-pure-only
      - name: 段1d S4 关联合同测试真被 vitest 收集执行（4 文件 / >=18 用例 / 真 Postgres）
        run: npm run test:workbench-relations --workspace apps/api
      - name: 段2d S4 关联链七段（A27 / A28 / A29② / A30①②③ / A31）
        run: |
          S=.github/workflows/scripts/smoke/structured-workbench-smoke.sh
          # 七段各自 fixture-up；变异证明也各自显式调用它们（判据见 contract-dod.md）
          bash "$S" --a27-only
          bash "$S" --a28-only
          bash "$S" --a29-backref-only
          bash "$S" --a30-row-only
          bash "$S" --a30-table-only
          bash "$S" --a30-field-only
          bash "$S" --a31-only
      - name: 段1e S4 加厚 rollup 合同测试真被 vitest 收集执行（4 文件 / >=14 用例 / 真 Postgres）
        run: npm run test:workbench-rollup --workspace apps/api
      - name: 段2e S4 加厚 rollup 链五段（A37 聚合值 / A38 org 隔离 / A39 降级三支 / A40 类型校验 / 零 DDL）
        run: |
          S=.github/workflows/scripts/smoke/structured-workbench-smoke.sh
          # 五段各自 fixture-up；变异证明也各自显式调用它们（判据见 contract-dod.md）
          bash "$S" --rollup-a37-only
          bash "$S" --rollup-a38-only
          bash "$S" --rollup-a39-only
          bash "$S" --rollup-a40-only
          bash "$S" --rollup-ddl-only
      - name: 段2e A41 墙裁定守卫（rollup 读服务钉死路径 + 检索特征文件零命中，源码级无需 DB）
        run: bash sprints/08222228-workbench-rollup-sprintE/scripts/rollup-wall-guard.sh
      - name: 段2b G2 恢复演练（真 pg_dump + 真还原 + 五表逐条全等）
        run: bash .github/workflows/scripts/backup/restore-drill.sh

  # 段3：windows-latest 干净 VM 真浏览器。
  # **不许加 job 级 if** —— 那正是 A33(c) 要堵的孤儿 spec 形态。
  windows-real-browser:
    runs-on: windows-latest
    needs: linux-guards-and-db
    services: {}
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 起本地 Postgres（windows runner 自带，默认 Disabled 必须先改 StartupType）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $svc = Get-Service postgresql* -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $svc) { throw "FAIL: windows runner 上找不到 PostgreSQL 服务" }
          # runner 镜像里这个服务的启动类型是 Disabled，直接 Start-Service 会报
          # "cannot be started due to the following error"，先改成 Manual 才起得来
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service $svc.Name
          $env:PGPASSWORD = 'root'
          & "$env:PGBIN\psql" -U postgres -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          $env:PGPASSWORD = 'postgres'
          & "$env:PGBIN\psql" -U postgres -c "CREATE DATABASE zenithjoy_e2e;"
          & "$env:PGBIN\psql" -U postgres -d zenithjoy_e2e -c "CREATE SCHEMA IF NOT EXISTS zenithjoy; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          # PGBIN 里的 psql 得进 PATH，e2e-verify.ps1 直接调 psql
          "$env:PGBIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 路③ 真浏览器全链（建表 → 8 类字段 → 可见性 → 删表 → 回收站还原）
        shell: pwsh
        run: pwsh -File "sprints/08201151-员工知识中枢-路-结构化工作台-c86e37ff/e2e-verify.ps1"
      - name: 上传截图（Golden Path 五张）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path3-screenshots
          path: sprints/08201151-员工知识中枢-路-结构化工作台-c86e37ff/screenshots/
          if-no-files-found: warn

      # ── Sprint B（S2 数据进得来）行链三段 ────────────────────────────────
      # 三个 step 各自 seed / 起服务 / 跑完停：谁都不指望上一个 step 留下的后台进程还活着。
      - name: 路③ S2 行链 E2E 准备（依赖 / chromium / migration / apps-api 构建）
        shell: pwsh
        run: pwsh -File "sprints/08201850-workbench-sprintB-rows/e2e-rows-prepare.ps1"
      - name: 路③ S2 行链真浏览器（行内编辑 / 冲突提示 / 断网保留输入 / 粘贴 / 回收站还原）
        shell: pwsh
        run: pwsh -File "sprints/08201850-workbench-sprintB-rows/e2e-rows-run.ps1" -Spec "structured-workbench-rows.spec.ts" -Grep "@rows-offline"
      - name: 路③ S2 行详情面板（字段全集 / 多行编辑区 / 面板开着时该行被删）
        shell: pwsh
        run: pwsh -File "sprints/08201850-workbench-sprintB-rows/e2e-rows-run.ps1" -Spec "structured-workbench-rows.spec.ts" -Grep "@rows-detail"
      - name: 路③ S2 UI 上限硬拦（以小 WORKBENCH_ROW_LIMIT 起服务）
        shell: pwsh
        run: pwsh -File "sprints/08201850-workbench-sprintB-rows/e2e-rows-run.ps1" -Spec "structured-workbench-rows.spec.ts" -Grep "@rows-limit" -RowLimit 3
      - name: 上传本刀截图（S2 行链六张）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path3-rows-screenshots
          path: sprints/08201850-workbench-sprintB-rows/screenshots/
          if-no-files-found: error

      # ── Sprint C（S3 视图切得开）视图链两段 ────────────────────────────────
      # 同一 windows job：npm ci / chromium / migration / apps-api 构建由前面 Sprint B 的 prepare 做过一次，
      # 这两个 step 各自 seed / 起服务 / 跑完停（e2e-views-run.ps1 复用 Sprint B 的 e2e-rows-lib.ps1）。
      - name: 路③ S3 看板拖卡（换列落库 / 409 冲突弹回 / 断网弹回）
        shell: pwsh
        run: pwsh -File "sprints/08210012-workbench-sprintC-views/e2e-views-run.ps1" -Grep "@views-kanban"
      - name: 路③ S3 视图偏好（表格筛排隐藏列 / 断网保存失败可见）
        shell: pwsh
        run: pwsh -File "sprints/08210012-workbench-sprintC-views/e2e-views-run.ps1" -Grep "@views-prefs"
      - name: 上传本刀截图（S3 视图链六张）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path3-views-screenshots
          path: sprints/08210012-workbench-sprintC-views/screenshots/
          if-no-files-found: error

      # ── Sprint D（S4 关联连得上）关联链三段 ────────────────────────────────
      # 同一 windows job：npm ci / chromium / migration / apps-api 构建由前面 Sprint B 的 prepare 做过一次，
      # 这三个 step 各自 seed / 起服务 / 跑完停（e2e-relations-run.ps1 复用 Sprint B 的 e2e-rows-lib.ps1）。
      - name: 路③ S4 关联链真浏览器（建关联字段 → 挑记录 → 单元格显示目标标题）
        shell: pwsh
        run: pwsh -File "sprints/08220300-workbench-sprintD-relations/e2e-relations-run.ps1" -Grep "@relation-build"
      - name: 路③ S4 点关联项跳转目标记录详情
        shell: pwsh
        run: pwsh -File "sprints/08220300-workbench-sprintD-relations/e2e-relations-run.ps1" -Grep "@relation-jump"
      - name: 路③ S4 反向面板列出引用来源
        shell: pwsh
        run: pwsh -File "sprints/08220300-workbench-sprintD-relations/e2e-relations-run.ps1" -Grep "@relation-backref"
      - name: 路③ S4 删被引用记录后单元格失效标记（不显示旧标题·点击不跳 404）
        shell: pwsh
        run: pwsh -File "sprints/08220300-workbench-sprintD-relations/e2e-relations-run.ps1" -Grep "@relation-stale"
      - name: 上传本刀截图（S4 关联链四张）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path3-relations-screenshots
          path: sprints/08220300-workbench-sprintD-relations/screenshots/
          if-no-files-found: error

      # ── Sprint E（S4 加厚 rollup/lookup 聚合）rollup 链三段 ────────────────────
      # 同一 windows job：npm ci / chromium / migration / apps-api 构建由前面 Sprint B 的 prepare 做过一次，
      # 这三个 step 各自 seed / 起服务 / 跑完停（e2e-rollup-run.ps1 复用 Sprint B 的 e2e-rows-lib.ps1）。
      - name: 路③ S4 rollup 建字段配聚合真浏览器（配 sum/count → 单元格显示聚合值）
        shell: pwsh
        run: pwsh -File "sprints/08222228-workbench-rollup-sprintE/e2e-rollup-run.ps1" -Grep "@rollup-build"
      - name: 路③ S4 rollup lookup 多值逗号拼接
        shell: pwsh
        run: pwsh -File "sprints/08222228-workbench-rollup-sprintE/e2e-rollup-run.ps1" -Grep "@rollup-lookup"
      - name: 路③ S4 rollup 删依赖字段后单元格降级占位（不白屏）
        shell: pwsh
        run: pwsh -File "sprints/08222228-workbench-rollup-sprintE/e2e-rollup-run.ps1" -Grep "@rollup-degrade"
      - name: 上传本刀截图（S4 加厚 rollup 链三张）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path3-rollup-screenshots
          path: sprints/08222228-workbench-rollup-sprintE/screenshots/
          if-no-files-found: error
