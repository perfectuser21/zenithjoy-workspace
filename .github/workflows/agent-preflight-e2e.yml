name: Agent Preflight E2E (xian-rog real machine)

on:
  push:
    branches: [main, 'cp-*']
    paths:
      - 'services/agent/src/preflight/**'
      - 'services/agent/package.json'
      - '.github/workflows/agent-preflight-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/agent/src/preflight/**'
      - 'services/agent/package.json'
      - '.github/workflows/agent-preflight-e2e.yml'
  workflow_dispatch:

# 最小权限：self-hosted runner 上只读 repo 内容，不授予写权限（安全硬化）
permissions:
  contents: read

# 同一分支新 push 取消旧运行，避免 self-hosted runner 排队堆积
concurrency:
  group: agent-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-xian-rog:
    runs-on: [self-hosted, wechat-capable]
    timeout-minutes: 10
    steps:
      - name: Prepare existing GitHub-only loopback proxy
        id: github-proxy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $available = $false
          $client = New-Object System.Net.Sockets.TcpClient
          try {
            $pending = $client.BeginConnect('127.0.0.1', 7890, $null, $null)
            if ($pending.AsyncWaitHandle.WaitOne(750, $false)) {
              $client.EndConnect($pending)
              $available = $client.Connected
            }
          } catch {
            # Only probe the already-running loopback service; never start one.
            $available = $false
          } finally {
            $client.Close()
          }
          if ($available) {
            $count = 0
            if (Test-Path Env:GIT_CONFIG_COUNT) {
              if ($env:GIT_CONFIG_COUNT -notmatch '\A[0-9]+\z' -or
                  -not [int]::TryParse($env:GIT_CONFIG_COUNT, [ref]$count) -or
                  $count -eq [int]::MaxValue) {
                throw 'Cannot append GitHub proxy: invalid existing Git config count'
              }
            }
            # Append at the next active index; inherited KEY/VALUE entries remain.
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "GIT_CONFIG_KEY_${count}=http.https://github.com/.proxy"
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "GIT_CONFIG_VALUE_${count}=http://127.0.0.1:7890"
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "GIT_CONFIG_COUNT=$($count + 1)"
            Write-Host 'Existing loopback proxy selected for GitHub Git HTTPS only'
          } else {
            Write-Host 'Loopback proxy unavailable; preserving direct checkout transport'
          }

      - uses: actions/checkout@v4

      - name: Restore complete agent source after reused checkout
        shell: bash
        run: |
          # checkout can remove worktreeConfig and expose a legacy local sparse
          # setting again. Restore this job's tracked inputs before npm/build.
          git sparse-checkout disable
          test -f services/agent/tsconfig.build.json
          test -f services/agent/src/preflight/preflight-runner.ts
          test -f services/agent/src/handlers/__tests__/wechat-rpa.test.ts

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        shell: bash
        working-directory: services/agent
        run: npm ci

      - name: Build
        shell: bash
        working-directory: services/agent
        run: npm run build

      - name: Run preflight line04 (real machine)
        shell: bash
        working-directory: services/agent
        run: |
          node -e "
          const { runPreflight } = require('./dist/preflight/preflight-runner');
          runPreflight('line04-wechat-cs').then(r => {
            console.log(JSON.stringify(r, null, 2));
            // All current checks must pass. A version error must not mask a
            // simultaneous Python/memory failure or become a successful run.
            const requiredChecks = ['wechat_version', 'pywinauto', 'memory'];
            if (r?.ok !== true || requiredChecks.some(key => r.checks?.[key] !== true)) {
              console.error('[preflight] line04 真机检测未通过：' + (r?.reason || '未知或不完整结果'));
              console.error('[preflight] checks=' + JSON.stringify(r?.checks));
              process.exit(1);
            }
            console.log('[preflight] line04 真机检测通过');
          }).catch(e => {
            // 打印完整堆栈 + 平台/Python 上下文，便于真机排查
            console.error('[preflight] runPreflight 抛出异常：', e && e.stack ? e.stack : e);
            console.error('[preflight] platform=' + process.platform + ' arch=' + process.arch);
            process.exit(1);
          });
          "
