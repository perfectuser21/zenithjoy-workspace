name: Implementation impact

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_revision:
        description: '固定基线40位SHA；main中央快照必须已登记'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  caller-contract:
    name: Implementation caller contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 手动运行只接受main
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_REF: ${{ github.ref }}
        run: test "$RUN_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - run: node --test scripts/ci/__tests__/implementation-impact-workflow.test.mjs
      - run: node --test scripts/ci/__tests__/pilot-release-workflow.test.mjs
      - run: node --test scripts/ci/__tests__/implementation-patrol-scope.test.mjs

  scope-classification:
    name: Implementation scope classification
    needs: caller-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.scope.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - name: Classify fixed patrol contract and complete Git diff
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base_revision || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/implementation-patrol-scope.mjs "$GITHUB_WORKSPACE" "$BASE" "$HEAD" "$RUNNER_TEMP/implementation-scope"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/implementation-scope/scope.json
          if-no-files-found: error

  impact:
    name: Implementation impact
    needs: [caller-contract, scope-classification]
    if: needs['scope-classification'].outputs.classification == 'applicable'
    uses: perfectuser21/cecelia/.github/workflows/implementation-impact.yml@68ee3bd092ad6c0d765d26b64799529fe4a0f773
    with:
      source_repo: perfectuser21/zenithjoy-workspace
      scope: cecelia-device-patrol
      base_revision: ${{ github.event.pull_request.base.sha || inputs.base_revision || github.event.before }}
      head_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      tooling_revision: 68ee3bd092ad6c0d765d26b64799529fe4a0f773
    secrets:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
      BRAIN_DEPLOY_URL: ${{ secrets.BRAIN_DEPLOY_URL }}
      CECELIA_ACTIONS_READ_TOKEN: ${{ secrets.CECELIA_ACTIONS_READ_TOKEN }}
