name: E2E Line02 公司信息页 + 采集任务 Table (Windows)

# Line02 公司信息页（CompanyProfilePage）+ 采集任务 Table（AcquisitionConfigPage）
# Playwright E2E on windows-latest，API 全部 stub（page.route），不依赖外部服务。

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/src/pages/CompanyProfilePage.tsx'
      - 'apps/dashboard/src/pages/AcquisitionConfigPage.tsx'
      - 'apps/dashboard/src/api/company-profile.api.ts'
      - 'apps/dashboard/e2e/line02-company-profile-collect.spec.ts'
      - 'apps/api/src/routes/company-profile.ts'
      - '.github/workflows/e2e-line02-company-profile-collect.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/src/pages/CompanyProfilePage.tsx'
      - 'apps/dashboard/src/pages/AcquisitionConfigPage.tsx'
      - 'apps/dashboard/src/api/company-profile.api.ts'
      - 'apps/dashboard/e2e/line02-company-profile-collect.spec.ts'
      - 'apps/api/src/routes/company-profile.ts'
      - '.github/workflows/e2e-line02-company-profile-collect.yml'
  workflow_dispatch:

concurrency:
  group: e2e-line02-company-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-windows:
    name: Playwright — Line02 Company Profile + Collect (Windows Chrome)
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不缓存：npm cache 是 macOS 生成的，缺 Windows optional deps

      - name: Install deps
        run: npm ci

      - name: Install Windows rollup native binding
        # package-lock.json 由 macOS 生成，不含 @rollup/rollup-win32-x64-msvc
        # Vite dev/preview 无条件加载 rollup native，不装就 crash
        run: npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

      - name: Start Vite preview on port 5174
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'e2e-user-line02'
          VITE_MOCK_USER_NAME: 'Line02 E2E User'
        run: |
          npx vite preview --port 5174 --host &
          for i in $(seq 1 30); do
            curl -fs http://localhost:5174 >/dev/null 2>&1 && echo "Vite ready after ${i}s" && break
            sleep 1
          done
          curl -fs http://localhost:5174 || (echo "Vite failed to start"; exit 1)

      - name: Run Playwright E2E — Line02 Company Profile + Collect
        working-directory: apps/dashboard
        env:
          E2E_BASE_URL: 'http://localhost:5174'
        run: npx playwright test e2e/line02-company-profile-collect.spec.ts --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-line02-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7
