name: E2E — Line02 公司信息 + 采集任务

on:
  push:
    branches: [main, 'cp-*']
  pull_request:
    branches: [main]

jobs:
  e2e-line02:
    name: Line02 Company Profile & Collect E2E
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/dashboard

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/dashboard

      - name: Run E2E tests
        run: npx playwright test e2e/line02-company-profile-collect.spec.ts --reporter=html
        working-directory: apps/dashboard
        env:
          E2E_BASE_URL: http://localhost:5174

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-line02
          path: apps/dashboard/playwright-report/
          retention-days: 7
