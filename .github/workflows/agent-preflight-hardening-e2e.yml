name: Agent Preflight Hardening E2E

on:
  push:
    branches: [main, 'cp-*']
    paths:
      - 'services/agent/wechat-rpa/preflight.py'
      - 'services/agent/install-pack/start.bat'
      - 'apps/dashboard/src/config/navigation.config.ts'
      - 'apps/dashboard/src/components/Line04PreflightCard.tsx'
      - 'apps/dashboard/src/pages/WechatCustomerServiceConfigPage.tsx'
      - '.github/workflows/agent-preflight-hardening-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/agent/wechat-rpa/preflight.py'
      - 'services/agent/install-pack/start.bat'
      - 'apps/dashboard/src/config/navigation.config.ts'
      - 'apps/dashboard/src/components/Line04PreflightCard.tsx'
      - 'apps/dashboard/src/pages/WechatCustomerServiceConfigPage.tsx'
      - '.github/workflows/agent-preflight-hardening-e2e.yml'
  workflow_dispatch:

jobs:
  preflight-e2e-static:
    name: Static / Cross-Platform Checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test deps
        run: pip install pytest

      - name: E2E-1 preflight.py --dry-run 8项检测（Linux cross-platform，锁版本已删）
        run: |
          cd services/agent/wechat-rpa
          PUBLIC=/tmp python preflight.py --dry-run || true
          python -c "
          import json, os
          jpath = os.path.join('/tmp', 'zj-preflight.json')
          r = json.load(open(jpath, encoding='utf-8'))
          checks = r['checks']
          assert len(checks) == 8, f'FAIL: 期望8项，实际{len(checks)}项'
          assert not [x for x in checks if x['name'] == 'lock_update'], 'FAIL: lock_update 应已删除'
          print('OK: 8项检测，无 lock_update')
          "

      - name: E2E-1b 版本闸逻辑（锁 4.1.8.x：4.1.9/4.1.10 降级 / 4.1.7 降级 / 4.1.8.x 放行，cross-platform）
        run: |
          cd services/agent/wechat-rpa
          python -c "
          import sys
          from unittest.mock import patch
          sys.path.insert(0, '.')
          from preflight import check_wechat_version
          # 4.1.8.107（== 4.1.8.x）→ 放行 ok
          with patch('preflight.get_weixin_version', return_value='4.1.8.107'), \
               patch('preflight._is_windows', return_value=True):
              base = check_wechat_version(dry_run=True)
          assert base['status'] == 'ok', f'FAIL: 4.1.8.107 应放行 ok，实际 {base[\"status\"]}'
          # 4.1.9 / 4.1.10（>=4.1.9 上界）→ 降级 failed（2026-06-29 锁回 4.1.8.x，反转放开上界）
          for v in ('4.1.9', '4.1.10'):
              with patch('preflight.get_weixin_version', return_value=v), \
                   patch('preflight._is_windows', return_value=True):
                  hi = check_wechat_version(dry_run=True)
              assert hi['status'] == 'failed', f'FAIL: {v}（>=4.1.9）应降级 failed，实际 {hi[\"status\"]}'
              assert '4.1.8' in hi.get('detail', ''), f'FAIL: {v} detail 未提及 4.1.8'
          # 4.1.7（<4.1.8 下界）→ 降级
          with patch('preflight.get_weixin_version', return_value='4.1.7'), \
               patch('preflight._is_windows', return_value=True):
              lo = check_wechat_version(dry_run=True)
          assert lo['status'] == 'failed', f'FAIL: 4.1.7（<4.1.8）应 failed，实际 {lo[\"status\"]}'
          assert '4.1.8' in lo.get('detail', ''), 'FAIL: detail 未提及 4.1.8'
          print('OK: 4.1.8.x 放行 / 4.1.9/4.1.10 降级 / 4.1.7 降级')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: E2E-4 navigation.config.ts 无 requireSuperAdmin
        # 2026-07-06：原 200 字符窗口断言会把下一条路由（/admin/license 的 requireSuperAdmin）
        # 扫进来误报 → 改为只检查 /module-health 自己那一行。
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('apps/dashboard/src/config/navigation.config.ts', 'utf8');
          const line = src.split('\n').find(l => l.includes(\"path: '/module-health'\"));
          if (!line) { console.error('FAIL: 未找到 /module-health 路由'); process.exit(1); }
          if (line.includes('requireSuperAdmin')) {
            console.error('FAIL: /module-health 仍有 requireSuperAdmin');
            process.exit(1);
          }
          console.log('OK: /module-health 无 requireSuperAdmin');
          "

      - name: E2E-5 Line04PreflightCard 组件完整性
        run: |
          node -e "
          const fs = require('fs');
          const card = fs.readFileSync('apps/dashboard/src/components/Line04PreflightCard.tsx', 'utf8');
          if (!card.includes('fetchModuleHealth')) { console.error('FAIL: 缺 fetchModuleHealth'); process.exit(1); }
          if (!card.includes('Agent 未连接')) { console.error('FAIL: 缺无数据提示'); process.exit(1); }
          const page = fs.readFileSync('apps/dashboard/src/pages/WechatCustomerServiceConfigPage.tsx', 'utf8');
          if (!page.includes('Line04PreflightCard')) { console.error('FAIL: 页面未引用组件'); process.exit(1); }
          console.log('OK: Line04PreflightCard 已实现并被页面引用');
          "

      - name: Python pytest 版本降级路径（cross-platform）
        run: |
          cd services/agent/wechat-rpa
          python -m pytest tests/test_preflight_lock.py -v

  preflight-e2e-windows:
    name: Preflight Checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test deps
        run: pip install pytest

      - name: E2E-1 preflight.py --dry-run 8项检测（Windows，锁版本已删）
        shell: pwsh
        run: |
          $env:PUBLIC = $env:TEMP
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          python services\agent\wechat-rpa\preflight.py --dry-run
          # exit code may be nonzero (failed checks on CI env) — just verify JSON content
          python -c @"
          import json, os
          jpath = os.path.join(os.environ.get('TEMP', '/tmp'), 'zj-preflight.json')
          r = json.load(open(jpath, encoding='utf-8'))
          checks = r['checks']
          assert len(checks) == 8, f'FAIL: 期望8项，实际{len(checks)}项'
          assert not [x for x in checks if x['name'] == 'lock_update'], 'FAIL: lock_update 应已删除'
          print('OK: 8项检测，无 lock_update')
          "@
          if ($LASTEXITCODE -ne 0) { throw "E2E-1 FAIL" }

      # 2026-07-06：原 E2E-3「start.bat preflight-failed → blocking」已删除。
      # 它守卫的行为已被产品有意移除：preflight 不再由 start.bat 阻塞执行，
      # 改为 agent core module-manager 启动后非阻塞自跑 + 自愈（见 start.bat Step 6.9 注释）。
      # 守卫一个不存在的行为只会永远红。preflight 本身的正确性由本 job 其余步骤覆盖。

      - name: Python pytest 版本降级路径（Windows全套）
        shell: pwsh
        run: |
          python -m pytest services/agent/wechat-rpa/tests/test_preflight_lock.py -v

      - name: E2E-6 preflight --dry-run 全通路径（exit 0）
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          $env:PUBLIC = $env:TEMP
          $p = Start-Process -FilePath "python" `
              -ArgumentList "services\agent\wechat-rpa\preflight.py", "--dry-run" `
              -WorkingDirectory (Get-Location).Path `
              -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) {
              Write-Warning "E2E-6: preflight --dry-run exit=$($p.ExitCode)（Windows CI 环境含 failed 项，检查是否预期）"
          } else {
              Write-Host "OK: E2E-6 preflight --dry-run exit=0"
          }

      - name: E2E-7 check_wechat_login warn → start.bat 不闪退（员工机场景回归）
        shell: pwsh
        timeout-minutes: 5
        run: |
          # 验证：微信未登录 → preflight 返回 warn（非 failed）→ exit 0 → start.bat 正常启动
          # 这是修复 "员工首次安装时微信未登录 → start.bat 闪退" 的 regression test
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONUTF8 = '1'
          python -c @"
          import sys
          sys.path.insert(0, r'services\agent\wechat-rpa')
          from unittest.mock import patch, MagicMock
          import preflight

          # 模拟 Windows 环境 + 微信已安装但未登录（get_main_window 返回 None）
          mock_mw_module = MagicMock()
          mock_mw_module.get_main_window.return_value = None
          mock_mw_module.login_window_present.return_value = False

          with patch.dict(sys.modules, {'find_weixin': mock_mw_module}), \
               patch('preflight._is_windows', return_value=True), \
               patch('preflight.subprocess', MagicMock()):
              result = preflight.check_wechat_login(dry_run=True)

          print('wechat_login status:', result['status'])
          assert result['status'] == 'warn', f"FAIL: 期望 warn，实际 {result['status']} — 员工机首次安装会闪退！"
          print('OK: check_wechat_login 未登录 → warn（start.bat 不会因此闪退）')
          "@
          if ($LASTEXITCODE -ne 0) { throw "E2E-7 FAIL: check_wechat_login 未登录仍返回 failed" }

          # 进一步验证：仅含 warn 项 → compute_exit_code = 0
          python -c @"
          import sys
          sys.path.insert(0, r'services\agent\wechat-rpa')
          from preflight import compute_exit_code
          checks = [
              {'name': 'wechat_login', 'status': 'warn', 'detail': '未登录'},
              {'name': 'wechat_installed', 'status': 'ok', 'detail': '已安装'},
          ]
          code = compute_exit_code(checks)
          assert code == 0, f'FAIL: compute_exit_code 含 warn 应返回 0，实际 {code}'
          print('OK: warn-only checks → exit 0（start.bat 继续执行，不闪退）')
          "@
          if ($LASTEXITCODE -ne 0) { throw "E2E-7b FAIL" }

      - name: 清理测试 fixture（防止残留影响其他 job）
        if: always()
        shell: pwsh
        run: |
          $fixtureDir = "C:\Program Files\Tencent\Weixin"
          if (Test-Path $fixtureDir) {
            # 先移除 icacls deny，允许删除
            icacls "$fixtureDir" /reset /T /Q 2>$null
            Remove-Item -Recurse -Force $fixtureDir -ErrorAction SilentlyContinue
            Write-Host "✅ 清理测试 fixture 目录完成"
          }
          # 清理防火墙规则（netsh 规则不存在时返回 1，用 | Out-Null 忽略退出码）
          netsh advfirewall firewall delete rule name="Block WeixinUpdate" 2>$null | Out-Null
          netsh advfirewall firewall delete rule name="Block WeixinUpdate dldir1v6.qq.com" 2>$null | Out-Null
          netsh advfirewall firewall delete rule name="Block WeChat Update weixin.qq.com" 2>$null | Out-Null
          Write-Host "✅ 清理防火墙规则完成"
          exit 0

