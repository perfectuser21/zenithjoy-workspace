name: DB Backup + Restore Drill (G2)

# G2：pg_dump 定时备份 + 恢复演练。
#
# 两件事必须在**同一个 job 的同一次运行内**完成：备份跑了但从没还原过 = 假绿，
# 真出事那一刻才发现备份是空的。所以这里没有"只备份"的路径——restore-drill.sh
# 自己会种可判别数据、dump、还原到临时库、五表逐条比对全等，任一环红就整个 job 红。
#
# 明确不做的事（合同「未覆盖真实链路清单」#1/#2 已登记）：
#   * 异地对象存储：需要 COS_SECRET_ID / COS_SECRET_KEY 两个仓库 secret，当前 repo 未配置。
#     配好后由 Sprint B 补 upload step，并把 A5 断言扩展到"从 COS 拉回的备份还原全等"。
#     在此之前 G2 状态是 logic-done-pending-offsite —— 备份与恢复演练这两件本身是真跑真验的。
#   * 生产库接线：需要 PROD_DATABASE_URL，属主理人放行范围。库连接串已参数化，届时改 input 即可。
on:
  schedule:
    # 每天 UTC 18:00 = 北京 02:00，避开白天负载
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      database_url_secret_name:
        description: '要备份的库（留空 = CI 库）。填 secret 名，不填连接串本身。'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/db-backup.yml'
      - '.github/workflows/scripts/backup/**'

# 最小权限：只读代码 + 传备份 artifact，不写任何仓库状态
permissions:
  contents: read

jobs:
  backup-and-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenithjoy_backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_backup
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 对齐 pg 客户端大版本（客户端比服务端旧时 pg_dump 直接拒绝工作）
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Install deps
        run: npm ci
      - name: Run migrations（演练要比对路③ 五表，先得有这五张表）
        run: npm run migrate --workspace apps/api
      - name: 备份 + 恢复演练（同一次运行内，无 continue-on-error）
        run: bash .github/workflows/scripts/backup/restore-drill.sh
      - name: 路② 协同笔记 documents 备份恢复演练（content jsonb + crdt_state bytea 七字段全等）
        run: bash sprints/08221200-line11-path2-collab-notes/backup-restore-drill.sh
      - name: 留存本次备份产物（14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-backup-${{ github.run_id }}
          path: /tmp/wb-drill-*.dump
          retention-days: 14
          if-no-files-found: warn
