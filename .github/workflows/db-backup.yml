name: CI Fixture Backup + Restore Drill (G2)

# 仅在独立CI测试库种数据、备份、恢复并比对。
# 此运行不证明生产备份或异地副本可恢复；生产证据另行留在任务账。
on:
  schedule:
    # 每天 UTC 18:00 = 北京 02:00，避开白天负载
    - cron: '0 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/db-backup.yml'
      - '.github/workflows/scripts/backup/**'

# 最小权限：只读代码 + 传备份 artifact，不写任何仓库状态
permissions:
  contents: read

jobs:
  backup-and-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenithjoy_backup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_backup
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenithjoy_backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 对齐 pg 客户端大版本（客户端比服务端旧时 pg_dump 直接拒绝工作）
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Install deps
        run: npm ci
      - name: Run migrations（演练要比对路③ 五表，先得有这五张表）
        run: npm run migrate --workspace apps/api
      - name: 备份 + 恢复演练（同一次运行内，无 continue-on-error）
        run: bash .github/workflows/scripts/backup/restore-drill.sh
      - name: 路② 协同笔记 documents 备份恢复演练（content jsonb + crdt_state bytea 七字段全等）
        run: bash sprints/08221200-line11-path2-collab-notes/backup-restore-drill.sh
      - name: 留存本次备份产物（14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fixture-backup-${{ github.run_id }}
          path: /tmp/wb-drill-*.dump
          retention-days: 14
          if-no-files-found: warn
