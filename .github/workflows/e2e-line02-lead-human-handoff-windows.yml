name: E2E — Line02 留言人工跟进 & LeadsTable 统一

# 可 required 设计：去掉原生 on.pull_request.paths 门（否则不相关 PR 整条 workflow 不跑、
# required check 永远等不到会锁死全仓 PR）。改为 workflow 每 PR 都跑，内部 changes job
# 用 git diff 判定是否跑真 job；always() 聚合 gate「Line02 Lead Gate Passed」在真 job
# 跳过时照样报绿。required 挂聚合 gate，不挂原始 job。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_database_url:
        description: 'E2E_DATABASE_URL (evaluator manual dispatch only)'
        required: false

concurrency:
  group: e2e-line02-lead-human-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes — 变更路径检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lead: ${{ steps.filter.outputs.lead }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "lead=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event: run all"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE...$HEAD")
          echo "$FILES"
          LEAD=false
          if echo "$FILES" | grep -qE '^(apps/api/src/routes/acquisition\.ts|apps/api/src/services/acquisition-dispatch\.ts|apps/dashboard/src/components/LeadsTable\.tsx|apps/dashboard/src/pages/LeadsPage\.tsx|apps/dashboard/src/pages/AcquisitionTasksPage\.tsx|apps/dashboard/e2e/leads-unified-table\.spec\.ts|services/agent/src/line02/reply-poller\.ts|sprints/07032333-line02-lead-human-handoff/|\.github/workflows/e2e-line02-lead-human-handoff-windows\.yml$)'; then
            LEAD=true
          fi
          echo "lead=$LEAD" >> "$GITHUB_OUTPUT"

  # PR CI job: ubuntu-latest + Postgres + apps/api + Vite dev server（第3条测试打真实 API，需要真后端）
  e2e:
    name: Playwright — Line02 LeadsTable 统一（ubuntu chromium）
    needs: changes
    if: needs.changes.outputs.lead == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: cecelia
      DATABASE_PASSWORD: cecelia
      DATABASE_NAME: cecelia
      PORT: 5200
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5200
      ASSIGNEE_ROSTER: '["客服A","客服B"]'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Create zenithjoy schema + pgcrypto
        env:
          PGPASSWORD: cecelia
        run: |
          psql -h localhost -U cecelia -d cecelia -c "CREATE SCHEMA IF NOT EXISTS zenithjoy;"
          psql -h localhost -U cecelia -d cecelia -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Run apps/api/db migrations
        env:
          PGPASSWORD: cecelia
        run: |
          for f in apps/api/db/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U cecelia -d cecelia -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build apps/api
        working-directory: apps/api
        run: npm run build

      - name: Start apps/api
        working-directory: apps/api
        run: |
          node dist/index.js > /tmp/apps-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5200/health >/dev/null 2>&1; then
              echo "apps/api ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5200/health || (cat /tmp/apps-api.log && exit 1)

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'ci-e2e-user'
          VITE_MOCK_USER_NAME: 'CI E2E User'
        run: |
          npx vite --port 5174 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5174 > /dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5174 || (echo "Vite failed to start"; exit 1)

      - name: Run Playwright E2E
        working-directory: apps/dashboard
        env:
          E2E_BASE_URL: 'http://localhost:5174'
        run: npx playwright test e2e/leads-unified-table.spec.ts --reporter=list

      - name: Dump apps/api log on failure
        if: failure()
        run: cat /tmp/apps-api.log || true

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-line02-lead-human-handoff-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/screenshots/
          retention-days: 7

  # Evaluator job: windows-latest + 真实后端（仅 workflow_dispatch 手动触发）
  e2e-windows:
    name: Playwright — Line02 LeadsTable 统一（windows-latest evaluator）
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Run E2E verify script
        working-directory: sprints/07032333-line02-lead-human-handoff
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || inputs.e2e_database_url }}
        run: ./e2e-verify.ps1

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-line02-lead-human-handoff-windows-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/screenshots/
          retention-days: 7

  # ─── 聚合 gate（required context）───────────────────────────────────────────
  # 每 PR 都跑；真 e2e job 跳过（不相关 PR）视为通过，失败才红。required 挂这个。
  # e2e-windows 是 dispatch-only evaluator，不纳入 gate。
  lead-gate:
    name: Line02 Lead Gate Passed
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Line02 Lead Gate
        run: |
          echo "changes=${{ needs.changes.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "FAIL: changes 检测未成功"; exit 1
          fi
          case "${{ needs.e2e.result }}" in
            success|skipped) ;;
            *) echo "FAIL: e2e 结果为 ${{ needs.e2e.result }}"; exit 1 ;;
          esac
          echo "Line02 Lead Gate Passed"
