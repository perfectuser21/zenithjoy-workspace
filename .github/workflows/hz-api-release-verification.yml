name: Hangzhou API staging business verification

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
        description: Full SHA currently deployed to Hong Kong staging API
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    secrets:
      STAGING_ACCEPTANCE_EMAIL:
        required: true
      STAGING_ACCEPTANCE_PASSWORD:
        required: true
    outputs:
      sha:
        value: ${{ jobs.verification.outputs.sha }}
      api_run_id:
        value: ${{ jobs.verification.outputs.api_run_id }}
      api_run_attempt:
        value: ${{ jobs.verification.outputs.api_run_attempt }}

permissions:
  contents: read
  actions: read

jobs:
  verification:
    if: github.repository == 'perfectuser21/zenithjoy-workspace' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: zenithjoy-staging-acceptance
    concurrency:
      group: zenithjoy-hk-dashboard-business-verification
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.stage.outputs.sha }}
      api_run_id: ${{ steps.stage.outputs.api_run_id }}
      api_run_attempt: ${{ steps.stage.outputs.api_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bind the running staging API to its exact image artifact
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          node scripts/release-gate/hz-api-staging-evidence.mjs "$SHA" > "$RUNNER_TEMP/hz-api-staging-before.json"
          cat "$RUNNER_TEMP/hz-api-staging-before.json"
      - name: Verify real API authentication, draft and retry in Hong Kong staging
        env:
          EXPECTED_API_SHA: ${{ steps.stage.outputs.sha }}
          API_STAGING_RUN_ID: ${{ steps.stage.outputs.api_run_id }}
          API_STAGING_RUN_ATTEMPT: ${{ steps.stage.outputs.api_run_attempt }}
          STAGING_ACCEPTANCE_EMAIL: ${{ secrets.STAGING_ACCEPTANCE_EMAIL }}
          STAGING_ACCEPTANCE_PASSWORD: ${{ secrets.STAGING_ACCEPTANCE_PASSWORD }}
          STAGING_ACCEPTANCE_TENANT_ID: ${{ vars.STAGING_ACCEPTANCE_TENANT_ID }}
          HZ_API_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/hz-api-business-verification.json
        run: node scripts/release-gate/hz-api-business-smoke.mjs
      - name: Confirm the staging API and its artifact stayed fixed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.stage.outputs.sha }}
        run: |
          set -euo pipefail
          GITHUB_OUTPUT='' node scripts/release-gate/hz-api-staging-evidence.mjs "$SHA" > "$RUNNER_TEMP/hz-api-staging-after.json"
          cmp "$RUNNER_TEMP/hz-api-staging-before.json" "$RUNNER_TEMP/hz-api-staging-after.json"
      - name: Summarize the candidate and verified staging attempt
        env:
          SHA: ${{ steps.stage.outputs.sha }}
          STAGED_RUN: ${{ steps.stage.outputs.api_run_id }}
          STAGED_ATTEMPT: ${{ steps.stage.outputs.api_run_attempt }}
        run: printf 'API %s %s/%s\n' "$SHA" "$STAGED_RUN" "$STAGED_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
      - name: Store immutable API verification results
        uses: actions/upload-artifact@v4
        with:
          name: hz-api-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hz-api-business-verification.json
            ${{ runner.temp }}/hz-api-staging-before.json
          if-no-files-found: error
          retention-days: 14
