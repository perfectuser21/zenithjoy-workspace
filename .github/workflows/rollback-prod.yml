name: Rollback Production HK :5200（留存镜像回退）

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '已成功运行并留存的完整 SHA（留空=上一个版本）'
        required: false
        default: ''
      confirm:
        description: '输入 ROLLBACK 确认回退 HK 生产 API'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  rollback:
    concurrency:
      group: zenithjoy-production-hk
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 确认留存镜像回退
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = ROLLBACK
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: 回退 HK 实际旧镜像并验证健康及版本
        env:
          SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.HK_VPS_TAILSCALE_IP || '100.86.118.99' }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            -i "$KEY_FILE" "root@${SSH_HOST}" bash -s -- rollback "$INPUT_SHA" \
            < scripts/deploy/hk-api-release.sh
