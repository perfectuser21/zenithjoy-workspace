name: Promote API to Production HK
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 已在staging通过的完整40位SHA
        required: true
        type: string
      acceptance_run_key:
        description: 冻结同版本且已定案的Brain验收单
        required: true
        type: string
      confirm:
        description: 输入PROMOTE
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      acceptance_run_key:
        required: true
        type: string
      confirm:
        required: false
        type: string
        default: PROMOTE
permissions:
  contents: read
  actions: read
jobs:
  admission:
    uses: ./.github/workflows/release-admission.yml
    with:
      sha: ${{ inputs.sha }}
      targets: api
      acceptance_run_key: ${{ inputs.acceptance_run_key }}
    secrets: inherit
  promote-prod-hk:
    name: Promote 生产 :5200（HK docker）
    needs: [admission]
    concurrency:
      group: zenithjoy-production-hk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm promotion
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: test "$CONFIRM" = PROMOTE
      - name: 接入 Tailscale（走内网）
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - uses: actions/checkout@v4

      - name: Promote verified SHA via SSH（保留镜像，失败自动恢复）
        env:
          SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.HK_VPS_TAILSCALE_IP || '100.86.118.99' }}
          DEPLOY_SHA: ${{ needs.admission.outputs.sha }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            -i "$KEY_FILE" "root@${SSH_HOST}" bash -s -- promote "$DEPLOY_SHA" \
            < scripts/deploy/hk-api-release.sh
