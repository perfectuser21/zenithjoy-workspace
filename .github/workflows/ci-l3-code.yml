name: L3 Code Gate

# L3: 代码质量检查 — 按模块变更触发（~5min）
# 职责：Lint、TypeCheck、Build、Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change Detection ────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api: ${{ steps.filter.outputs.api }}
      geoai: ${{ steps.filter.outputs.geoai }}
      ci: ${{ steps.filter.outputs.ci }}
      agent_modules: ${{ steps.filter.outputs.agent_modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: filter
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "dashboard=true" >> $GITHUB_OUTPUT
              echo "api=true" >> $GITHUB_OUTPUT
              echo "geoai=true" >> $GITHUB_OUTPUT
              echo "ci=true" >> $GITHUB_OUTPUT
              echo "agent_modules=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          else
            BASE_REF="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")
          fi

          echo "$CHANGED" | grep -q "^apps/dashboard/" \
            && echo "dashboard=true" >> $GITHUB_OUTPUT || echo "dashboard=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q "^apps/api/" \
            && echo "api=true" >> $GITHUB_OUTPUT || echo "api=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q "^apps/geoai/" \
            && echo "geoai=true" >> $GITHUB_OUTPUT || echo "geoai=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -qE "^\.github/|^tsconfig\.base\.json$|^package\.json$" \
            && echo "ci=true" >> $GITHUB_OUTPUT || echo "ci=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -qE "^services/agent/modules/|^services/agent/scripts/build-line-module\.sh$" \
            && echo "agent_modules=true" >> $GITHUB_OUTPUT || echo "agent_modules=false" >> $GITHUB_OUTPUT

  # ─── Dashboard ───────────────────────────────────────────────────────
  dashboard-lint:
    name: Dashboard Lint
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      # 棘轮制：78 = 2026-07-05 实测警告数，只许降不许涨；目标 ≤20（消警告另立 sprint）
      - run: npx eslint . --max-warnings 78
        working-directory: apps/dashboard

  dashboard-typecheck:
    name: Dashboard Typecheck
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - run: npx tsc --noEmit
        working-directory: apps/dashboard

  dashboard-build:
    name: Dashboard Build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - name: Fix rollup optional deps (npm ci bug workaround)
        working-directory: apps/dashboard
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true
      - run: mkdir -p apps/dashboard/public/gallery/chatgpt-cards apps/dashboard/public/gallery/deep-post-cards
      - run: npm run build
        working-directory: apps/dashboard
        env:
          CORE_FEATURES_PATH: ./src/stubs/core-features
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          retention-days: 7

  # ─── API ─────────────────────────────────────────────────────────────
  api-lint:
    name: API Lint
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/api
      # 棘轮制：40 = 2026-07-05 实测警告数（贴线），只许降不许涨；目标 ≤20（消警告另立 sprint）
      - run: npx eslint src/ --max-warnings 40
        working-directory: apps/api

  api-typecheck:
    name: API Typecheck
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/api
      - run: npx tsc --noEmit
        working-directory: apps/api

  # ─── GeoAI ──────────────────────────────────────────────────────────
  geoai-build:
    name: GeoAI Build
    needs: changes
    if: needs.changes.outputs.geoai == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fix Linux native optional deps missing from macOS-generated lock file
        run: |
          npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu 2>/dev/null || true
          src="node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node"
          dst="node_modules/lightningcss/lightningcss.linux-x64-gnu.node"
          [ -f "$src" ] && [ ! -f "$dst" ] && cp "$src" "$dst" || true
      - run: npm run build
        working-directory: apps/geoai

  # ─── Security ────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # 两段 npm audit（根目录+apps/dashboard）走 registry 网络慢时各 5min 上下，10min 总窗被吃满（2026-09-04 实测被 cancel）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      # audit-gate 含 devDependencies（旧 --omit=dev 藏住过 6 个 high，2026-07-05 repo-audit 抓出）
      # npm audit 只读 lockfile，无需 npm ci
      - name: 根目录依赖漏洞门禁（含 dev）
        run: bash .github/workflows/scripts/audit-gate.sh .
      - name: dashboard 依赖漏洞门禁（含 dev）
        run: bash .github/workflows/scripts/audit-gate.sh apps/dashboard

  # ─── OpenClaw scripts ────────────────────────────────────────────────
  # phonectl（件3 信号桥薄壳）等 scripts/openclaw/ 下脚本的 Node 单测。这些是根级
  # 独立脚本，不属于任何 workspace，不会被 apps/api 的 vitest 捡到——不接进某个
  # 具体闸就是孤儿测试（devgate/detect-review-issues.js 已吃过这个亏，见 PR#1769：
  # 两份回归测试写了半年从未跑过，同一类误判复发 4 次）。无条件跑（纯 node --test，
  # 无需装依赖，几秒钟），不按变更路径过滤。
  openclaw-scripts-test:
    name: OpenClaw Scripts Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: node --test scripts/openclaw
        run: node --test scripts/openclaw/**/*.test.js

  # ─── Agent Line Modules ──────────────────────────────────────────────
  # 2026-07-12 巡检抓漏：line-module TS 编译此前只在 push main 的 agent-installpack
  # 跑，PR 阶段无闸 → PR#1245 的 TS2459 直接红在主干。此 job 把同一构建脚本前移到 PR 闸。
  line-module-build:
    name: Line Module Build (${{ matrix.lineId }})
    needs: changes
    if: needs.changes.outputs.agent_modules == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lineId: [line04, line01, line02, line05]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/agent
      - run: bash scripts/build-line-module.sh ${{ matrix.lineId }}
        working-directory: services/agent

  # ─── L3 Gate ──────────────────────────────────────────────────────────
  l3-passed:
    name: L3 Code Gate Passed
    needs:
      - changes
      - dashboard-lint
      - dashboard-typecheck
      - dashboard-build
      - api-lint
      - api-typecheck
      - geoai-build
      - security
      - openclaw-scripts-test
      - line-module-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: L3 Code Gate
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  L3 Code Gate"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          FAILED=false

          if [ "${{ needs.changes.result }}" = "failure" ]; then
            echo "FAIL: Detect Changes"
            FAILED=true
          fi

          # Dashboard (conditional)
          if [ "${{ needs.changes.outputs.dashboard }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            for job_result in \
              "Dashboard Lint:${{ needs.dashboard-lint.result }}" \
              "Dashboard Typecheck:${{ needs.dashboard-typecheck.result }}" \
              "Dashboard Build:${{ needs.dashboard-build.result }}"; do
              NAME="${job_result%%:*}"
              RESULT="${job_result##*:}"
              if [ "$RESULT" != "success" ]; then
                echo "FAIL: $NAME ($RESULT)"
                FAILED=true
              fi
            done
          fi

          # API (conditional)
          if [ "${{ needs.changes.outputs.api }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            for job_result in \
              "API Lint:${{ needs.api-lint.result }}" \
              "API Typecheck:${{ needs.api-typecheck.result }}"; do
              NAME="${job_result%%:*}"
              RESULT="${job_result##*:}"
              if [ "$RESULT" != "success" ]; then
                echo "FAIL: $NAME ($RESULT)"
                FAILED=true
              fi
            done
          fi

          # GeoAI (conditional)
          if [ "${{ needs.changes.outputs.geoai }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            if [ "${{ needs.geoai-build.result }}" != "success" ]; then
              echo "FAIL: GeoAI Build (${{ needs.geoai-build.result }})"
              FAILED=true
            fi
          fi

          # Security (always)
          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "FAIL: Security Audit (${{ needs.security.result }})"
            FAILED=true
          fi

          # OpenClaw scripts (always)
          if [ "${{ needs.openclaw-scripts-test.result }}" != "success" ]; then
            echo "FAIL: OpenClaw Scripts Test (${{ needs.openclaw-scripts-test.result }})"
            FAILED=true
          fi

          # Agent Line Modules (conditional)
          if [ "${{ needs.changes.outputs.agent_modules }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            if [ "${{ needs.line-module-build.result }}" != "success" ]; then
              echo "FAIL: Line Module Build (${{ needs.line-module-build.result }})"
              FAILED=true
            fi
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  L3 Code Gate FAILED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          echo ""
          echo "Module check results:"
          [ "${{ needs.changes.outputs.dashboard }}" = "true" ] && echo "  Dashboard: checked" || echo "  Dashboard: skipped"
          [ "${{ needs.changes.outputs.api }}" = "true" ] && echo "  API: checked" || echo "  API: skipped"
          [ "${{ needs.changes.outputs.geoai }}" = "true" ] && echo "  GeoAI: checked" || echo "  GeoAI: skipped"
          [ "${{ needs.changes.outputs.agent_modules }}" = "true" ] && echo "  Agent Line Modules: checked" || echo "  Agent Line Modules: skipped"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  L3 Code Gate PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
