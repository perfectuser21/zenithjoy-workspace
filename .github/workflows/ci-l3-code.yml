name: L3 Code Gate

# L3: 代码质量检查 — 按模块变更触发（~5min）
# 职责：Lint、TypeCheck、Build、Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: l3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change Detection ────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api: ${{ steps.filter.outputs.api }}
      geoai: ${{ steps.filter.outputs.geoai }}
      ci: ${{ steps.filter.outputs.ci }}
      agent_modules: ${{ steps.filter.outputs.agent_modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect changed modules
        id: filter
        run: node scripts/ci/detect-changes.mjs code

  # ─── Dashboard ───────────────────────────────────────────────────────
  dashboard-lint:
    name: Dashboard Lint
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      # 棘轮制：78 = 2026-07-05 实测警告数，只许降不许涨；目标 ≤20（消警告另立 sprint）
      - run: npx eslint . --max-warnings 78
        working-directory: apps/dashboard

  dashboard-typecheck:
    name: Dashboard Typecheck
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - run: npx tsc --noEmit
        working-directory: apps/dashboard

  dashboard-build:
    name: Dashboard Build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - name: Fix rollup optional deps (npm ci bug workaround)
        working-directory: apps/dashboard
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true
      - run: mkdir -p apps/dashboard/public/gallery/chatgpt-cards apps/dashboard/public/gallery/deep-post-cards
      - run: npm run build
        working-directory: apps/dashboard
        env:
          CORE_FEATURES_PATH: ./src/stubs/core-features
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dashboard-dist
          path: apps/dashboard/dist
          retention-days: 7

  # ─── API ─────────────────────────────────────────────────────────────
  api-lint:
    name: API Lint
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/api
      # 棘轮制：40 = 2026-07-05 实测警告数（贴线），只许降不许涨；目标 ≤20（消警告另立 sprint）
      - run: npx eslint src/ --max-warnings 40
        working-directory: apps/api

  api-typecheck:
    name: API Typecheck
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/api
      - run: npx tsc --noEmit
        working-directory: apps/api

  # ─── GeoAI ──────────────────────────────────────────────────────────
  geoai-build:
    name: GeoAI Build
    needs: changes
    if: needs.changes.outputs.geoai == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fix Linux native optional deps missing from macOS-generated lock file
        run: |
          npm install --no-save @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu 2>/dev/null || true
          src="node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node"
          dst="node_modules/lightningcss/lightningcss.linux-x64-gnu.node"
          [ -f "$src" ] && [ ! -f "$dst" ] && cp "$src" "$dst" || true
      - run: npm run build
        working-directory: apps/geoai

  # ─── Security ────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # 两段 npm audit（根目录+apps/dashboard）走 registry 网络慢时各 5min 上下，10min 总窗被吃满（2026-09-04 实测被 cancel）
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      # audit-gate 含 devDependencies（旧 --omit=dev 藏住过 6 个 high，2026-07-05 repo-audit 抓出）
      # npm audit 只读 lockfile，无需 npm ci
      - name: 根目录依赖漏洞门禁（含 dev）
        run: bash .github/workflows/scripts/audit-gate.sh .
      - name: dashboard 依赖漏洞门禁（含 dev）
        run: bash .github/workflows/scripts/audit-gate.sh apps/dashboard

  # ─── OpenClaw scripts ────────────────────────────────────────────────
  # phonectl（件3 信号桥薄壳）等 scripts/openclaw/ 下脚本的 Node 单测。这些是根级
  # 独立脚本，不属于任何 workspace，不会被 apps/api 的 vitest 捡到——不接进某个
  # 具体闸就是孤儿测试（devgate/detect-review-issues.js 已吃过这个亏，见 PR#1769：
  # 两份回归测试写了半年从未跑过，同一类误判复发 4 次）。无条件跑（纯 node --test，
  # 读取真实契约需安装已锁定根依赖），不按变更路径过滤。
  openclaw-scripts-test:
    name: OpenClaw Scripts Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # 两片主集合实测494秒，加准备79秒及Durable core36秒已超10分钟。
    # 三片覆盖完整同一文件集合，不筛用例、不延长job或生产deadline。
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zenithjoy_metrics_scratch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scratch-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zenithjoy_metrics_scratch"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ZJ_METRICS_PG_REQUIRED: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: zenithjoy_metrics_scratch
      PGUSER: postgres
      PGPASSWORD: scratch-only
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked real-contract test dependencies
        run: npm ci --ignore-scripts --workspaces=false
      # douyin-phone-adb 是 zsh 脚本，ubuntu runner 默认没有 zsh。
      # 不装就只能让测试 skip，而"在 CI 里从不执行的守卫"等于没有守卫
      # （0916 自查：279 个 smoke 里 55 个是 pipefail 假绿，同一个病）。
      # libxml2-utils 提供 /usr/bin/xmllint：account-current-nickname 守卫要跑真实的抖音号/昵称提取。
      - name: 刷新 OpenClaw OS 软件包索引（有界诊断）
        id: openclaw-apt-index
        timeout-minutes: 2
        run: |
          echo "PREFLIGHT_START apt-index"
          timeout 90s sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          echo "PREFLIGHT_DONE apt-index"
      - name: 安装 zsh、xmllint 和 ffmpeg（有界诊断）
        id: openclaw-os-packages
        timeout-minutes: 6
        run: |
          echo "PREFLIGHT_START os-packages"
          missing=()
          for pair in zsh:zsh xmllint:libxml2-utils ffmpeg:ffmpeg; do
            tool="${pair%%:*}"
            if path="$(command -v "$tool")"; then
              echo "PREFLIGHT_TOOL $tool existing_path=$path"
            else
              echo "PREFLIGHT_TOOL $tool existing_path=missing"
              missing+=("${pair#*:}")
            fi
          done
          if ((${#missing[@]})); then
            timeout 300s bash .github/workflows/scripts/prepare-openclaw-os-packages.sh "${RUNNER_TEMP:-/tmp}" /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt "${missing[@]}"
          fi
          for tool in zsh xmllint ffmpeg; do
            echo "PREFLIGHT_TOOL $tool path=$(command -v "$tool")"
          done
          zsh --version
          xmllint --version
          ffmpeg -version
          echo "PREFLIGHT_DONE os-packages"
      - name: 安装并核验 Pillow（有界诊断）
        id: openclaw-pillow
        timeout-minutes: 2
        run: |
          echo "PREFLIGHT_START pillow"
          timeout 60s python3 -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 0 Pillow
          python3 -c 'from PIL import Image; print(Image.__version__)'
          echo "PREFLIGHT_DONE pillow"
      - name: node --test scripts/openclaw + services/phone-adb-controller + deploy-phone-adb-controller workflow 契约测试
        # 正式Pilot会校验陪跑Skill固定版本；合并前同样执行，避免旧正例只在发布时暴露。
        run: node --test --test-shard=${{ matrix.shard }}/3 scripts/openclaw/**/*.test.js services/phone-adb-controller/__tests__/*.test.mjs .github/workflows/scripts/__tests__/*.test.mjs scripts/product-map/__tests__/leadgen-workflow-skill.test.js
      - name: Agent 主执行与 Commander 无设备 smoke
        if: matrix.shard == 1
        run: bash .github/workflows/scripts/smoke/agent-first-leadgen-smoke.sh
      # Independent full recovery suite: one matrix leg is sufficient; its failure
      # still fails openclaw-scripts-test and the required L3 aggregate.
      - name: Durable publish recovery core
        if: matrix.shard == 1
        run: node --test services/listing-workflow/__tests__/*.test.mjs

  # 本机内核nofork守卫不能由Linux上的platform skip代替。
  collection-phone-darwin-test:
    name: Collection Phone Darwin Test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --workspaces=false
      - name: Prepare private preflight PostgreSQL 17 test binary
        run: |
          brew install postgresql@17
          echo "PREFLIGHT_TEST_PG_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - name: Diagnose pinned preflight Python startup without credentials or phone
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {readFileSync,realpathSync,statSync,appendFileSync} from 'node:fs';
          import {resolve,isAbsolute} from 'node:path';
          import {createHash} from 'node:crypto';
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const env={PATH:'/usr/bin:/bin:/usr/sbin:/sbin',HOME:process.env.RUNNER_TEMP,TMPDIR:process.env.RUNNER_TEMP,LANG:'en_US.UTF-8',...(process.env.DEVELOPER_DIR?{DEVELOPER_DIR:process.env.DEVELOPER_DIR}:{})};
          const call=(command,args,input='',selectedEnv=env)=>spawnSync(command,args,{env:selectedEnv,input,encoding:'utf8',timeout:10000,maxBuffer:65536});
          const report=(name,result)=>console.log(JSON.stringify({name,code:result.status,signal:result.signal,error_code:result.error?.code||null,stderr_bytes:Buffer.byteLength(result.stderr||''),stderr_sha256:hash(result.stderr||''),stderr_classes:['xcrun','Operation not permitted','PermissionError','Resource temporarily unavailable','No such file'].filter(s=>(result.stderr||'').includes(s)),stdout:result.stdout?.slice(0,1000)}));
          const discover=call('/usr/bin/python3',['-I','-S','-c','import sys;print(sys.executable)']);report('system-python-discovery',discover);
          const helper=resolve('services/phone-adb-controller/preflight-local-step.py'),input='<hierarchy><node text="抖音号：fixture"/><node text="编辑主页"/></hierarchy>',args=['-I','-S',helper,'ui'],profile='(version 1)(allow default)(deny process-fork)';
          report('system-python-plain-helper',call('/usr/bin/python3',args,input));
          report('system-python-sandbox-helper',call('/usr/bin/sandbox-exec',['-p',profile,'/usr/bin/python3',...args],input));
          const physical=discover.stdout?.trim();
          if(discover.status===0&&isAbsolute(physical||'')&&!/[\r\n]/.test(physical)&&statSync(physical).isFile()){
            const canonical=realpathSync(physical);console.log(JSON.stringify({name:'physical-python-identity',path:physical,realpath:canonical,sha256:hash(readFileSync(canonical))}));
            report('physical-python-sandbox-helper',call('/usr/bin/sandbox-exec',['-p',profile,canonical,...args],input));
            report('physical-python-fork-negative',call('/usr/bin/sandbox-exec',['-p',profile,canonical,'-I','-S','-c','import os;os.fork()']));
            const {DEVELOPER_DIR:_sdk,...minimalEnv}=env;
            report('minimal-env-system-python-plain-helper',call('/usr/bin/python3',args,input,minimalEnv));
            report('minimal-env-system-python-sandbox-helper',call('/usr/bin/sandbox-exec',['-p',profile,'/usr/bin/python3',...args],input,minimalEnv));
            const positive=call('/usr/bin/sandbox-exec',['-p',profile,canonical,...args],input,minimalEnv),negative=call('/usr/bin/sandbox-exec',['-p',profile,canonical,'-I','-S','-c','import os;os.fork()'],'',minimalEnv);
            report('minimal-env-physical-python-sandbox-helper',positive);report('minimal-env-physical-python-fork-negative',negative);
            if(positive.status!==0||positive.signal||JSON.parse(positive.stdout).account?.douyin_id!=='fixture'||negative.status!==1||negative.signal||!/Operation not permitted|Resource temporarily unavailable/.test(negative.stderr||''))throw Error('PHYSICAL_TEST_PYTHON_NOFORK_UNVERIFIED');
            if(/[\r\n]/.test(canonical))throw Error('PHYSICAL_TEST_PYTHON_PATH_INVALID');
            if(process.env.GITHUB_ENV)appendFileSync(process.env.GITHUB_ENV,'PREFLIGHT_TEST_PYTHON_BIN='+canonical+'\n');
          }
          NODE
      - name: Run preflight native lifecycle tests on Darwin
        run: node --test --test-concurrency=1 services/phone-adb-controller/__tests__/preflight-*.test.mjs
      - name: Require real Darwin kernel tests
        run: |
          node -e "if(process.platform!=='darwin')process.exit(1)"
          python3 services/phone-adb-controller/__tests__/collection-review-maintenance.test.py
          python3 services/phone-adb-controller/__tests__/collection-review-gap.test.py
          python3 services/phone-adb-controller/__tests__/collection-review-maintenance-claim.test.py
          # 文件级隔离冷启动/observer重夹具，避免并行文件消耗彼此真实300ms/.4s预算。
          # 不改生产deadline、单项断言或case内部fork/IPC/race并发；原有项与新增清场项仍全部实跑。
          node --test --test-concurrency=1 services/phone-adb-controller/__tests__/adb-host-terminal.test.mjs services/phone-adb-controller/__tests__/native-operation-ipc.test.mjs services/phone-adb-controller/__tests__/native-operation-identity.test.mjs services/phone-adb-controller/__tests__/native-operation-races.test.mjs services/phone-adb-controller/__tests__/discovery-phase-budget.test.mjs services/phone-adb-controller/__tests__/discovery-cleanup-scope.test.mjs services/phone-adb-controller/__tests__/collection-leaf-returned.test.mjs services/phone-adb-controller/__tests__/uiautomator-dump-crash.test.mjs services/phone-adb-controller/__tests__/collection-returned-authority.test.mjs services/phone-adb-controller/__tests__/collection-panel-readback.test.mjs services/phone-adb-controller/__tests__/collection-leaf-scope.test.mjs services/phone-adb-controller/__tests__/collection-phone-proof.test.mjs services/phone-adb-controller/__tests__/collection-evidence-layout.test.mjs services/phone-adb-controller/__tests__/collection-cleanup-only.test.mjs
      - name: Preserve failed collection fixture evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collection-phone-darwin-failures
          path: ${{ runner.temp }}/collection-phone-failures
          if-no-files-found: warn
          retention-days: 7

  # ─── apps/api/scripts ────────────────────────────────────────────────
  # apps/api/scripts/ 下的独立 Python 脚本（如 wechat-mp-freepublish.py）不属于任何
  # npm workspace，不会被 apps/api 的 vitest 捡到——同 openclaw-scripts-test 的教训
  # （PR#1769：孤儿回归测试写了半年从未跑过，同一类误判复发 4 次）。无条件跑（纯
  # stdlib unittest，无需装依赖，几秒钟），不按变更路径过滤。
  api-scripts-test:
    name: API Scripts Test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phone account patrol full offline runtime contracts
        run: node --test scripts/phone-account-patrol/implementation-regression.test.mjs
      - name: Fixed skill bootstrap transport contracts
        run: python3 scripts/__tests__/skills-source-bootstrap.test.py
      - name: unittest apps/api/scripts/tests
        run: python3 -m unittest discover -s apps/api/scripts/tests -p 'test_*.py' -v
      - name: Android WeChat reception safety contracts (offline)
        run: bash .github/workflows/scripts/smoke/wechat-cs-android-smoke.sh

  # ─── Agent Line Modules ──────────────────────────────────────────────
  # 2026-07-12 巡检抓漏：line-module TS 编译此前只在 push main 的 agent-installpack
  # 跑，PR 阶段无闸 → PR#1245 的 TS2459 直接红在主干。此 job 把同一构建脚本前移到 PR 闸。
  line-module-build:
    name: Line Module Build (${{ matrix.lineId }})
    needs: changes
    if: needs.changes.outputs.agent_modules == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lineId: [line04, line01, line02, line05]
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: services/agent
      - run: bash scripts/build-line-module.sh ${{ matrix.lineId }}
        working-directory: services/agent

  # ─── L3 Gate ──────────────────────────────────────────────────────────
  l3-passed:
    name: L3 Code Gate Passed
    needs:
      - changes
      - dashboard-lint
      - dashboard-typecheck
      - dashboard-build
      - api-lint
      - api-typecheck
      - geoai-build
      - security
      - openclaw-scripts-test
      - collection-phone-darwin-test
      - api-scripts-test
      - line-module-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
