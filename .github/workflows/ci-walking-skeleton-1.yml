name: Walking Skeleton #1 — Golden Path 1 Douyin

# 客户首次成功路径（抖音版）端到端 smoke
# Notion Journey: https://www.notion.so/358c40c2ba6381b2a6eacd288cf82f29
# Contract:        /tmp/walking-skeleton-1-contract.md
#
# 此 workflow 与 ci-l4-e2e-smoke.yml 解耦：单跑 walking-skeleton-1 一条链路。
# 其他 ws1 teammate (agent/api/dashboard) PR 合并后，本 workflow 必须全绿才算
# Maturity not_started → skeleton 升级达成。
#
# CI 跑两条 smoke：
#   1. golden-path-1-douyin-smoke.sh — 抖音路径 mock（含 session SQL mock）
#   2. golden-path-1-smoke.sh       — Step 6 dispatch chain（POST /publish + task-ack + publish_status）
# 真 Agent + Playwright + Chrome 验证由人工每周跑 manual-verify-douyin.sh，
# 该脚本带 MANUAL_VERIFY=1 gate，CI 跑到也会 exit 0 跳过。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ws1-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-path-1-douyin:
    name: Golden Path 1 Douyin Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: cecelia
      DATABASE_PASSWORD: cecelia
      DATABASE_NAME: cecelia
      PORT: 5200
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5200
      ZENITHJOY_INTERNAL_TOKEN: ci-only-internal-token-abc-not-prod
      API_BASE: http://localhost:5200
      PGHOST: localhost
      PGUSER: cecelia
      PGPASSWORD: cecelia
      PGDATABASE: cecelia

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install apps/api deps
        run: npm ci --workspace=apps/api

      - name: Create zenithjoy schema + pgcrypto
        env:
          PGPASSWORD: cecelia
        run: |
          psql -h localhost -U cecelia -d cecelia -c "CREATE SCHEMA IF NOT EXISTS zenithjoy;"
          psql -h localhost -U cecelia -d cecelia -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Run apps/api/db migrations
        env:
          PGPASSWORD: cecelia
        run: |
          for f in apps/api/db/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U cecelia -d cecelia -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build apps/api
        working-directory: apps/api
        run: npm run build

      - name: Start apps/api
        working-directory: apps/api
        run: |
          node dist/index.js > /tmp/apps-api.log 2>&1 &
          echo $! > /tmp/apps-api.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5200/health >/dev/null 2>&1; then
              echo "apps/api ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5200/health || (cat /tmp/apps-api.log && exit 1)

      - name: Run Walking Skeleton #1 Golden Path Smoke (mock)
        run: |
          chmod +x .github/workflows/scripts/smoke/golden-path-1-douyin-smoke.sh
          bash .github/workflows/scripts/smoke/golden-path-1-douyin-smoke.sh

      - name: Run Step 6 Dispatch Chain Smoke
        # POST /api/works/:id/publish → publish_tasks queued → heartbeat → task-ack → publish_status=success
        # 独立脚本（不依赖 Steps 1-5 的 install-pack），可在 CI ubuntu runner 直接跑
        run: |
          chmod +x .github/workflows/scripts/smoke/step6-dispatch-chain-smoke.sh
          bash .github/workflows/scripts/smoke/step6-dispatch-chain-smoke.sh

      - name: Run manual-verify-douyin.sh (skip-only check)
        # 该脚本必须在 CI 里 exit 0 跳过（MANUAL_VERIFY 未设置）。
        # 这一步等同于 lint —— 验证 gate 写对了。
        run: |
          chmod +x .github/workflows/scripts/smoke/manual-verify-douyin.sh
          bash .github/workflows/scripts/smoke/manual-verify-douyin.sh

      - name: Stop apps/api
        if: always()
        run: |
          if [ -f /tmp/apps-api.pid ]; then
            kill "$(cat /tmp/apps-api.pid)" 2>/dev/null || true
          fi

      - name: Upload apps/api log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apps-api-log-ws1
          path: /tmp/apps-api*.log
          retention-days: 3
