name: L4 Runtime Gate

# L4: 运行时测试 — 按模块变更触发（~10min）
# 职责：单元测试 + Coverage 报告

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: l4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change Detection ────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: filter
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "dashboard=true" >> $GITHUB_OUTPUT
              echo "api=true" >> $GITHUB_OUTPUT
              echo "ci=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          else
            BASE_REF="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")
          fi

          echo "$CHANGED" | grep -q "^apps/dashboard/" \
            && echo "dashboard=true" >> $GITHUB_OUTPUT || echo "dashboard=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q "^apps/api/" \
            && echo "api=true" >> $GITHUB_OUTPUT || echo "api=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q "^services/agent/" \
            && echo "agent=true" >> $GITHUB_OUTPUT || echo "agent=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -qE "^\.github/|^tsconfig\.base\.json$|^package\.json$" \
            && echo "ci=true" >> $GITHUB_OUTPUT || echo "ci=false" >> $GITHUB_OUTPUT

  # ─── Dashboard Tests ─────────────────────────────────────────────────
  dashboard-test:
    name: Dashboard Test
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - name: Fix rollup optional deps (npm ci bug workaround)
        working-directory: apps/dashboard
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true
      - name: Run tests with coverage
        working-directory: apps/dashboard
        run: npx vitest run --coverage

  # ─── API Tests ───────────────────────────────────────────────────────
  api-test:
    name: API Test
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/api
      - name: Fix rollup optional deps (npm ci bug workaround)
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true
      - name: Run tests with coverage
        working-directory: apps/api
        run: npx vitest run --coverage

  # ─── Agent Tests ─────────────────────────────────────────────────────
  agent-test:
    name: Agent Test
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: services/agent
      - name: Run tests (src/ only — publishers require Chrome CDP not available in CI)
        working-directory: services/agent
        run: npx vitest run src/
      - name: Check build-modules/line04/wechat-rpa in sync with source
        run: |
          diff -r services/agent/wechat-rpa/ \
               services/agent/build-modules/line04/wechat-rpa/ \
               --exclude="*.pyc" --exclude="__pycache__" && \
            echo "build-modules in sync" || \
            (echo "build-modules diverged from source! Run: rsync -av services/agent/wechat-rpa/ services/agent/build-modules/line04/wechat-rpa/" && exit 1)

      # 防漂移守卫（修 #817 部署 gap 的根）：line04 三个版本面必须完全一致。
      # build-line-module.sh 真读 modules/line04/manifest.json 决定 COS 包版本；
      # build-modules manifest 是打包基线；中台心跳 required_version 告诉客户机要哪个版本。
      # 任一面落后 → 客户机被告知已最新永不重下 → 拿不到新代码（#817 就是只 bump 了 build-modules）。
      - name: Check line04 三个版本面一致（modules / build-modules / 中台心跳）
        run: |
          V_MOD=$(node -e "process.stdout.write(require('./services/agent/modules/line04/manifest.json').version)")
          V_BUILD=$(node -e "process.stdout.write(require('./services/agent/build-modules/line04/manifest.json').version)")
          V_HB=$(grep -oE "'line04-wechat-cs': \{ status: 'active', required_version: '[0-9.]+' \}" \
                 apps/api/src/services/walking-skeleton.service.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "modules=$V_MOD build-modules=$V_BUILD heartbeat=$V_HB"
          if [ "$V_MOD" != "$V_BUILD" ] || [ "$V_MOD" != "$V_HB" ]; then
            echo "FAIL: line04 三个版本面不一致 — 三者必须相等，否则客户机永不真升级。"
            echo "  改 line04 版本时必须同步：services/agent/modules/line04/manifest.json"
            echo "                          services/agent/build-modules/line04/manifest.json"
            echo "                          apps/api/src/services/walking-skeleton.service.ts HEARTBEAT_MODULES"
            exit 1
          fi
          echo "OK: line04 三个版本面一致 = $V_MOD"

      - name: Smoke — line04 发货版本面 + 自动回复闭环（修 #817 部署 gap）
        run: |
          chmod +x .github/workflows/scripts/smoke/line04-ship-version-sync-smoke.sh
          bash .github/workflows/scripts/smoke/line04-ship-version-sync-smoke.sh

      - name: Smoke — 客户机 Agent 自愈四件（#822 保活/统一身份/统一真发/自检上报）
        run: |
          chmod +x .github/workflows/scripts/smoke/agent-self-heal-smoke.sh
          bash .github/workflows/scripts/smoke/agent-self-heal-smoke.sh

      - name: Smoke — 客户机 Agent 核心自升级（#824 required_agent_version + .active-core 自换重启）
        run: |
          chmod +x .github/workflows/scripts/smoke/agent-core-self-upgrade-smoke.sh
          bash .github/workflows/scripts/smoke/agent-core-self-upgrade-smoke.sh

      - name: Smoke — Agent 形态收口（悦升云端图标 + 安装包无窗，Sprint 06240003）
        run: |
          chmod +x .github/workflows/scripts/smoke/agent-form-smoke.sh
          bash .github/workflows/scripts/smoke/agent-form-smoke.sh

  # ─── L4 Gate ──────────────────────────────────────────────────────────
  l4-passed:
    name: L4 Runtime Gate Passed
    needs: [changes, dashboard-test, api-test, agent-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: L4 Runtime Gate
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  L4 Runtime Gate"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          FAILED=false

          if [ "${{ needs.changes.result }}" = "failure" ]; then
            echo "FAIL: Detect Changes"
            FAILED=true
          fi

          # Dashboard tests (conditional)
          if [ "${{ needs.changes.outputs.dashboard }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            if [ "${{ needs.dashboard-test.result }}" != "success" ]; then
              echo "FAIL: Dashboard Test (${{ needs.dashboard-test.result }})"
              FAILED=true
            fi
          fi

          # API tests (conditional)
          if [ "${{ needs.changes.outputs.api }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            if [ "${{ needs.api-test.result }}" != "success" ]; then
              echo "FAIL: API Test (${{ needs.api-test.result }})"
              FAILED=true
            fi
          fi

          # Agent tests (conditional)
          if [ "${{ needs.changes.outputs.agent }}" = "true" ] || [ "${{ needs.changes.outputs.ci }}" = "true" ]; then
            if [ "${{ needs.agent-test.result }}" != "success" ]; then
              echo "FAIL: Agent Test (${{ needs.agent-test.result }})"
              FAILED=true
            fi
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  L4 Runtime Gate FAILED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi

          echo ""
          echo "Module check results:"
          [ "${{ needs.changes.outputs.dashboard }}" = "true" ] && echo "  Dashboard: tested" || echo "  Dashboard: skipped"
          [ "${{ needs.changes.outputs.api }}" = "true" ] && echo "  API: tested" || echo "  API: skipped"
          [ "${{ needs.changes.outputs.agent }}" = "true" ] && echo "  Agent: tested" || echo "  Agent: skipped"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  L4 Runtime Gate PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
