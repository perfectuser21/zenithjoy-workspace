name: L4 Runtime Gate

# L4: 运行时测试 — 按模块变更触发（~10min）
# 职责：单元测试 + Coverage 报告

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: l4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change Detection ────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      staff_hub: ${{ steps.filter.outputs.staff_hub }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect changed modules
        id: filter
        run: node scripts/ci/detect-changes.mjs runtime

  # ─── Dashboard Tests ─────────────────────────────────────────────────
  dashboard-test:
    name: Dashboard Test
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
        working-directory: apps/dashboard
      - name: Fix rollup optional deps (npm ci bug workaround)
        working-directory: apps/dashboard
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true
      - name: Run tests with coverage
        working-directory: apps/dashboard
        run: npx vitest run --coverage

  # ─── API Tests ───────────────────────────────────────────────────────
  api-test:
    name: API Test
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/api
      - name: Install media tools required by current video contracts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Fix rollup optional deps (npm ci bug workaround)
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true
      - name: Run tests with coverage
        working-directory: apps/api
        run: npx vitest run --coverage

  staff-hub-test:
    name: Staff Hub Test
    needs: changes
    if: needs.changes.outputs.staff_hub == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --workspace=apps/staff-hub --ignore-scripts
      - run: npm test --workspace=apps/staff-hub

  # ─── Agent Tests ─────────────────────────────────────────────────────
  agent-test:
    name: Agent Test
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: services/agent
      - name: Run tests (vitest config：src/ + modules/ + publishers/ 全覆盖，publishers 用 mock 不依赖 Chrome CDP)
        working-directory: services/agent
        run: npx vitest run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: wechat-rpa 纯函数单测（顶层零 pywinauto，clean CI 可跑）
        working-directory: services/agent/wechat-rpa
        run: |
          python -m pip install --quiet pytest
          # CRM 重做 agent 侧纯逻辑：好友扫描解析 / ingest 上报 / 黑名单 should_reply 翻转
          # 这些测试用 stub 注入 pywinauto，CI 无真机也能跑（修 a4699d21：smoke 必须真接 CI）。
          python -m pytest tests/test_scan_recent_contacts.py \
                           tests/test_friend_scan_ingest.py \
                           tests/test_friend_scan_pending.py \
                           tests/test_cs_config_gate.py \
                           tests/test_scan_unread.py \
                           tests/test_scan_unread_n_msgs.py \
                           tests/test_bubble_anchor.py \
                           tests/test_read_chat_bubbles.py \
                           tests/test_scan_trigger.py \
                           tests/test_msg_direction.py \
                           tests/test_mainloop_wiring.py \
                           tests/test_reply_loop_purity.py \
                           tests/test_desktop_yield.py \
                           tests/test_phase0_observability.py -q
      - name: line04 Phase 0 观测 smoke（版本三面一致 + build_diag 含 module_version/skip_reasons）
        run: bash .github/workflows/scripts/smoke/line04-phase0-observability-smoke.sh
      - name: line04 CI×监听 桌面互斥接线 smoke（CI acquire/release + 监听 loop 顶让位）
        run: bash .github/workflows/scripts/smoke/line04-ci-desktop-mutex-smoke.sh
      - name: Check build-modules/line04/wechat-rpa in sync with source
        run: python3 .github/workflows/scripts/line04-package-sync.py

      # 防漂移守卫（修 #817 部署 gap 的根）：line04 三个版本面必须完全一致。
      # build-line-module.sh 真读 modules/line04/manifest.json 决定 COS 包版本；
      # build-modules manifest 是打包基线；中台心跳 required_version 告诉客户机要哪个版本。
      # 任一面落后 → 客户机被告知已最新永不重下 → 拿不到新代码（#817 就是只 bump 了 build-modules）。
      - name: Check line04 三个版本面一致（modules / build-modules / 中台心跳）
        run: |
          V_MOD=$(node -e "process.stdout.write(require('./services/agent/modules/line04/manifest.json').version)")
          V_BUILD=$(node -e "process.stdout.write(require('./services/agent/build-modules/line04/manifest.json').version)")
          V_HB=$(grep -oE "'line04-wechat-cs': \{ status: 'active', required_version: '[0-9.]+' \}" \
                 apps/api/src/services/walking-skeleton.service.ts | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "modules=$V_MOD build-modules=$V_BUILD heartbeat=$V_HB"
          if [ "$V_MOD" != "$V_BUILD" ] || [ "$V_MOD" != "$V_HB" ]; then
            echo "FAIL: line04 三个版本面不一致 — 三者必须相等，否则客户机永不真升级。"
            echo "  改 line04 版本时必须同步：services/agent/modules/line04/manifest.json"
            echo "                          services/agent/build-modules/line04/manifest.json"
            echo "                          apps/api/src/services/walking-skeleton.service.ts HEARTBEAT_MODULES"
            exit 1
          fi
          echo "OK: line04 三个版本面一致 = $V_MOD"

      - name: Smoke — line04 发货版本面 + 自动回复闭环（修 #817 部署 gap）
        run: |
          chmod +x .github/workflows/scripts/smoke/line04-ship-version-sync-smoke.sh
          bash .github/workflows/scripts/smoke/line04-ship-version-sync-smoke.sh

      - name: Smoke — line04 版本锁闭环（PR-A：4.1.10 锁成 false + 装完关更新接线，Path4）
        run: |
          chmod +x .github/workflows/scripts/smoke/line04-version-lock-closure-smoke.sh
          bash .github/workflows/scripts/smoke/line04-version-lock-closure-smoke.sh

      - name: Smoke — 客户机 Agent 自愈四件（#822 保活/统一身份/统一真发/自检上报）
        run: |
          chmod +x .github/workflows/scripts/smoke/agent-self-heal-smoke.sh
          bash .github/workflows/scripts/smoke/agent-self-heal-smoke.sh

      - name: Smoke — 客户机 Agent 核心自升级（#824 required_agent_version + .active-core 自换重启）
        run: |
          chmod +x .github/workflows/scripts/smoke/agent-core-self-upgrade-smoke.sh
          bash .github/workflows/scripts/smoke/agent-core-self-upgrade-smoke.sh

      - name: Smoke — Agent 形态收口（悦升云端图标 + 安装包无窗，Sprint 06240003）
        run: |
          chmod +x .github/workflows/scripts/smoke/agent-form-smoke.sh
          bash .github/workflows/scripts/smoke/agent-form-smoke.sh

  windows-process-cleanup:
    name: Windows Candidate Process Cleanup
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify real job process tree cleanup and cancellation
        shell: powershell
        run: .\.github\workflows\scripts\__tests__\line02-process-job.test.ps1

  # UI contracts are called here so failures participate in the required gate.
  dashboard-operations-ui:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-dashboard-operations-windows.yml

  staff-skill-eval-ui:
    needs: changes
    if: needs.changes.outputs.staff_hub == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-staff-skill-eval.yml

  agent-windows-contracts:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/agent-qr-windows-verify.yml

  # ─── L4 Gate ──────────────────────────────────────────────────────────
  l4-passed:
    name: L4 Runtime Gate Passed
    needs: [changes, dashboard-test, api-test, agent-test, windows-process-cleanup, staff-hub-test, dashboard-operations-ui, staff-skill-eval-ui, agent-windows-contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: L4 Runtime Gate
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          node scripts/ci/required-gate.mjs runtime
          # The shared checker validates detection outputs and every failure/cancel.
          # Reusable contract selection spans existing routes; selected skip/missing must
          # also fail this same required job.
          node --input-type=module <<'JS'
          const needs = JSON.parse(process.env.GATE_NEEDS);
          const contracts = {
            'dashboard-operations-ui': ['dashboard', 'ci'],
            'staff-skill-eval-ui': ['staff_hub', 'api', 'ci'],
            'agent-windows-contracts': ['agent', 'ci'],
          };
          for (const [job, routes] of Object.entries(contracts)) {
            if (routes.some(route => needs.changes.outputs[route] === 'true') &&
                needs[job]?.result !== 'success') {
              throw new Error('Required consumer workflow did not succeed: ' + job + '=' + (needs[job]?.result ?? 'missing'));
            }
          }
          console.log('Selected consumer workflows succeeded');
          JS
