name: L4 Integration Tests

# L4-INT: 真实 DB integration tests — 按 apps/api 变更触发（~5min）
# 职责：4 critical chains（tenant onboarding / works CRUD / publish-logs / snapshots）
# 与 ci-l4-runtime.yml 并行运行，共同构成 L4 Runtime Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: l4-int-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Change Detection ────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect changed modules
        id: filter
        run: node scripts/ci/detect-changes.mjs integration

  # ─── Integration Tests with Real DB ──────────────────────────────────
  api-integration-test:
    name: API Integration Test
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenithjoy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: zenithjoy_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      ZENITHJOY_INTERNAL_TOKEN: integration-test-token
      ADMIN_FEISHU_OPENIDS: ou_admin_integration_001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace=apps/api

      - name: Fix rollup optional deps (npm ci bug workaround)
        run: node -e "try{require('@rollup/rollup-linux-x64-gnu')}catch(e){require('child_process').execSync('npm install --no-save @rollup/rollup-linux-x64-gnu',{stdio:'inherit'})}" || true

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run integration tests
        working-directory: apps/api
        run: npx vitest run --config vitest.integration.config.ts

      - name: Run disposable PostgreSQL API contracts
        working-directory: apps/api
        env:
          PG_CONTRACTS_DISPOSABLE: '1'
          DATABASE_NAME: zenithjoy_contract_test
          COMPANY_CONFIG_SCRATCH_URL: postgresql://postgres:postgres@localhost:5432/cecelia_scratch
        run: npx vitest run --config vitest.pg-contracts.config.ts

      - name: Run current business PostgreSQL lifecycles
        working-directory: apps/api
        env:
          BUSINESS_PG_DISPOSABLE: '1'
          DATABASE_NAME: zenithjoy_business_contract_test
        run: npx vitest run --config vitest.business-pg.config.ts

      - name: Run consolidated PostgreSQL contracts
        working-directory: apps/api
        env:
          PG_CONSOLIDATION_DISPOSABLE: '1'
          DATABASE_NAME: zenithjoy_consolidation_test
        run: npx vitest run --config vitest.consolidated-pg.config.ts

  # ─── Integration Gate ─────────────────────────────────────────────────
  integration-gate:
    name: Integration Gate Passed
    needs: [changes, api-integration-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check integration gate
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-gate.mjs integration
