name: Deploy Dashboard to HK VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'deploy/nginx.conf'
      - 'deploy/docker-compose.hk.yml'

concurrency:
  group: deploy-hk-vps
  cancel-in-progress: false

jobs:
  deploy-dashboard:
    name: Deploy Dashboard + Nginx to HK VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            trap 'rm -f /tmp/compose_err.txt' EXIT
            echo "=== [1/3] git sync ==="
            git -C /opt/zenithjoy/repo remote prune origin 2>/dev/null || true
            git -C /opt/zenithjoy/repo fetch --force --prune origin main
            git -C /opt/zenithjoy/repo reset --hard origin/main

            echo "=== [2/3] reload nginx ==="
            COMPOSE_FILE=/opt/zenithjoy/repo/deploy/docker-compose.hk.yml
            set +e
            docker compose -f "$COMPOSE_FILE" up -d autopilot-dashboard 2>/tmp/compose_err.txt
            COMPOSE_RC=$?
            set -e
            if [ $COMPOSE_RC -ne 0 ]; then
              echo "⚠️  compose up 失败 (exit=$COMPOSE_RC)，原始错误："
              cat /tmp/compose_err.txt
              echo "执行 overlayfs 恢复..."
              docker rm -f autopilot-dashboard 2>/dev/null || true
              docker rmi nginx:alpine 2>/dev/null || true
              sleep 2
              docker pull nginx:alpine
              docker compose -f "$COMPOSE_FILE" up -d autopilot-dashboard
            fi
            docker exec autopilot-dashboard nginx -s reload 2>/dev/null || true

            echo "=== [3/3] health check ==="
            sleep 3
            if curl -sf https://autopilot.zenjoymedia.media/health > /dev/null 2>&1 || \
               curl -sf http://localhost/health > /dev/null 2>&1; then
              echo "Dashboard health check passed"
            else
              echo "Warning: health check inconclusive (HTTPS may need Cloudflare)"
            fi

  notify-failure:
    name: Notify Brain on failure
    runs-on: ubuntu-latest
    needs: [deploy-dashboard]
    if: failure()
    steps:
      - name: Post P0 alert to Brain
        run: |
          curl -sf -X POST http://38.23.47.81:5221/api/brain/tasks \
            -H "Content-Type: application/json" \
            -d '{
              "title": "ZenithJoy HK Dashboard 部署失败",
              "priority": "P0",
              "task_type": "dev",
              "description": "deploy-hk-vps.yml 失败，请人工介入"
            }' || echo "Brain API 不可达，跳过告警"
