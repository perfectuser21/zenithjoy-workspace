name: Release admission（同版本 staging 与真实验收）
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      targets:
        required: true
        type: string
      acceptance_run_key:
        required: true
        type: string
      bind_api_artifact:
        type: boolean
        default: false
    outputs:
      sha:
        value: ${{ jobs.admission.outputs.sha }}
      api_run_id:
        value: ${{ jobs.admission.outputs.api_run_id }}
      api_run_attempt:
        value: ${{ jobs.admission.outputs.api_run_attempt }}
permissions:
  contents: read
  actions: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.staging.outputs.sha }}
      api_run_id: ${{ steps.staging.outputs.api_run_id }}
      api_run_attempt: ${{ steps.staging.outputs.api_run_attempt }}
    steps:
      - name: Only trusted main release entry
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact candidate staging runs
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          TARGETS: ${{ inputs.targets }}
        run: node scripts/release-gate/staging-evidence.mjs "$SHA" "$TARGETS"
      - name: Report retired legacy nightly evidence
        run: |
          echo '::warning::Legacy Kotlin/browser nightly checks are retired; no Skill or Android physical acceptance is implied.'
          echo 'Legacy nightly is retired. Device acceptance is not established by this step; exact-version Brain business evidence remains required.' >> "$GITHUB_STEP_SUMMARY"
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: Read frozen business acceptance from Brain
        env:
          SSH_KEY: ${{ secrets.US_MAC_SSH_KEY }}
          SSH_HOST: ${{ secrets.US_MAC_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.US_MAC_USER }}
          SHA: ${{ steps.staging.outputs.sha }}
          TARGETS: ${{ inputs.targets }}
          RUN_KEY: ${{ inputs.acceptance_run_key }}
          BIND_API_ARTIFACT: ${{ inputs.bind_api_artifact }}
          API_RUN_ID: ${{ steps.staging.outputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ steps.staging.outputs.api_run_attempt }}
        run: |
          set -euo pipefail
          # SSH joins remote arguments into a shell command: validate every data token first.
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGETS" =~ ^(api|dashboard|staff-hub)(,(api|dashboard|staff-hub))*$ ]]
          [[ "$RUN_KEY" =~ ^[a-zA-Z0-9_.:-]{1,180}$ ]]
          set -- "$SHA" "$TARGETS" "$RUN_KEY"
          if [[ "${BIND_API_ARTIFACT:-false}" == true ]]; then
            [[ "$API_RUN_ID" =~ ^[1-9][0-9]{0,15}$ && "$API_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ ]]
            set -- "$@" "$API_RUN_ID" "$API_RUN_ATTEMPT"
          fi
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i "$KEY_FILE" \
            "$SSH_USER@$SSH_HOST" node --input-type=module - "$@" \
            < scripts/release-gate/acceptance-record.mjs
