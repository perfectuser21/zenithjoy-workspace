name: Promote staff-hub to Production (verified candidate)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: '已在 staging 验证的完整40位 SHA'
        required: true
        type: string
      acceptance_run_key:
        description: '同候选真实业务验收记录的 run key'
        required: true
        type: string
      confirm:
        description: '输入 PROMOTE 确认晋级'
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      acceptance_run_key:
        required: true
        type: string
      confirm:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  admission:
    uses: ./.github/workflows/release-admission.yml
    with:
      sha: ${{ inputs.sha }}
      targets: staff-hub
      acceptance_run_key: ${{ inputs.acceptance_run_key }}
    secrets: inherit
  promote-staff-hub:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: zenithjoy-production-hk
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ needs.admission.outputs.sha }}
      CONFIRM: ${{ inputs.confirm }}
      SSH_HOST: ${{ secrets.HK_VPS_HOST }}
      SSH_USER: ${{ secrets.HK_VPS_USER }}
      SSH_PORT: ${{ secrets.HK_VPS_PORT || '22' }}
      SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
      UPLOAD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Confirm promotion
        run: |
          [[ "$CONFIRM" == PROMOTE ]] || exit 1
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact candidate
        working-directory: source
        env:
          VITE_FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID || 'cli_a937a808ca395bd6' }}
          VITE_DEPLOY_ENV: production
          VITE_SKIP_AUTH: 'false'
          VITE_SUPER_ADMIN_EMAILS: 'xuxiao21xx@icloud.com,alexperfectapi01@gmail.com'
          VITE_STAFF_EMAILS: '408080793@qq.com,121406646@qq.com,Zenithjoy21xx@gmail.com,xuxiao21xx@icloud.com'
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          export VITE_BUILD_SHA="$DEPLOY_SHA"
          npm ci --workspace=apps/staff-hub
          npm run build --workspace=apps/staff-hub
          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > apps/staff-hub/dist/release-sha.json
      - name: Upload immutable candidate and release helper
        run: |
          mkdir -p ~/.ssh bundle/dist
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          cp -R source/apps/staff-hub/dist/. bundle/dist/
          cp control/scripts/deploy/frontend-release.sh bundle/
          cp control/.github/workflows/scripts/deploy-lib.sh bundle/
          mkdir -p bundle/configs
          cp source/deploy/staff-hub/nginx.conf source/deploy/staff-hub/common.conf bundle/configs/
          REMOTE="/opt/zenithjoy/staff-hub/incoming/$DEPLOY_SHA-$UPLOAD_ID"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE'"
          rsync -az -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" bundle/ "$SSH_USER@$SSH_HOST:$REMOTE/"
      - name: Promote and roll back automatically on failure
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ needs.admission.outputs.sha }}
          UPLOAD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT || '22' }}
          envs: DEPLOY_SHA,UPLOAD_ID
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ && "$UPLOAD_ID" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
            BUNDLE="/opt/zenithjoy/staff-hub/incoming/$DEPLOY_SHA-$UPLOAD_ID"
            bash "$BUNDLE/frontend-release.sh" /opt/zenithjoy/staff-hub "$DEPLOY_SHA" \
              "$BUNDLE/dist" staff-hub https://staff.zenjoymedia.media:9443 "$BUNDLE/deploy-lib.sh" "$BUNDLE/configs"
