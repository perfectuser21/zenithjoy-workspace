name: Agent E2E -- Real Windows Video Pipeline
on:
  workflow_dispatch:
    inputs:
      agent_version:
        description: Agent install pack version
        required: false
        default: "1.1.10"
      session_token:
        description: Session token from pre-login (run get-e2e-token.sh locally before triggering)
        required: true

jobs:
  e2e-video-pipeline:
    name: Windows -- install pack + Agent online + video task + result
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download install pack
        shell: powershell
        run: |
          $v = "${{ github.event.inputs.agent_version }}"
          $url = "https://zenithjoy-static-1333590468.cos.accelerate.myqcloud.com/install-pack/zenithjoy-agent-v${v}.tar.gz"
          Write-Host "[e2e] downloading zenithjoy-agent-v${v}.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile "agent.tar.gz" -UseBasicParsing
          Write-Host "[e2e] downloaded: $((Get-Item agent.tar.gz).Length) bytes"

      - name: Extract install pack
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "pack" | Out-Null
          tar -xzf agent.tar.gz -C pack --strip-components=1
          Get-ChildItem pack | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Download test video (45s Chinese voiceover)
        shell: powershell
        run: |
          $dir = "C:\Users\runneradmin\Videos"
          $path = "$dir\zj-e2e-koubo-45s.mp4"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://zenithjoy-static-1333590468.cos.accelerate.myqcloud.com/e2e-test-assets/zj-e2e-koubo-45s.mp4"
          Invoke-WebRequest -Uri $url -OutFile $path -UseBasicParsing
          Write-Host "[e2e] video: $((Get-Item $path).Length) bytes at $path"
          echo "VIDEO_PATH=$path" >> $env:GITHUB_ENV

      - name: Write .env
        shell: powershell
        run: |
          $c = "ZENITHJOY_LICENSE=ZJ-F-FBFYTLFR`r`nZENITHJOY_API_BASE=https://autopilot.zenjoymedia.media`r`nZENITHJOY_API_URL=wss://autopilot.zenjoymedia.media/agent-ws"
          $c | Set-Content "pack\.env" -Encoding ascii
          Get-Content "pack\.env"

      - name: Extract Node.js v22
        shell: powershell
        run: |
          $nodeDir = "$env:APPDATA\ZenithJoy\runtime\nodejs"
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          Expand-Archive -Path "pack\node-win-x64.zip" -DestinationPath "$env:TEMP\zj-node-tmp" -Force
          $folder = (Get-ChildItem "$env:TEMP\zj-node-tmp" | Select-Object -First 1).Name
          Move-Item "$env:TEMP\zj-node-tmp\$folder\*" $nodeDir -Force
          Remove-Item "$env:TEMP\zj-node-tmp" -Recurse -Force
          Write-Host "[e2e] node: $(& "$nodeDir\node.exe" --version)"

      - name: Install hyperframes
        shell: powershell
        run: |
          $nodeExe = "$env:APPDATA\ZenithJoy\runtime\nodejs\node.exe"
          $npmCli  = "$env:APPDATA\ZenithJoy\runtime\nodejs\node_modules\npm\bin\npm-cli.js"
          $hfDir   = "$env:APPDATA\ZenithJoy\runtime\hyperframes"
          New-Item -ItemType Directory -Force -Path $hfDir | Out-Null
          & $nodeExe $npmCli install hyperframes --prefix $hfDir --registry https://registry.npmmirror.com
          if (-not (Test-Path "$hfDir\node_modules\hyperframes\dist\cli.js")) { exit 1 }
          Write-Host "[e2e] hyperframes OK"

      - name: Start Chrome CDP 19222
        shell: powershell
        run: |
          $chrome = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) { $chrome = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }
          Start-Process -FilePath $chrome -ArgumentList @(
            "--remote-debugging-port=19222",
            "--user-data-dir=$env:USERPROFILE\.zj-chrome",
            "--no-first-run", "--no-default-browser-check", "--disable-extensions"
          )
          Start-Sleep -Seconds 4
          Write-Host "[e2e] Chrome started :19222"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> $env:GITHUB_ENV
          echo "PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=1" >> $env:GITHUB_ENV

      - name: Start Agent (background)
        shell: powershell
        run: |
          $agentDir = (Resolve-Path "pack").Path
          $env:ZENITHJOY_LICENSE = "ZJ-F-FBFYTLFR"
          $env:ZENITHJOY_API_BASE = "https://autopilot.zenjoymedia.media"
          $env:ZENITHJOY_API_URL = "wss://autopilot.zenjoymedia.media/agent-ws"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.zj" | Out-Null
          Start-Process -FilePath "$agentDir\zenithjoy-agent.exe" -WorkingDirectory $agentDir -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\agent-out.log" -RedirectStandardError "$env:RUNNER_TEMP\agent-err.log"
          Start-Sleep -Seconds 10
          Get-Content "$env:RUNNER_TEMP\agent-out.log" -EA SilentlyContinue | Select-Object -Last 10

      - name: Wait for Agent online
        shell: powershell
        env:
          ZJ_SESSION_TOKEN: ${{ github.event.inputs.session_token }}
        run: |
          $tok = $env:ZJ_SESSION_TOKEN
          Write-Host "[e2e] using session token from dispatch input"
          echo "ZJ_SESSION_TOKEN=$tok" >> $env:GITHUB_ENV

          $licenseKey = "ZJ-F-FBFYTLFR"
          $hdr = @{ Authorization = "Bearer $licenseKey" }
          $maxWait = 120; $elapsed = 0
          while ($elapsed -lt $maxWait) {
            try {
              $r = Invoke-RestMethod -Uri "https://autopilot.zenjoymedia.media/api/agent/me/status" -Headers $hdr -EA Stop
              Write-Host "[e2e] ${elapsed}s connected=$($r.connected) hostname=$($r.hostname)"
              if ($r.connected -eq $true) { Write-Host "[e2e] Agent ONLINE"; exit 0 }
            } catch { Write-Host "[e2e] poll: $($_.Exception.Message)" }
            Start-Sleep -Seconds 5; $elapsed += 5
          }
          Write-Host "[e2e] TIMEOUT - agent did not come online in ${maxWait}s"
          Get-Content "$env:RUNNER_TEMP\agent-out.log" -EA SilentlyContinue | Select-Object -Last 40
          Get-Content "$env:RUNNER_TEMP\agent-err.log" -EA SilentlyContinue | Select-Object -Last 20
          exit 1

      - name: Install Playwright
        shell: powershell
        run: |
          npm install @playwright/test --no-save 2>&1 | Select-Object -Last 5
          npx playwright install chromium 2>&1 | Select-Object -Last 3

      - name: Run Playwright E2E test
        shell: powershell
        env:
          VIDEO_PATH: ${{ env.VIDEO_PATH }}
          ZJ_SESSION_TOKEN: ${{ github.event.inputs.session_token }}
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          npx playwright test e2e/agent-video-pipeline.spec.js --reporter=list

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn

      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent-out.log
            ${{ runner.temp }}/agent-err.log
          if-no-files-found: warn
