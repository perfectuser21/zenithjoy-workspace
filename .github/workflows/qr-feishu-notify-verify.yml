name: QR Notification API Acceptance (Windows)

# 验证 qr-bind-operator.cjs 在 Windows 上：
#   1. 启动浏览器 → 打开抖音登录页
#   2. 等待 QR 元素出现
#   3. 只截 QR 元素（非全屏）
#   4. 推送飞书互动卡片
#
# 脚本会在 90s 后扫码超时退出（正常，没人扫）。
# 仅验证元素截图边界与provider业务码成功；不声称群内已送达/可扫码，需独立读回。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '待验证平台'
        type: choice
        options: [douyin, kuaishou, xiaohongshu, shipinhao, toutiao, weibo, zhihu, gongzhonghao]
        default: douyin

jobs:
  qr-feishu-notify:
    name: QR element crop + provider API acceptance
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json

      - name: Install agent dependencies
        working-directory: services/agent
        run: npm ci

      - name: Install Playwright chromium
        working-directory: services/agent
        run: npx playwright install chromium --with-deps

      - name: Bind attempt and strict provider acceptance receipt
        working-directory: services/agent
        shell: pwsh
        env:
          PLATFORM: ${{ inputs.platform || 'douyin' }}
          QR_NOTIFICATION_EVIDENCE: ${{ github.workspace }}/qr-notification-evidence.json
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          ZENITHJOY_FEISHU_WEBHOOK: ${{ secrets.ZENITHJOY_FEISHU_WEBHOOK }}
        run: |
          node publishers/qr-bind-operator.cjs $env:PLATFORM "" "ci-verify" 150000 > "$env:GITHUB_WORKSPACE/qr-bind-result.jsonl"
          $bindingExit = $LASTEXITCODE
          node ../../scripts/sessions/validate-qr-notification.mjs $env:QR_NOTIFICATION_EVIDENCE "$env:GITHUB_WORKSPACE/qr-bind-result.jsonl" "$bindingExit" $env:GITHUB_RUN_ID $env:PLATFORM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "API acceptance verified. External message delivery and QR readability remain NOT_VERIFIED."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-notification-api-acceptance
          path: |
            qr-notification-evidence.json
            qr-bind-result.jsonl
          if-no-files-found: error
