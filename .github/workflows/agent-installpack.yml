name: Agent Install Pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - '.github/workflows/agent-installpack.yml'

jobs:
  build:
    # windows-latest: pkg 在 Windows 上原生编译 win-x64 exe。
    # COS 上传用 cos.accelerate.myqcloud.com（全球 CDN 加速，跨境 TCP 稳定）。
    # Dryrun verify 也在此处跑（windows-latest 是 Windows，可直接执行 embedded python.exe）。
    runs-on: windows-latest
    outputs:
      pack_name: ${{ steps.get_pack.outputs.pack_name }}
      cos_url: ${{ steps.cos_upload.outputs.cos_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: services/agent
      - name: Build dist
        run: npm run build
        working-directory: services/agent
      - name: Build install pack
        shell: bash
        run: bash scripts/build-install-pack.sh
        working-directory: services/agent

      # ── exe overlay 完整性 + 可运行 gate（钉死 2.0.25 的 Pkg-error 回归）──────────────────
      # 2.0.25 坏在：pkg 打完后 rcedit --set-icon 改 PE 资源截断了追加在 exe 末尾的 snapshot
      # overlay → exe 从 69.7MB 掉到 37.8MB → 运行时 `Pkg: Error reading from file`。
      # 本 gate 在真 Windows runner 上直接验产出的 exe：① 大小 ≥60MB（overlay 完整）
      # ② 实跑 `--print-version` 不报 Pkg error、退出码 0（pkg 能读 overlay）。任一失败 → 红 job。
      # 注意：本 step 的 PowerShell 脚本体必须**纯 ASCII**。windows-latest 的
      # Windows PowerShell 5.1 不按 UTF-8 解析内联 .ps1，中文/em-dash/全角括号会乱码成
      # 非法 token（曾让本 gate 在 parse 阶段就崩，根本没跑到验 exe）。中文说明只放在上面的
      # YAML 注释里（注释不进 PowerShell 解析）。
      - name: Verify exe overlay intact and runnable
        shell: powershell
        working-directory: services/agent
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "zenithjoy-agent.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced: $exe" }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "[verify-exe] $exe size = $sizeMB MB"
          # overlay intact => whole exe ~69-70MB; truncated 2.0.25 was only 37.8MB. Floor 60MB.
          if ($sizeMB -lt 60) {
            throw "exe only $sizeMB MB (<60MB) - snapshot overlay likely truncated (2.0.25 Pkg-error regression)"
          }
          Write-Host "[verify-exe] running exe --print-version (proves pkg can read overlay, no Pkg error)"
          $out = & ".\$exe" --print-version 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "[verify-exe] exit=$code output: $out"
          if ($out -match "Pkg: Error") {
            throw "exe reports Pkg overlay read error - overlay corrupted: $out"
          }
          if ($code -ne 0) {
            throw "exe --print-version exit code $code (expected 0) - exe cannot start: $out"
          }
          Write-Host "[verify-exe] OK: exe overlay intact ($sizeMB MB) and runnable"

      # exe icon gate: the embedded app icon MUST be the ZenithJoy logo (blue), NOT the
      # default pkg/node icon (green hexagon). #846 fixed overlay but the icon silently
      # stayed default -> real machine extraction showed a green hexagon. This step
      # extracts the exe's largest icon frame and asserts it is predominantly BLUE
      # (ZenithJoy logo) and NOT predominantly green (default node icon). ASCII-only body.
      - name: Verify exe app icon is ZenithJoy logo (not default node icon)
        shell: powershell
        working-directory: services/agent
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path "zenithjoy-agent.exe").Path

          # ExtractIconEx pulls the actual PE RT_GROUP_ICON resource (not the generic assoc icon).
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public class IconEx {
            [DllImport("Shell32.dll", CharSet=CharSet.Auto)]
            public static extern uint ExtractIconEx(string lpszFile, int nIconIndex, IntPtr[] phiconLarge, IntPtr[] phiconSmall, uint nIcons);
            [DllImport("user32.dll")] public static extern bool DestroyIcon(IntPtr hIcon);
          }
          "@
          Add-Type -TypeDefinition $sig

          $large = New-Object IntPtr[] 1
          $small = New-Object IntPtr[] 1
          $n = [IconEx]::ExtractIconEx($exe, 0, $large, $small, 1)
          if ($large[0] -eq [IntPtr]::Zero) { throw "could not extract app icon from exe" }
          $icon = [System.Drawing.Icon]::FromHandle($large[0])
          $bmp = $icon.ToBitmap()
          Write-Host "[verify-icon] extracted icon $($bmp.Width)x$($bmp.Height)"

          # Sample every pixel; accumulate average RGB over non-transparent pixels.
          $rSum = 0.0; $gSum = 0.0; $bSum = 0.0; $cnt = 0
          for ($y = 0; $y -lt $bmp.Height; $y++) {
            for ($x = 0; $x -lt $bmp.Width; $x++) {
              $px = $bmp.GetPixel($x, $y)
              if ($px.A -lt 32) { continue }
              $rSum += $px.R; $gSum += $px.G; $bSum += $px.B; $cnt++
            }
          }
          [IconEx]::DestroyIcon($large[0]) | Out-Null
          if ($cnt -eq 0) { throw "icon has no opaque pixels - extraction failed" }
          $rAvg = [int]($rSum / $cnt); $gAvg = [int]($gSum / $cnt); $bAvg = [int]($bSum / $cnt)
          Write-Host "[verify-icon] avg opaque RGB = ($rAvg, $gAvg, $bAvg) over $cnt px"

          # ZenithJoy logo = blue text on white/transparent => blue channel dominates over green.
          # Default node icon = green hexagon => green channel dominates over blue.
          # Assert blue is meaningfully >= green (logo), reject green-dominant (default node).
          if ($gAvg -gt ($bAvg + 8)) {
            throw "exe icon looks like the DEFAULT node icon (green-dominant: g=$gAvg > b=$bAvg) - ZenithJoy logo was NOT embedded"
          }
          Write-Host "[verify-icon] OK: exe app icon is ZenithJoy logo (blue>=green: b=$bAvg g=$gAvg)"

      - name: Get pack name
        id: get_pack
        shell: bash
        run: |
          PACK=$(basename "$(ls services/agent/dist-installpack/zenithjoy-agent-v*.tar.gz | head -1)")
          echo "pack_name=${PACK}" >> "$GITHUB_OUTPUT"
          echo "[build] pack_name=${PACK}"
      - name: Upload to COS (cos.accelerate CDN bypass)
        id: cos_upload
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = (Get-ChildItem services\agent\dist-installpack\*.tar.gz | Select-Object -First 1).Name
          $bucket = "zenithjoy-static-1333590468"
          $endpoint = "cos.accelerate.myqcloud.com"
          $cosKey = "install-pack/$pack"
          $cosUrl = "https://$bucket.$endpoint/$cosKey"

          Write-Host "[upload] Installing coscmd..."
          python -m pip install coscmd -q
          if ($LASTEXITCODE -ne 0) { throw "pip install coscmd failed exit=$LASTEXITCODE" }

          Write-Host "[upload] Configuring coscmd..."
          coscmd config -a $env:COS_SECRET_ID -s $env:COS_SECRET_KEY -b $bucket -e $endpoint

          Write-Host "[upload] Uploading services\agent\dist-installpack\$pack -> cos://$bucket/$cosKey"
          coscmd upload "services\agent\dist-installpack\$pack" "/install-pack/$pack" --force

          "cos_url=$cosUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "pack_name=$pack" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "[upload] done: $cosUrl"

      - name: Dryrun verify (embedded-python import check)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = (Get-ChildItem services\agent\dist-installpack\*.tar.gz | Select-Object -First 1).FullName
          $verifyDir = "dist-verify-tmp"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          Write-Host "[verify] extracting $pack"
          tar xzf $pack -C $verifyDir
          $agentDir = (Get-ChildItem -Directory "$verifyDir\zenithjoy-agent-v*" | Select-Object -First 1).FullName
          Write-Host "[verify] agent dir: $agentDir"
          & "$agentDir\python-embedded\python.exe" "$agentDir\wechat-rpa\listen_chat.py" --dryrun-print-version
          if ($LASTEXITCODE -ne 0) { throw "dryrun-print-version failed with exit code $LASTEXITCODE" }
          Write-Host "[verify] dryrun-print-version OK"
          Remove-Item -Recurse -Force $verifyDir -ErrorAction SilentlyContinue

      - name: Update manifest with cos_url
        shell: powershell
        env:
          COS_URL: ${{ steps.cos_upload.outputs.cos_url }}
        run: |
          $m = Get-Content "services\agent\dist-installpack\manifest.json" | ConvertFrom-Json
          $m | Add-Member -MemberType NoteProperty -Name "cos_url" -Value $env:COS_URL -Force
          $m | ConvertTo-Json -Depth 5 | Set-Content "services\agent\dist-installpack\manifest.json" -Encoding ascii
          Write-Host "manifest.json updated: $env:COS_URL"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-manifest
          path: services/agent/dist-installpack/manifest.json
          retention-days: 1

  # 各 Line 模块独立打包（与 build 并行），上传到 COS modules/ 目录。
  # core.exe 轻量，Line 模块按需下载安装。
  build-line-modules:
    runs-on: ubuntu-latest
    needs: []   # 与 build job 并行，不依赖 core
    strategy:
      matrix:
        lineId: [line04, line01, line02, line05]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        shell: bash
        working-directory: services/agent
        run: npm ci
      - name: Build line module
        shell: bash
        working-directory: services/agent
        run: |
          # build-line-module.sh 由 beta 负责；未合并前占位通过，保证 CI 结构验证
          if [ -f scripts/build-line-module.sh ]; then
            bash scripts/build-line-module.sh ${{ matrix.lineId }}
          else
            echo "::warning::scripts/build-line-module.sh pending (beta), skip build"
          fi
      - name: Upload ${{ matrix.lineId }} to COS
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        working-directory: services/agent
        run: |
          MANIFEST_LINE_ID=$(node -e "console.log(require('./modules/${{ matrix.lineId }}/manifest.json').lineId)" 2>/dev/null || echo "${{ matrix.lineId }}")
          # find 无文件时 exit 0（ls 无文件时 exit 2，pipefail 下会提前退出脚本）
          PACK=$(find dist-modules -maxdepth 1 -name "${MANIFEST_LINE_ID}-v*.tar.gz" 2>/dev/null | head -1)
          if [ -z "$PACK" ]; then
            echo "::warning::dist-modules/${MANIFEST_LINE_ID}-v*.tar.gz 不存在，跳过上传"
            exit 0
          fi
          pip install coscmd -q
          PACK_NAME=$(basename "$PACK")
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/modules/${PACK_NAME}"
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload "$PACK" "$COS_PATH" --force
          echo "Uploaded: https://${BUCKET}.${ENDPOINT}${COS_PATH}"

  publish:
    needs: [build, build-line-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: zenithjoy-agent-manifest
          path: services/agent/dist-installpack/

      # 幂等镜像微信 4.1.8 安装器到 COS（env-doctor preflight 自愈时的内网回退源）
      # 增强项，非 agent 包硬依赖：env-doctor 有官方 dldir1v6.qq.com 回退，故此步失败不红 job。
      - name: Mirror WeChat 4.1.8 to COS (idempotent)
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/wechat/WeChatWin_4.1.8.exe"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"
          OFFICIAL="https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.1.8.exe"

          if curl -sf -I "$COS_URL" >/dev/null 2>&1; then
            echo "[mirror-wechat] 已镜像，跳过：$COS_URL"
            exit 0
          fi

          echo "[mirror-wechat] COS 无缓存，从官方下载 $OFFICIAL ..."
          curl -L -o WeChatWin_4.1.8.exe "$OFFICIAL" || { echo "[mirror-wechat] 官方下载失败，跳过镜像（非致命）"; exit 0; }

          SIZE=$(stat -c%s WeChatWin_4.1.8.exe 2>/dev/null || stat -f%z WeChatWin_4.1.8.exe)
          if [ "${SIZE:-0}" -lt 209715200 ]; then
            echo "[mirror-wechat] 下载体积异常（${SIZE} bytes < 200MB），跳过上传（非致命）"
            exit 0
          fi

          pip install coscmd -q
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b "zenithjoy-static-1333590468" -e "cos.accelerate.myqcloud.com"
          coscmd upload WeChatWin_4.1.8.exe \
            "/install-pack/wechat/WeChatWin_4.1.8.exe" --force \
            || echo "[mirror-wechat] coscmd upload 失败（非致命，有官方回退源）"

      - name: Deploy manifest.json to HK VPS
        env:
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          VPS_INTERNAL_TOKEN: ${{ secrets.VPS_INTERNAL_TOKEN }}
        run: |
          curl -sf -X PUT "${VPS_API_URL}/api/agent/install-pack/manifest" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${VPS_INTERNAL_TOKEN}" \
            -d @services/agent/dist-installpack/manifest.json \
            --max-time 30
