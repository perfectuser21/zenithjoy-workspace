name: Agent Install Pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - '.github/workflows/agent-installpack.yml'

jobs:
  build:
    # windows-latest: pkg 在 Windows 上原生编译 win-x64 exe，无需下载交叉编译 binary
    # ubuntu-latest 需从 pkg-fetch.vercel.app 拉 win64 binary，该 CDN 不稳定 504
    runs-on: windows-latest
    outputs:
      pack_name: ${{ steps.get_pack.outputs.pack_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: services/agent
      - name: Build dist
        run: npm run build
        working-directory: services/agent
      - name: Build install pack
        shell: bash
        run: bash scripts/build-install-pack.sh
        working-directory: services/agent
      - name: Get pack name
        id: get_pack
        shell: bash
        run: |
          PACK=$(basename "$(ls services/agent/dist-installpack/zenithjoy-agent-v*.tar.gz | head -1)")
          echo "pack_name=${PACK}" >> "$GITHUB_OUTPUT"
          echo "[build] pack_name=${PACK}"
      - name: Upload tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-installpack
          path: |
            services/agent/dist-installpack/zenithjoy-agent-v*.tar.gz
            services/agent/dist-installpack/manifest.json
          retention-days: 1

  # 各 Line 模块独立打包（与 build 并行），上传到 COS modules/ 目录。
  # core.exe 轻量，Line 模块按需下载安装。
  build-line-modules:
    runs-on: ubuntu-latest
    needs: []   # 与 build job 并行，不依赖 core
    strategy:
      matrix:
        lineId: [line04, line01, line02, line05]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        shell: bash
        working-directory: services/agent
        run: npm ci
      - name: Build line module
        shell: bash
        working-directory: services/agent
        run: |
          # build-line-module.sh 由 beta 负责；未合并前占位通过，保证 CI 结构验证
          if [ -f scripts/build-line-module.sh ]; then
            bash scripts/build-line-module.sh ${{ matrix.lineId }}
          else
            echo "::warning::scripts/build-line-module.sh pending (beta), skip build"
          fi
      - name: Upload ${{ matrix.lineId }} to COS
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        working-directory: services/agent
        run: |
          PACK=$(ls dist-modules/${{ matrix.lineId }}-v*.tar.gz 2>/dev/null | head -1)
          if [ -z "$PACK" ]; then
            echo "::warning::dist-modules/${{ matrix.lineId }}-v*.tar.gz 不存在（脚本占位），跳过上传"
            exit 0
          fi
          pip install coscmd -q
          PACK_NAME=$(basename "$PACK")
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/modules/${PACK_NAME}"
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload "$PACK" "$COS_PATH" --force
          echo "Uploaded: https://${BUCKET}.${ENDPOINT}${COS_PATH}"

  # COS 上传 + dryrun 合并在 xian-rog（中国节点）：
  # xian-rog → COS ap-guangzhou 是国内链路，无跨境 TCP 连接被防火墙丢弃的问题。
  # GitHub Actions ubuntu-latest（美国）→ COS China 的 multipart TCP 连接不稳定（已验证失败）。
  upload-and-verify:
    needs: [build]
    runs-on: [self-hosted, wechat-capable]
    outputs:
      cos_url: ${{ steps.cos_upload.outputs.cos_url }}
      pack_name: ${{ steps.cos_upload.outputs.pack_name }}
    steps:
      # 注意：xian-rog 在中国境内，无法访问 github.com（HTTPS 443 被墙）。
      # 故意不用 actions/checkout@v4，改用 inline Python 脚本上传 COS。
      # actions/download-artifact 和 upload-artifact 走 Actions 内部 API，不走 github.com，可用。

      - name: Download tar.gz artifact from GitHub
        uses: actions/download-artifact@v4
        with:
          name: zenithjoy-agent-installpack
          path: dist-installpack/

      - name: Upload to COS (xian-rog China → COS China，国内链路稳定)
        id: cos_upload
        shell: powershell
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = (Get-ChildItem dist-installpack\*.tar.gz | Select-Object -First 1).Name
          $bucket = "zenithjoy-static-1333590468"
          $region = "ap-guangzhou"
          $cosKey = "install-pack/$pack"
          $cosUrl = "https://$bucket.cos.$region.myqcloud.com/$cosKey"

          Write-Host "[upload] Installing cos-python-sdk-v5..."
          python -m pip install cos-python-sdk-v5 -q 2>&1 | Write-Host

          # inline cos-upload via base64（避免 PowerShell here-string 与 YAML 缩进冲突）
          $b64 = ""
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64)) | Set-Content "cos-upload-inline.py" -Encoding utf8NoBOM

          Write-Host "[upload] Uploading dist-installpack\$pack -> cos://$bucket/$cosKey"
          python cos-upload-inline.py "dist-installpack\$pack" $bucket $region $cosKey

          "cos_url=$cosUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          "pack_name=$pack" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          Write-Host "[upload] done: $cosUrl"

      - name: Update manifest with cos_url
        shell: powershell
        env:
          COS_URL: ${{ steps.cos_upload.outputs.cos_url }}
        run: |
          $m = Get-Content "dist-installpack\manifest.json" | ConvertFrom-Json
          $m | Add-Member -MemberType NoteProperty -Name "cos_url" -Value $env:COS_URL -Force
          $m | ConvertTo-Json -Depth 5 | Set-Content "dist-installpack\manifest.json" -Encoding utf8NoBOM
          Write-Host "manifest.json updated: $env:COS_URL"

      - name: Dryrun verify (real embedded-python import check)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = (Get-ChildItem dist-installpack\*.tar.gz | Select-Object -First 1).FullName
          Write-Host "[verify] extracting $pack"
          tar xzf $pack -C dist-installpack
          $agentDir = (Get-ChildItem -Directory dist-installpack\zenithjoy-agent-v* | Select-Object -First 1).FullName
          Write-Host "[verify] agent dir: $agentDir"
          & "$agentDir\python-embedded\python.exe" "$agentDir\wechat-rpa\listen_chat.py" --dryrun-print-version
          if ($LASTEXITCODE -ne 0) { throw "dryrun-print-version failed with exit code $LASTEXITCODE" }
          Write-Host "[verify] dryrun-print-version OK"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-manifest
          path: dist-installpack/manifest.json

      - name: Cleanup
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force dist-installpack -ErrorAction SilentlyContinue

  publish:
    needs: [upload-and-verify, build-line-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: zenithjoy-agent-manifest
          path: services/agent/dist-installpack/

      # 幂等镜像微信 4.1.8 安装器到 COS（env-doctor preflight 自愈时的内网回退源）
      # 增强项，非 agent 包硬依赖：env-doctor 有官方 dldir1v6.qq.com 回退，故此步失败不红 job。
      - name: Mirror WeChat 4.1.8 to COS (idempotent)
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/wechat/WeChatWin_4.1.8.exe"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"
          OFFICIAL="https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.1.8.exe"

          if curl -sf -I "$COS_URL" >/dev/null 2>&1; then
            echo "[mirror-wechat] 已镜像，跳过：$COS_URL"
            exit 0
          fi

          echo "[mirror-wechat] COS 无缓存，从官方下载 $OFFICIAL ..."
          curl -L -o WeChatWin_4.1.8.exe "$OFFICIAL" || { echo "[mirror-wechat] 官方下载失败，跳过镜像（非致命）"; exit 0; }

          SIZE=$(stat -c%s WeChatWin_4.1.8.exe 2>/dev/null || stat -f%z WeChatWin_4.1.8.exe)
          if [ "${SIZE:-0}" -lt 209715200 ]; then
            echo "[mirror-wechat] 下载体积异常（${SIZE} bytes < 200MB），跳过上传（非致命）"
            exit 0
          fi

          pip install coscmd -q
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b "zenithjoy-static-1333590468" -e "cos.accelerate.myqcloud.com"
          coscmd upload WeChatWin_4.1.8.exe \
            "/install-pack/wechat/WeChatWin_4.1.8.exe" --force \
            || echo "[mirror-wechat] coscmd upload 失败（非致命，有官方回退源）"

      - name: Deploy manifest.json to HK VPS
        env:
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          VPS_INTERNAL_TOKEN: ${{ secrets.VPS_INTERNAL_TOKEN }}
        run: |
          curl -sf -X PUT "${VPS_API_URL}/api/agent/install-pack/manifest" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${VPS_INTERNAL_TOKEN}" \
            -d @services/agent/dist-installpack/manifest.json \
            --max-time 30
