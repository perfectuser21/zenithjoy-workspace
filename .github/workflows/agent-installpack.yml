name: Agent Install Pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - '.github/workflows/agent-installpack.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cos_url: ${{ steps.cos_upload.outputs.cos_url }}
      pack_name: ${{ steps.cos_upload.outputs.pack_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 缓存 pkg win64 二进制，避免每次从 pkg-fetch.vercel.app 下载（不稳定导致 504/compile-error）
      - name: Cache pkg binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-node18-win64-v1
      # pkg-fetch.vercel.app 不稳定时（504），直接从 GitHub releases 预置二进制绕过它
      - name: Pre-seed pkg binary from GitHub releases (fallback)
        run: |
          PKG_CACHE="$HOME/.pkg-cache/v3.4"
          BINARY="fetched-v18.5.0-win-x64"
          if [ ! -f "$PKG_CACHE/$BINARY" ]; then
            mkdir -p "$PKG_CACHE"
            echo "[pkg-seed] downloading node-v18.5.0-win-x64 from pkg-fetch releases..."
            curl -L --retry 3 -o "$PKG_CACHE/$BINARY" \
              "https://github.com/vercel/pkg-fetch/releases/download/v3.4/node-v18.5.0-win-x64"
            chmod +x "$PKG_CACHE/$BINARY"
            echo "[pkg-seed] seeded: $PKG_CACHE/$BINARY ($(du -sh "$PKG_CACHE/$BINARY" | cut -f1))"
          else
            echo "[pkg-seed] cache hit, skipping download"
          fi
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: services/agent
      - name: Build dist
        run: npm run build
        working-directory: services/agent
      - name: Build install pack
        run: bash scripts/build-install-pack.sh
        working-directory: services/agent

      # 先上传 COS，让 verify-on-rog 可以从国内加速节点下载（避免从 GitHub Artifact 跨国拉 700MB）
      - name: Upload to COS
        id: cos_upload
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install coscmd -q
          PACK=$(basename "$(ls services/agent/dist-installpack/zenithjoy-agent-v*.tar.gz | head -1)")
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/${PACK}"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"

          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload "services/agent/dist-installpack/${PACK}" "$COS_PATH" --force

          echo "cos_url=${COS_URL}" >> "$GITHUB_OUTPUT"
          echo "pack_name=${PACK}" >> "$GITHUB_OUTPUT"
          echo "COS_URL=${COS_URL}" >> "$GITHUB_ENV"
          echo "[build] uploaded to $COS_URL"

      - name: Update manifest with cos_url
        run: |
          python3 -c "
          import json, os
          path = 'services/agent/dist-installpack/manifest.json'
          with open(path) as f:
              m = json.load(f)
          m['cos_url'] = os.environ['COS_URL']
          with open(path, 'w') as f:
              json.dump(m, f, indent=2)
          print('manifest.json updated with cos_url:', m['cos_url'])
          "

      # 只把小体积的 manifest.json 存 artifact，publish job 读取后部署
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-manifest
          path: services/agent/dist-installpack/manifest.json

  # 在 self-hosted Windows (ROG, wechat-capable) 上真实跑 dryrun，
  # 用 embedded python 真 import pywinauto/win32api/comtypes，
  # 失败则 publish 不运行 — 防止把环境坏掉的包发到 COS/HK VPS。
  verify-on-rog:
    needs: [build]
    runs-on: [self-hosted, wechat-capable]
    steps:
      # 从 COS 国内加速节点下载（xian-rog 在国内，比 GitHub Artifact 快 10x+）
      - name: Download from COS (国内加速)
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $cosUrl = "${{ needs.build.outputs.cos_url }}"
          $packName = "${{ needs.build.outputs.pack_name }}"
          New-Item -ItemType Directory -Force -Path dist-installpack | Out-Null
          Write-Host "[verify] Downloading from COS: $cosUrl"
          Invoke-WebRequest -Uri $cosUrl -OutFile "dist-installpack\$packName" -UseBasicParsing
          $sizeMB = [math]::Round((Get-Item "dist-installpack\$packName").Length / 1MB, 1)
          Write-Host "[verify] Download complete: ${sizeMB} MB"

      - name: Dryrun verify (real embedded-python import check)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = (Get-ChildItem dist-installpack\*.tar.gz | Select-Object -First 1).FullName
          Write-Host "[verify] extracting $pack"
          tar xzf $pack -C dist-installpack
          $agentDir = (Get-ChildItem -Directory dist-installpack\zenithjoy-agent-v* | Select-Object -First 1).FullName
          Write-Host "[verify] agent dir: $agentDir"
          & "$agentDir\python-embedded\python.exe" "$agentDir\wechat-rpa\listen_chat.py" --dryrun-print-version
          if ($LASTEXITCODE -ne 0) { throw "dryrun-print-version failed with exit code $LASTEXITCODE" }
          Write-Host "[verify] dryrun-print-version OK"

      - name: Cleanup
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force dist-installpack -ErrorAction SilentlyContinue

  publish:
    needs: [verify-on-rog]
    runs-on: ubuntu-latest
    steps:
      # COS 上传已在 build job 完成，此处只下载 manifest.json 用于部署
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: zenithjoy-agent-manifest
          path: services/agent/dist-installpack/

      # 幂等镜像微信 4.1.8 安装器到 COS（env-doctor preflight 自愈时的内网回退源）
      # 增强项，非 agent 包硬依赖：env-doctor 有官方 dldir1v6.qq.com 回退，故此步失败不红 job。
      - name: Mirror WeChat 4.1.8 to COS (idempotent)
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/wechat/WeChatWin_4.1.8.exe"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"
          OFFICIAL="https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.1.8.exe"

          if curl -sf -I "$COS_URL" >/dev/null 2>&1; then
            echo "[mirror-wechat] 已镜像，跳过：$COS_URL"
            exit 0
          fi

          echo "[mirror-wechat] COS 无缓存，从官方下载 $OFFICIAL ..."
          curl -L -o WeChatWin_4.1.8.exe "$OFFICIAL" || { echo "[mirror-wechat] 官方下载失败，跳过镜像（非致命）"; exit 0; }

          SIZE=$(stat -c%s WeChatWin_4.1.8.exe 2>/dev/null || stat -f%z WeChatWin_4.1.8.exe)
          if [ "${SIZE:-0}" -lt 209715200 ]; then
            echo "[mirror-wechat] 下载体积异常（${SIZE} bytes < 200MB），跳过上传（非致命）"
            exit 0
          fi

          pip install coscmd -q
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload WeChatWin_4.1.8.exe "$COS_PATH" --force || { echo "[mirror-wechat] 上传失败（非致命）"; exit 0; }
          echo "[mirror-wechat] 已镜像到 $COS_URL"

      - name: Deploy manifest.json to HK VPS
        env:
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          VPS_INTERNAL_TOKEN: ${{ secrets.VPS_INTERNAL_TOKEN }}
        run: |
          curl -sf -X PUT "${VPS_API_URL}/api/agent/install-pack/manifest" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${VPS_INTERNAL_TOKEN}" \
            -d @services/agent/dist-installpack/manifest.json \
            --max-time 30
