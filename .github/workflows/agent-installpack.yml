name: Agent Install Pack Candidate
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deprecated; false builds candidates, true is rejected (no production publishing)
        type: boolean
        default: false
        required: true
  push:
    branches: [main]
    paths:
      - ".skills-source.json"
      - 'services/agent/**'
      - '.github/workflows/agent-installpack.yml'

permissions:
  contents: read

jobs:
  candidate-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject deprecated production publish mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$REQUESTED_PUBLISH" != "" && "$REQUESTED_PUBLISH" != "false" ]]; then
            echo "::error::publish=true is disabled; this workflow only builds candidates" >&2
            exit 1
          fi
          case "$EVENT_NAME" in
            push|workflow_dispatch) echo "candidate only: no production publication" ;;
            *) echo "::error::unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac

  build:
    # windows-latest: pkg 在 Windows 上原生编译 win-x64 exe。
    # Dryrun verify 也在此处跑（windows-latest 是 Windows，可直接执行 embedded python.exe）。
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [candidate-mode]
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: services/agent
      - name: Build dist
        run: npm run build
        working-directory: services/agent
      # 作战窗刀1(PR #1497起)把apps/agent-panel的vite build接进了build-install-pack.sh，
      # 但这个job此前只npm install了services/agent，从未装过apps/agent-panel的devDependencies
      # (含vite)——build-install-pack.sh内部跑`npm run build`(=vite build)时报
      # "'vite' is not recognized"，job从此每次必红，publish job被跳过，
      # 2026-07-29之前合并的相关PR全部没有真的推送到生产（发现记录见 docs/handoffs/
      # 202607291540-panel-click-through-investigation.md 关联issue）。
      - name: Install agent-panel web deps
        run: npm ci --no-audit --no-fund
        working-directory: apps/agent-panel
      - name: Build install pack
        shell: bash
        run: bash scripts/build-install-pack.sh
        working-directory: services/agent

      # ── exe overlay 完整性 + 可运行 gate（钉死 2.0.25 的 Pkg-error 回归）──────────────────
      # 2.0.25 坏在：pkg 打完后 rcedit --set-icon 改 PE 资源截断了追加在 exe 末尾的 snapshot
      # overlay → exe 从 69.7MB 掉到 37.8MB → 运行时 `Pkg: Error reading from file`。
      # 本 gate 在真 Windows runner 上直接验产出的 exe：① 大小 ≥60MB（overlay 完整）
      # ② 实跑 `--print-version` 不报 Pkg error、退出码 0（pkg 能读 overlay）。任一失败 → 红 job。
      # 注意：本 step 的 PowerShell 脚本体必须**纯 ASCII**。windows-latest 的
      # Windows PowerShell 5.1 不按 UTF-8 解析内联 .ps1，中文/em-dash/全角括号会乱码成
      # 非法 token（曾让本 gate 在 parse 阶段就崩，根本没跑到验 exe）。中文说明只放在上面的
      # YAML 注释里（注释不进 PowerShell 解析）。
      - name: Verify exe overlay intact and runnable
        shell: powershell
        working-directory: services/agent
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "zenithjoy-agent.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced: $exe" }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "[verify-exe] $exe size = $sizeMB MB"
          # overlay intact => whole exe ~69-70MB; truncated 2.0.25 was only 37.8MB. Floor 60MB.
          if ($sizeMB -lt 60) {
            throw "exe only $sizeMB MB (<60MB) - snapshot overlay likely truncated (2.0.25 Pkg-error regression)"
          }
          Write-Host "[verify-exe] running exe --print-version (proves pkg can read overlay, no Pkg error)"
          $out = & ".\$exe" --print-version 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "[verify-exe] exit=$code output: $out"
          if ($out -match "Pkg: Error") {
            throw "exe reports Pkg overlay read error - overlay corrupted: $out"
          }
          if ($code -ne 0) {
            throw "exe --print-version exit code $code (expected 0) - exe cannot start: $out"
          }
          Write-Host "[verify-exe] OK: exe overlay intact ($sizeMB MB) and runnable"

      # exe icon gate: the embedded app icon MUST be the ZenithJoy logo (blue), NOT the
      # default pkg/node icon (green hexagon). #846 fixed overlay but the icon silently
      # stayed default -> real machine extraction showed a green hexagon. This step
      # extracts the exe's largest icon frame and asserts it is predominantly BLUE
      # (ZenithJoy logo) and NOT predominantly green (default node icon). ASCII-only body.
      - name: Verify exe app icon is ZenithJoy logo (not default node icon)
        shell: powershell
        working-directory: services/agent
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path "zenithjoy-agent.exe").Path

          # ExtractIconEx pulls the actual PE RT_GROUP_ICON resource (not the generic assoc icon).
          $sig = @"
          using System;
          using System.Runtime.InteropServices;
          public class IconEx {
            [DllImport("Shell32.dll", CharSet=CharSet.Auto)]
            public static extern uint ExtractIconEx(string lpszFile, int nIconIndex, IntPtr[] phiconLarge, IntPtr[] phiconSmall, uint nIcons);
            [DllImport("user32.dll")] public static extern bool DestroyIcon(IntPtr hIcon);
          }
          "@
          Add-Type -TypeDefinition $sig

          $large = New-Object IntPtr[] 1
          $small = New-Object IntPtr[] 1
          $n = [IconEx]::ExtractIconEx($exe, 0, $large, $small, 1)
          if ($large[0] -eq [IntPtr]::Zero) { throw "could not extract app icon from exe" }
          $icon = [System.Drawing.Icon]::FromHandle($large[0])
          $bmp = $icon.ToBitmap()
          Write-Host "[verify-icon] extracted icon $($bmp.Width)x$($bmp.Height)"

          # Sample every pixel; accumulate average RGB over non-transparent pixels.
          $rSum = 0.0; $gSum = 0.0; $bSum = 0.0; $cnt = 0
          for ($y = 0; $y -lt $bmp.Height; $y++) {
            for ($x = 0; $x -lt $bmp.Width; $x++) {
              $px = $bmp.GetPixel($x, $y)
              if ($px.A -lt 32) { continue }
              $rSum += $px.R; $gSum += $px.G; $bSum += $px.B; $cnt++
            }
          }
          [IconEx]::DestroyIcon($large[0]) | Out-Null
          if ($cnt -eq 0) { throw "icon has no opaque pixels - extraction failed" }
          $rAvg = [int]($rSum / $cnt); $gAvg = [int]($gSum / $cnt); $bAvg = [int]($bSum / $cnt)
          Write-Host "[verify-icon] avg opaque RGB = ($rAvg, $gAvg, $bAvg) over $cnt px"

          # ZenithJoy logo = blue text on white/transparent => blue channel dominates over green.
          # Default node icon = green hexagon => green channel dominates over blue.
          # Assert blue is meaningfully >= green (logo), reject green-dominant (default node).
          if ($gAvg -gt ($bAvg + 8)) {
            throw "exe icon looks like the DEFAULT node icon (green-dominant: g=$gAvg > b=$bAvg) - ZenithJoy logo was NOT embedded"
          }
          Write-Host "[verify-icon] OK: exe app icon is ZenithJoy logo (blue>=green: b=$bAvg g=$gAvg)"

      - name: Dryrun verify (embedded-python import check)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pack = (Get-ChildItem services\agent\dist-installpack\*.tar.gz | Select-Object -First 1).FullName
          $verifyDir = "dist-verify-tmp"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          Write-Host "[verify] extracting $pack"
          tar xzf $pack -C $verifyDir
          $agentDir = (Get-ChildItem -Directory "$verifyDir\zenithjoy-agent-v*" | Select-Object -First 1).FullName
          Write-Host "[verify] agent dir: $agentDir"
          & "$agentDir\python-embedded\python.exe" "$agentDir\wechat-rpa\listen_chat.py" --dryrun-print-version
          if ($LASTEXITCODE -ne 0) { throw "dryrun-print-version failed with exit code $LASTEXITCODE" }
          Write-Host "[verify] dryrun-print-version OK"
          & "$agentDir\python-embedded\python.exe" -c "import webview; print('webview-import-ok')"
          if ($LASTEXITCODE -ne 0) { throw "packaged python-embedded cannot import webview - overlay supply broken (knife-A gate)" }
          Write-Host "[verify] pywebview import OK"
          Remove-Item -Recurse -Force $verifyDir -ErrorAction SilentlyContinue

      - name: Record candidate hashes
        shell: bash
        working-directory: services/agent
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/write-installpack-candidate.cjs core
      - name: Retain verified core candidate
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-candidate-core-${{ github.sha }}
          path: |
            services/agent/dist-installpack/*.tar.gz
            services/agent/dist-installpack/manifest.json
            services/agent/dist-installpack/candidate-receipt.json
            services/agent/dist-installpack/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # Core and four modules are retained as candidates from the same source SHA.
  # Existing clients and production pointers are not changed by this workflow.
  build-line-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [candidate-mode]
    strategy:
      matrix:
        lineId: [line04, line01, line02, line05]
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        shell: bash
        working-directory: services/agent
        run: npm ci
      - name: Build line module
        shell: bash
        working-directory: services/agent
        run: |
          bash scripts/build-line-module.sh ${{ matrix.lineId }}
          test -n "$(find dist-modules -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Record candidate hashes
        shell: bash
        working-directory: services/agent
        env:
          CANDIDATE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/write-installpack-candidate.cjs ${{ matrix.lineId }}
      - name: Retain module candidate
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-candidate-${{ matrix.lineId }}-${{ github.sha }}
          path: |
            services/agent/dist-modules/*.tar.gz
            services/agent/dist-modules/manifest.json
            services/agent/dist-modules/candidate-receipt.json
            services/agent/dist-modules/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
