name: Agent Install Pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - '.github/workflows/agent-installpack.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: services/agent
      - name: Build dist
        run: npm run build
        working-directory: services/agent
      - name: Build install pack
        run: bash scripts/build-install-pack.sh
        working-directory: services/agent

      - name: Upload to COS + update manifest cos_url
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install coscmd -q
          VERSION=$(node -e "console.log(require('./services/agent/package.json').version)")
          PACK="zenithjoy-agent-v${VERSION}.tar.gz"
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/${PACK}"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"

          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload "services/agent/dist-installpack/${PACK}" "$COS_PATH" --force

          # 更新 manifest.json 加入 cos_url
          python3 -c "
          import json
          path = 'services/agent/dist-installpack/manifest.json'
          with open(path) as f:
              m = json.load(f)
          m['cos_url'] = '${COS_URL}'
          with open(path, 'w') as f:
              json.dump(m, f, indent=2)
          print('manifest.json updated with cos_url:', m['cos_url'])
          "

      - name: Deploy manifest.json to HK VPS
        env:
          SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.HK_VPS_HOST }}
          VPS_USER: ${{ secrets.HK_VPS_USER }}
          VPS_PORT: ${{ secrets.HK_VPS_PORT }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          MANIFEST_JSON=$(cat services/agent/dist-installpack/manifest.json)
          ssh -i /tmp/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no \
            "${VPS_USER}@${VPS_HOST}" \
            "printf '%s' '${MANIFEST_JSON}' > /opt/zenithjoy/install-pack/manifest.json"
          rm -f /tmp/deploy_key

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-installpack
          path: services/agent/dist-installpack/
