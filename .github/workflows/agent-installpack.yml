name: Agent Install Pack
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - '.github/workflows/agent-installpack.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: services/agent
      - name: Build dist
        run: npm run build
        working-directory: services/agent
      - name: Build install pack
        run: bash scripts/build-install-pack.sh
        working-directory: services/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-installpack
          path: services/agent/dist-installpack/

  # 在 self-hosted Windows (ROG, wechat-capable) 上真实跑 dryrun，
  # 用 embedded python 真 import pywinauto/win32api/comtypes，
  # 失败则 publish 不运行 — 防止把环境坏掉的包发到 COS/HK VPS。
  verify-on-rog:
    needs: [build]
    runs-on: [self-hosted, wechat-capable]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: zenithjoy-agent-installpack
          path: dist-installpack/

      - name: Dryrun verify (real embedded-python import check)
        shell: bash
        run: |
          set -euo pipefail
          PACK=$(ls dist-installpack/*.tar.gz | head -1)
          echo "[verify] extracting $PACK"
          tar xzf "$PACK" -C dist-installpack/
          AGENT_DIR=$(ls -d dist-installpack/zenithjoy-agent-v*/ | head -1)
          echo "[verify] agent dir: $AGENT_DIR"
          "${AGENT_DIR}python-embedded/python.exe" "${AGENT_DIR}wechat-rpa/listen_chat.py" --dryrun-print-version
          echo "[verify] dryrun-print-version OK"

  publish:
    needs: [verify-on-rog]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: zenithjoy-agent-installpack
          path: services/agent/dist-installpack/

      - name: Upload to COS + update manifest cos_url
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install coscmd -q
          PACK=$(basename "$(ls services/agent/dist-installpack/zenithjoy-agent-v*.tar.gz | head -1)")
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/${PACK}"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"

          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload "services/agent/dist-installpack/${PACK}" "$COS_PATH" --force

          # 更新 manifest.json 加入 cos_url
          python3 -c "
          import json
          path = 'services/agent/dist-installpack/manifest.json'
          with open(path) as f:
              m = json.load(f)
          m['cos_url'] = '${COS_URL}'
          with open(path, 'w') as f:
              json.dump(m, f, indent=2)
          print('manifest.json updated with cos_url:', m['cos_url'])
          "

      # 幂等镜像微信 4.1.8 安装器到 COS（env-doctor preflight 自愈时的内网回退源）
      # 增强项，非 agent 包硬依赖：env-doctor 有官方 dldir1v6.qq.com 回退，故此步失败不红 job。
      - name: Mirror WeChat 4.1.8 to COS (idempotent)
        continue-on-error: true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          BUCKET="zenithjoy-static-1333590468"
          ENDPOINT="cos.accelerate.myqcloud.com"
          COS_PATH="/install-pack/wechat/WeChatWin_4.1.8.exe"
          COS_URL="https://${BUCKET}.${ENDPOINT}${COS_PATH}"
          OFFICIAL="https://dldir1v6.qq.com/weixin/Universal/Windows/WeChatWin_4.1.8.exe"

          # 幂等：已镜像(200)直接跳过，不重复下载/上传
          if curl -sf -I "$COS_URL" >/dev/null 2>&1; then
            echo "[mirror-wechat] 已镜像，跳过：$COS_URL"
            exit 0
          fi

          echo "[mirror-wechat] COS 无缓存，从官方下载 $OFFICIAL ..."
          curl -L -o WeChatWin_4.1.8.exe "$OFFICIAL" || { echo "[mirror-wechat] 官方下载失败，跳过镜像（非致命）"; exit 0; }

          # 校验大小 > 200MB，防止下到错误页/截断包
          SIZE=$(stat -c%s WeChatWin_4.1.8.exe 2>/dev/null || stat -f%z WeChatWin_4.1.8.exe)
          if [ "${SIZE:-0}" -lt 209715200 ]; then
            echo "[mirror-wechat] 下载体积异常（${SIZE} bytes < 200MB），跳过上传（非致命）"
            exit 0
          fi

          pip install coscmd -q
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload WeChatWin_4.1.8.exe "$COS_PATH" --force || { echo "[mirror-wechat] 上传失败（非致命）"; exit 0; }
          echo "[mirror-wechat] 已镜像到 $COS_URL"

      - name: Deploy manifest.json to HK VPS
        env:
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          VPS_INTERNAL_TOKEN: ${{ secrets.VPS_INTERNAL_TOKEN }}
        run: |
          curl -sf -X PUT "${VPS_API_URL}/api/agent/install-pack/manifest" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Token: ${VPS_INTERNAL_TOKEN}" \
            -d @services/agent/dist-installpack/manifest.json \
            --max-time 30
