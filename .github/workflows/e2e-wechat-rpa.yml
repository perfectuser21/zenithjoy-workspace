name: Manual E2E WeChat RPA — Fixed Candidate (Self-Hosted)

# 专为 wechat-rpa sprint 的 Harness Evaluator 触发。
# runs-on: [self-hosted, wechat-capable] → xian-rog（微信 4.1.8 + uiautomation + pyautogui 真实环境）
# 区别于 e2e-windows.yml（windows-latest，无微信，用于非 RPA sprint）

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Manual verification task UUID'
        required: true
      sprint_dir:
        description: 'Sprint directory (e.g. sprints/run-20260519-1234)'
        required: true
      pr_branch:
        description: 'Fixed candidate commit SHA (40 hex characters)'
        required: true

jobs:
  e2e:
    runs-on: [self-hosted, wechat-capable]
    timeout-minutes: 30
    steps:
      - name: Validate fixed manual candidate
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.pr_branch }}
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[a-fA-F0-9]{40}$') { throw 'Fixed 40-character candidate SHA required' }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve repository-contained manual script
        id: resolve
        env:
          CANDIDATE_SHA: ${{ inputs.pr_branch }}
          SPRINT_DIR: ${{ inputs.sprint_dir }}
          TASK_ID: ${{ inputs.task_id }}
        run: node .github/workflows/scripts/resolve-manual-e2e.mjs

      - name: Run E2E verification
        shell: powershell
        env:
          SCRIPT_PATH: ${{ steps.resolve.outputs.script_path }}
          TASK_ID: ${{ inputs.task_id }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
        run: |
          $taskId = $env:TASK_ID
          $ps1Path = $env:SCRIPT_PATH

          Write-Host "task_id=$taskId script=$ps1Path"
          Write-Host "runner: $env:COMPUTERNAME (self-hosted wechat-capable)"

          if (Test-Path $ps1Path) {
            Write-Host "Running E2E from $ps1Path"
            & $ps1Path
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              Write-Error "E2E verification failed with exit code $exitCode"
              exit $exitCode
            }
            Write-Host "E2E verification passed"
          } else {
            Write-Error "e2e-verify.ps1 not found at $ps1Path"
            exit 1
          }

      - name: Verify acceptance temp cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runPrefix = "zj-accept-cleanup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-"
          $markers = @(
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File `
              -Filter "$runPrefix*.txt" -ErrorAction SilentlyContinue
          )
          $runnerTempFull = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $runnerTempPrefix = (
            $runnerTempFull.TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar
            ) + [IO.Path]::DirectorySeparatorChar
          )
          foreach ($marker in $markers) {
            $target = (Get-Content $marker.FullName -Raw).Trim()
            $targetFull = [IO.Path]::GetFullPath($target)
            $expectedName = (
              "zj-accept-1467-$env:GITHUB_RUN_ID-" +
              "$env:GITHUB_RUN_ATTEMPT-*"
            )
            if (
              -not $targetFull.StartsWith(
                $runnerTempPrefix,
                [StringComparison]::OrdinalIgnoreCase
              ) -or
              [IO.Path]::GetFileName($targetFull) -notlike $expectedName
            ) {
              throw "invalid deferred acceptance cleanup target"
            }

            $deadline = (Get-Date).AddSeconds(30)
            do {
              if (Test-Path $targetFull) {
                $extendedTarget = "\\?\" + $targetFull
                $removeCommand = (
                  'rd /s /q "' + $extendedTarget + '" >nul 2>&1'
                )
                & "$env:SystemRoot\System32\cmd.exe" `
                  /d /s /c $removeCommand | Out-Null
              }
              if (-not (Test-Path $targetFull)) {
                break
              }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)

            if (Test-Path $targetFull) {
              throw "deferred acceptance directory cleanup failed"
            }
            Remove-Item -LiteralPath $marker.FullName -Force
          }
          Write-Host "Acceptance temp cleanup verified"
