name: E2E Line04 私域客服整合（5 卡 + 孤儿页删除）

# 私域客服整合（2026-06-25）前端验收：
#  - vitest（ubuntu）：navigation.config 断言私域客服区正好 5 卡 + 孤儿路由/lazy 已删
#  - Playwright（windows_cloud，ZenithJoy UI 死规则）：/area/wechat 总览页正好 5 张下钻卡、无「客服日报」独立卡
# API 全部 stub（page.route），不依赖外部服务。
# windows 惯例（4 条）：npm ci 不缓存 / 装 rollup-win32 native / playwright --with-deps / VITE_SKIP_AUTH=true。

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/src/pages/AreaHubPage.tsx'
      - 'apps/dashboard/src/config/navigation.config.ts'
      - 'apps/dashboard/src/config/__tests__/navigation.config.test.ts'
      - 'apps/dashboard/e2e/area-hub-wechat-consolidation.spec.ts'
      - '.github/workflows/e2e-line04-cs-consolidation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/src/pages/AreaHubPage.tsx'
      - 'apps/dashboard/src/config/navigation.config.ts'
      - 'apps/dashboard/src/config/__tests__/navigation.config.test.ts'
      - 'apps/dashboard/e2e/area-hub-wechat-consolidation.spec.ts'
      - '.github/workflows/e2e-line04-cs-consolidation.yml'
  workflow_dispatch:

concurrency:
  group: e2e-line04-cs-consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-vitest:                       # job1：navigation.config 单测（ubuntu，纯前端断言）
    name: job1 — navigation 5 卡 + 孤儿删除 vitest（ubuntu）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Vitest — navigation.config（5 卡 + 孤儿路由/lazy 已删）
        working-directory: apps/dashboard
        run: npx vitest run src/config/__tests__/navigation.config.test.ts --reporter=verbose

  dashboard-ui:                            # job2：/area/wechat 总览 5 卡 Playwright UI（windows，无 DB）
    name: job2 — 私域客服区 5 卡总览 UI（windows）
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不缓存：npm cache 是 macOS 生成的，缺 Windows optional deps（@rollup/rollup-win32-x64-msvc）

      - name: Install deps
        run: npm ci

      - name: Install Windows rollup native binding
        # package-lock.json 由 macOS 生成，不含 @rollup/rollup-win32-x64-msvc。
        # Vite dev server 启动时无条件加载 rollup native，不装就 crash。
        run: npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'dev-user-001'
          VITE_MOCK_USER_NAME: '测试用户'
        run: |
          npx vite --port 5173 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5173 >/dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5173 || (echo "Vite failed to start"; exit 1)

      - name: Run Playwright E2E — 私域客服区 5 卡总览
        working-directory: apps/dashboard
        env:
          E2E_BASE_URL: 'http://localhost:5173'
        run: npx playwright test e2e/area-hub-wechat-consolidation.spec.ts --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cs-consolidation-artifacts
          path: |
            apps/dashboard/screenshots/
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7
