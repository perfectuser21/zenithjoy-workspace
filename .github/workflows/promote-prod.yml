name: Promote to Production :5200 (人工放行闸)

# ───────────────────────────────────────────────────────────────────────────
# 蓝绿加固人工放行闸（PrepPRD 2026-06-25，Line E）：
#   切生产 :5200 的【唯一】入口，★只能人手点★（workflow_dispatch）——绝无 push/schedule
#   自动触发。流程：人工打开常驻 staging :5201 看过、确认 OK → 来 Actions 手点本 workflow
#   → 走 blue_green_deploy：再验一遍 staging → 记录回滚锚点（当前 :5200 sha）→ 原子重指
#   releases/current → 新 release → 重启生产 + 验证。
#
#   两条失败路径自动护住生产：
#     · staging 复验红 → 不 promote，:5200 纹丝不动 → 报 P0
#     · promote 中/后失败 → 自动回滚（软链回上一 release）→ 报 P0
#
#   ☠️ 死规则：smoke 仍会假阳，本闸绝不自动 promote。每次都人点。
# ───────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '要 promote 到生产的 commit sha（留空=用常驻 staging 当前 sha）'
        required: false
        default: ''
      confirm:
        description: '输入 PROMOTE 确认放行到生产 :5200（人工卡点二次确认）'
        required: true
        default: ''

# 串行：同一时刻只允许一个 promote 在跑，防并发切 :5200
concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Promote 候选 → 生产 :5200（人工放行 + 失败自动回滚）
    runs-on: ubuntu-latest
    steps:
      - name: 二次确认闸（必须输入 PROMOTE）
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PROMOTE" ]; then
            echo "❌ confirm 不是 PROMOTE（实际='${{ github.event.inputs.confirm }}'）——拒绝 promote。"
            echo "   人工卡点：请确认已打开常驻 staging :5201 看过、确认 OK，再在 confirm 框输入 PROMOTE。"
            exit 1
          fi
          echo "✅ 人工二次确认通过，开始 promote。"

      - name: 接入 Tailscale（走内网，绕公网防火墙）
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Promote via SSH (blue_green_deploy：验 staging → 原子切 current → 重启 :5200 → 失败自动回滚)
        env:
          SSH_KEY: ${{ secrets.US_MAC_SSH_KEY }}
          SSH_HOST: ${{ secrets.US_MAC_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.US_MAC_USER }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
        timeout-minutes: 25
        run: |
          # 根因修复（issue，2026-07-08）：这个脚本之前没有 set -e，SSH 那步失败后仍会跑到
          # 末尾 rm -f（成功），导致整个 step 退出码=0 被误报 success——即使 promote 从没真正
          # 执行过。加 set -e + trap 清理 KEY_FILE，确保 SSH/远端脚本失败时 step 真的报红。
          set -euo pipefail
          # 用宿主机 bash 直接 ssh（appleboy/ssh-action 在 Docker，看不到 Tailscale 网络）
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=60 \
              -i "$KEY_FILE" \
              -p 22 \
              "${SSH_USER}@${SSH_HOST}" \
              bash -s -- "$INPUT_SHA" << 'REMOTE_EOF'
          set -euo pipefail
          REPO=/Users/administrator/perfect21/zenithjoy

          # shellcheck source=/dev/null
          source "$REPO/.github/workflows/scripts/deploy-lib.sh"

          export ZJ_REPO="$REPO"
          export ZJ_API_DIR="$REPO/apps/api"
          export ZJ_PROD_PORT=5200
          export ZJ_STAGING_PORT=5201
          export ZJ_PROD_LABEL=com.zenithjoy.api
          export ZJ_STAGING_LABEL=com.zenithjoy.api.staging
          export ZJ_STAGING_DB=zenithjoy_test
          # 拆库刀1（决策 0710）：生产库名由 GitHub repo variable ZJ_PROD_DB 控制。
          # 未设 → cecelia（现状）；切换日翻这个变量为 zenithjoy（与生产 plist DATABASE_NAME 同日同翻），回滚=翻回。
          export ZJ_PROD_DB="${{ vars.ZJ_PROD_DB || 'cecelia' }}"
          export ZJ_PROD_PLIST="$HOME/Library/LaunchAgents/com.zenithjoy.api.plist"
          export ZJ_NODE=/opt/homebrew/bin/node
          export ZJ_RELEASES_DIR="${ZJ_RELEASES_DIR:-/Users/administrator/zenithjoy-releases}"
          export ZJ_KEEP_RELEASES="${ZJ_KEEP_RELEASES:-5}"
          export BRAIN_URL="${BRAIN_URL:-http://localhost:5221}"
          mkdir -p "$ZJ_RELEASES_DIR"

          # 目标 sha：根因修复（issue，2026-07-08）——原来这里写 INPUT_SHA="$1"，SSH 拼接
          # 空参数时远端收不到位置参数，set -u 下直接 unbound variable 崩溃。改用
          # resolve_promote_target_sha 统一收口（内部用 ${1:-}，零参数/空参数都不崩，
          # 自动回退到 staging 软链），逻辑与单元测试（deploy-lib.test.sh Case P/Q/R）共用同一份。
          TARGET_SHA="$(resolve_promote_target_sha "$@")"
          echo "promote 目标 sha=${TARGET_SHA}"

          # blue_green_deploy 的 hook 指向 mmv 真实实现：
          #   - staging 复验仍走 staging_deploy_slot+staging_verify（再验一遍刚验过的，便宜保险）
          #   - promote/rollback 走 release 隔离版（原子切 current / 软链回上一 release）
          export BG_DEPLOY_STAGING_FN=staging_deploy_slot
          export BG_VERIFY_STAGING_FN=staging_verify
          export BG_RECORD_ANCHOR_FN=staging_record_anchor
          export BG_PROMOTE_FN=staging_promote
          export BG_VERIFY_PROD_FN=staging_verify_prod
          export BG_ROLLBACK_FN=staging_rollback
          export BG_DESTROY_STAGING_FN=staging_destroy_slot
          export BG_ALERT_P0_FN=staging_alert_p0

          blue_green_deploy "$TARGET_SHA"
          REMOTE_EOF

  notify-failure:
    name: Notify Brain on promote failure
    runs-on: ubuntu-latest
    needs: [promote]
    if: failure()
    steps:
      - name: Post P0 alert to Brain
        run: |
          curl -sf -X POST ${{ secrets.BRAIN_URL }}/api/brain/tasks \
            -H "Content-Type: application/json" \
            -d '{
              "title": "ZenithJoy promote 到生产 :5200 失败",
              "priority": "P0",
              "task_type": "dev",
              "description": "promote-prod.yml 失败。若 staging 复验红则 :5200 未触碰；若 promote 中失败已自动回滚到上一 release，请人工核实 :5200 健康。"
            }' || echo "Brain API 不可达，跳过告警"
