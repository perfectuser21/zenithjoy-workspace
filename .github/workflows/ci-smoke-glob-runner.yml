name: Smoke Glob Gate

# ───────────────────────────────────────────────────────────────────────────
# smoke glob-gate —— PASS 基线棘轮闸（前身 report-only，Issue a4699d21 的"下一步"）
#
# 规则：
#   - smoke-baseline.txt 内的脚本 = 必绿（FAIL 重试 1 次后仍败 → job 红）
#   - 基线外脚本 FAIL = 存量债，仅 ::warning:: 报告（见 docs/smoke-debt-report.md）
#   - 基线条目在磁盘缺失 / 落入 DENYLIST → job 红（防删/挪脚本绕闸）
#   - PR 级规则见 baseline-lint job（新脚本必进基线 / 删基线行须 BASELINE-REMOVE:）
#   - 聚合 required check：Smoke Glob Gate Passed（仅 pull_request 事件）
# ───────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'   # 每天 03:00 UTC+8 跑一次，盯 drift
  workflow_dispatch:

concurrency:
  group: smoke-glob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-glob-runner:
    name: Smoke Glob Runner
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 与 ci-l4-e2e-smoke.yml 的 smoke-api-contract job 保持一致
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: cecelia
      DATABASE_PASSWORD: cecelia
      DATABASE_NAME: cecelia
      DATABASE_URL: postgres://cecelia:cecelia@localhost:5432/cecelia
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: cecelia
      PGPASSWORD: cecelia
      PGDATABASE: cecelia
      PORT: 5200
      NODE_ENV: test
      ADMIN_FEISHU_OPENIDS: ou_admin_smoke_999
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5200
      ZENITHJOY_INTERNAL_TOKEN: ci-only-internal-token-abc-not-prod
      FEISHU_API_BASE: http://localhost:3099
      FEISHU_STATE_SECRET: ci-only-state-secret-2026
      DASHBOARD_BASE_URL: http://localhost:5173
      SMOKE_TOKEN: smoke-secret-2026
      # smoke 脚本用到的多种 base-url 别名，全部指向本 job 的 apps/api
      API_BASE: http://localhost:5200
      API_URL: http://localhost:5200
      API_PORT: '5200'                       # 少数脚本用 API_PORT 默认 3001，强制 5200
      BASE_URL: http://localhost:5200
      ZENITHJOY_API_BASE: http://localhost:5200
      API_BASE_URL: http://localhost:5200
      # 少数脚本直接读 $DB 连接串
      DB: postgres://cecelia:cecelia@localhost:5432/cecelia
      # fake executor base：本 repo 在 apps/api 里挂了 _smoke-fake-* 路由，指回自身
      FAKE_LLM_BASE: http://localhost:5200
      FAKE_AGENT_BASE: http://localhost:5200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install apps/api deps
        run: npm ci --workspace=apps/api

      - name: Create zenithjoy schema + pgcrypto
        run: |
          psql -h localhost -U cecelia -d cecelia -c "CREATE SCHEMA IF NOT EXISTS zenithjoy;"
          psql -h localhost -U cecelia -d cecelia -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Run apps/api/db migrations
        run: |
          for f in apps/api/db/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U cecelia -d cecelia -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build apps/api
        working-directory: apps/api
        run: npm run build

      - name: Start fake-feishu-server (部分 smoke 依赖)
        working-directory: apps/api
        run: |
          if [ -f test-utils/fake-feishu-server.ts ]; then
            if [ -f node_modules/.bin/ts-node ]; then
              node_modules/.bin/ts-node --transpile-only test-utils/fake-feishu-server.ts > /tmp/fake-feishu.log 2>&1 &
            else
              npx -y -p ts-node@10 ts-node --transpile-only test-utils/fake-feishu-server.ts > /tmp/fake-feishu.log 2>&1 &
            fi
            for i in $(seq 1 20); do
              curl -fs http://localhost:3099/healthz >/dev/null 2>&1 && { echo "fake-feishu ready ${i}s"; break; }
              sleep 1
            done
          else
            echo "fake-feishu-server.ts 不存在，跳过（依赖它的基线 smoke 会 FAIL 并阻断；存量债 smoke 仅报告）"
          fi

      - name: Start apps/api
        working-directory: apps/api
        run: |
          node dist/index.js > /tmp/apps-api.log 2>&1 &
          echo $! > /tmp/apps-api.pid
          for i in $(seq 1 40); do
            curl -fs http://localhost:5200/health >/dev/null 2>&1 && { echo "apps/api ready ${i}s"; break; }
            sleep 1
          done
          curl -fs http://localhost:5200/health || (cat /tmp/apps-api.log && exit 1)

      - name: Discover + run all CI-capable smoke scripts (ratchet gate)
        id: glob
        run: |
          set -uo pipefail
          DIR=".github/workflows/scripts/smoke"
          BASELINE=".github/workflows/scripts/smoke-baseline.txt"

          # ── DENYLIST：真机/RPA smoke，CI 跑不了（原样保留） ──
          DENYLIST="
          wechat-auto-launch-smoke.sh
          wechat-rpa-auto-reply-smoke.sh
          wechat-cs-visible-delivery-smoke.sh
          line04-preflight-smoke.sh
          "

          is_denied() {
            local n="$1"
            for d in $DENYLIST; do [ "$n" = "$d" ] && return 0; done
            return 1
          }

          in_baseline() { grep -qxF "$1" "$BASELINE"; }

          # wechat-rpa-real-agent 内含 npm install + build，90s 偶发超时，单独放宽
          script_timeout() {
            case "$1" in
              wechat-rpa-real-agent-smoke.sh) echo 240 ;;
              *) echo 90 ;;
            esac
          }

          run_one() { timeout "$(script_timeout "$1")" bash "$DIR/$1"; }

          RESULTS=$(mktemp)
          PASS=0; DEBT_FAIL=0; GATE_FAIL=0; SKIP=0
          for f in "$DIR"/*.sh; do
            name=$(basename "$f")
            if is_denied "$name"; then
              if in_baseline "$name"; then
                echo "::error::基线脚本 $name 同时在 DENYLIST（绕闸状态），二选一：移出基线（BASELINE-REMOVE）或移出 DENYLIST"
                GATE_FAIL=$((GATE_FAIL+1))
              fi
              echo "::group::SKIP (denylist 真机/RPA) $name"; echo "skipped"; echo "::endgroup::"
              printf '%s\tSKIP\t-\n' "$name" >> "$RESULTS"
              SKIP=$((SKIP+1))
              continue
            fi
            echo "::group::RUN $name"
            chmod +x "$f"
            if run_one "$name"; then
              echo "→ PASS $name"
              printf '%s\tPASS\t0\n' "$name" >> "$RESULTS"
              PASS=$((PASS+1))
            else
              rc=$?
              if in_baseline "$name"; then
                echo "→ FAIL ($rc) $name [基线内，重试 1 次]"
                sleep 5
                if run_one "$name"; then
                  echo "→ PASS (retry) $name"
                  printf '%s\tPASS-RETRY\t0\n' "$name" >> "$RESULTS"
                  PASS=$((PASS+1))
                else
                  rc2=$?
                  echo "::error::基线内 smoke $name FAIL (exit $rc2，含重试)——棘轮闸阻断"
                  printf '%s\tGATE-FAIL\t%s\n' "$name" "$rc2" >> "$RESULTS"
                  GATE_FAIL=$((GATE_FAIL+1))
                fi
              else
                echo "::warning::存量债 smoke $name FAIL (exit $rc)（不阻塞，清偿见 docs/smoke-debt-report.md）"
                printf '%s\tDEBT-FAIL\t%s\n' "$name" "$rc" >> "$RESULTS"
                DEBT_FAIL=$((DEBT_FAIL+1))
              fi
            fi
            echo "::endgroup::"
          done

          # 防删/挪脚本绕闸：基线条目必须在磁盘存在
          BASELINE_TOTAL=0
          while IFS= read -r b; do
            [ -z "$b" ] && continue
            BASELINE_TOTAL=$((BASELINE_TOTAL+1))
            if [ ! -f "$DIR/$b" ]; then
              echo "::error::基线条目 $b 在 $DIR 不存在（删/挪脚本必须走 BASELINE-REMOVE 流程）"
              GATE_FAIL=$((GATE_FAIL+1))
            fi
          done < "$BASELINE"

          TOTAL=$((PASS+DEBT_FAIL+GATE_FAIL))
          {
            echo "# Smoke Glob Gate 报告（棘轮闸）"
            echo ""
            echo "- 候选执行（非 denylist）: **$TOTAL**"
            echo "- ✅ PASS: **$PASS**"
            echo "- 🔴 基线内 FAIL（阻断）: **$GATE_FAIL** / 基线共 $BASELINE_TOTAL"
            echo "- ⚠️ 存量债 FAIL（不阻断）: **$DEBT_FAIL**"
            echo "- ⏭️ SKIP（denylist 真机/RPA）: **$SKIP**"
            echo ""
            echo "## 阻断清单（基线内 FAIL）"
            awk -F'\t' '$2=="GATE-FAIL"{print "- 🔴 `"$1"` (exit "$3")"}' "$RESULTS" || true
            echo ""
            echo "## 存量债清单（不阻断）"
            awk -F'\t' '$2=="DEBT-FAIL"{print "- `"$1"` (exit "$3")"}' "$RESULTS" || true
            echo ""
            echo "> 棘轮规则：基线内必绿；存量债转绿后请把脚本名加进 smoke-baseline.txt（棘轮只进不退）。"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "TOTAL=$TOTAL PASS=$PASS GATE_FAIL=$GATE_FAIL DEBT_FAIL=$DEBT_FAIL SKIP=$SKIP"
          if [ "$GATE_FAIL" -gt 0 ]; then
            echo "::error::Smoke Glob Gate 阻断：$GATE_FAIL 个基线内脚本 FAIL"
            exit 1
          fi
          exit 0

  baseline-lint:
    name: Smoke Baseline Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run lint-smoke-baseline
        run: bash .github/workflows/scripts/lint-smoke-baseline.sh origin/main

  # 聚合 required check（照抄 ci-l1-process.yml l1-passed 模式：PR-only，
  # 不裸比 != success 以免把 push/schedule 下 skipped 的 baseline-lint 判红）
  gate:
    name: Smoke Glob Gate Passed
    needs: [smoke-glob-runner, baseline-lint]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check gates
        run: |
          check() {
            if [ "$2" != "success" ]; then echo "❌ $1: $2"; exit 1; fi
            echo "✅ $1"
          }
          check "smoke-glob-runner" "${{ needs.smoke-glob-runner.result }}"
          check "baseline-lint"     "${{ needs.baseline-lint.result }}"
