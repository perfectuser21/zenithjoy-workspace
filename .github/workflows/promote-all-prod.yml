name: Promote ALL to Production (一键放行闸：后端+前端整体)

# ───────────────────────────────────────────────────────────────────────────
# 统一人工放行闸（2026-06-27）：一次确认，把同一套验证过的 release 整体切到生产。
#   过去切生产要分别点两个工作流（promote-prod=后端 :5200、promote-dashboard-prod=前端 autopilot），
#   原因是前后端在不同机器（API 在美国 Mac、dashboard 在 HK VPS）。但同一个 release 是一个整体，
#   分两次点容易切了一边忘另一边、版本对不上。本 workflow 合成一键：
#     先后端（蓝绿：复验 staging → 记回滚锚点 → 原子切 current → 迁移 → 重启 :5200 → 失败自动回滚）
#     → 后端成功后再前端（build 生产 dist → release 隔离切软链 → 重启 autopilot-dashboard → 公网验证）
#   任一步失败 → 报 P0；后端失败已自动回滚、前端不会切（needs 卡住）。
#
#   ★只能人手点★（workflow_dispatch + confirm=PROMOTE）。绝无 push/schedule 自动触发；AI 不自行 promote。
#   原 promote-prod.yml / promote-dashboard-prod.yml 保留，供只切单边的场景。
#
# Release Gate（2026-07-09 刀C，6站2轨模型第⑤站）：
#   人工放行保持不变，但机器先查证据——没绿不让点：
#     ① staging 部署最近一次绿（deploy-us-vps + deploy-dashboard-staging）
#     ② 真机 nightly 最近 2 晚绿且最新一次 <36h（nightly-real-machine-staging）
#   nightly 可豁免（waive_nightly 填理由，纯云轨改动/引导期用），豁免会大字记录在 run summary——
#   谁豁免谁负责。promote 成功后自动打 release-YYYYMMDD-N tag + GitHub Release（回滚锚+记录）。
# ───────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '要 promote 的 commit sha（留空=用常驻 staging 当前 sha）'
        required: false
        default: ''
      confirm:
        description: '输入 PROMOTE 确认整体放行到生产（后端 :5200 + 前端 autopilot）'
        required: true
        default: ''
      waive_nightly:
        description: '豁免 nightly 检查的理由（纯云轨改动/引导期才填；留空=必须查 nightly 绿）'
        required: false
        default: ''

permissions:
  contents: write   # release-tag：打 tag + 建 GitHub Release
  actions: read     # release-gate：查 staging/nightly run 结论

# 与单独 promote-prod 共用串行组，防并发切生产 :5200
concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  # ─── 第⑤站 Release Gate：机器查证据，没绿不让点（人工放行仍是 confirm=PROMOTE）───
  release-gate:
    name: 0/2 Release Gate（查 staging 绿 + nightly 最近2晚绿）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 二次确认闸（必须输入 PROMOTE）
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PROMOTE" ]; then
            echo "❌ confirm 不是 PROMOTE（实际='${{ github.event.inputs.confirm }}'）——拒绝 promote。"
            echo "   人工卡点：请确认已打开常驻 staging（:5201 / staging-autopilot）看过、确认 OK，再在 confirm 框输入 PROMOTE。"
            exit 1
          fi
          echo "✅ 人工二次确认通过，开始查放行证据。"

      - name: 证据① staging 部署最近一次必须绿
        run: |
          FAIL=0
          for WF in deploy-us-vps.yml deploy-dashboard-staging.yml; do
            C=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WF" \
                  --status completed --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
            echo "staging 部署 $WF 最近结论: $C"
            if [ "$C" != "success" ]; then
              echo "::error::$WF 最近一次不是绿（$C）——staging 本身没部署好，不能 promote"
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || exit 1

      - name: 证据② 真机 nightly 最近 2 晚绿且最新 <36h（可 waive）
        run: |
          WAIVE="${{ github.event.inputs.waive_nightly }}"
          if [ -n "$WAIVE" ]; then
            echo "⚠️ nightly 检查被人工豁免，理由：$WAIVE"
            {
              echo "## ⚠️ Release Gate：nightly 检查被豁免"
              echo ""
              echo "理由：**$WAIVE**（豁免人=触发者 ${{ github.actor }}，谁豁免谁负责）"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" \
                   --workflow nightly-real-machine-staging.yml \
                   --status completed --limit 2 --json conclusion,createdAt \
                   --jq '[.[] | {c:.conclusion, t:.createdAt}]')
          COUNT=$(echo "$RUNS" | jq 'length')
          echo "nightly 最近完成记录: $RUNS"
          if [ "$COUNT" = "0" ]; then
            echo "::error::nightly 一次都没跑过——没有真机证据，不能 promote（或填 waive_nightly）"
            exit 1
          fi
          BAD=$(echo "$RUNS" | jq '[.[] | select(.c != "success")] | length')
          if [ "$BAD" != "0" ]; then
            echo "::error::nightly 最近 $COUNT 次中有非绿——真机回归没过，不能 promote（先修红或填 waive_nightly）"
            exit 1
          fi
          LATEST=$(echo "$RUNS" | jq -r '.[0].t')
          AGE_H=$(( ( $(date +%s) - $(date -d "$LATEST" +%s) ) / 3600 ))
          echo "最新 nightly: $LATEST（${AGE_H}h 前）"
          if [ "$AGE_H" -gt 36 ]; then
            echo "::error::最新 nightly 已 ${AGE_H}h（>36h）——证据过期（nightly 可能停摆），不能 promote"
            exit 1
          fi
          echo "✅ nightly 证据齐：最近 ${COUNT} 次全绿，最新 ${AGE_H}h 前。"

  promote-backend:
    name: 1/2 后端 → 生产 :5200（蓝绿+迁移+失败自动回滚）
    runs-on: ubuntu-latest
    needs: [release-gate]
    steps:
      - name: 二次确认闸（必须输入 PROMOTE）
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "PROMOTE" ]; then
            echo "❌ confirm 不是 PROMOTE（实际='${{ github.event.inputs.confirm }}'）——拒绝 promote。"
            echo "   人工卡点：请确认已打开常驻 staging（:5201 / staging-autopilot）看过、确认 OK，再在 confirm 框输入 PROMOTE。"
            exit 1
          fi
          echo "✅ 人工二次确认通过，开始整体 promote（先后端 :5200）。"

      - name: Promote 后端 via SSH (blue_green_deploy：验 staging → 原子切 current → 重启 :5200 → 失败自动回滚)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.US_MAC_HOST }}
          username: ${{ secrets.US_MAC_USER }}
          key: ${{ secrets.US_MAC_SSH_KEY }}
          port: ${{ secrets.US_MAC_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            REPO=/Users/administrator/perfect21/zenithjoy
            INPUT_SHA="${{ github.event.inputs.sha }}"

            # shellcheck source=/dev/null
            source "$REPO/.github/workflows/scripts/deploy-lib.sh"

            export ZJ_REPO="$REPO"
            export ZJ_API_DIR="$REPO/apps/api"
            export ZJ_PROD_PORT=5200
            export ZJ_STAGING_PORT=5201
            export ZJ_PROD_LABEL=com.zenithjoy.api
            export ZJ_STAGING_LABEL=com.zenithjoy.api.staging
            export ZJ_STAGING_DB=zenithjoy_test
            export ZJ_PROD_PLIST="$HOME/Library/LaunchAgents/com.zenithjoy.api.plist"
            export ZJ_NODE=/opt/homebrew/bin/node
            export ZJ_RELEASES_DIR="${ZJ_RELEASES_DIR:-/Users/administrator/zenithjoy-releases}"
            export ZJ_KEEP_RELEASES="${ZJ_KEEP_RELEASES:-5}"
            export BRAIN_URL="${BRAIN_URL:-http://localhost:5221}"
            mkdir -p "$ZJ_RELEASES_DIR"

            # 目标 sha：输入为空 → 用常驻 staging 当前指向的 release sha（即刚验过的候选）
            TARGET_SHA="$INPUT_SHA"
            if [ -z "$TARGET_SHA" ]; then
              STAGING_LINK="$ZJ_RELEASES_DIR/staging"
              if [ -L "$STAGING_LINK" ]; then
                TARGET_SHA="$(basename "$(readlink "$STAGING_LINK")")"
              fi
            fi
            if [ -z "$TARGET_SHA" ]; then
              echo "❌ 取不到 promote 目标 sha（输入为空且 releases/staging 软链不存在）"; exit 1
            fi
            echo "promote 目标 sha=${TARGET_SHA}"

            # blue_green_deploy 的 hook 指向真实实现：
            export BG_DEPLOY_STAGING_FN=staging_deploy_slot
            export BG_VERIFY_STAGING_FN=staging_verify
            export BG_RECORD_ANCHOR_FN=staging_record_anchor
            export BG_PROMOTE_FN=staging_promote
            export BG_VERIFY_PROD_FN=staging_verify_prod
            export BG_ROLLBACK_FN=staging_rollback
            export BG_DESTROY_STAGING_FN=staging_destroy_slot
            export BG_ALERT_P0_FN=staging_alert_p0

            blue_green_deploy "$TARGET_SHA"

  promote-dashboard:
    name: 2/2 前端 → 生产 autopilot（后端成功后才切）
    runs-on: ubuntu-latest
    needs: [promote-backend]
    steps:
      - name: Promote 前端 via SSH（build 生产 dist + release 隔离切 autopilot-dashboard + 公网验证）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            REPO=/opt/zenithjoy/repo
            DASH_DIR=/opt/zenithjoy/autopilot-dashboard

            echo "=== [1/5] git sync（候选 = origin/main）==="
            git -C "$REPO" remote prune origin 2>/dev/null || true
            git -C "$REPO" fetch --force --prune origin main
            git -C "$REPO" reset --hard origin/main
            SHA="$(git -C "$REPO" rev-parse HEAD)"
            echo "候选 sha=$SHA"

            echo "=== [2/5] npm build（生产 build env）==="
            cd "$REPO"
            npm ci --silent --workspace=apps/dashboard
            export VITE_FEISHU_APP_ID='cli_a937a808ca395bd6'
            export VITE_SKIP_AUTH='false'
            export VITE_SUPER_ADMIN_EMAILS='xuxiao21xx@icloud.com,alexperfectapi01@gmail.com'
            export VITE_STAFF_EMAILS='408080793@qq.com,121406646@qq.com,Zenithjoy21xx@gmail.com,xuxiao21xx@icloud.com'
            export VITE_DEPLOY_ENV='production'
            npm run build --workspace=apps/dashboard

            echo "=== [3/5] 首次迁移：若 dist 还是实体目录（旧 cp 覆盖模型）→ 转成 release 软链 ==="
            if [ -d "$DASH_DIR/dist" ] && [ ! -L "$DASH_DIR/dist" ]; then
              echo "检测到 dist 为实体目录，迁移为 release 软链模型（保留当前内容为 baseline release）"
              mkdir -p "$DASH_DIR/releases/baseline-$SHA"
              cp -R "$DASH_DIR/dist/." "$DASH_DIR/releases/baseline-$SHA/" 2>/dev/null || true
              rm -rf "$DASH_DIR/dist"
              ln -sfn "releases/baseline-$SHA" "$DASH_DIR/dist"
            fi

            echo "=== [4/5] release 隔离 promote（cp 进 releases/<sha>/ + 原子切软链 + 留存5份）==="
            # shellcheck source=/dev/null
            source "$REPO/.github/workflows/scripts/deploy-lib.sh"
            dashboard_release_promote "$DASH_DIR" "$SHA" "$REPO/apps/dashboard/dist" 5
            docker restart autopilot-dashboard
            sleep 3

            echo "=== [5/5] 公网验证（Cloudflare 全链路）==="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://autopilot.zenjoymedia.media/ || echo "000")
            echo "公网 HTTP 状态码: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ 公网验证失败（期望 200，实际 $HTTP_CODE）"
              echo "容器状态: $(docker inspect autopilot-dashboard --format '{{.State.Status}}')"
              echo "排查：Cloudflare Tunnel ingress 必须是 http://172.17.0.1:80"
              exit 1
            fi
            echo "✅ 整体 promote 完成：后端 :5200 + 前端 autopilot 都已切到生产，公网验证 200。"

  # ─── Release 落章：promote 成功 → 打 tag + GitHub Release（回滚锚 + 自动 release notes）───
  release-tag:
    name: 3/3 打 release tag + Release notes
    runs-on: ubuntu-latest
    needs: [promote-backend, promote-dashboard]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag (release-YYYYMMDD-N)
        run: |
          # 目标 sha：输入 sha 优先；否则用 origin/main HEAD（dashboard promote 的就是它；
          # 后端用 staging 软链 sha，正常流程二者一致——不一致时以 release notes 里的 PR 清单为准复核）
          SHA="${{ github.event.inputs.sha }}"
          [ -n "$SHA" ] || SHA=$(git rev-parse origin/main)
          BASE="release-$(TZ=Asia/Shanghai date +%Y%m%d)"
          N=1
          while git ls-remote --tags origin "refs/tags/$BASE-$N" | grep -q .; do N=$((N+1)); done
          TAG="$BASE-$N"
          echo "打 tag: $TAG @ $SHA"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" --title "$TAG" --generate-notes
          {
            echo "## 🏷️ Release 已落章：$TAG"
            echo ""
            echo "- sha: \`$SHA\`"
            echo "- 回滚：rollback-prod.yml 回到上一个 release tag"
            echo "- Release notes（含本次上线 PR 清单）见 Releases 页"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Notify Brain on promote failure
    runs-on: ubuntu-latest
    needs: [promote-backend, promote-dashboard]
    if: failure()
    steps:
      - name: Post P0 alert to Brain
        run: |
          curl -sf -X POST ${{ secrets.BRAIN_URL }}/api/brain/tasks \
            -H "Content-Type: application/json" \
            -d '{
              "title": "ZenithJoy 一键 promote 到生产失败",
              "priority": "P0",
              "task_type": "dev",
              "description": "promote-all-prod.yml 失败。后端失败已自动回滚 :5200；若后端成功而前端失败，需人工核实 autopilot 与 :5200 版本是否一致。"
            }' || echo "Brain API 不可达，跳过告警"
