name: Promote ALL to Production (same verified candidate)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'API 与 Dashboard 共同验收的完整40位 SHA'
        required: true
        type: string
      acceptance_run_key:
        description: '覆盖 API 与 Dashboard 的真实业务验收 run key'
        required: true
        type: string
      confirm:
        description: '输入 PROMOTE 确认晋级'
        required: true
        type: string
permissions:
  contents: write
  actions: read
# 生产锁由各单项部署 job 持有；编排层不能持相同锁，否则 reusable job 死锁。
concurrency:
  group: zenithjoy-promote-all
  cancel-in-progress: false
jobs:
  admission:
    uses: ./.github/workflows/release-admission.yml
    with:
      sha: ${{ inputs.sha }}
      targets: api,dashboard
      acceptance_run_key: ${{ inputs.acceptance_run_key }}
    secrets: inherit
  promote-backend:
    needs: [admission]
    uses: ./.github/workflows/promote-prod-hk.yml
    with:
      sha: ${{ needs.admission.outputs.sha }}
      acceptance_run_key: ${{ inputs.acceptance_run_key }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
  promote-frontend:
    needs: [admission, promote-backend]
    uses: ./.github/workflows/promote-dashboard-prod.yml
    with:
      sha: ${{ needs.admission.outputs.sha }}
      acceptance_run_key: ${{ inputs.acceptance_run_key }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
  release-tag:
    needs: [admission, promote-backend, promote-frontend]
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ needs.admission.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.sha }}
      - name: Record deployed candidate
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          TAG="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" --target "$DEPLOY_SHA" --title "$TAG" \
            --notes "API 与 Dashboard 已晋级候选 $DEPLOY_SHA。工作流运行 $GITHUB_RUN_ID。"
