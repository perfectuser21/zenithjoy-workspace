name: Agent QR Bind + Session Path + Publish Inject E2E (Windows)

# 真实业务验证——覆盖用户完整路径：
#   扫码绑定 → session 写入正确 Windows 路径
#   → handler 读取同路径 → 注入 DOUYIN_COOKIES
#   → publisher 走 cookie-inject 模式（headless，不弹浏览器）
#
# 触发：push to main 改动 handler/publisher 时自动跑（防回归）
#       + workflow_dispatch（手动验特定版本）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent installpack version to verify'
        required: false
        default: '1.1.74'
  push:
    branches: [main]
    paths:
      - 'services/agent/src/handlers/douyin-publish.ts'
      - 'services/agent/src/handlers/qr-bind-douyin.ts'
      - 'services/agent/publishers/douyin-publisher/**'
      - 'services/agent/publishers/qr-bind-douyin.cjs'

jobs:
  # ── Job 1: Windows 单元测试（快速卫生检查）─────────────────────────────────
  unit-tests-windows:
    name: Agent Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run all unit tests on Windows
        run: npm test -- --reporter=verbose

  # ── Job 2: 真实业务 E2E（核心验证）────────────────────────────────────────
  #
  # 逐步复现用户操作：
  #   [A] 模拟 QR 扫码绑定 → 写 session 到真实 Windows 路径
  #   [B] 验证 handler 读取路径与写入路径一致（防 typo 回归）
  #   [C] 验证 DOUYIN_COOKIES 注入 + publisher 解析 storageState 格式
  #   [D] 运行回归测试（防路径 typo sessions/douyin-default.json 再次出现）
  #
  session-path-e2e:
    name: Windows E2E — QR session path + publish inject
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript 编译检查
        shell: powershell
        run: npx tsc --noEmit

      # [A] 模拟 QR 扫码绑定写 session 文件
      # qr-bind-douyin.ts getSessionPath('douyin','default') 在 Windows 的真实路径：
      #   path.join(os.homedir(), '.zenithjoy-agent', 'sessions', 'douyin', 'default.json')
      #   = C:\Users\runneradmin\.zenithjoy-agent\sessions\douyin\default.json
      - name: "[A] 写 mock session 到 QR bind 真实落地路径"
        shell: powershell
        run: |
          $sessionDir = "$env:USERPROFILE\.zenithjoy-agent\sessions\douyin"
          New-Item -ItemType Directory -Force -Path $sessionDir | Out-Null
          $mockSession = @{
            cookies = @(
              @{ name="sessionid_ss"; domain=".douyin.com"; value="mock_ci_session_12345"; path="/"; expires=-1; httpOnly=$true; secure=$true; sameSite="None" }
            )
            origins = @()
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "$sessionDir\default.json" -Value $mockSession -Encoding UTF8
          Write-Host "[A] 写入: $sessionDir\default.json ($((Get-Item `"$sessionDir\default.json`").Length) bytes)"
          Get-Content "$sessionDir\default.json"

      # [B] 验证 handler 读路径 == QR bind 写路径
      - name: "[B] 验证 session 路径一致性（qr-bind 写 == handler 读）"
        shell: powershell
        run: |
          node -e "
          const os=require('os'),path=require('path'),fs=require('fs');
          const p=path.join(os.homedir(),'.zenithjoy-agent','sessions','douyin','default.json');
          if(!fs.existsSync(p)){console.error('FAIL: 文件不存在:',p);process.exit(1);}
          const parsed=JSON.parse(fs.readFileSync(p,'utf-8'));
          const cookies=Array.isArray(parsed)?parsed:(parsed.cookies||[]);
          const ok=cookies.some(c=>typeof c.value==='string'&&c.value.length>0&&typeof c.domain==='string'&&(c.domain.endsWith('.douyin.com')||c.domain==='douyin.com'));
          if(!ok){console.error('FAIL: 无有效 douyin session cookie');process.exit(1);}
          console.log('PASS: session 路径正确，格式有效');
          console.log('  路径:',p);
          console.log('  cookies:',cookies.length);
          "

      # [C] 验证 DOUYIN_COOKIES 注入 + publisher 解析
      - name: "[C] 验证 DOUYIN_COOKIES 注入 + publisher cookie 解析（无浏览器模式）"
        shell: powershell
        run: |
          node -e "
          const os=require('os'),path=require('path'),fs=require('fs');
          const p=path.join(os.homedir(),'.zenithjoy-agent','sessions','douyin','default.json');
          const localSession=fs.existsSync(p)?fs.readFileSync(p,'utf-8'):undefined;
          if(!localSession){console.error('FAIL: readLocalDouyinSession 读不到文件');process.exit(1);}
          const spawnEnv={};
          spawnEnv.DOUYIN_COOKIES=localSession;
          const _parsed=JSON.parse(spawnEnv.DOUYIN_COOKIES);
          const cookies=Array.isArray(_parsed)?_parsed:(_parsed.cookies||[]);
          if(cookies.length===0){console.error('FAIL: publisher 解析到 0 个 cookies');process.exit(1);}
          console.log('PASS: DOUYIN_COOKIES 注入成功，publisher 解析正常');
          console.log('  cookies:',cookies.length,'| 模式: cookie-inject（不弹浏览器）');
          "

      # [D] 回归测试（防路径 typo 再次出现）
      - name: "[D] session 路径回归测试"
        shell: powershell
        run: npx vitest run src/handlers/__tests__/douyin-publish.test.ts --reporter=verbose

      - name: 验收结论
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================================"
          Write-Host "  PASS: QR bind session 路径 + publish inject E2E 全通过"
          Write-Host "  [A] session 写入: .zenithjoy-agent/sessions/douyin/default.json  ✓"
          Write-Host "  [B] handler 读取路径一致                                          ✓"
          Write-Host "  [C] DOUYIN_COOKIES 注入 + cookie 解析                            ✓"
          Write-Host "  [D] 回归测试（防 typo）                                           ✓"
          Write-Host "========================================================"

  # ── Job 3: installpack 完整性（仅手动触发时跑）─────────────────────────────
  sandbox-install:
    name: Windows installpack v${{ github.event.inputs.version || '1.1.74' }} 完整性
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: 下载 installpack
        shell: powershell
        run: |
          $version = "${{ github.event.inputs.version }}"
          $url = "https://zenithjoy-static-1333590468.cos.accelerate.myqcloud.com/install-pack/zenithjoy-agent-v${version}.tar.gz"
          Write-Host "[verify] 下载 zenithjoy-agent-v${version}.tar.gz ..."
          Invoke-WebRequest -Uri $url -OutFile "agent.tar.gz" -UseBasicParsing
          Write-Host "[verify] 大小: $((Get-Item agent.tar.gz).Length) bytes"

      - name: 解压 + 验证 exe + publisher 脚本
        shell: powershell
        run: |
          mkdir pack | Out-Null
          tar -xzf agent.tar.gz -C pack --strip-components=1
          Write-Host "[verify] 包内容:"; Get-ChildItem pack | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path "pack\zenithjoy-agent.exe")) { Write-Host "ERROR: exe 不存在"; exit 1 }
          $size = (Get-Item "pack\zenithjoy-agent.exe").Length
          if ($size -lt 1000000) { Write-Host "ERROR: exe 过小 ($size bytes)"; exit 1 }
          Write-Host "PASS: zenithjoy-agent.exe $size bytes"
          @("pack\publishers\publish-douyin-image.cjs","pack\publishers\publish-douyin-image-dryrun.cjs","pack\publishers\qr-bind-douyin.cjs") | ForEach-Object {
            if (-not (Test-Path $_)) { Write-Host "ERROR: 缺少 $_"; exit 1 }
            Write-Host "PASS: $_ ($((Get-Item $_).Length) bytes)"
          }
          Write-Host ""; Write-Host "============================================"
          Write-Host "  PASS: v${{ github.event.inputs.version }} installpack 完整"
          Write-Host "============================================"
