name: Agent Windows handler/session contracts + candidate files

# Windows 源码合同：真实 handler + 临时文件，浏览器/子进程/HTTP 使用测试依赖。
# 不证明生产扫码子进程、登录状态、publisher 浏览器行为或真实发布成功。
# 人工入口另查显式候选版本的发布包文件，不执行包内代码。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit numeric MAJOR.MINOR.PATCH candidate installpack version (files only)'
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - 'services/agent/**'
      - 'sprints/06131229-path2-douyin-dm-outreach/**'
      - 'sprints/06220836-agent-client-encapsulation/**'
      - 'sprints/0703-line04-desktop-lease-broker/**'
      - '.github/workflows/agent-qr-windows-verify.yml'

jobs:
  unit-tests-windows:
    name: Windows handler/session contracts (mocked external boundaries)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript source contracts
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: TypeScript test contracts (Vitest module semantics)
        run: npx tsc --noEmit --module esnext --moduleResolution bundler
      - name: Run actual agent unit suites on Windows
        run: npm test -- --reporter=verbose

  # 人工候选包文件完整性；不启动 agent、不扫码、不发布。
  sandbox-install:
    name: Windows candidate installpack file integrity
    runs-on: windows-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    env:
      INSTALLPACK_VERSION: ${{ inputs.version }}
    steps:
      - name: 下载 installpack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:INSTALLPACK_VERSION
          if ($version -cnotmatch '\A(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\z') {
            throw 'version must be an explicit numeric MAJOR.MINOR.PATCH without leading zeroes'
          }
          $url = "https://zenithjoy-static-1333590468.cos.accelerate.myqcloud.com/install-pack/zenithjoy-agent-v${version}.tar.gz"
          Write-Host "[verify] 下载 zenithjoy-agent-v${version}.tar.gz ..."
          Invoke-WebRequest -Uri $url -OutFile "agent.tar.gz" -UseBasicParsing
          Write-Host "[verify] 大小: $((Get-Item agent.tar.gz).Length) bytes"

      - name: 解压 + 验证 exe + publisher 脚本
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path pack | Out-Null
          tar -xzf agent.tar.gz -C pack --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw 'installpack extraction failed' }
          Write-Host "[verify] 包内容:"; Get-ChildItem pack | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path -Path "pack\zenithjoy-agent.exe" -PathType Leaf)) { Write-Host "ERROR: exe 不存在"; exit 1 }
          $size = (Get-Item "pack\zenithjoy-agent.exe").Length
          if ($size -lt 1000000) { Write-Host "ERROR: exe 过小 ($size bytes)"; exit 1 }
          Write-Host "PASS: zenithjoy-agent.exe $size bytes"
          @("pack\publishers\publish-douyin-image.cjs","pack\publishers\publish-douyin-image-dryrun.cjs","pack\publishers\qr-bind-douyin.cjs") | ForEach-Object {
            if (-not (Test-Path -Path $_ -PathType Leaf)) { Write-Host "ERROR: 缺少 $_"; exit 1 }
            Write-Host "PASS: $_ ($((Get-Item $_).Length) bytes)"
          }
          Write-Host ""; Write-Host "============================================"
          Write-Host "  PASS: v$env:INSTALLPACK_VERSION installpack required files present"
          Write-Host "============================================"
