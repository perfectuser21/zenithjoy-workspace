name: Deploy Dashboard to STAGING (staging-autopilot, API :5201)

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/**'
      - 'deploy/nginx.staging.conf'
      - 'deploy/docker-compose.staging.yml'
      - 'scripts/deploy/hk-dashboard-staging.sh'
      - 'scripts/deploy/comfy_official_assets.py'
      - '.github/workflows/deploy-dashboard-staging.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-dashboard-staging
  cancel-in-progress: false
jobs:
  deploy-staging-dashboard:
    if: github.ref == 'refs/heads/main'
    environment: creative-canvas-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build exact candidate on runner
        env:
          VITE_FEISHU_APP_ID: cli_a937a808ca395bd6
          VITE_SKIP_AUTH: 'false'
          VITE_SUPER_ADMIN_EMAILS: xuxiao21xx@icloud.com,alexperfectapi01@gmail.com
          VITE_STAFF_EMAILS: 408080793@qq.com,121406646@qq.com,Zenithjoy21xx@gmail.com,xuxiao21xx@icloud.com
          VITE_DEPLOY_ENV: staging
          VITE_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          npm ci --workspace=apps/dashboard
          npm run build --workspace=apps/dashboard
          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > apps/dashboard/dist/release-sha.json
          mkdir -p "$RUNNER_TEMP/dashboard-bundle"
          cp -r apps/dashboard/dist "$RUNNER_TEMP/dashboard-bundle/dist"
          # Add public official frontend files after Vite/PWA build so the
          # dashboard service worker does not precache the Comfy bundle.
          curl -fL --retry 3 --max-time 120 --max-filesize 30000000 \
            'https://files.pythonhosted.org/packages/79/f2/2f99e418fa31d7d73d23723d7fce0a4bba2d363ad0fb59ab973d78191ea3/comfyui_frontend_package-1.57.6-py3-none-any.whl' \
            -o "$RUNNER_TEMP/comfy-frontend.whl"
          python3 scripts/deploy/comfy_official_assets.py "$RUNNER_TEMP/comfy-frontend.whl" "$RUNNER_TEMP/dashboard-bundle/dist"
          cp deploy/nginx.staging.conf "$RUNNER_TEMP/dashboard-bundle/nginx.conf"
          tar -czf "$RUNNER_TEMP/dashboard-staging.tar.gz" -C "$RUNNER_TEMP/dashboard-bundle" dist nginx.conf
          sha256sum "$RUNNER_TEMP/dashboard-staging.tar.gz" | awk '{print $1}' > "$RUNNER_TEMP/dashboard-staging.sha256"
      - name: 接入 Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.CREATIVE_CANVAS_TAILSCALE_AUTHKEY }}
          version: latest
      - name: Install staging candidate
        env:
          SSH_KEY: ${{ secrets.CREATIVE_CANVAS_HK_SSH_KEY }}
          SSH_HOST: ${{ vars.HK_VPS_TAILSCALE_IP || '100.86.118.99' }}
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          REMOTE_SCRIPT=
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS=(-o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -i "$KEY_FILE")
          # shellcheck disable=SC2029
          cleanup() { if [[ -n "$REMOTE_SCRIPT" ]]; then ssh "${SSH_OPTS[@]}" "root@${SSH_HOST}" rm -f "$REMOTE_SCRIPT" || true; fi; rm -f "$KEY_FILE"; }
          trap cleanup EXIT
          REMOTE_SCRIPT=$(ssh "${SSH_OPTS[@]}" "root@${SSH_HOST}" 'umask 077; mktemp /tmp/zj-dashboard-staging.XXXXXXXX')
          [[ "$REMOTE_SCRIPT" =~ ^/tmp/zj-dashboard-staging[.][a-zA-Z0-9]+$ ]]
          scp "${SSH_OPTS[@]}" scripts/deploy/hk-dashboard-staging.sh "root@${SSH_HOST}:$REMOTE_SCRIPT"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          DEPLOY_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          HASH=$(cat "$RUNNER_TEMP/dashboard-staging.sha256")
          [[ "$HASH" =~ ^[0-9a-f]{64}$ ]]
          printf -v REMOTE_CMD '%q ' bash "$REMOTE_SCRIPT" "$DEPLOY_SHA" "$HASH" "$DEPLOY_RUN_ID"
          # shellcheck disable=SC2029
          ssh "${SSH_OPTS[@]}" "root@${SSH_HOST}" "$REMOTE_CMD" < "$RUNNER_TEMP/dashboard-staging.tar.gz"
          if ! bash .github/workflows/scripts/smoke/staging-smoke.sh https://staging-autopilot.zenjoymedia.media; then
            printf -v ROLLBACK_CMD '%q ' bash "$REMOTE_SCRIPT" "$DEPLOY_SHA" rollback "$DEPLOY_RUN_ID"
            # shellcheck disable=SC2029
            ssh "${SSH_OPTS[@]}" "root@${SSH_HOST}" "$ROLLBACK_CMD" || echo 'Dashboard rollback could not be verified' >&2
            exit 1
          fi
