name: Skill Source Ownership
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_live_source:
        description: Verify the fixed private source using the configured read identity
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  ownership:
    name: Skill source ownership
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test ownership guard
        run: python3 -m unittest discover -s scripts -p test_skill_source_ownership.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test trusted reader transport independently
        run: node --test scripts/ci/__tests__/implementation-skill-source.test.mjs scripts/ci/__tests__/implementation-skill-source-transport.test.mjs
      - name: Test bounded pinned-source bootstrap transport
        run: python3 scripts/__tests__/skills-source-bootstrap.test.py
      - name: Reject business-owned skill definitions
        run: python3 scripts/skill_source_ownership.py
  source-identity-probe:
    name: Actual pinned source identity probe
    if: github.event_name == 'workflow_dispatch' && inputs.verify_live_source
    needs: ownership
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual pinned source with public identity diagnostics
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
