name: Pilot release verification
on:
  workflow_call:
    inputs:
      source_repo: {required: true, type: string}
      scope: {required: true, type: string}
      head_revision: {required: true, type: string}
      tooling_revision: {required: true, type: string}
    secrets:
      TS_AUTHKEY: {required: true}
      CECELIA_INTERNAL_TOKEN: {required: true}
      BRAIN_DEPLOY_URL: {required: false}
      SKILLS_SOURCE_SSH_KEY: {required: false}
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      run_attempt: ${{ github.run_attempt }}
    env:
      SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
      MAP_SCOPE: ${{ inputs.scope }}
      HEAD: ${{ inputs.head_revision || github.sha }}
    steps:
      - name: 固定同仓当前main及受支持试点
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REPO: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_REPO" = "$CALLER_REPO"
          test "$HEAD" = "$CALLER_SHA"
          case "$SOURCE_REPO:$MAP_SCOPE" in
            perfectuser21/zenithjoy-workspace:zenithjoy|perfectuser21/zenithjoy-workspace:commander-generic|perfectuser21/zenithjoy-workspace:cecelia-device-patrol-definitions|perfectuser21/zenithjoy-workspace:android-bilibili-readonly|perfectuser21/zenithjoy-workspace:leadgen-101-lightweight|perfectuser21/zenithjoy-workspace:leadgen-101-single-check) ;;
            *) exit 1 ;;
          esac
          test "$(gh api "repos/$SOURCE_REPO/git/ref/heads/main" --jq .object.sha)" = "$HEAD"
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: 仅主线刷新并导出中央规范快照
        timeout-minutes: 12
        env:
          BRAIN_URL: ${{ secrets.BRAIN_DEPLOY_URL || 'http://100.79.41.61:5221' }}
          CECELIA_INTERNAL_TOKEN: ${{ secrets.CECELIA_INTERNAL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          trap 'code=$?; if (( code != 0 )) && [[ ! -f evidence/gap.json ]]; then printf "%s\n" "{\"status\":\"unknown\",\"stage\":\"pilot_snapshot\",\"exit_code\":$code}" > evidence/gap.json; fi' EXIT
          test -n "$CECELIA_INTERNAL_TOKEN"
          jq -n --arg scope "$MAP_SCOPE" --arg repo "$SOURCE_REPO" --arg revision "$HEAD" '{scope:$scope,repo:$repo,revision:$revision}' > evidence/request.json
          deadline=$((SECONDS+660))
          response=evidence/response.tmp
          transport_loss() {
            [[ "$2" == 000 || "$2" == 200 ]] || return 1
            case "$1" in 7|18|28|52|55|56) return 0 ;; *) return 1 ;; esac
          }
          request() {
            local method=$1 remaining=$((deadline-SECONDS)) route=refresh
            local args=(-H 'Content-Type: application/json' --data-binary @evidence/request.json)
            (( remaining > 0 )) || return 28
            if [[ "$method" == GET ]]; then
              (( remaining <= 4 )) || remaining=4
              route=snapshot
              args=(--get --data-urlencode "scope=$MAP_SCOPE" --data-urlencode "repo=$SOURCE_REPO" --data-urlencode "revision=$HEAD")
            elif (( remaining > 600 )); then
              remaining=600
            fi
            curl -q --silent --show-error --connect-timeout 5 --max-time "$remaining" \
              -H "X-Internal-Token: $CECELIA_INTERNAL_TOKEN" --output "$response" --write-out '%{http_code}' \
              "${args[@]}" "$BRAIN_URL/api/brain/implementation-ci/$route"
          }
          check_main() {
            local remaining=$((deadline-SECONDS)) actual
            (( remaining > 0 )) || return 28
            (( remaining <= 10 )) || remaining=10
            actual=$(timeout "${remaining}s" gh api "repos/$SOURCE_REPO/git/ref/heads/main" --jq .object.sha) || return
            [[ "$actual" == "$HEAD" ]]
          }
          read_back() {
            local poll status code
            for poll in 1 2 3 4 5 6; do
              if status=$(request GET); then
                [[ "$status" == 200 ]] || { echo "Pilot snapshot read-back HTTP $status" >&2; return 1; }
                return 0
              else
                code=$?
              fi
              transport_loss "$code" "$status" && (( poll < 6 && SECONDS+2 < deadline )) || return "$code"
              sleep 2
            done
          }
          validate() {
            jq -es --slurpfile request evidence/request.json "
              length == 1 and (.[0] | (has(\"error\") | not) and
                .snapshot.schema_version == 1 and
                (.snapshot | {scope,repo,revision}) == \$request[0] and
                (.snapshot.snapshot_sha256 | (type == \"string\" and test(\"^[0-9a-f]{64}$\"))) and
                (.snapshot.gaps | type == \"array\") and ($1))" "$response" >/dev/null
          }
          verified() { validate '.snapshot.status == "verified" and (.snapshot.gaps | length == 0)'; }
          reject_snapshot() {
            local diagnostic
            if validate '.snapshot.status == "unknown"' 2>/dev/null &&
              diagnostic=$(jq -c '
                [.snapshot.gaps[:32][] | objects | .code | strings | select(IN(
                  "activity_snapshot_missing", "authoring_adapter_invalid",
                  "authoring_definition_missing", "authoring_definition_source_mismatch",
                  "capability_mapping_missing", "capability_source_repo_mismatch",
                  "definition_snapshot_ambiguous", "definition_snapshot_missing",
                  "definition_source_owner_unknown", "manifest_snapshot_ambiguous",
                  "manifest_source_mismatch", "scope_manifest_missing",
                  "scope_repository_ambiguous", "scope_repository_missing", "workflow_capability_unmapped"
                ))] | unique | .[:6] |
                {status:"unknown",stage:"pilot_snapshot",exit_code:1,code:"PILOT_SNAPSHOT_NOT_VERIFIED",gap_codes:.}
              ' "$response" 2>/dev/null); then
              printf '%s\n' "$diagnostic" > evidence/gap.json || true
              printf 'Pilot snapshot rejected: %s\n' "$diagnostic" >&2 || true
            fi
            exit 1
          }
          for attempt in 1 2; do
            lost=false
            if status=$(request POST); then
              if [[ "$status" == 200 ]]; then
                verified || reject_snapshot
                mv "$response" evidence/head.json
                exit 0
              fi
              if [[ "$status" != 409 ]] || ! jq -e '.error.code | IN("ACTIVITY_CONTRACT_SNAPSHOT_CHANGED","MAP_MANIFEST_ACTIVE_CONFLICT")' "$response" >/dev/null; then
                echo "Pilot snapshot refresh HTTP $status" >&2
                mv "$response" evidence/refresh-error.json
                exit 1
              fi
            else
              code=$?
              transport_loss "$code" "$status" || exit "$code"
              echo "Pilot snapshot refresh outcome unknown after curl $code, checking the exact snapshot" >&2
              lost=true
            fi
            read_back || exit $?
            if verified; then
              check_main || exit $?
              mv "$response" evidence/head.json
              exit 0
            fi
            [[ "$lost" == true && "$attempt" == 1 ]] || reject_snapshot
            # Only the exact empty server state permits a single new refresh.
            validate '.snapshot as $s | $s.status == "unknown" and
              ($s.gaps | map(.code) | sort) == ["definition_snapshot_missing","scope_manifest_missing"] and
              $s.definitions.workflows == [] and $s.definitions.activities == [] and
              ($s.map | has("manifest")) and $s.map.manifest == null' || reject_snapshot
            check_main || exit $?
            echo 'Pilot snapshot is absent on the same main revision, refreshing once more' >&2
          done
          exit 1
      - name: 快照前置失败保留缺口
        if: failure()
        run: |
          mkdir -p evidence
          if [[ ! -f evidence/gap.json ]]; then printf '%s\n' '{"status":"unknown","stage":"pilot_snapshot","code":"PILOT_SNAPSHOT_FAILED"}' > evidence/gap.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-release-snapshot-${{ inputs.scope }}-${{ inputs.head_revision || github.sha }}-attempt-${{ github.run_attempt }}
          path: evidence/*.json
          if-no-files-found: error
  verify:
    name: Declared pilot regression verification
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPO: ${{ inputs.source_repo || github.repository }}
      HEAD: ${{ inputs.head_revision || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: perfectuser21/cecelia
          ref: ${{ inputs.tooling_revision || github.sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo || github.repository }}
          ref: ${{ inputs.head_revision || github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 可信初始化先于产物下载
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zsh jq libxml2-utils
          (cd tooling && npm ci --ignore-scripts)
          (cd source && npm ci --ignore-scripts)
          mkdir -p output
      - uses: actions/download-artifact@v4
        with:
          name: pilot-release-snapshot-${{ inputs.scope }}-${{ inputs.head_revision || github.sha }}-attempt-${{ needs.snapshot.outputs.run_attempt }}
          github-token: ${{ github.token }}
          path: snapshot
      - name: 准备固定中央Skill对象缓存
        env:
          SKILLS_SOURCE_SSH_KEY: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
        run: |
          set -euo pipefail
          jq -ce '.snapshot | select(type=="object")' "$PWD/snapshot/head.json" > "$PWD/snapshot/canonical.json"
          cache="$(node tooling/scripts/ci/implementation-skill-source.mjs --prepare-ci-cache "$GITHUB_WORKSPACE/source" "$SOURCE_REPO" "$HEAD" --snapshot "$PWD/snapshot/canonical.json")"
          case "$cache" in "$RUNNER_TEMP"/implementation-skills-ci-*/objects) test -d "$cache" ;; *) echo 'invalid fixed Skill cache' >&2; exit 1 ;; esac
          printf 'IMPLEMENTATION_SKILLS_SOURCE_DIR=%s\n' "$cache" >> "$GITHUB_ENV"
      - name: 固定完整计划及白名单环境运行全部登记回归
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node tooling/scripts/ci/pilot-release-verification.mjs --repo-root "$PWD/source" \
            --snapshot "$PWD/snapshot/head.json" --output-dir "$PWD/output" --event "$EVENT" --ref "$REF"
      - name: 失败保留缺口，绝不合成PASS收据
        if: failure()
        run: |
          mkdir -p output
          if [[ ! -f output/gap.json ]]; then printf '%s\n' '{"status":"unknown","stage":"pilot_workflow","code":"PILOT_WORKFLOW_FAILED"}' > output/gap.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-release-verification-${{ inputs.scope }}-${{ inputs.head_revision || github.sha }}-attempt-${{ github.run_attempt }}
          path: output/*.json
          retention-days: 90
          if-no-files-found: error
