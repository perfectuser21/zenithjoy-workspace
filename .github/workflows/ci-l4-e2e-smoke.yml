name: L4 E2E Smoke

# PR-e/5：端到端冒烟
# 3 个 job：
#   1. python-creator-tests  — services/content-pipeline/tests 全量 pytest
#   2. smoke-api-contract    — 起 apps/api + Postgres，curl 关键 endpoint
#   3. smoke-e2e-worker      — topic + topic-worker + pipeline-worker（全 fake executors）
#
# 触发：PR 到 main + push 到 main + 每晚 schedule + 手动

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 18 * * *'   # 每天 02:30 UTC+8（北京时间）跑一次
  workflow_dispatch:

concurrency:
  group: l4-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: services/content-pipeline Python 测试 ─────────────────────────
  python-creator-tests:
    name: Creator Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/content-pipeline/requirements-ci.txt

      - name: Install CI deps
        run: pip install -r services/content-pipeline/requirements-ci.txt

      - name: Run pytest
        working-directory: services/content-pipeline
        run: python3 -m pytest tests/ -v

  # ─── Job 2: apps/api 端点契约冒烟 ───────────────────────────────
  smoke-api-contract:
    name: API Contract Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: cecelia
      DATABASE_PASSWORD: cecelia
      DATABASE_NAME: cecelia
      PORT: 5200
      NODE_ENV: test
      # Sprint B 多租户 smoke 用：API 识别 super-admin
      ADMIN_FEISHU_OPENIDS: ou_admin_smoke_999
      # Line04 CRM 邮箱超管旁路（修 403）：API 识别 X-User-Email ∈ ADMIN_EMAILS（须与 smoke SMOKE_ADMIN_EMAIL 同值）
      ADMIN_EMAILS: boss@zenjoymedia.media
      # PR-1 better-auth 邮箱+密码登录
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5200
      # PR-A super-admin 守卫的 dev fallback 关闭（设了 token 后无 header 真返 401）
      ZENITHJOY_INTERNAL_TOKEN: ci-only-internal-token-abc-not-prod
      # Path 2 Sprint A — 飞书集成走 fake-feishu-server stub（job 内 step 启动）
      FEISHU_API_BASE: http://localhost:3099
      FEISHU_STATE_SECRET: ci-only-state-secret-2026
      DASHBOARD_BASE_URL: http://localhost:5173
      SMOKE_TOKEN: smoke-secret-2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install apps/api deps
        run: npm ci --workspace=apps/api

      - name: Create zenithjoy schema + pgcrypto
        env:
          PGPASSWORD: cecelia
        run: |
          psql -h localhost -U cecelia -d cecelia -c "CREATE SCHEMA IF NOT EXISTS zenithjoy;"
          psql -h localhost -U cecelia -d cecelia -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Run apps/api/db migrations
        env:
          PGPASSWORD: cecelia
        run: |
          # 含 20260210_000000_create_works_tables.sql（works/publish_logs/field_definitions 自治建表）
          # ON_ERROR_STOP=1 防止 psql 静默吞错（之前 Sprint B owner_id ALTER 因 works 缺失被吞）
          for f in apps/api/db/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U cecelia -d cecelia -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build apps/api
        working-directory: apps/api
        run: npm run build

      # ─── Path 2 Sprint A — fake-feishu-server 必须在 apps/api 之前起 ──────
      - name: Start fake-feishu-server (Path 2 Sprint A)
        working-directory: apps/api
        run: |
          if [ -f node_modules/.bin/ts-node ]; then
            node_modules/.bin/ts-node --transpile-only test-utils/fake-feishu-server.ts > /tmp/fake-feishu.log 2>&1 &
          else
            npx -y -p ts-node@10 ts-node --transpile-only test-utils/fake-feishu-server.ts > /tmp/fake-feishu.log 2>&1 &
          fi
          echo $! > /tmp/fake-feishu.pid
          for i in $(seq 1 20); do
            if curl -fs http://localhost:3099/healthz >/dev/null 2>&1; then
              echo "fake-feishu-server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:3099/healthz || (cat /tmp/fake-feishu.log && exit 1)

      - name: Start apps/api
        working-directory: apps/api
        run: |
          node dist/index.js > /tmp/apps-api.log 2>&1 &
          echo $! > /tmp/apps-api.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5200/health >/dev/null 2>&1; then
              echo "apps/api ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5200/health || (cat /tmp/apps-api.log && exit 1)

      - name: Smoke — GET /api/topics (empty OK)
        run: |
          RESP=$(curl -s http://localhost:5200/api/topics \
            -H "X-Internal-Token: $ZENITHJOY_INTERNAL_TOKEN")
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true' || (echo "FAIL: /api/topics missing success:true"; exit 1)

      - name: Smoke — POST /api/topics
        id: create_topic
        run: |
          RESP=$(curl -s -X POST http://localhost:5200/api/topics \
            -H 'Content-Type: application/json' \
            -H "X-Internal-Token: $ZENITHJOY_INTERNAL_TOKEN" \
            -d '{"title":"CI 冒烟选题","priority":1,"status":"已通过"}')
          echo "$RESP"
          TOPIC_ID=$(echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['data']['id'])")
          if [ -z "$TOPIC_ID" ]; then
            echo "FAIL: 未拿到 topic id"
            exit 1
          fi
          echo "topic_id=$TOPIC_ID" >> $GITHUB_OUTPUT

      - name: Smoke — GET /api/pacing-config
        run: |
          RESP=$(curl -s http://localhost:5200/api/pacing-config \
            -H "X-Internal-Token: $ZENITHJOY_INTERNAL_TOKEN")
          echo "$RESP"
          echo "$RESP" | grep -q '"daily_limit"' || (echo "FAIL: pacing-config missing daily_limit"; exit 1)

      - name: Smoke — GET /api/pipelines/running (should be empty)
        run: |
          RESP=$(curl -s http://localhost:5200/api/pipelines/running \
            -H "X-Internal-Token: $ZENITHJOY_INTERNAL_TOKEN")
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true' || (echo "FAIL: /api/pipelines/running missing success:true"; exit 1)
          echo "$RESP" | grep -q '"items":\[\]' || (echo "FAIL: items should be empty array"; exit 1)

      - name: Smoke — POST /api/pipeline/trigger (missing content_type → 400)
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST http://localhost:5200/api/pipeline/trigger \
            -H 'Content-Type: application/json' \
            -d '{}')
          cat /tmp/resp.json
          [ "$STATUS" = "400" ] || (echo "expected 400 got $STATUS"; exit 1)
          grep -q 'CONTENT_TYPE_REQUIRED' /tmp/resp.json || (echo "missing error code"; exit 1)

      - name: Smoke — Dashboard License (Sprint A)
        env:
          API_BASE: http://localhost:5200
          ADMIN_FEISHU_ID: ou_admin_smoke_999
          USER_FEISHU_ID: ou_customer_smoke_001
        run: |
          chmod +x .github/workflows/scripts/smoke/dashboard-license-smoke.sh
          bash .github/workflows/scripts/smoke/dashboard-license-smoke.sh

      - name: Smoke — Multi-tenant Isolation (Sprint B)
        env:
          API_BASE: http://localhost:5200
          ADMIN_FEISHU_ID: ou_admin_smoke_999
          ALICE_FEISHU_ID: ou_alice_smoke_001
          BOB_FEISHU_ID: ou_bob_smoke_002
        run: |
          chmod +x .github/workflows/scripts/smoke/multi-tenant-smoke.sh
          bash .github/workflows/scripts/smoke/multi-tenant-smoke.sh

      - name: Smoke — Better-auth email+password (PR-1)
        env:
          API_BASE: http://localhost:5200
        run: |
          chmod +x .github/workflows/scripts/smoke/auth-smoke.sh
          bash .github/workflows/scripts/smoke/auth-smoke.sh

      - name: Smoke — Better-auth → tenant_members bridge (PR-2)
        env:
          API_BASE: http://localhost:5200
          PGHOST: localhost
          PGUSER: cecelia
          PGPASSWORD: cecelia
          PGDATABASE: cecelia
        run: |
          chmod +x .github/workflows/scripts/smoke/auth-tenant-bridge-smoke.sh
          bash .github/workflows/scripts/smoke/auth-tenant-bridge-smoke.sh

      - name: Smoke — Credits Foundation (PR-C)
        env:
          API_BASE: http://localhost:5200
          ADMIN_FEISHU_ID: ou_admin_smoke_999
        run: |
          chmod +x .github/workflows/scripts/smoke/credits-smoke.sh
          bash .github/workflows/scripts/smoke/credits-smoke.sh

      # ─── Line 10 客户管理后台 — 公司名/子账号/客服-PC 绑定/诊断 后端真链路 ───
