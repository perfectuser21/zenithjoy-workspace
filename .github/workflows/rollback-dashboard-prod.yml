name: Rollback Dashboard Production（已验证留存版本）

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '已验证留存版本ID（留空=上一次成功发布前的版本）'
        required: false
        default: ''
      confirm:
        description: '输入 ROLLBACK 确认回退生产 Dashboard'
        required: true
        default: ''

permissions:
  contents: read
concurrency:
  group: zenithjoy-production-hk
  cancel-in-progress: false

jobs:
  rollback-dashboard:
    if: github.ref == 'refs/heads/main'
    name: 回退已验证 Dashboard 内容并独立读回
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_SHA: ${{ inputs.sha }}
      CONFIRM: ${{ inputs.confirm }}
      SSH_HOST: ${{ secrets.HK_VPS_HOST }}
      SSH_USER: ${{ secrets.HK_VPS_USER }}
      SSH_PORT: ${{ secrets.HK_VPS_PORT || '22' }}
      SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
      UPLOAD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 确认回退输入
        run: |
          [[ "$CONFIRM" == ROLLBACK ]] || exit 1
          [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 上传可信回退控制器
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh bundle
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          cp scripts/deploy/frontend-release.sh .github/workflows/scripts/deploy-lib.sh bundle/
          REMOTE="/opt/zenithjoy/autopilot-dashboard/incoming/rollback-$UPLOAD_ID"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE'"
          rsync -az -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" bundle/ "$SSH_USER@$SSH_HOST:$REMOTE/"
      - name: 验证留存证明后回退，失败恢复原版本
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT || '22' }}
          envs: INPUT_SHA,UPLOAD_ID
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            [[ -z "$INPUT_SHA" || "$INPUT_SHA" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || exit 1
            [[ "$UPLOAD_ID" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
            BUNDLE="/opt/zenithjoy/autopilot-dashboard/incoming/rollback-$UPLOAD_ID"
            bash "$BUNDLE/frontend-release.sh" --rollback /opt/zenithjoy/autopilot-dashboard "$INPUT_SHA" \
              autopilot-dashboard https://autopilot.zenjoymedia.media "$BUNDLE/deploy-lib.sh"

  notify-failure:
    name: Notify Brain on rollback failure
    runs-on: ubuntu-latest
    needs: [rollback-dashboard]
    if: failure()
    steps:
      - name: Post P0 alert to Brain
        env:
          BRAIN_URL: ${{ secrets.BRAIN_URL }}
        run: |
          curl -sf -X POST "$BRAIN_URL/api/brain/tasks" \
            -H "Content-Type: application/json" \
            -d '{"title":"ZenithJoy生产Dashboard回退失败","priority":"P0","task_type":"dev","description":"已验证版本回退或内容读回失败，请核对线上实际版本及本次运行证据。"}' \
            || echo 'Brain告警写入失败，发布运行仍保持失败'
