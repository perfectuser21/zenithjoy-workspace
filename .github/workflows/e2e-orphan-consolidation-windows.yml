name: E2E Orphan Specs Consolidation (Windows)

# ci-patrol 2026-07-12 巡检发现 12 个 spec 零 workflow 引用，收编到此 workflow。
# triage 后:3 个已过时删除(crm-config/customer-management/wechat-bind-button),
# 9 个修绿并纳入本 workflow。
#
# 覆盖 9 spec(全 API stub / page.route,不依赖外部服务):
#   acquisition-android-entry / content-judgment-gate / customer-admin-backend /
#   line04-preflight-card / module-health / module-health-access /
#   video-remake / wechat-cs-config / ability-acceptance
# （path-2-sprint-a 已删除，决策19e6480c 2026-07-14：测的 /dashboard/feishu-bind
#   页面已随 FeishuBindTenant 一起下线，Path2 改本地不再需要飞书绑定这条流程）
#
# 门禁哲学(用户 2026-07-12 拍板「不留红」):8 个 spec 全绿才过,无棘轮债名单、
# 无 continue-on-error 兜底掩红。任一 spec 红 → job 红 → 阻塞合并。
#
# ── gate 模式(用户 2026-07-13 拍板「焊死进 required」)────────────────────────
# 本 workflow【无条件触发】(on 无 paths 过滤),内部 changes job 用 git diff 决定
# 是否真跑重活(windows playwright)。不碰 dashboard 的 PR → changes 短路 → 重 job skip
# → orphan-e2e-gate 秒过 N/A,不烧 windows runner。碰了 → 8 spec 全绿才让 gate 过。
# gate job(Orphan E2E Gate Passed)因 always() 恒上报状态,故可安全加进 main required checks
# 而不会让非 dashboard PR 永久 pending(避开「required + paths 冲突」陷阱)。
# 回归守卫 lint-orphan-gate-alwayson.sh 在 gate job 里跑,防有人塞回 paths 过滤。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-orphan-consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 变更检测(cheap,always)─────────────────────────────────────────────────
  changes:
    name: Detect Orphan-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      orphan: ${{ steps.filter.outputs.orphan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "orphan=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          else
            BASE_REF="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null || echo "")
          fi
          echo "── changed files ──"
          echo "$CHANGED"
          echo "───────────────────"
          # 触发重活的条件：9 个 orphan spec 之一 / dashboard src / 本 workflow / 守卫脚本
          if echo "$CHANGED" | grep -qE '^apps/dashboard/e2e/(acquisition-android-entry|content-judgment-gate|customer-admin-backend|line04-preflight-card|module-health|module-health-access|video-remake|wechat-cs-config|ability-acceptance)\.spec\.ts$' \
             || echo "$CHANGED" | grep -qE '^apps/dashboard/src/' \
             || echo "$CHANGED" | grep -qxF '.github/workflows/e2e-orphan-consolidation-windows.yml' \
             || echo "$CHANGED" | grep -qxF '.github/workflows/scripts/lint-orphan-gate-alwayson.sh'; then
            echo "orphan=true" >> $GITHUB_OUTPUT
            echo "→ orphan=true(运行 8 spec)"
          else
            echo "orphan=false" >> $GITHUB_OUTPUT
            echo "→ orphan=false(gate 直接 N/A 通过,不烧 windows runner)"
          fi

  # ── 重活:9 spec 全绿(仅在 orphan=true 时跑)────────────────────────────────
  playwright-orphan-consolidation:
    name: Playwright — Orphan Specs Consolidation (Windows Chrome)
    needs: changes
    if: needs.changes.outputs.orphan == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    # 各 spec 的 base URL env 变量名不统一(E2E_BASE_URL / BASE_URL / PLAYWRIGHT_BASE_URL),
    # 在 job 级一次性全指向本地 dev server,免得逐 spec 漏设导致连不上误红。
    env:
      E2E_BASE_URL: 'http://localhost:5174'
      BASE_URL: 'http://localhost:5174'
      PLAYWRIGHT_BASE_URL: 'http://localhost:5174'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Windows rollup native binding
        # package-lock.json 由 macOS/Linux 生成，不含 @rollup/rollup-win32-x64-msvc。
        run: npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'dev-user-001'
          VITE_MOCK_USER_NAME: '测试用户'
          # MOCK_USER.email 硬编码 dev@zenjoymedia.media(见 AuthContext.tsx);isSuperAdmin
          # = 该 email ∈ VITE_SUPER_ADMIN_EMAILS。customer-admin-backend 需超管,故必须一致。
          VITE_SUPER_ADMIN_EMAILS: 'dev@zenjoymedia.media'
        run: |
          npx vite --port 5174 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5174 >/dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5174 || (echo "Vite failed to start"; exit 1)

      # ── 逐个 spec 运行，continue-on-error 让 Gate 一次汇总全部结果（而非首红即停）───

      - name: Run — acquisition-android-entry
        id: acq_android
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/acquisition-android-entry.spec.ts --reporter=list

      - name: Run — content-judgment-gate
        id: content_judgment
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/content-judgment-gate.spec.ts --reporter=list

      - name: Run — customer-admin-backend
        id: customer_admin
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/customer-admin-backend.spec.ts --reporter=list

      - name: Run — line04-preflight-card
        id: preflight_card
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/line04-preflight-card.spec.ts --reporter=list

      - name: Run — module-health
        id: module_health
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/module-health.spec.ts --reporter=list

      - name: Run — module-health-access
        id: module_health_access
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/module-health-access.spec.ts --reporter=list

      - name: Run — video-remake
        id: video_remake
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/video-remake.spec.ts --reporter=list

      - name: Run — wechat-cs-config
        id: wechat_cs
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/wechat-cs-config.spec.ts --reporter=list

      - name: Run — ability-acceptance
        id: ability_acceptance
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/ability-acceptance.spec.ts --reporter=list

      # ── 汇总:9 个全绿才让本 job 绿，不留红（无债名单、无兜底掩红）──────────────
      - name: 汇总 — 全部 orphan spec 必须绿
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Orphan Specs Consolidation Results"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          FAIL=0
          for pair in \
            "acquisition-android-entry:${{ steps.acq_android.outcome }}" \
            "content-judgment-gate:${{ steps.content_judgment.outcome }}" \
            "customer-admin-backend:${{ steps.customer_admin.outcome }}" \
            "line04-preflight-card:${{ steps.preflight_card.outcome }}" \
            "module-health:${{ steps.module_health.outcome }}" \
            "module-health-access:${{ steps.module_health_access.outcome }}" \
            "video-remake:${{ steps.video_remake.outcome }}" \
            "wechat-cs-config:${{ steps.wechat_cs.outcome }}" \
            "ability-acceptance:${{ steps.ability_acceptance.outcome }}"; do
            NAME="${pair%%:*}"
            RESULT="${pair##*:}"
            if [ "$RESULT" = "success" ]; then
              echo "  PASS: $NAME"
            else
              echo "::error::$NAME FAIL（$RESULT）"
              FAIL=$((FAIL+1))
            fi
          done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$FAIL" -gt 0 ]; then
            echo "  $FAIL 个 spec 红 —— 阻塞合并（不留红债：修绿或删除，无中间态）"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          echo "  全部 9 个 orphan spec 绿 ✓"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-orphan-consolidation-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7

  # ── 汇总 gate(always,产出 required context)────────────────────────────────
  orphan-e2e-gate:
    name: Orphan E2E Gate Passed
    needs: [changes, playwright-orphan-consolidation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 回归守卫：本 workflow 必须无条件触发（pull_request 无 paths 过滤），
      # 否则 required gate 会让非匹配 PR 永久 pending。守卫红 = gate 红 = 挡合并。
      - name: 回归守卫 — orphan workflow 必须无条件触发
        run: bash .github/workflows/scripts/lint-orphan-gate-alwayson.sh

      - name: Gate 判定
        run: |
          ORPHAN="${{ needs.changes.outputs.orphan }}"
          RESULT="${{ needs.playwright-orphan-consolidation.result }}"
          echo "orphan=$ORPHAN  playwright.result=$RESULT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$ORPHAN" != "true" ]; then
            echo "  本 PR 未触及 orphan spec / dashboard src / 本 workflow"
            echo "  → 无需运行 orphan specs → Gate PASS (N/A)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            echo "  9 个 orphan spec 全绿 → Gate PASS"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 0
          fi
          echo "::error::orphan specs job 结果=$RESULT（非 success）→ Gate FAIL，阻塞合并（不留红）"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          exit 1
