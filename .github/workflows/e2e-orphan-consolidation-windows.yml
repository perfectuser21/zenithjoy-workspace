name: E2E Orphan Specs Consolidation (Windows)

# ci-patrol 2026-07-12 巡检发现 12 个 spec 零 workflow 引用，收编到此 workflow。
# triage 后:3 个已过时删除(crm-config/customer-management/wechat-bind-button),
# 9 个修绿并纳入本 workflow。
#
# 覆盖 9 spec(全 API stub / page.route,不依赖外部服务):
#   acquisition-android-entry / content-judgment-gate / customer-admin-backend /
#   line04-preflight-card / module-health / module-health-access /
#   path-2-sprint-a / video-remake / wechat-cs-config
#
# 门禁哲学(用户 2026-07-12 拍板「不留红」):9 个 spec 全绿才过,无棘轮债名单、
# 无 continue-on-error 兜底掩红。任一 spec 红 → job 红 → 阻塞合并。

on:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard/e2e/acquisition-android-entry.spec.ts'
      - 'apps/dashboard/e2e/content-judgment-gate.spec.ts'
      - 'apps/dashboard/e2e/customer-admin-backend.spec.ts'
      - 'apps/dashboard/e2e/line04-preflight-card.spec.ts'
      - 'apps/dashboard/e2e/module-health.spec.ts'
      - 'apps/dashboard/e2e/module-health-access.spec.ts'
      - 'apps/dashboard/e2e/path-2-sprint-a.spec.ts'
      - 'apps/dashboard/e2e/video-remake.spec.ts'
      - 'apps/dashboard/e2e/wechat-cs-config.spec.ts'
      - 'apps/dashboard/src/**'
      - '.github/workflows/e2e-orphan-consolidation-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/e2e/acquisition-android-entry.spec.ts'
      - 'apps/dashboard/e2e/content-judgment-gate.spec.ts'
      - 'apps/dashboard/e2e/customer-admin-backend.spec.ts'
      - 'apps/dashboard/e2e/line04-preflight-card.spec.ts'
      - 'apps/dashboard/e2e/module-health.spec.ts'
      - 'apps/dashboard/e2e/module-health-access.spec.ts'
      - 'apps/dashboard/e2e/path-2-sprint-a.spec.ts'
      - 'apps/dashboard/e2e/video-remake.spec.ts'
      - 'apps/dashboard/e2e/wechat-cs-config.spec.ts'
      - 'apps/dashboard/src/**'
      - '.github/workflows/e2e-orphan-consolidation-windows.yml'
  workflow_dispatch:

concurrency:
  group: e2e-orphan-consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-orphan-consolidation:
    name: Playwright — Orphan Specs Consolidation (Windows Chrome)
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    # 各 spec 的 base URL env 变量名不统一(E2E_BASE_URL / BASE_URL / PLAYWRIGHT_BASE_URL),
    # 在 job 级一次性全指向本地 dev server,免得逐 spec 漏设导致连不上误红。
    env:
      E2E_BASE_URL: 'http://localhost:5174'
      BASE_URL: 'http://localhost:5174'
      PLAYWRIGHT_BASE_URL: 'http://localhost:5174'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Windows rollup native binding
        # package-lock.json 由 macOS/Linux 生成，不含 @rollup/rollup-win32-x64-msvc。
        run: npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'dev-user-001'
          VITE_MOCK_USER_NAME: '测试用户'
          # MOCK_USER.email 硬编码 dev@zenjoymedia.media(见 AuthContext.tsx);isSuperAdmin
          # = 该 email ∈ VITE_SUPER_ADMIN_EMAILS。customer-admin-backend 需超管,故必须一致。
          VITE_SUPER_ADMIN_EMAILS: 'dev@zenjoymedia.media'
        run: |
          npx vite --port 5174 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5174 >/dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5174 || (echo "Vite failed to start"; exit 1)

      # ── 逐个 spec 运行，continue-on-error 让 Gate 一次汇总全部结果（而非首红即停）───

      - name: Run — acquisition-android-entry
        id: acq_android
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/acquisition-android-entry.spec.ts --reporter=list

      - name: Run — content-judgment-gate
        id: content_judgment
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/content-judgment-gate.spec.ts --reporter=list

      - name: Run — customer-admin-backend
        id: customer_admin
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/customer-admin-backend.spec.ts --reporter=list

      - name: Run — line04-preflight-card
        id: preflight_card
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/line04-preflight-card.spec.ts --reporter=list

      - name: Run — module-health
        id: module_health
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/module-health.spec.ts --reporter=list

      - name: Run — module-health-access
        id: module_health_access
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/module-health-access.spec.ts --reporter=list

      - name: Run — path-2-sprint-a
        id: path2_sprint_a
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/path-2-sprint-a.spec.ts --reporter=list

      - name: Run — video-remake
        id: video_remake
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/video-remake.spec.ts --reporter=list

      - name: Run — wechat-cs-config
        id: wechat_cs
        continue-on-error: true
        working-directory: apps/dashboard
        run: npx playwright test e2e/wechat-cs-config.spec.ts --reporter=list

      # ── 汇总 Gate：9 个全绿才过，不留红（无债名单、无兜底掩红）──────────────────

      - name: Gate — 全部 orphan spec 必须绿
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Orphan Specs Consolidation Results"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          FAIL=0
          for pair in \
            "acquisition-android-entry:${{ steps.acq_android.outcome }}" \
            "content-judgment-gate:${{ steps.content_judgment.outcome }}" \
            "customer-admin-backend:${{ steps.customer_admin.outcome }}" \
            "line04-preflight-card:${{ steps.preflight_card.outcome }}" \
            "module-health:${{ steps.module_health.outcome }}" \
            "module-health-access:${{ steps.module_health_access.outcome }}" \
            "path-2-sprint-a:${{ steps.path2_sprint_a.outcome }}" \
            "video-remake:${{ steps.video_remake.outcome }}" \
            "wechat-cs-config:${{ steps.wechat_cs.outcome }}"; do
            NAME="${pair%%:*}"
            RESULT="${pair##*:}"
            if [ "$RESULT" = "success" ]; then
              echo "  PASS: $NAME"
            else
              echo "::error::$NAME FAIL（$RESULT）"
              FAIL=$((FAIL+1))
            fi
          done
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "$FAIL" -gt 0 ]; then
            echo "  $FAIL 个 spec 红 —— 阻塞合并（不留红债：修绿或删除，无中间态）"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          echo "  全部 9 个 orphan spec 绿 ✓"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-orphan-consolidation-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
          retention-days: 7
