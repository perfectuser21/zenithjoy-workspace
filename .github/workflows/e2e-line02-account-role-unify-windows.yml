name: E2E — Line02 账号角色统一 & 绑定机器列

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/routes/agent-burner.ts'
      - 'apps/dashboard/src/pages/AcquisitionAccountsPage.tsx'
      - 'apps/dashboard/e2e/line02-account-role-unify.spec.ts'
      - 'sprints/07032332-line02-account-role-unify/**'
  workflow_dispatch:

concurrency:
  group: e2e-line02-account-role-unify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright — Line02 绑定机器列（ubuntu chromium）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'ci-e2e-user'
          VITE_MOCK_USER_NAME: 'CI E2E User'
        run: |
          npx vite --port 5174 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5174 > /dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5174 || (echo "Vite failed to start"; exit 1)

      - name: Run Playwright E2E
        working-directory: apps/dashboard
        env:
          E2E_BASE_URL: 'http://localhost:5174'
        run: npx playwright test e2e/line02-account-role-unify.spec.ts --reporter=list

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-line02-account-role-unify-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/screenshots/
          retention-days: 7
