name: Deploy phone-adb-controller to mmv+xian-m4

# ───────────────────────────────────────────────────────────────────────────
# Pilot仅证明登记回归；自动事件只准备独立候选，不切生产。
# 显式promote必须带同SHA真实候选run IDs，Brain逐项对账后才写正式根。
#
# 连接模式完全复用 deploy-us-vps.yml / promote-prod-hk.yml 已验证过的
# tailscale/github-action + SSH 到 mmv，不新建任何连接通道。
# mmv 自己已配置好到 xian-m4 的 SSH 别名，deploy.sh 从 mmv 上跑就能推两机。
# ───────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: [Pilot release verification]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      implementation_run_id:
        description: '本仓候选SHA对应的成功Pilot release verification run ID'
        required: true
        type: string
      candidate_sha:
        description: '已合并main的完整40位候选SHA'
        required: true
        type: string
      mode:
        description: '准备候选或晋级已实跑通过的候选'
        required: true
        default: candidate
        type: choice
        options: [candidate, promote]
      business_run_ids:
        description: 'promote必填：Brain候选run ID的JSON数组，不接受PASS声明'
        required: false
        default: '[]'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-phone-adb-controller
  cancel-in-progress: false

jobs:
  deploy:
    name: 候选准备或同版本真实验收后晋级
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.evidence.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 校验同一次主线成功CI及固定JSON产物
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMPLEMENTATION_RUN_ID: ${{ inputs.implementation_run_id || github.event.workflow_run.id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node .github/workflows/scripts/phone-deploy-evidence.mjs "$IMPLEMENTATION_RUN_ID" phone-release-evidence.json "$CANDIDATE_SHA"
      - name: 接入 Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Tailnet 诊断（status/ping/port22）
        env:
          SSH_HOST: ${{ secrets.US_MAC_TAILSCALE_IP }}
        run: |
          echo "── tailscale status"
          sudo tailscale status | head -20 || true
          echo "── 目标 $SSH_HOST 是否在 peers"
          sudo tailscale status | grep -F "$SSH_HOST" || echo "⚠️ 目标 IP 不在 peers 列表"
          echo "── tailscale ping"
          sudo tailscale ping -c 3 --timeout 5s "$SSH_HOST" || echo "⚠️ tailscale ping 不通"

      - name: SSH 到 mmv 部署两机 + drift-check + Bark 通知
        env:
          SSH_KEY: ${{ secrets.US_MAC_SSH_KEY }}
          SSH_HOST: ${{ secrets.US_MAC_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.US_MAC_USER }}
          DEPLOY_SHA: ${{ steps.evidence.outputs.sha }}
          IMPLEMENTATION_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'candidate' }}
          BUSINESS_RUN_IDS: ${{ inputs.business_run_ids || '[]' }}
        timeout-minutes: 30
        run: |
          KEY_FILE=$(mktemp)
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # 只把JSON编码为数据；不将artifact路径或内容当作shell/代码执行。
          {
          printf "CI_BUNDLE_B64='%s'\n" "$(base64 -w0 phone-release-evidence.json)"
          printf "BUSINESS_RUNS_B64='%s'\n" "$(printf '%s' "$BUSINESS_RUN_IDS" | base64 -w0)"
          cat << 'REMOTE_EOF'
          set -euo pipefail
          DEPLOY_SHA="$1"
          DEPLOY_ATTEMPT="github:$2:$3:$4"
          DEPLOY_MODE="$5"
          TOOL_SHA="$6"
          BUSINESS_RUN_IDS="$(printf '%s' "$BUSINESS_RUNS_B64" | node -e 'process.stdout.write(Buffer.from(require("fs").readFileSync(0,"utf8"),"base64").toString())')"
          [[ "$DEPLOY_MODE" == candidate || "$DEPLOY_MODE" == promote ]] || exit 1
          [[ "$TOOL_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          CI_BUNDLE=$(mktemp)
          trap 'rm -f "$CI_BUNDLE"' EXIT
          printf '%s' "$CI_BUNDLE_B64" | node -e 'const fs=require("fs");fs.writeFileSync(process.argv[1],Buffer.from(fs.readFileSync(0,"utf8"),"base64"),{mode:0o600})' "$CI_BUNDLE"
          unset CI_BUNDLE_B64
          REPO="$HOME/perfect21/zenithjoy-workspace"
          BARK="$HOME/.openclaw/leadgen-scripts/notify-bark.js"

          b64() { printf '%s' "$1" | base64 | tr -d '\n'; }
          notify() {
            # notify TITLE BODY [level]
            node "$BARK" "$(b64 "$1")" "$(b64 "$2")" "${3:-timeSensitive}" || true
          }

          echo "=== [0/4] git fetch(只更新引用,不碰工作区) ==="
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          case "$(git -C "$REPO" remote get-url origin)" in
            https://github.com/perfectuser21/zenithjoy-workspace.git|https://github.com/perfectuser21/zenithjoy-workspace|git@github.com:perfectuser21/zenithjoy-workspace.git) ;;
            *) echo "部署源仓库身份不符" >&2; exit 1 ;;
          esac
          git -C "$REPO" fetch --force origin refs/heads/main:refs/remotes/origin/main
          git -C "$REPO" merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git -C "$REPO" merge-base --is-ancestor "$TOOL_SHA" origin/main

          # 门禁工具固定于本次主线控制版本；被测候选只提供部署源字节。
          LIB_TMP=$(mktemp)
          if ! git -C "$REPO" show "$TOOL_SHA:.github/workflows/scripts/deploy-phone-adb-remote-lib.sh" > "$LIB_TMP" 2>/dev/null; then
            notify "phone-adb自动部署失败" "取不到目标commit的部署lib脚本(sha=${DEPLOY_SHA:0:8})"
            rm -f "$LIB_TMP"
            exit 1
          fi
          # shellcheck source=/dev/null
          source "$LIB_TMP"
          rm -f "$LIB_TMP"

          echo "=== [1/4] 独立detached部署checkout → ${DEPLOY_SHA} ==="
          if ! DEPLOY_CHECKOUT="$(prepare_deployment_checkout "$REPO" "$DEPLOY_SHA")"; then
            notify "phone-adb自动部署已拒绝" "固定SHA独立checkout核验失败，现场保留(sha=${DEPLOY_SHA:0:8})"
            exit 1
          fi
          TOOL_CHECKOUT="$(prepare_deployment_checkout "$REPO" "$TOOL_SHA")"

          echo "=== [2/4] ${DEPLOY_MODE}（固定 ${DEPLOY_SHA}）==="
          cd "$DEPLOY_CHECKOUT"
          export PYTHONDONTWRITEBYTECODE=1
          # wrapper从mmv 0600凭据镜像读token，先构造/核验release，再调用现有deploy.sh。
          if ! DEPLOY_LOG=$(node "$TOOL_CHECKOUT/services/phone-adb-controller/deployment-prepare.mjs" "$DEPLOY_SHA" "$CI_BUNDLE" "$DEPLOY_ATTEMPT" "$DEPLOY_MODE" "$BUSINESS_RUN_IDS" </dev/null 2>&1); then
            echo "$DEPLOY_LOG"
            DEPLOY_FAIL_DETAIL="$(echo "$DEPLOY_LOG" | grep '❌' | head -3 | tr '\n' ';' || true)"
            [[ -z "$DEPLOY_FAIL_DETAIL" ]] && DEPLOY_FAIL_DETAIL="$(echo "$DEPLOY_LOG" | tail -5 | tr '\n' ';')"
            if [[ "$DEPLOY_MODE" == candidate ]]; then
              notify "phone-adb候选准备失败" "正式安装未切换: ${DEPLOY_FAIL_DETAIL}(sha=${DEPLOY_SHA:0:8})"
            else
              notify "phone-adb晋级失败" "生产写入或后验失败，需检查两机安装状态: ${DEPLOY_FAIL_DETAIL}(sha=${DEPLOY_SHA:0:8})"
            fi
            exit 1
          fi
          echo "$DEPLOY_LOG"
          if [[ "$DEPLOY_MODE" == candidate ]]; then
            notify "phone-adb候选已准备" "独立版本目录就绪，业务尚未验收，正式安装未切换(sha=${DEPLOY_SHA:0:8})" "active"
            exit 0
          fi

          echo "=== [3/4] drift-check.sh 后验(锁定本次部署的SHA,不重新fetch避免中途又有合并造成误报) ==="
          if ! DRIFT_LOG=$(DRIFT_REPO="$DEPLOY_CHECKOUT" DRIFT_REF="$DEPLOY_SHA" DRIFT_SKIP_FETCH=1 bash services/phone-adb-controller/drift-check.sh </dev/null 2>&1); then
            echo "$DRIFT_LOG"
            notify "phone-adb自动部署后验失败" "drift-check未通过(sha=${DEPLOY_SHA:0:8}): $(echo "$DRIFT_LOG" | tail -3 | tr '\n' ';')"
            exit 1
          fi
          echo "$DRIFT_LOG"

          # 防第二种假绿(N3)：drift-check.sh 退出码是0不代表真的做了对账，必须确认输出里有 DRIFT_CHECK OK。
          if ! echo "$DRIFT_LOG" | grep -q "DRIFT_CHECK OK"; then
            notify "phone-adb自动部署可疑" "drift-check退出码是0但输出里没有DRIFT_CHECK OK,可能没有真的对账(sha=${DEPLOY_SHA:0:8})"
            exit 1
          fi

          notify "phone-adb自动部署成功" "已部署到mmv+xian-m4并通过drift-check(sha=${DEPLOY_SHA:0:8})" "active"
          echo "✅ 全部完成"
          REMOTE_EOF
          } | ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 \
              -i "$KEY_FILE" -p 22 "${SSH_USER}@${SSH_HOST}" \
              bash -s -- "$DEPLOY_SHA" "$IMPLEMENTATION_RUN_ID" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$DEPLOY_MODE" "$(git rev-parse HEAD)"

          rm -f "$KEY_FILE"

  notify-connect-failure:
    name: SSH/Tailscale 连接失败兜底通知
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure() && needs.deploy.outputs.deploy_sha != ''
    steps:
      - name: 接入 Tailscale（复用同一 authkey，仅为了能发通知，不重跑部署）
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
      - name: SSH 到 mmv 发送 Bark 告警（deploy job 内部因连不上/超时而没机会自己发通知时兜底）
        env:
          SSH_KEY: ${{ secrets.US_MAC_SSH_KEY }}
          SSH_HOST: ${{ secrets.US_MAC_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.US_MAC_USER }}
        run: |
          KEY_FILE=$(mktemp)
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          TITLE_B64=$(printf '%s' "phone-adb自动部署workflow失败" | base64 | tr -d '\n')
          BODY_B64=$(printf '%s' "deploy job本身失败(可能是tailnet/SSH连不上),见GitHub Actions run日志" | base64 | tr -d '\n')
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i "$KEY_FILE" \
              "${SSH_USER}@${SSH_HOST}" \
              "node \$HOME/.openclaw/leadgen-scripts/notify-bark.js '$TITLE_B64' '$BODY_B64'" || true
          rm -f "$KEY_FILE"
