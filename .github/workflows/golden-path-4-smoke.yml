name: Golden Path 4 — Private AI Wechat Smoke

# Path 4 客户私域 AI 接管 端到端 smoke
# Notion Journey: https://www.notion.so/35ac40c2ba6381af-af97-e3bc8e3b0fb4
# Sprint:         sprints/sprint-d-path4-private-ai-thin/contract-dod.md
#
# 6 个 ws-level job (ws1..ws6) 独立跑各自短 smoke；
# 最终 job golden-path-4-smoke 用 needs:[ws1..ws5] enforce 依赖（合同 r1 #14），
# 跑完整 6-step golden-path-4-smoke.sh。
#
# ⚠️ 诚实声明（假绿灯治理第一刀）：本 workflow 全部 job 跑 ubuntu-latest，无任何真机成分——
#    仅验管道拼接/路由/schema/草稿生成，全程 REAL_PUBLISH=0 dryrun，不碰真微信、不真发。
#    Path4 私域微信「真扫码 + 真发」真机闸【尚未接入 CI】（待建，见治理第二刀）。
#    注：lead-acceptance-check workflow 只在 ubuntu 上 grep 校验 markdown 证据文件存在性，
#    并非「rog-xian 真扫码真发」——旧注释系误述，已更正，勿再据此以为 Path4 真机已被验证。

on:
  push:
    branches:
      - main
      - 'cp-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: golden-path-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ws1:
    name: ws1 — DB schema + 路由 + Agent 协议 + LLM audit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run ws1 smoke
        run: bash .github/workflows/scripts/smoke/path4-sprint-1-ws1-smoke.sh

  ws2:
    name: ws2 — qr_bind + 飞书 4 表 + Dashboard + 8 fixture
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run ws2 smoke
        run: bash .github/workflows/scripts/smoke/path4-sprint-1-ws2-smoke.sh

  ws3:
    name: ws3 — DeepSeek 私聊草稿 + listen_chat + A 路线护栏
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run ws3 smoke
        run: bash .github/workflows/scripts/smoke/path4-sprint-1-ws3-smoke.sh

  ws4:
    name: ws4 — 朋友圈草稿 + scheduler-tick
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run ws4 smoke
        run: bash .github/workflows/scripts/smoke/path4-sprint-1-ws4-smoke.sh

  ws5:
    name: "[DRYRUN] ws5 — 飞书审批 + wechat_rpa 管道拼接（ubuntu 无微信，非真发）"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run ws5 smoke
        run: bash .github/workflows/scripts/smoke/path4-sprint-1-ws5-smoke.sh

  agent-real-script:
    name: Agent wechat-rpa 真实脚本接入（v1.1.77）
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run wechat-rpa-real-agent smoke
        run: bash .github/workflows/scripts/smoke/wechat-rpa-real-agent-smoke.sh

  golden-path-4-smoke:
    name: Golden Path 4 — Full 6-step E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 合同 r1 #14：ws1..ws5 全绿才跑完整端到端
    needs: [ws1, ws2, ws3, ws4, ws5]
    # 2026-08-04 修复（假绿灯审计）：此前本 job 不起 DB/API，脚本探测到不可达就整段 SKIP
    # 仍报 PASS——Step 1/7/8/9/12/13/14 从未在这条跑道上真跑过。真覆盖只发生在
    # Smoke Glob Gate（ci-smoke-glob-runner.yml）。现补齐同款 DB/API 基建，让这条
    # 专属跑道的名字（"Full ... E2E Smoke"）名副其实。
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cecelia
          POSTGRES_PASSWORD: cecelia
          POSTGRES_DB: cecelia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: cecelia
      DATABASE_PASSWORD: cecelia
      DATABASE_NAME: cecelia
      DATABASE_URL: postgres://cecelia:cecelia@localhost:5432/cecelia
      DB_URL: postgres://cecelia:cecelia@localhost:5432/cecelia
      PORT: 5200
      NODE_ENV: test
      API_BASE: http://localhost:5200
      ADMIN_FEISHU_OPENIDS: ou_admin_smoke_999
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5200
      ZENITHJOY_INTERNAL_TOKEN: ci-only-internal-token-abc-not-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: services/agent/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install apps/api deps
        run: npm ci --workspace=apps/api

      # Step 17（作战窗刀1）需要真跑 services/agent 的 TS 逻辑证明看门狗 proven-to-fire，
      # 不是静态 grep——装依赖才能用 tsx 直接执行。
      - name: Install services/agent deps (for Step 17 panel-event-bus proven-to-fire check)
        run: npm ci --no-audit --no-fund
        working-directory: services/agent

      # 2026-08-04 修复（Step 17d 假绿）：脚本此前声称"CI 独立 job 已跑"业务语言渲染单测，
      # 实际全仓库无该 job。装了依赖后脚本自带的 `[ -d node_modules ]` 分支会自动真跑 vitest。
      - name: Install apps/agent-panel deps (for Step 17d business-language vitest)
        run: npm ci --no-audit --no-fund
        working-directory: apps/agent-panel

      - name: Create zenithjoy schema + pgcrypto
        env:
          PGPASSWORD: cecelia
        run: |
          psql -h localhost -U cecelia -d cecelia -c "CREATE SCHEMA IF NOT EXISTS zenithjoy;"
          psql -h localhost -U cecelia -d cecelia -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Run apps/api/db migrations
        env:
          PGPASSWORD: cecelia
        run: |
          for f in apps/api/db/migrations/*.sql; do
            echo "→ $f"
            psql -h localhost -U cecelia -d cecelia -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build apps/api
        working-directory: apps/api
        run: npm run build

      - name: Start apps/api
        working-directory: apps/api
        run: |
          node dist/index.js > /tmp/apps-api.log 2>&1 &
          echo $! > /tmp/apps-api.pid
          for i in $(seq 1 40); do
            curl -fs http://localhost:5200/health >/dev/null 2>&1 && { echo "apps/api ready ${i}s"; break; }
            sleep 1
          done
          curl -fs http://localhost:5200/health || (cat /tmp/apps-api.log && exit 1)

      - name: Run full golden-path-4-smoke (REAL_PUBLISH=0 dryrun)
        env:
          REAL_PUBLISH: '0'
          CI: 'true'
        run: bash .github/workflows/scripts/smoke/golden-path-4-smoke.sh
