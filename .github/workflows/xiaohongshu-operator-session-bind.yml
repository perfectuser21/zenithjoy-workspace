name: 小红书 Session 绑定 — 扫码 + 存 Secret

on:
  workflow_dispatch:
    inputs:
      debug:
        description: '打印 cookie 名列表（不打印值）'
        required: false
        default: 'false'

jobs:
  bind-session:
    name: 小红书运营员扫码绑定
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/agent/package-lock.json

      - name: Install agent dependencies
        working-directory: services/agent
        run: npm ci

      - name: Install Playwright chromium
        working-directory: services/agent
        run: npx playwright install chromium --with-deps

      - name: 启动小红书扫码绑定（飞书发 QR，等扫码，存 Secret）
        shell: pwsh
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          ZENITHJOY_FEISHU_WEBHOOK: ${{ secrets.ZENITHJOY_FEISHU_WEBHOOK }}
          GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: node scripts/sessions/bind-operator-xiaohongshu.js

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaohongshu-bind-${{ github.run_number }}
          path: |
            xiaohongshu-qr.png
            xiaohongshu-bind-success.png
            xiaohongshu-bind-timeout.png
          if-no-files-found: ignore
          retention-days: 3
