name: Deploy Staff Hub to Staging (:9444)

# 对齐 apps/api 的 deploy-staging-hk.yml 模式：push main 自动部署到 staging，绝不碰生产。
# 生产更新走人工闸门 promote-staff-hub-prod-hk.yml（workflow_dispatch）。

on:
  push:
    branches: [main]
    paths:
      - 'apps/staff-hub/**'
      - 'deploy/staff-hub/**'
      - 'deploy/docker-compose.staff-hub-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staff-hub-staging
  cancel-in-progress: false

jobs:
  deploy-staff-hub-staging:
    name: Build & Deploy Staff Hub Staging
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.sha }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      SSH_HOST: ${{ secrets.HK_VPS_HOST }}
      SSH_USER: ${{ secrets.HK_VPS_USER }}
      SSH_PORT: ${{ secrets.HK_VPS_PORT || '22' }}
      SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
      BRAIN_PUBLIC_URL: ${{ vars.BRAIN_PUBLIC_URL || 'http://localhost:5221' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install dependencies
        run: npm ci --workspace=apps/staff-hub

      - name: Create .env.production
        run: |
          echo "VITE_FEISHU_APP_ID=$FEISHU_APP_ID" > apps/staff-hub/.env.production
          echo "VITE_DEPLOY_ENV=staging" >> apps/staff-hub/.env.production

      - name: Build staff-hub
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          export VITE_BUILD_SHA="$DEPLOY_SHA"
          npm run build --workspace=apps/staff-hub
          printf '{"sha":"%s"}\n' "$DEPLOY_SHA" > apps/staff-hub/dist/release-sha.json

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist + nginx configs to VPS via rsync（仅 staging 路径）
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            apps/staff-hub/dist/ \
            "$SSH_USER@$SSH_HOST:/opt/zenithjoy/staff-hub-staging/dist/"
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            deploy/staff-hub/nginx-staging.conf \
            "$SSH_USER@$SSH_HOST:/opt/zenithjoy/staff-hub-staging/nginx.conf"
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            deploy/staff-hub/common-staging.conf \
            "$SSH_USER@$SSH_HOST:/opt/zenithjoy/staff-hub-staging/common.conf"
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            deploy/docker-compose.staff-hub-staging.yml \
            "$SSH_USER@$SSH_HOST:/opt/zenithjoy/staff-hub-staging/compose.yml"
          echo "✅ staging dist + nginx configs + 同SHA compose synced"

      - name: Bring up staff-hub-staging via docker compose + 冒烟（仅 staging，绝不碰生产 staff-hub）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT }}
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            set -euo pipefail
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            # Existing HK staging was created under project=deploy. Preserve
            # its ownership while using this candidate's uploaded compose.
            PROJECT=$(docker inspect staff-hub-staging \
              --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null || true)
            PROJECT=${PROJECT:-zenithjoy-staff-hub-staging}
            [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Invalid staging compose project' >&2; exit 1; }
            docker compose -p "$PROJECT" \
              -f /opt/zenithjoy/staff-hub-staging/compose.yml up -d staff-hub-staging
            docker restart staff-hub-staging
            echo "✅ staff-hub-staging restarted"

            echo "▶ 冒烟：staging :9444 首页 200（走 Tailscale IP，容器 healthcheck 起来后再测）"
            STATUS=none
            for i in $(seq 1 20); do
              STATUS=$(docker inspect staff-hub-staging --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
              if [ "$STATUS" = "healthy" ]; then break; fi
              sleep 3
            done
            [ "$STATUS" = "healthy" ] || { echo "❌ 容器未 healthy: $STATUS"; docker logs --tail 50 staff-hub-staging; exit 1; }
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -k "https://100.86.118.99:9444/" -H "Host: staff.zenjoymedia.media")
            [ "$CODE" = "200" ] || { echo "❌ staging :9444 首页 http=$CODE"; exit 1; }
            curl -fsSk --max-time 15 "https://100.86.118.99:9444/release-sha.json?candidate=$DEPLOY_SHA" \
              -H 'Host: staff.zenjoymedia.media' | jq -e --arg sha "$DEPLOY_SHA" '.sha == $sha'
            echo "✅ staging :9444 首页200 且 SHA=$DEPLOY_SHA"

      - name: Notify Brain on failure
        if: failure()
        run: |
          jq -n --arg sha "$DEPLOY_SHA" '{level:"P1",source:"deploy-staff-hub-staging",message:("Staff Hub staging 部署失败 sha="+$sha)}' \
            | curl -s -X POST "$BRAIN_PUBLIC_URL/api/brain/alerts" -H 'Content-Type: application/json' --data-binary @- || true
