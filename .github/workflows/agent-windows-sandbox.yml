name: Agent Windows Sandbox Test
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent version to test (e.g. 1.1.7)'
        required: false
        default: '1.1.7'

jobs:
  windows-sandbox:
    name: Windows Sandbox — Node 22 + hyperframes smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download install pack from COS
        shell: powershell
        run: |
          $version = "${{ github.event.inputs.version }}"
          $url = "https://zenithjoy-static-1333590468.cos.accelerate.myqcloud.com/install-pack/zenithjoy-agent-v${version}.tar.gz"
          Write-Host "[sandbox] downloading zenithjoy-agent-v${version}.tar.gz ..."
          Invoke-WebRequest -Uri $url -OutFile "agent.tar.gz" -UseBasicParsing
          Write-Host "[sandbox] download OK, size: $((Get-Item agent.tar.gz).Length) bytes"

      - name: Extract install pack
        shell: powershell
        run: |
          mkdir pack | Out-Null
          tar -xzf agent.tar.gz -C pack --strip-components=1
          Write-Host "[sandbox] pack contents:"
          Get-ChildItem pack | ForEach-Object { Write-Host "  $_" }
          if (-not (Test-Path "pack\node-win-x64.zip")) {
            Write-Host "ERROR: node-win-x64.zip not found in pack"
            exit 1
          }
          Write-Host "[sandbox] node-win-x64.zip found OK"

      - name: Extract portable Node.js
        shell: powershell
        run: |
          $nodeDir = "$env:APPDATA\ZenithJoy\runtime\nodejs"
          New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
          Write-Host "[sandbox] extracting node-win-x64.zip to temp..."
          Expand-Archive -Path "pack\node-win-x64.zip" -DestinationPath "$env:TEMP\zj-node-tmp" -Force
          $extracted = Get-ChildItem "$env:TEMP\zj-node-tmp" | Select-Object -First 1
          Write-Host "[sandbox] extracted folder: $($extracted.Name)"
          Move-Item "$env:TEMP\zj-node-tmp\$($extracted.Name)\*" $nodeDir -Force
          Remove-Item "$env:TEMP\zj-node-tmp" -Recurse -Force
          $nodeExe = "$nodeDir\node.exe"
          if (-not (Test-Path $nodeExe)) {
            Write-Host "ERROR: node.exe not found at $nodeExe"
            exit 1
          }
          $ver = & $nodeExe --version
          Write-Host "[sandbox] node.exe version: $ver"
          if ($ver -notmatch "^v22\.") {
            Write-Host "ERROR: expected Node v22.x, got $ver"
            exit 1
          }
          Write-Host "[sandbox] Node 22 OK"

      - name: Install hyperframes via npmmirror
        shell: powershell
        run: |
          $nodeDir = "$env:APPDATA\ZenithJoy\runtime\nodejs"
          $nodeExe = "$nodeDir\node.exe"
          $npmCli = "$nodeDir\node_modules\npm\bin\npm-cli.js"
          $hfDir = "$env:APPDATA\ZenithJoy\runtime\hyperframes"
          New-Item -ItemType Directory -Force -Path $hfDir | Out-Null
          Write-Host "[sandbox] installing hyperframes via npmmirror..."
          $proc = Start-Process -FilePath $nodeExe -ArgumentList @(
            $npmCli, "install", "hyperframes",
            "--prefix", $hfDir,
            "--registry", "https://registry.npmmirror.com"
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: hyperframes install failed with exit code $($proc.ExitCode)"
            exit 1
          }
          $hfMain = "$hfDir\node_modules\hyperframes\dist\cli.js"
          if (-not (Test-Path $hfMain)) {
            Write-Host "ERROR: hyperframes cli.js not found at $hfMain"
            exit 1
          }
          Write-Host "[sandbox] hyperframes installed OK: $hfMain"

      - name: Verify hyperframes runs without EBADENGINE
        shell: powershell
        run: |
          $nodeDir = "$env:APPDATA\ZenithJoy\runtime\nodejs"
          $nodeExe = "$nodeDir\node.exe"
          $hfDir = "$env:APPDATA\ZenithJoy\runtime\hyperframes"
          $hfMain = "$hfDir\node_modules\hyperframes\dist\cli.js"
          Write-Host "[sandbox] running hyperframes --version..."
          $output = & $nodeExe $hfMain --version 2>&1
          Write-Host "[sandbox] output: $output"
          $outputStr = $output -join " "
          if ($outputStr -match "EBADENGINE") {
            Write-Host "FAIL: EBADENGINE still present in output"
            exit 1
          }
          Write-Host "[sandbox] No EBADENGINE -- Node 22 + hyperframes compatibility CONFIRMED"

      - name: Verify playwright-core bundled in pack (root cause fix v1.1.57)
        shell: powershell
        run: |
          $packDir = (Resolve-Path "pack").Path
          Write-Host "[pw-core] Checking playwright-core in pack node_modules..."

          # 1. File existence check — Join-Path for safe cross-platform path construction
          $idxPath  = Join-Path $packDir "node_modules\playwright-core\index.js"
          $pkgPath  = Join-Path $packDir "node_modules\playwright-core\package.json"
          $libPath  = Join-Path $packDir "node_modules\playwright-core\lib"
          $idxOk = Test-Path $idxPath
          $pkgOk = Test-Path $pkgPath
          $libOk = Test-Path $libPath
          if (-not $idxOk) { Write-Host "[pw-core] FAIL: playwright-core/index.js missing"; exit 1 }
          if (-not $pkgOk) { Write-Host "[pw-core] FAIL: playwright-core/package.json missing"; exit 1 }
          if (-not $libOk) { Write-Host "[pw-core] FAIL: playwright-core/lib/ missing"; exit 1 }
          Write-Host "[pw-core] File structure OK"

          # 2. require() works from publisher script directory using system node
          $testScript  = Join-Path $packDir "publishers\douyin-publisher\__pw_require_test.cjs"
          $outFile     = Join-Path $env:TEMP "pw-test-out.txt"
          $errFile     = Join-Path $env:TEMP "pw-test-err.txt"
          $publisherDir = Join-Path $packDir "publishers\douyin-publisher"
          # Build script content via string concat — heredoc @'...'@ breaks YAML block scalar indentation
          $nl = [char]10
          $scriptContent = "try {${nl}" +
            "  const { chromium } = require('playwright-core');${nl}" +
            "  if (!chromium) throw new Error('chromium object is falsy');${nl}" +
            "  console.log('PASS: playwright-core loaded, chromium API available');${nl}" +
            "  process.exit(0);${nl}" +
            "} catch (e) {${nl}" +
            "  console.error('FAIL:', e.message);${nl}" +
            "  process.exit(1);${nl}" +
            "}"
          Set-Content $testScript $scriptContent -Encoding UTF8

          $env:NODE_PATH = Join-Path $packDir "node_modules"
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $packDir "playwright-browsers"
          Write-Host "[pw-core] NODE_PATH=$env:NODE_PATH"
          Write-Host "[pw-core] Running require test from publisher directory..."
          $proc = Start-Process -FilePath "node" -ArgumentList @($testScript) `
            -WorkingDirectory $publisherDir `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $outFile `
            -RedirectStandardError $errFile
          $stdout = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
          $stderr = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
          Write-Host "[pw-core] stdout: $stdout"
          if ($stderr) { Write-Host "[pw-core] stderr: $stderr" }
          # Clean up all temp files
          Remove-Item $testScript -Force -ErrorAction SilentlyContinue
          Remove-Item $outFile    -Force -ErrorAction SilentlyContinue
          Remove-Item $errFile    -Force -ErrorAction SilentlyContinue

          if ($proc.ExitCode -ne 0) {
            Write-Host "[pw-core] FAIL: require() test exited $($proc.ExitCode)"
            exit 1
          }
          Write-Host "[pw-core] require() test PASSED"

          # 3. Verify Playwright Chromium is bundled and findable
          $browsersDir   = Join-Path $packDir "playwright-browsers"
          $chromiums     = Get-ChildItem $browsersDir -Filter "chromium-*" -Directory -ErrorAction SilentlyContinue
          $hasChromiums  = $null -ne $chromiums -and $chromiums.Count -gt 0
          if (-not $hasChromiums) {
            Write-Host "[pw-core] FAIL: playwright-browsers/chromium-* directory not found"
            exit 1
          }
          $chromiumName = $chromiums[0].Name
          $chromeExe    = Join-Path $browsersDir "$chromiumName\chrome-win64\chrome.exe"
          $chromeOk     = Test-Path $chromeExe
          if (-not $chromeOk) {
            Write-Host "[pw-core] FAIL: chrome.exe not found at $chromeExe"
            exit 1
          }
          Write-Host "[pw-core] Chromium found: $chromiumName\chrome-win64\chrome.exe"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "  ALL CHECKS PASSED: v${{ github.event.inputs.version }}"
          Write-Host "  playwright-core bundled + require() OK"
          Write-Host "  Node 22 + hyperframes + Chromium READY"
          Write-Host "============================================"
