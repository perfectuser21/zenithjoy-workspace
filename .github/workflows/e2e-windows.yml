name: E2E Windows

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Harness task ID'
        required: true
      sprint_dir:
        description: 'Sprint directory (e.g. sprints/run-20260519-1234)'
        required: true
      pr_branch:
        description: 'PR branch to checkout (optional, defaults to default branch)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_branch != '' && inputs.pr_branch || github.event.repository.default_branch }}
      - name: Install psql
        run: sudo apt-get install -y postgresql-client
      - name: Run smoke
        env:
          API_URL: ${{ secrets.E2E_API_URL }}
          DB_URL: ${{ secrets.E2E_DATABASE_URL }}
          TENANT: "2ac0aa4a-99f4-470a-aed7-c3a9fe03149b"
        run: |
          SMOKE=".github/workflows/scripts/smoke/line02-company-profile-collect-smoke.sh"
          if [ -f "$SMOKE" ]; then bash "$SMOKE"; else echo "smoke.sh not found, skipping"; fi

  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_branch != '' && inputs.pr_branch || github.event.repository.default_branch }}
          fetch-depth: 0

      # Path 2 Step4 [CI_GAP fix]：原 workflow 只 checkout+ffmpeg，未装 Node →
      # e2e-verify.ps1 内 npm.cmd / npx.cmd 不可用。补 setup-node(node 20)。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Run E2E verification
        shell: pwsh
        env:
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          TOAPI_API_KEY: ${{ secrets.TOAPI_API_KEY }}
          # ALIYUN_API_KEY is the GHA secret name for the Aliyun DashScope API key;
          # the ps1 script expects DASHSCOPE_API_KEY as the env var name
          DASHSCOPE_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          $sprintDir = "${{ inputs.sprint_dir }}"
          $taskId = "${{ inputs.task_id }}"
          $ps1Path = "$sprintDir/e2e-verify.ps1"

          Write-Host "task_id=$taskId sprint_dir=$sprintDir"

          if (Test-Path $ps1Path) {
            Write-Host "Running E2E from $ps1Path"
            & $ps1Path
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              Write-Error "E2E verification failed with exit code $exitCode"
              exit $exitCode
            }
            Write-Host "E2E verification passed"
          } else {
            Write-Error "e2e-verify.ps1 not found at $ps1Path (sprint_dir=$sprintDir)"
            exit 1
          }
