name: WeChat CS Hardening — E2E

# Path 4 微信 AI 客服稳定性加固 E2E。
# 设计如此（PrepPRD 已说明）：pywinauto 真机操作微信 GHA 跑不了（runner 无微信），
# 由 xian-pc lead 自验。本 workflow 只验证：
#   job1 (ubuntu)  — 中台链路模拟用户：curl 真打 /listener-heartbeat + /draft-generate(mode:auto)
#                    + schema mode 透传单测（mock 飞书/DeepSeek）
#   job2 (windows) — Agent 启动路径解析 + listen_chat.py dryrun 退出码 0（python-embedded getPythonExe 逻辑）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'services/agent/**'
      - 'apps/api/**'
      - '.github/workflows/wechat-cs-e2e.yml'
  workflow_dispatch:

concurrency:
  group: wechat-cs-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  middleware-chain:
    name: job1 — 中台链路模拟用户（curl + mode 透传）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: 5210
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5210
      ZENITHJOY_INTERNAL_TOKEN: ci-only-internal-token-abc-not-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install apps/api deps
        run: npm ci --workspace=apps/api

      - name: Schema 含 mode + 心跳端点单测（mock 飞书/DeepSeek，权威 mode 透传断言）
        working-directory: apps/api
        run: |
          npx vitest run \
            tests/routes/wechat.test.ts \
            src/services/__tests__/wechat-heartbeat.test.ts \
            src/routes/__tests__/wechat.test.ts \
            --reporter=basic

      - name: Build apps/api
        working-directory: apps/api
        run: npm run build

      - name: Start apps/api
        working-directory: apps/api
        run: |
          node dist/index.js > /tmp/apps-api.log 2>&1 &
          echo $! > /tmp/apps-api.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5210/health >/dev/null 2>&1; then
              echo "apps/api ready after ${i}s"; break
            fi
            sleep 1
          done
          curl -fs http://localhost:5210/health || (cat /tmp/apps-api.log && exit 1)

      - name: E2E — 监听心跳上报（进程守护端点真链路）
        run: |
          BODY='{"agent_id":"ci-agent","wechat_id":"ci-wx-默忆"}'
          RESP=$(curl -s -X POST http://localhost:5210/api/wechat/listener-heartbeat \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "heartbeat resp: $RESP"
          echo "$RESP" | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); if(j.ok!==true) process.exit(1);" \
            || { echo "FAIL: 心跳端点未返回 ok:true"; exit 1; }
          echo "PASS: /listener-heartbeat ok:true"

      - name: E2E — 模拟用户消息 mode:auto（schema 透传，无凭据时合理降级）
        run: |
          # 多租户隔离：draft-generate 现要求租户上下文（缺租户 4xx 拒绝、绝不写入任意 agent）。
          # listen_chat 等非浏览器 caller 显式传 tenant_id（沿用 agent-context body 显式 id 范式）。
          BODY='{"sender":"ci-客户","wechat_id":"ci_wx","content":"在吗","mode":"auto","tenant_id":"ci-tenant"}'
          CODE=$(curl -s -o /tmp/dg.json -w '%{http_code}' -X POST \
            http://localhost:5210/api/wechat/draft-generate \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "draft-generate HTTP $CODE: $(cat /tmp/dg.json)"
          test "$CODE" = "200" || { echo "FAIL: mode:auto 应 200（含 reply 或合理降级 not_in_whitelist）"; exit 1; }
          node -e "const j=require('/tmp/dg.json'); if(!('reply' in j) && j.reason!=='not_in_whitelist' && j.ok!==true) process.exit(1);" \
            || { echo "FAIL: 返回既无 reply 也非合理降级"; exit 1; }
          echo "PASS: mode:auto 链路（200 + reply/合理降级）"

      - name: E2E — 非法 mode 被 schema 拒（证明 mode enum 真生效）
        run: |
          BODY='{"sender":"ci-客户","wechat_id":"ci_wx","content":"在吗","mode":"bogus"}'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:5210/api/wechat/draft-generate \
            -H 'Content-Type: application/json' -d "$BODY")
          echo "非法 mode HTTP $CODE"
          test "$CODE" = "400" || { echo "FAIL: 非法 mode 应被 zod enum 拒为 400"; exit 1; }
          echo "PASS: 非法 mode → 400"

      - name: Static smoke（5 处修复 + 守护落地）
        run: bash .github/workflows/scripts/smoke/wechat-cs-hardening-smoke.sh

      - name: Stop apps/api
        if: always()
        run: kill "$(cat /tmp/apps-api.pid)" 2>/dev/null || true

  agent-windows:
    name: job2 — Agent 启动路径 + listen_chat dryrun（self-hosted xian-rog）
    runs-on: [self-hosted, wechat-capable]
    timeout-minutes: 12
    # Windows self-hosted runner 默认 locale=GBK，python 读含中文的 .py/文件会 UnicodeDecodeError，
    # stdout 打中文会 UnicodeEncodeError。强制 UTF-8 模式根治读写两侧（Python 3.7+）。
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      # 不用 actions/setup-node：self-hosted runner 走国内 proxy 拉 codeload.github.com
      # 100s 超时×3 必挂（2026-07-02 排查实锤，agent-module-e2e.yml 同款处理）。用本机 node。
      - name: Verify Node.js (self-hosted, skip setup-node to avoid proxy timeout)
        shell: bash
        run: node --version

      - name: Install services/agent deps
        shell: bash
        working-directory: services/agent
        run: npm ci

      - name: Agent 路径解析单测（process.execPath / getPythonExe，Windows 验证）
        shell: bash
        working-directory: services/agent
        # 仅跑路径解析相关用例：resolveScript / getPythonExe / process.execPath。
        # "非 Windows skip" 用例按设计只在 Linux agent CI 跑（windows-latest 上 startWechatListener
        # 真走 win32 分支不 skip，故在此 job 用 -t 过滤掉）。
        run: npx vitest run src/handlers/__tests__/wechat-rpa.test.ts -t "resolveScript|getPythonExe|process.execPath"

      - name: listen_chat.py --dryrun-print-version 退出码 0
        shell: bash
        working-directory: services/agent/wechat-rpa
        run: python listen_chat.py --dryrun-print-version

      - name: listen_chat.py --dryrun 注入消息退出码 0（中台 dryrun，不真发）
        shell: bash
        working-directory: services/agent/wechat-rpa
        env:
          WECHAT_DRAFT_API_DRYRUN: '1'
        run: python listen_chat.py --dryrun --inject-message '{"sender":"ci","wechat_id":"ci_wx","content":"hi"}'

      - name: 纯逻辑单测（_parse_item_name / reply_in_chat / post_heartbeat）
        shell: bash
        working-directory: services/agent/wechat-rpa
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

  # job3 — 真机行为 gate：在 rog 的真微信上验证"开会话→读气泡→判向"整链。
  # 2026-07-02 事故（连发5条只回1条+闪屏死循环）的根因是 read_chat_bubbles 在真机上
  # 一条气泡都读不到，而 Fake 注入 pytest 全绿带病合入——本 gate 堵这个洞：
  # PR 改到 wechat-rpa 就真发一条 marker 到"文件传输助手"并断言气泡可读+方向正确。
  # 必须 session 1（GUI）才能 UIA 操作微信，runner 服务在 session 0 → PsExec64 -i 1 包一层。
  bubble-read-gate:
    name: job3 — 真机气泡可读性 gate（xian-rog 真微信）
    runs-on: [self-hosted, wechat-capable]
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - name: Run bubble gate in session 1 via PsExec
        shell: powershell
        run: |
          $py = 'C:\Users\asus\anaconda3\python.exe'
          $script = Join-Path $env:GITHUB_WORKSPACE 'services\agent\tools\selfcheck_bubbles.py'
          $outJson = 'C:\Users\Public\zj-bubble-gate.json'
          $outLog = 'C:\Users\Public\zj-bubble-gate-stdout.txt'
          Remove-Item $outJson, $outLog -ErrorAction SilentlyContinue
          $bat = 'C:\Users\Public\zj-bubble-gate.bat'
          $lines = @(
            '@echo off',
            'set PYTHONUTF8=1',
            ('"' + $py + '" "' + $script + '" > "' + $outLog + '" 2>&1')
          )
          Set-Content -Path $bat -Value $lines -Encoding ascii
          & C:\Users\asus\PSTools\PsExec64.exe -i 1 -accepteula -w C:\Users\Public $bat
          if (-not (Test-Path $outJson)) {
            if (Test-Path $outLog) { Get-Content $outLog }
            Write-Error 'gate 没产出结果 JSON（脚本崩溃/PsExec 失败）'
            exit 1
          }
          $j = Get-Content $outJson -Raw -Encoding utf8 | ConvertFrom-Json
          Write-Host ("bubbles=" + $j.bubble_count + " marker_found=" + $j.marker_found + " marker_outgoing=" + $j.marker_outgoing)
          if (-not $j.ok) {
            if (Test-Path $outLog) { Get-Content $outLog }
            Write-Error ("真机气泡 gate FAILED: " + $j.err)
            exit 1
          }
          Write-Host "真机气泡 gate PASS"
