name: WeChat CS Hardening — E2E

# Current CS producer: services/wechat-cs-android (Android RPA).
# Offline contracts exercise real service/router code with isolated DB/model/phone adapters.
# This gate does not send messages, access a phone, or claim fresh device delivery evidence.
# Keep the existing required context: WeChat CS Gate Passed.

on:
  push:
    branches: [main]
  merge_group:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wechat-cs-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes — 变更路径检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cs_backend: ${{ steps.filter.outputs.cs_backend }}
      android_cs: ${{ steps.filter.outputs.android_cs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect changed files
        id: filter
        run: node scripts/ci/detect-changes.mjs wechat

  middleware-chain:
    name: job1 — 真实HTTP Router/Service（隔离DB与模型）
    needs: changes
    if: needs.changes.outputs.cs_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: 5210
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-secret-32-chars-min-not-prod-123
      BETTER_AUTH_URL: http://localhost:5210
      ZENITHJOY_INTERNAL_TOKEN: ci-only-internal-token-abc-not-prod
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install apps/api deps
        run: npm ci --workspace=apps/api

      - name: Schema 含 mode + 心跳端点单测（mock 飞书/DeepSeek，权威 mode 透传断言）
        working-directory: apps/api
        run: |
          npx vitest run \
            tests/routes/wechat.test.ts \
            src/services/__tests__/wechat-heartbeat.test.ts \
            src/routes/__tests__/wechat.test.ts \
            --reporter=basic

      - name: Real HTTP draft success/failure/gating contract (no platform or paid model)
        working-directory: apps/api
        run: |
          npx vitest run \
            src/routes/wechat-draft-behavior.test.ts \
            tests/services/wechat-draft.test.ts \
            src/routes/__tests__/wechat-message-receipt.test.ts \
            src/routes/__tests__/wechat-crm-event-access.test.ts \
            src/routes/__tests__/wechat-config.test.ts \
            --reporter=basic

      - name: Current CS routing and shared API smoke
        run: bash .github/workflows/scripts/smoke/wechat-cs-hardening-smoke.sh


  android-cs:
    name: Android CS safety contracts (offline)
    needs: changes
    if: needs.changes.outputs.android_cs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - name: Android reception, exact-contact delivery and recovery contracts
        run: bash .github/workflows/scripts/smoke/wechat-cs-android-smoke.sh

  # ─── Gate job（required context，与 L1/L2 Gate Passed 同款）─────────────────
  wechat-cs-gate:
    name: WeChat CS Gate Passed
    needs: [changes, middleware-chain, android-cs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: WeChat CS Gate
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-gate.mjs wechat
