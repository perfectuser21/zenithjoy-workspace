name: Deploy API to HK VPS (常驻 staging :5201)

# ───────────────────────────────────────────────────────────────────────────
# 拆库刀3-T3（2026-07-14）：staging API 从美国本机 launchd 迁至 hk-vps docker。
#   本 workflow 取代 deploy-us-vps.yml（已降级 workflow_dispatch-only）：
#   main 合并（apps/api/** 变更）→ ssh HK → git 同步到本次 SHA → docker build
#   → compose up zenithjoy-api-staging → 容器 /health 冒烟。**绝不碰生产 :5200**。
#
#   生产 promote 仍是人手点的 promote workflow，人工卡点不变。
#   方案 SSOT：cecelia repo docs/architecture/2026-07-14-zj-migrate-hk/architecture.md
#   HK 访问：Tailscale（HK_VPS_TAILSCALE_IP=100.86.118.99），复用 TS_OAUTH secrets。
# ───────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'deploy/docker-compose.staging-api.yml'
      - 'scripts/deploy/hk-api-staging.sh'
      - '.github/workflows/deploy-staging-hk.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-staging-hk
  cancel-in-progress: false

jobs:
  deploy-staging-hk:
    name: 部署候选到 HK 常驻 staging :5201（不碰生产 :5200）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 接入 Tailscale（走内网）
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy fixed candidate via SSH（独立源码及实际版本核验）
        env:
          SSH_KEY: ${{ secrets.HK_VPS_SSH_KEY }}
          SSH_HOST: ${{ vars.HK_VPS_TAILSCALE_IP || '100.86.118.99' }}
          DEPLOY_SHA: ${{ github.sha }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 \
            -i "$KEY_FILE" "root@${SSH_HOST}" bash -s -- "$DEPLOY_SHA" \
            < scripts/deploy/hk-api-staging.sh

      # 从 GHA runner 公网出口验证部署后的支付回调端点——上面 [4/4] 那步是容器起来了没
      # （SSH 进 HK 内网 curl 127.0.0.1），这步验的是完全不同的另一件事：公网域名/nginx
      # 反代路径有没有漂移、验签中间件有没有真的挂上，只有走公网才能测出来。
      # PAYMENT_NOTIFY_BASE_URL 这个 secret 由刀2 配置（未配置时脚本内部优雅跳过、退出码
      # 0，不让当前 CI 变红；配置后自动生效，不需要再开任务回来接线）。
      - name: 支付回调公网可达性 smoke
        env:
          PAYMENT_NOTIFY_BASE_URL: ${{ secrets.PAYMENT_NOTIFY_BASE_URL }}
        run: bash .github/workflows/scripts/smoke/payment-smoke.sh

      - name: Notify Brain on failure
        if: failure()
        run: |
          curl -s -X POST "${{ vars.BRAIN_PUBLIC_URL || 'http://localhost:5221' }}/api/brain/alerts" \
            -H "Content-Type: application/json" \
            -d '{"level":"P1","source":"deploy-staging-hk","message":"HK staging 部署失败 sha=${{ github.sha }}"}' || true
