name: Session Health Check — 平台登录状态巡检

on:
  schedule:
    # 每天 4 次：北京时间 00:00 / 06:00 / 12:00 / 18:00
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制发 Bark 通知（无论是否过期）'
        required: false
        default: 'false'

jobs:
  check-sessions:
    name: 检查所有平台 session 有效性
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        shell: bash
        env:
          DOUYIN_COOKIES: ${{ secrets.DOUYIN_COOKIES }}
          DOUYIN_COOKIES_BURNER: ${{ secrets.DOUYIN_COOKIES_BURNER }}
          BARK_URL: https://api.day.app/QU7ktbzPJxZbNx9pEHcstW
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          node scripts/sessions/check-health.js

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-health-${{ github.run_number }}
          path: session-health-report.json
          retention-days: 30
