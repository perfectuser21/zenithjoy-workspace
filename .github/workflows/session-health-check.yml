name: Session Health Check — 平台登录状态巡检

on:
  schedule:
    # 每天 4 次：北京时间 00:00 / 06:00 / 12:00 / 18:00
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制发 Bark 通知（无论是否过期）'
        required: false
        default: 'false'

jobs:
  check-sessions:
    name: 检查所有平台 session 有效性
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        shell: bash
        env:
          # 抖音主号（标准命名）+ 3 小号
          DOUYIN_COOKIES: ${{ secrets.DOUYIN_COOKIES }}
          DOUYIN_SUB_1: ${{ secrets.DOUYIN_SUB_1 }}
          DOUYIN_SUB_2: ${{ secrets.DOUYIN_SUB_2 }}
          DOUYIN_SUB_3: ${{ secrets.DOUYIN_SUB_3 }}
          # 快手主号（标准命名）+ 3 小号
          KUAISHOU_COOKIES: ${{ secrets.KUAISHOU_COOKIES }}
          KUAISHOU_SUB_1: ${{ secrets.KUAISHOU_SUB_1 }}
          KUAISHOU_SUB_2: ${{ secrets.KUAISHOU_SUB_2 }}
          KUAISHOU_SUB_3: ${{ secrets.KUAISHOU_SUB_3 }}
          # 小红书主号（标准命名）+ 3 小号
          XIAOHONGSHU_COOKIES: ${{ secrets.XIAOHONGSHU_COOKIES }}
          XIAOHONGSHU_SUB_1: ${{ secrets.XIAOHONGSHU_SUB_1 }}
          XIAOHONGSHU_SUB_2: ${{ secrets.XIAOHONGSHU_SUB_2 }}
          XIAOHONGSHU_SUB_3: ${{ secrets.XIAOHONGSHU_SUB_3 }}
          # 视频号主号（标准命名）+ 3 小号
          SHIPINHAO_COOKIES: ${{ secrets.SHIPINHAO_COOKIES }}
          SHIPINHAO_SUB_1: ${{ secrets.SHIPINHAO_SUB_1 }}
          SHIPINHAO_SUB_2: ${{ secrets.SHIPINHAO_SUB_2 }}
          SHIPINHAO_SUB_3: ${{ secrets.SHIPINHAO_SUB_3 }}
          # 头条主号（标准命名）+ 3 小号
          TOUTIAO_COOKIES: ${{ secrets.TOUTIAO_COOKIES }}
          TOUTIAO_SUB_1: ${{ secrets.TOUTIAO_SUB_1 }}
          TOUTIAO_SUB_2: ${{ secrets.TOUTIAO_SUB_2 }}
          TOUTIAO_SUB_3: ${{ secrets.TOUTIAO_SUB_3 }}
          # 微博主号（标准命名）+ 3 小号
          WEIBO_COOKIES: ${{ secrets.WEIBO_COOKIES }}
          WEIBO_SUB_1: ${{ secrets.WEIBO_SUB_1 }}
          WEIBO_SUB_2: ${{ secrets.WEIBO_SUB_2 }}
          WEIBO_SUB_3: ${{ secrets.WEIBO_SUB_3 }}
          # 知乎主号（标准命名）+ 3 小号
          ZHIHU_COOKIES: ${{ secrets.ZHIHU_COOKIES }}
          ZHIHU_SUB_1: ${{ secrets.ZHIHU_SUB_1 }}
          ZHIHU_SUB_2: ${{ secrets.ZHIHU_SUB_2 }}
          ZHIHU_SUB_3: ${{ secrets.ZHIHU_SUB_3 }}
          # 公众号主号（标准命名）+ 3 小号
          GONGZHONGHAO_COOKIES: ${{ secrets.GONGZHONGHAO_COOKIES }}
          GONGZHONGHAO_SUB_1: ${{ secrets.GONGZHONGHAO_SUB_1 }}
          GONGZHONGHAO_SUB_2: ${{ secrets.GONGZHONGHAO_SUB_2 }}
          GONGZHONGHAO_SUB_3: ${{ secrets.GONGZHONGHAO_SUB_3 }}
          # 3 个 API Key
          FEISHU_API_KEY: ${{ secrets.FEISHU_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          WECOM_API_KEY: ${{ secrets.WECOM_API_KEY }}
          # 飞书机器人双渠道告警
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          # DB 回写
          OPERATOR_API_URL: ${{ secrets.OPERATOR_API_URL || 'http://localhost:3000' }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          # 其他配置
          BARK_URL: https://api.day.app/QU7ktbzPJxZbNx9pEHcstW
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          node scripts/sessions/check-health.js

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-health-${{ github.run_number }}
          path: session-health-report.json
          retention-days: 30
