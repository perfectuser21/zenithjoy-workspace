name: Lead Evidence Format Lint

# ⚠️ 诚实声明（假绿灯治理第一刀）：本 workflow 只在 ubuntu-latest 上 grep 校验
#    lead-acceptance markdown 证据文件是否存在，非真机执行、不 REAL_PUBLISH、
#    不碰真微信/真抖音。它【不是】Path4/Path1 真机验收闸，绿≠真机跑过。
#    （golden-path-4-smoke.yml 旧注释曾称本 workflow 做「rog-xian 真扫码真发」，系误述，已更正。）

on:
  pull_request:
    paths:
      - '.agent-knowledge/golden-path-1/lead-acceptance-sprint-*.md'
      - 'scripts/check-lead-acceptance.sh'
      - '.github/workflows/scripts/check-lead-evidence-format.sh'
      - '.github/workflows/scripts/__tests__/lead-evidence-format.test.mjs'
      - '.github/workflows/lead-acceptance-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Historical evidence format only (non-empty, no placeholder-only green)
        run: bash .github/workflows/scripts/check-lead-evidence-format.sh
