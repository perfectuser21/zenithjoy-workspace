name: lead-acceptance-check

# ⚠️ 诚实声明（假绿灯治理第一刀）：本 workflow 只在 ubuntu-latest 上 grep 校验
#    lead-acceptance markdown 证据文件是否存在，非真机执行、不 REAL_PUBLISH、
#    不碰真微信/真抖音。它【不是】Path4/Path1 真机验收闸，绿≠真机跑过。
#    （golden-path-4-smoke.yml 旧注释曾称本 workflow 做「rog-xian 真扫码真发」，系误述，已更正。）

on:
  pull_request:
    paths:
      - '.agent-knowledge/golden-path-1/lead-acceptance-sprint-*.md'
      - 'scripts/check-lead-acceptance.sh'
      - '.github/workflows/lead-acceptance-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lead acceptance evidence files
        run: |
          for f in .agent-knowledge/golden-path-1/lead-acceptance-sprint-*.md; do
            [ -f "$f" ] || continue
            echo ">>> Checking $f"
            # 跳过纯占位（含 PLACEHOLDER 字眼）
            if grep -q '^> \*\*PLACEHOLDER\*\*' "$f"; then
              echo "  (PLACEHOLDER — skip)"
              continue
            fi
            bash scripts/check-lead-acceptance.sh "$f" || exit 1
          done
