name: Android CI — agent-android

# 可 required 设计（同 e2e-line02-lead-human-handoff-windows.yml 已验证过的模式）：
# pull_request 不带原生 on.pull_request.paths 门——否则不相关 PR 整条 workflow 不跑，
# 若把 test-and-build 直接设成 required check，required 会永远等不到这个从未触发的
# check 上报，导致所有不碰 services/agent-android/** 的 PR 被无限期卡死在 merge
# 前（2026-08-04 实测复现：把 "Unit Tests + Release APK" 直接设 required 后，
# 一个完全不相关的 PR 卡在 mergeStateStatus=BLOCKED 出不去）。改为 workflow 每
# PR 都跑，内部 changes job 用 git diff 判定是否跑真 job，聚合 gate
# 「Android CI Gate Passed」在真 job 跳过时照样报绿，required 挂聚合 gate。
# push 保留原生 paths 门（不影响 required-check 阻塞判定，只影响 main 分支的
# APK 构建/上传是否触发，维持原有行为）。
on:
  push:
    branches: [main]
    paths:
      - ".skills-source.json"
      - 'services/agent-android/**'
      - '.github/workflows/android-agent-ci.yml'
  merge_group:
  pull_request:

concurrency:
  group: android-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes — 变更路径检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect changed files
        id: filter
        run: node scripts/ci/detect-changes.mjs android

  test-and-build:
    name: Unit Tests + Release APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-android

    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned skill sources
        if: hashFiles('.skills-source.json') != ''
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Run unit tests (MachineFingerprintTest / HttpHeartbeatLoopTest / NodeExtractorTest)
        run: gradle :app:testDebugUnitTest

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: services/agent-android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      # job 默认 working-directory 是 services/agent-android，这里回 repo root 跑 smoke
      - name: Agent command executor smoke（OpenClaw 信号桥·件1）
        working-directory: ${{ github.workspace }}
        run: bash .github/workflows/scripts/android-agent-contracts.sh --verify-results

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkey -v \
              -keystore "$RUNNER_TEMP/ci.jks" \
              -alias cikey -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=CI,OU=CI,O=ZenithJoy,L=CI,S=CI,C=CN" \
              -storepass ci-keystore-pass -keypass ci-keystore-pass \
              -noprompt
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-keystore-pass" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=cikey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=ci-keystore-pass" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle assembleRelease

      - name: Upload APK to COS
        if: github.ref == 'refs/heads/main'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          pip install coscmd -q
          # 境外(ap-hongkong) bucket + 自定义域名：大陆区域绑自定义域名需 ICP 备案，
          # 而 COS 默认域名禁止公网分发 apk/ipa(DownloadForbidden)，境外区域绕开备案限制。
          BUCKET="zenithjoy-static-hk-1333590468"
          ENDPOINT="cos.ap-hongkong.myqcloud.com"
          COS_PATH="/install-pack/android/zenithjoy-agent.apk"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$BUCKET" -e "$ENDPOINT"
          coscmd upload "$APK" "$COS_PATH" --force
          echo "Uploaded: http://apk.zenjoymedia.media${COS_PATH}"  # HTTPS 证书申请中，暂用 http

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-${{ github.sha }}
          path: services/agent-android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ─── 聚合 gate（required context）───────────────────────────────────────────
  # 每 PR 都跑；真 test-and-build job 跳过（不相关 PR）视为通过，失败才红。
  # required 挂这个，不挂 test-and-build 本身（同 lead-gate 模式）。
  android-ci-gate:
    name: Android CI Gate Passed
    needs: [changes, test-and-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android CI Gate
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/required-gate.mjs android
