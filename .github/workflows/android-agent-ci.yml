name: Android CI — agent-android

on:
  push:
    branches: [main]
    paths:
      - 'services/agent-android/**'
      - '.github/workflows/android-agent-ci.yml'
  pull_request:
    paths:
      - 'services/agent-android/**'
      - '.github/workflows/android-agent-ci.yml'

concurrency:
  group: android-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit Tests + Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Run unit tests (MachineFingerprintTest / HttpHeartbeatLoopTest / NodeExtractorTest)
        run: gradle :app:testDebugUnitTest

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: services/agent-android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkey -v \
              -keystore "$RUNNER_TEMP/ci.jks" \
              -alias cikey -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=CI,OU=CI,O=ZenithJoy,L=CI,S=CI,C=CN" \
              -storepass ci-keystore-pass -keypass ci-keystore-pass \
              -noprompt
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=ci-keystore-pass" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=cikey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=ci-keystore-pass" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zenithjoy-agent-${{ github.sha }}
          path: services/agent-android/app/build/outputs/apk/release/*.apk
          retention-days: 30
