name: "[CONFIG] E2E Line04 CRM AG Grid 运营台（DOM 行内编辑 AI 客户管理台）"

# Line04 CRM AG Grid 运营台 Playwright E2E
# 纯 dashboard UI 脚本（Vite dev server + Playwright headless chromium，VITE_SKIP_AUTH mock），
# 不涉及 RPA → 按"非 RPA = 纯脚本"规则跑 ubuntu headless（原 windows-latest 无必要，已下线）。
#
# 可 required 设计：去掉原生 on.pull_request.paths 门（否则不相关 PR 整条 workflow 不跑、
# required check 永远等不到会锁死全仓 PR）。改为 workflow 每 PR 都跑，内部 changes job
# 用 git diff 判定是否跑真 Playwright job；always() 聚合 gate「Line04 CRM Gate Passed」
# 在真 job 跳过时照样报绿。required 挂聚合 gate，不挂原始 job。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-line04-crm-aggrid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes — 变更路径检测
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crm: ${{ steps.filter.outputs.crm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "crm=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event: run all"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE...$HEAD")
          echo "$FILES"
          CRM=false
          if echo "$FILES" | grep -qE '^(apps/dashboard/src/pages/CustomerListPage\.tsx|apps/dashboard/src/pages/CustomerProfilePage\.tsx|apps/dashboard/e2e/crm-aggrid\.spec\.ts|apps/dashboard/e2e/crm-customer-list\.spec\.ts|\.github/workflows/e2e-line04-crm-aggrid\.yml)$'; then
            CRM=true
          fi
          echo "crm=$CRM" >> "$GITHUB_OUTPUT"

  playwright:
    name: Playwright — CRM AG Grid 运营台 (ubuntu chromium)
    needs: changes
    if: needs.changes.outputs.crm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/dashboard
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server (VITE_SKIP_AUTH=true)
        working-directory: apps/dashboard
        env:
          VITE_SKIP_AUTH: 'true'
          VITE_MOCK_USER_ID: 'dev-user-001'
          VITE_MOCK_USER_NAME: '测试用户'
        run: |
          npx vite --port 5174 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5174 >/dev/null 2>&1; then
              echo "Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fs http://localhost:5174 || (echo "Vite failed to start"; exit 1)

      - name: Run Playwright E2E — CRM AG Grid 运营台
        working-directory: apps/dashboard
        env:
          BASE_URL: 'http://localhost:5174'
        run: npx playwright test e2e/crm-aggrid.spec.ts e2e/crm-customer-list.spec.ts --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-crm-aggrid-artifacts
          path: |
            apps/dashboard/test-results/
            apps/dashboard/playwright-report/
            apps/dashboard/screenshots/
          retention-days: 7

  # ─── 聚合 gate（required context）───────────────────────────────────────────
  # 每 PR 都跑；真 job 跳过（不相关 PR）视为通过，失败才红。required 挂这个。
  crm-gate:
    name: Line04 CRM Gate Passed
    needs: [changes, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Line04 CRM Gate
        run: |
          echo "changes=${{ needs.changes.result }} playwright=${{ needs.playwright.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "FAIL: changes 检测未成功"; exit 1
          fi
          case "${{ needs.playwright.result }}" in
            success|skipped) ;;
            *) echo "FAIL: playwright 结果为 ${{ needs.playwright.result }}"; exit 1 ;;
          esac
          echo "Line04 CRM Gate Passed"
