name: E2E Line02 Keyword→Comment (ROG)

# Line02 智能获客 — 关键词搜索 + 评论抓取 真机 smoke
# 依赖 xian-rog self-hosted runner（含真实抖音 creator session）
# 验证：keyword-search-douyin.cjs 找到视频 → crawl-comments-douyin.cjs 抓到评论者

on:
  push:
    branches: [main]
    paths:
      - 'services/agent/src/handlers/keyword-search-douyin.ts'
      - 'services/agent/publishers/keyword-search-douyin.cjs'
      - 'services/agent/publishers/crawl-comments-douyin.cjs'
      - 'services/agent/src/index.ts'
      - '.github/workflows/e2e-line02-keyword-comment.yml'
      - '.github/workflows/scripts/smoke/line02-keyword-comment-smoke.sh'
      - '.github/workflows/scripts/run-line02-candidate.ps1'
      - '.github/workflows/scripts/line02-process-job.cs'
  pull_request:
    branches: [main]
    paths:
      - 'services/agent/src/handlers/keyword-search-douyin.ts'
      - 'services/agent/publishers/keyword-search-douyin.cjs'
      - 'services/agent/publishers/crawl-comments-douyin.cjs'
      - 'services/agent/src/index.ts'
      - '.github/workflows/e2e-line02-keyword-comment.yml'
      - '.github/workflows/scripts/smoke/line02-keyword-comment-smoke.sh'
      - '.github/workflows/scripts/run-line02-candidate.ps1'
      - '.github/workflows/scripts/line02-process-job.cs'
  workflow_dispatch:
    inputs:
      smoke_kw:
        description: '测试关键词'
        default: '美甲'

concurrency:
  group: e2e-line02-keyword-comment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyword-comment-smoke:
    name: Line02 关键词→评论 smoke（xian-rog 真机）
    runs-on: [self-hosted, wechat-capable]
    timeout-minutes: 15
    concurrency:
      group: zj-rog-desktop
      cancel-in-progress: false
    env:
      SMOKE_KW: ${{ github.event.inputs.smoke_kw || '美甲' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/workflows/scripts
            services/agent/publishers
            services/agent/package.json
            services/agent/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare candidate dependencies from lockfile
        shell: powershell
        working-directory: services/agent
        run: npm ci --ignore-scripts --omit=dev --workspaces=false
      - name: Run fixed candidate with approved interactive test user
        shell: powershell
        run: .\.github\workflows\scripts\run-line02-candidate.ps1
      - name: Retain actual candidate receipt and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line02-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: line02-candidate-evidence/
          if-no-files-found: warn
