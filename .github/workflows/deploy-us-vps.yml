name: Deploy API to US Mac

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'

jobs:
  deploy-api:
    name: Deploy API to US Mac (launchd)
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (蓝绿：staging :5201 验过 → promote :5200 → 失败自动回滚)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.US_MAC_HOST }}
          username: ${{ secrets.US_MAC_USER }}
          key: ${{ secrets.US_MAC_SSH_KEY }}
          port: ${{ secrets.US_MAC_PORT }}
          script_stop: true
          # 蓝绿部署（PrepPRD 2026-06-24，方案 A：切换=把验过的新 build 重启进 :5200）：
          #   先发 staging slot :5201（连 zenithjoy_test 库、无客户流量）→ 在 :5201 跑部署验证
          #   （migration可跑通/health/版本断言/golden-path smoke）→ 全绿才 promote 切 :5200
          #   → staging 验证红：不 promote，:5200 纹丝不动 → promote 中失败：自动回滚到上一版 sha
          #   全部编排逻辑在 deploy-lib.sh 的 blue_green_deploy（单测 + smoke proven-to-fire）。
          envs: DEPLOY_SHA
          command_timeout: 20m
          script: |
            set -euo pipefail
            REPO=/Users/administrator/perfect21/zenithjoy
            DEPLOY_SHA="${{ github.sha }}"

            echo "=== [1/3] git sync → ${DEPLOY_SHA} ==="
            git -C "$REPO" fetch --force --prune origin main
            git -C "$REPO" reset --hard "$DEPLOY_SHA"

            echo "=== [2/3] install & build（build 内写 dist/build-info.json）==="
            cd "$REPO"
            export BUILD_SHA="$DEPLOY_SHA"
            npm ci --workspace=apps/api --ignore-scripts 2>/dev/null || \
              (cd "$REPO/apps/api" && npm ci --ignore-scripts)
            npm run build --workspace=apps/api 2>/dev/null || \
              (cd "$REPO/apps/api" && BUILD_SHA="$DEPLOY_SHA" npm run build)

            echo "=== [3/3] 蓝绿部署：staging :5201 验过 → promote :5200（失败自动回滚）==="
            # shellcheck source=/dev/null
            source "$REPO/.github/workflows/scripts/deploy-lib.sh"

            # mmv 上下文（deploy-lib hook 实现读取）
            export ZJ_REPO="$REPO"
            export ZJ_API_DIR="$REPO/apps/api"
            export ZJ_PROD_PORT=5200
            export ZJ_STAGING_PORT=5201
            export ZJ_PROD_LABEL=com.zenithjoy.api
            export ZJ_STAGING_DB=zenithjoy_test
            export ZJ_PROD_PLIST="$HOME/Library/LaunchAgents/com.zenithjoy.api.plist"
            export ZJ_NODE=/opt/homebrew/bin/node
            export BRAIN_URL="${BRAIN_URL:-http://localhost:5221}"

            # 把蓝绿编排器的 hook 指向 deploy-lib.sh 里的 mmv 真实实现
            export BG_DEPLOY_STAGING_FN=staging_deploy_slot
            export BG_VERIFY_STAGING_FN=staging_verify
            export BG_RECORD_ANCHOR_FN=staging_record_anchor
            export BG_PROMOTE_FN=staging_promote
            export BG_VERIFY_PROD_FN=staging_verify_prod
            export BG_ROLLBACK_FN=staging_rollback
            export BG_DESTROY_STAGING_FN=staging_destroy_slot
            export BG_ALERT_P0_FN=staging_alert_p0

            blue_green_deploy "$DEPLOY_SHA"

  notify-failure:
    name: Notify Brain on failure
    runs-on: ubuntu-latest
    needs: [deploy-api]
    if: failure()
    steps:
      - name: Post P0 alert to Brain
        run: |
          curl -sf -X POST ${{ secrets.BRAIN_URL }}/api/brain/tasks \
            -H "Content-Type: application/json" \
            -d '{
              "title": "ZenithJoy US API 部署失败",
              "priority": "P0",
              "task_type": "dev",
              "description": "deploy-us-vps.yml 失败，请人工介入"
            }' || echo "Brain API 不可达，跳过告警"
