name: Pinned Skill Sources
on:
  pull_request:
    paths:
      - '.skills-source.json'
      - 'scripts/*skills-source*'
      - '.github/actions/skills-source/**'
      - '.github/workflows/skills-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned skill sources
        uses: ./.github/actions/skills-source
        with:
          ssh-key: ${{ secrets.SKILLS_SOURCE_SSH_KEY }}
