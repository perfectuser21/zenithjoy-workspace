name: Deploy Staff Hub to HK VPS

# Staff Hub 员工前端专属部署——只碰 apps/staff-hub 静态文件 + 它自己的独立容器，
# 不碰 zenithjoy-api-prod（那个有人工卡点，见 promote-prod-hk.yml 死规矩）。

on:
  push:
    branches: [main]
    paths:
      - 'apps/staff-hub/**'
      - 'deploy/staff-hub/**'
  workflow_dispatch:

concurrency:
  group: deploy-staff-hub
  cancel-in-progress: false

jobs:
  deploy-staff-hub:
    name: Build & Deploy Staff Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --workspace=apps/staff-hub

      - name: Create .env.production
        run: |
          echo "VITE_FEISHU_APP_ID=${{ secrets.FEISHU_APP_ID }}" > apps/staff-hub/.env.production

      - name: Build staff-hub
        run: npm run build --workspace=apps/staff-hub

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HK_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.HK_VPS_PORT }} ${{ secrets.HK_VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist + nginx.conf to VPS via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HK_VPS_PORT }} -o StrictHostKeyChecking=no" \
            apps/staff-hub/dist/ \
            ${{ secrets.HK_VPS_USER }}@${{ secrets.HK_VPS_HOST }}:/opt/zenithjoy/staff-hub/dist/
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HK_VPS_PORT }} -o StrictHostKeyChecking=no" \
            deploy/staff-hub/nginx.conf \
            ${{ secrets.HK_VPS_USER }}@${{ secrets.HK_VPS_HOST }}:/opt/zenithjoy/staff-hub/nginx.conf
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HK_VPS_PORT }} -o StrictHostKeyChecking=no" \
            deploy/staff-hub/common.conf \
            ${{ secrets.HK_VPS_USER }}@${{ secrets.HK_VPS_HOST }}:/opt/zenithjoy/staff-hub/common.conf
          echo "✅ dist + nginx.conf + common.conf synced"

      - name: Restart staff-hub container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HK_VPS_HOST }}
          username: ${{ secrets.HK_VPS_USER }}
          key: ${{ secrets.HK_VPS_SSH_KEY }}
          port: ${{ secrets.HK_VPS_PORT }}
          script: |
            docker restart staff-hub
            echo "✅ staff-hub restarted"
