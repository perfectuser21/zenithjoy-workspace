# Product Map SSOT — ZenithJoy
# 此文件是唯一手写分类来源。App/Line/GP 的任何变更只在此处修改。
# 生成投影：npm run product-map:generate
# 校验：npm run product-map:validate
# 漂移检测：npm run product-map:check

apps:
  - id: customer_app
    name: 客户端（Customer App）
    lines:
      - id: line01
        name: Line 01 智能发布
      - id: line02
        name: Line 02 智能获客
      - id: line04
        name: Line 04 智能客服
      - id: line05
        name: Line 05 视频剪辑
      - id: line07
        name: Line 07 AI爆款视频翻拍

  - id: staff_app
    name: 员工后台（Staff App）
    lines:
      - id: line00
        name: Line 00 运营中枢
      - id: line10
        name: Line 10 客户管理
      # 2026-08-19 主理人拍板（决策 ab866172）：员工知识中枢——替代 Notion 的团队知识底座，
      # 与 Brain/开发流水线深度打通。三条 GP：经验沉淀与问答 / 协同笔记 / 结构化工作台。
      - id: line11
        name: Line 11 员工知识中枢

surfaces:
  - web
  - api
  - android
  - windows

editions:
  - personal_wechat
  - wecom

# Golden Paths
golden_paths:
  # 2026-08-12 收敛（本 sprint，判定点见 contract-draft.md）：与 ability_acceptance 疑似功能重叠，
  # 决策 fc7b5dc0 重写的是"验收"（ability_acceptance 所指代的功能域），skill_acceptance 未见后续
  # 重写/CI 覆盖证据，标记 deprecated（条目保留不删除）。
  - id: skill_acceptance
    app_id: staff_app
    line_id: line00
    name: Skill 验收流程
    status: deprecated

  # 2026-07-31 用户拍板（决策 fc7b5dc0，覆盖 07-29 走 Notion 的决策）：验收+展示全部收回
  # 自家前端，Staff Hub 直连 Brain 零同步层重新实现（cecelia PR #4516 后端 + 本仓库前端）
  - id: ability_acceptance
    app_id: staff_app
    line_id: line00
    name: Ability 验收流程
    status: active

  - id: line_health
    app_id: staff_app
    line_id: line00
    name: Line 健康度看板
    status: active

  # GP锚定闭环刀1新增：机制自身注册。status=proposed——刀2-5尚未落地，
  # 刀1-5全部合并，§8 六条验收标准均已满足（刀4③"无锚任务注册400"因task-tasks.js
  # 跨项目共用改为执行时terminal fail，功能等价但触发时点不同，见刀4 handoff架构修正说明），
  # 刀5翻转为active。
  - id: gp_anchor_enforcement
    app_id: staff_app
    line_id: line00
    name: GP锚定闭环
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-f1-anchor-smoke.sh

  # 工厂 · F1 开发闭环（cecelia kernel harness 2.0 自身的 Golden Path，journey e6f803f2）。
  # 2026-08-19 决策 109dd8eb：cecelia 流水线路径的修复必须锚到本 GP 的某一步，
  # 守卫落在 tests/gp/f1/step<N>-*.test.* 这条边上（CI lint-gp-anchor-artifact 产物闸）。
  # 此前 F1 只在 cecelia Brain DB 里有、不在本 map 里 → hook 写不出合法锚 → 人人 none(infra)。
  - id: f1_dev_loop
    app_id: staff_app
    line_id: line00
    name: 工厂 · F1 开发闭环
    status: active
    steps:
      - id: step1
        name: 接单进车间即分档
      - id: step2
        name: 合同即法律
      - id: step3
        name: 造完真验
      - id: step4
        name: 交付有回执
      - id: step5
        name: kernel-contract-a20

  # 客户线GP：业务步骤原样从 .claude/CLAUDE.md 迁移（用户拍板：刀1不做业务审计）。
  # 注：smoke内部实测步数与此处业务step数不对齐是已知记录，不代表数据错误——
  # product-map记业务步骤，smoke脚本内部粒度是实现细节（设计文档非目标②）。
  - id: customer_first_success
    app_id: customer_app
    line_id: line01
    name: 客户首次成功
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-1-smoke.sh
    steps:
      - id: step1
        name: 注册自动登录（含 free license）
      - id: step2
        name: 装客户端 + Agent 自动连中台
      - id: step3
        name: 画像诊断（行业/受众/风格 3 字段）
      - id: step4
        name: 扫码绑定抖音主号（Agent 弹登录窗，session 存本地）
      - id: step5
        name: AI 生成 1 条内容（接 Claude API）
      - id: step6
        name: 中台派任务 + dryrun 发布 + 回执

  # 2026-07-29 主理人拍板（task 58596a57）：line02 按员工实测玩法拆 4 条获客 GP。
  # 老 id 保留标 deprecated 防历史锚点断裂；实际只有关键词获客是 working，其余占位待建。
  - id: customer_smart_acquisition
    app_id: customer_app
    line_id: line02
    name: 客户智能获客（已拆分为四条获客 GP）
    status: deprecated

  - id: keyword_acquisition
    app_id: customer_app
    line_id: line02
    name: 关键词获客
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-2-smoke.sh
    # 承诺式骨干 4 步（决策 60da58cf，2026-08-15，按 capability/references/step-cutting.md 四测试扫出）。
    # 每步是「客户可观察的状态变化」承诺；注册/装机/建表/填画像=共享前置件(复用 Path1)，不算本路骨干；
    # 挂片/FR/NFR/判定点/断言落 Brain 账本(journey_features + journey_step_links)，不进本文件（决策 26793221）。
    # 旧 step7「触达带企微号→企微webhook→AI首答」已退役(决策 19c25189)：代码中不存在，0707 去飞书改本地中台。
    steps:
      - id: step1
        name: 中台显示手机上有 N 个可用抖音小号
      - id: step2
        name: 系统按关键词替客户找到符合画像的目标视频，中台可见清单
      - id: step3
        name: Lead 表出现带抖音号的潜在客户
      - id: step4
        name: 系统用小号给线索发出私信，客户看到每条已发出/被限流/失败/已送达

  # 以下三条为占位（主理人 07-29：只写出来，尚无实际实现）
  - id: live_acquisition
    app_id: customer_app
    line_id: line02
    name: 直播获客
    status: proposed
    steps:
      - id: step1
        name: 客户指定目标直播间/主播
      - id: step2
        name: 抓直播间互动观众
      - id: step3
        name: 触达带企微号→收好友→AI首答→写Lead表

  - id: video_link_acquisition
    app_id: customer_app
    line_id: line02
    name: 视频链接获客
    status: proposed
    steps:
      - id: step1
        name: 客户手填目标视频链接
      - id: step2
        name: 抓该视频评论区
      - id: step3
        name: 触达带企微号→收好友→AI首答→写Lead表

  - id: benchmark_link_acquisition
    app_id: customer_app
    line_id: line02
    name: 对标链接获客
    status: proposed
    steps:
      - id: step1
        name: 客户手填对标账号链接
      - id: step2
        name: 读对标账号视频→抓评论区
      - id: step3
        name: 触达带企微号→收好友→AI首答→写Lead表

  - id: customer_private_ai
    app_id: customer_app
    line_id: line04
    name: 客户私域 AI 接管（已细化为智能客服六条 GP）
    status: deprecated
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-4-smoke.sh
    steps:
      - id: step1
        name: 中台扫码绑个微干净测试号
      - id: step2
        name: 飞书 Bitable 自动建 3 张表（客户档案 / 营销画像 / 内容排期）
      - id: step3
        name: 名单内客户私聊进来 → DeepSeek拼对话历史写回复草稿 → 写飞书互动记录表（待审）
      - id: step4
        name: 中台定时触发"今日朋友圈" → DeepSeek拼营销画像写文案草稿 → 写飞书内容排期表（待审）
      - id: step5
        name: 用户在飞书审批 → 批准后系统spawn wechat_rpa.py真发（强制频控）
      - id: step6
        name: 发布回执（成功/失败+原因）回写飞书内容排期+互动记录表

  # 2026-07-29 主理人拍板（task 58596a57）：line04 细化为智能客服六条 GP + 绑定/安装共享前置。
  # steps 搬运自 Brain journey_steps（智能客服系列 journey）。
  # 原"微信客户沟通"含主/被动，现拆开：被动=passive_reception（做得最多），主动=active_voice_outreach（半测未完）。
  - id: cs_shared_binding
    app_id: customer_app
    line_id: line04
    name: 智能客服·绑定/安装（共享前置）
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-4-smoke.sh
    steps:
      - id: step1
        name: 注册自动登录
      - id: step2
        name: 装客户端 + Agent 连中台
      - id: step3
        name: 扫码绑定微信号

  # 半测未完（主理人 07-29：测了一半后搁置，验收未完成）
  - id: active_voice_outreach
    app_id: customer_app
    line_id: line04
    name: 智能客服·GP-A 主动语音触达
    status: active
    # gpa-voice-rtc-smoke.sh 存在但纯 grep/文件存在性检查（真实命令数=0），
    # 被 product-map:check 的 GP-SMOKE-EMPTY 反占位质检拦下，2026-08-04 审计后
    # 排除在外（如实反映：该脚本目前不构成有效 smoke 覆盖），待重写为含真实命令的验证。
    smoke_files:
      - .github/workflows/scripts/smoke/gpa-voice-outreach-smoke.sh
    steps:
      - id: step1
        name: 拨号触发
      - id: step2
        name: 接通判定
      - id: step3
        name: AI实时对话
      - id: step4
        name: 通话记录回写

  - id: passive_reception
    app_id: customer_app
    line_id: line04
    name: 智能客服·GP-B 被动接待
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-4-smoke.sh
      - .github/workflows/scripts/smoke/line04-wxid-whitelist-smoke.sh
      - .github/workflows/scripts/smoke/line04-cs-memory-smoke.sh
      - .github/workflows/scripts/smoke/line04-cs-tenant-isolation-smoke.sh
    steps:
      - id: step1
        name: 消息被感知
      - id: step2
        name: 决定谁来答
      - id: step3
        name: 回复送达
      - id: step4
        name: 留痕与善后

  - id: moments_publish
    app_id: customer_app
    line_id: line04
    name: 智能客服·GP-C 朋友圈发布
    status: active
    # 仅覆盖 step1（内容成稿）；发布上圈(step2)/发布确认与留痕(step3) 目前无对应 smoke，
    # 真实覆盖缺口——2026-08-04 审计发现，待后续 sprint 补齐。
    smoke_files:
      - .github/workflows/scripts/smoke/path4-sprint-1-ws4-smoke.sh
    steps:
      - id: step1
        name: 内容成稿
      - id: step2
        name: 发布上圈
      - id: step3
        name: 发布确认与留痕

  - id: business_report
    app_id: customer_app
    line_id: line04
    name: 智能客服·GP-D 经营汇报
    status: active
    # cs-daily-report-smoke.sh 目前是存量债（Smoke Glob Gate 非阻断），非必绿基线。
    smoke_files:
      - .github/workflows/scripts/smoke/cs-daily-report-smoke.sh
    steps:
      - id: step1
        name: 数据齐备
      - id: step2
        name: 报告生成
      - id: step3
        name: 送达老板

  - id: moments_interaction
    app_id: customer_app
    line_id: line04
    name: 智能客服·GP-E 朋友圈互动
    status: active
    # 2026-08-04 审计：暂无对应 smoke 脚本，真实覆盖缺口，待后续 sprint 补齐。
    steps:
      - id: step1
        name: 客户动态被感知
      - id: step2
        name: 互动决策
      - id: step3
        name: 互动执行与留痕

  - id: group_operation
    app_id: customer_app
    line_id: line04
    name: 智能客服·GP-F 社群运营
    status: active
    # 2026-08-04 审计：暂无对应 smoke 脚本，真实覆盖缺口，待后续 sprint 补齐。
    steps:
      - id: step1
        name: 群动静被感知
      - id: step2
        name: 响应与治理
      - id: step3
        name: 留痕

  # 2026-08-12 新增（本 sprint，task c2b59b6a）：锚定既有 smoke，不新写业务代码。
  # id/name 由 Generator 定稿（PRD [ASSUMPTION] 授权），未授权编造 steps 业务步骤内容
  # （reviewer round1 阻塞问题1：schema steps 可选，line_health 等既有 active GP 也没有 steps 字段）。
  - id: video_editing
    app_id: customer_app
    line_id: line05
    name: 视频剪辑
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/ai-video-pipeline-local-smoke.sh

  - id: viral_video_remake
    app_id: customer_app
    line_id: line07
    name: AI爆款视频翻拍
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/golden-path-7-video-remake-smoke.sh

  - id: customer_management
    app_id: staff_app
    line_id: line10
    name: 客户管理
    status: active
    smoke_files:
      - .github/workflows/scripts/smoke/customer-admin-backend-smoke.sh

  # 2026-08-19 员工知识中枢 路①（golden_path ade79e4e，7 轮 GAN 收敛，合同 v1 已签，
  # harness 任务 6110f348）：人或 agent 产生经验 → 团队任何人和任何 agent 都问得到、
  # 干活前被强制喂到，且只喂仍然成立的经验。
  - id: knowledge_experience_qa
    app_id: staff_app
    line_id: line11
    name: 经验沉淀与问答
    status: proposed
    steps:
      - id: step1
        name: 经验被留住（人侧自动触发 + agent 干完自动写回，「最近沉淀」立刻可见）
      - id: step2
        name: 问得到（大白话提问，答案带出处；「库里没有」与「暂时查不了」两种明确回答）
      - id: step3
        name: 干活前被喂到（agent 开工强制注入仍然成立的经验，中台可见注入台账）
