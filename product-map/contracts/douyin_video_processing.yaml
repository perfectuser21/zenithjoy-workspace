        order: 7
        reads:
          - Comment.dedup_key
          - Run.run_tag
          - HistoricalComment.history_sha256
        writes:
          - Comment.harvest_batch
          - Comment.dedup_key
          - Comment.line_key
          - Comment.recipient_evidence
        check: 评论池「运行批次」计数 ≥ leads_written（= push-raw-comments.js 本批实际落池数 PUSH_COMMENTS_STATS.created，不含被历史全池去重掉的）；0929修：同push_videos，全军覆没时 exit 1；保本次LEAD观察comments_collected及原PG门槛，新增comments_inserted/history_verified/coverage分列，历史不输出新LEAD或迁旧batch；可选recipient原件严格绑定line/run/source_run/profile/VID/UID/全文SHA、私有文件真实RUN_DIR和hash，异常拒绝
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.push_raw_comments（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
