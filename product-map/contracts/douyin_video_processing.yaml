      - gap: coll_video_binding_consistent 只能核对孤儿归属（评论来源视频必须是本批落过库的视频），抓不住漂移到同批另一条真实视频的语义错配；行内防线是 harvest-keyword.sh video_drifted（0929）。要抓同批错配需账本记每条评论采集时的视频身份序列做交叉核验
