    steps:
      - key: acquire_device_lock
        name: 拿设备锁
        order: 1
        reads:
          - Device.serial
        writes:
          - Device.lock_holder
        check: 实际锁owner与本run一致，使用本次冻结租约且不覆盖他人。
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.acquire_device_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
      - key: refresh_lock_heartbeat
        name: 锁心跳续期
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: lock-refresh 后锁文件 mtime 更新
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.refresh_lock_heartbeat（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
      - key: verify_device_identity
        name: 验设备身份
        order: 3
        reads:
          - Device.serial
        writes:
          - Device.online
        check: adb get-state == device 且 serial 与声明一致
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.verify_device_identity（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
      - key: verify_call_idle
        name: 验通话空闲
        order: 4
        reads:
          - Device.serial
        writes:
          - Device.call_state
        check: telephony call_state == IDLE
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.verify_call_idle（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/2及原始证据验收。
          readback:
            type: none
      - key: read_account_mark
        name: 读账号标记(我页)
        order: 5
        reads:
          - Account.sender_id
        writes:
          - Account.logged_in
        check: 我页抖音号 in profile 的注册账号列表(account-current + account_registered)
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.read_account_mark（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: open_run_ledger
        name: 开账本
        order: 6
        reads:
          - Account.profile
          - Device.serial
        writes:
          - Run.run_tag
          - Run.profile
          - Run.serial
        check: 保存本轮真实设备、账号、通话与锁的原始证据；未知明确记录，不从旧harvest日志或固定指标宣称成功。
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.open_run_ledger（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
    commander:
      entry: activity-commander.mjs
  - key: dedup
    name: 按视频ID判重和筛选
    promise: 核对视频来源与身份，交出本轮可处理且未被重复认领的视频集合
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_processing
      activity_key: dedup
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 3.3.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Video
        source: 101 已持久化的视频发现结果及待处理视频队列
        cardinality: many
        fields:
          - video_id
          - author
          - comment_count
          - keyword
    outputs:
      - type: Video
        destination: zenithjoy.leadgen_videos 的本轮待判定集合
        cardinality: many
        effect: create
        fields:
          - video_id
          - author
          - comment_count
          - keyword
    preconditions:
      - 本run公司政策与自家号名单可读取；101冻结身份、确切VID及其原始发现证据与PG逐ID读回一致。
      - input_provenance.producer是普通来源证明，不自动启用producer_descriptor特殊认领例外。普通路径按本次exactIDs且source_run:null认领；仅显式冻结producer_descriptor才适用其来源状态要求。
    postconditions:
      - probe: dedup_historical_filter_verified
        asserts: PG逐VID核实已采、拒绝和当前处理状态；按VID过滤重复，不以同标题合并不同视频；合法空集合保留实际筛选原因。
      - probe: dedup_own_filter_verified
        asserts: 自家作者过滤依据本次已核作者身份与公司配置，不能按标题或昵称猜作者。
      - probe: dedup_run_dedup_verified
        asserts: 本批VID不重复，实际可处理集合有本run精确认领与租约证据；合法缓存保留原judgment run，普通101来源证明不得误当必须pending/原101harvest_batch的特殊授权。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-102-dedup/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 600
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: skip
    failure:
      empty_ok:
        - no_cards 本词无视频卡片
      retryable:
        - lock_busy
        - WRONG_FOREGROUND
        - NO_ROOT
        - 候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判
      needs_human:
        cases:
          - TARGET_ABSENT 连续出现，疑抖音改版
        alert:
          channel: bark
          object: escort 升级（harvest-cron.sh 陪跑员）→ Bark
      fatal:
        - hash_mismatch 词单在 run 中被改
    side_effects: []
    invokers:
      - code
      - agent
    runtime:
      phase: batch_end
      entry: services/phone-adb-controller/leadgen-foundation/worker.mjs
      executor_kind: agent
      protocol: json-stdio-v1
