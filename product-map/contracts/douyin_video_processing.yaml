    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 评论图标兜底定位（douyin-phone-adb:2076）
    steps:
      - key: open_comment_section
        name: 开评论区
        order: 1
        reads:
          - Video.video_url
          - Video.judgment_status
        writes: []
        check: 本run逐VID有评论时必须原生评论header和输入面板，旧n条评论与新exact评论n均可见； 仅已证零评论可用本run同VID的精确零占位before原XML及identity原件哈希证明替代该VID面板，未知/缺按钮不算零；实际VID仍须qv新鲜nonce与identity sidecar核验，可选历史不替代核验
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.open_comment_section（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: collect_comments
        name: 采集评论
        order: 2
        reads:
          - Video.video_id
          - Account.nickname
          - HistoricalComment.status
          - HistoricalComment.video_id
          - HistoricalComment.douyin_id
          - HistoricalComment.body
        writes:
          - Comment.body
          - Comment.nickname
          - Comment.video_id
          - Comment.dedup_key
          - Comment.harvest_batch
          - Comment.line_key
        check: 逐屏整行去重，连续 2 屏无新增即停；过滤作者本人与自有账号；可选冻结采样配额1..50对所有tiers计已核历史加新distinct，达配额单独sampled且非全采；未设置时历史加新distinct已核覆盖累计large上限50，medium仍全采，历史命中按本屏新distinct观察记进展，unknown不跳过；仅本run同VID的精确零占位before原XML和identity原件hash证明齐全时，可替代该VID逐屏原件；零结果不计采得评论或配额
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.collect_comments（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
      - key: verify_commenter_identity
        name: 评论人身份验证
        order: 3
        reads:
          - Comment.nickname
        writes:
          - Comment.douyin_id
        check: 主页强校验：抖音号合法 + 账号三态 + 非自有账号；验证失败抢救(back+重开评论区)后核对 current-video-link 仍是本视频，漂移即本视频剩余评论作废(0929修，见下 known_gaps)；历史匹配也必须新鲜actualOID逐字核验及严格评论面板返回，profile和returned原工件hash独立关联
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.verify_commenter_identity（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: resolve_profile_link
        name: 客户主页直链
        order: 4
        reads:
          - Comment.douyin_id
        writes:
          - Comment.profile_url
        check: 取得当前评论人的真实主页URL并绑定完整recipientEvidence；新评论无需预先已有comment_id。
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.resolve_profile_link（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
