        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh qualification.extract_audio（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: transcribe
        name: 通义ASR转写
        order: 5
        reads:
          - Video.video_id
        writes:
          - Video.transcript
        check: ASR只消费本次可验证音频；技术失败unknown，no_speech按冻结政策明确处理，未声明时不自动rejected。
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh qualification.transcribe（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: judge_content
        name: 意向判定
        order: 6
        reads:
          - Video.transcript
          - Video.title
        writes:
          - Video.judgment_status
          - Video.judgment_reason
        check: 唯一业务主判保存真实matched/rejected与理由；合法缓存保留原判断来源，不增加评分调用。
        implementation:
          status: implemented
          ref: 资格 Activity Skill 的同一 Agent 按冻结政策判断，qualify-submit 提交，经宿主核证后由原事务持久化并读回。
        uses_llm: true
