          - author
          - comment_count
          - keyword
    outputs:
      - type: Video
        destination: zenithjoy.leadgen_videos 的本轮待判定集合
        cardinality: many
        effect: create
        fields:
          - video_id
          - author
          - comment_count
          - keyword
    preconditions:
      - 自家号名单必须可读取
      - 101冻结身份和本批VID清单校验成功，PG按VID独立读回无缺行
    postconditions:
      - probe: dedup_historical_filter_verified
        asserts: PG按实际VID读回已采与拒绝状态、自家作者配置、本批VID交接证据
      - probe: dedup_own_filter_verified
        asserts: PG按实际VID读回已采与拒绝状态、自家作者配置、本批VID交接证据
      - probe: dedup_run_dedup_verified
        asserts: PG按实际VID读回已采与拒绝状态、自家作者配置、本批VID交接证据
      - probe: dedup_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
