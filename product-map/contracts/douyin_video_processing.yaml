      - key: close_app
        name: 关App
        order: 1
        reads:
          - Device.serial
        writes: []
        check: 前台不再是 com.ss.android.ugc.aweme
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.close_app（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
      - key: release_lock
        name: 放锁
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: 仅精确释放本人已确认可释放的资源；未知保留并报告，不宽杀、不按TTL抢占。
