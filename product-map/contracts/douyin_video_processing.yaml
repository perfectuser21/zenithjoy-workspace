      current_skill_verified: false
    order: 4
    version: 2.6.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: CommentSampleRequest
        source: 本次任务冻结的采样请求
        cardinality: one
        optional: true
        fields:
          [
            run_tag,
            source_run,
            profile,
            serial,
            line,
            comment_limit,
            collection_budget_s
          ]
      - type: Video
        source: 本轮资格判定通过的视频及原生身份读回
        cardinality: many
        fields:
          - line_key
          - video_id
          - video_url
          - judgment_status
      - type: Device
        source: 采集预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Account
        source: 本轮原生核验的抖音账号
        cardinality: one
        fields:
          - sender_id
          - nickname
      - type: Run
        source: 本次冻结运行定义
        cardinality: one
        fields:
          - run_tag
      - type: HistoricalComment
        source: 该公司原 PostgreSQL 评论历史及覆盖记录
        cardinality: many
        optional: true
        fields:
          - id
          - line_key
          - run_tag
          - source_run
          - video_id
          - video_url
          - schema_version
          - status
          - douyin_id
          - body
          - history_sha256
          - coverage
    outputs:
      - type: Comment
        destination: zenithjoy.leadgen_comments，供评论评分 Workflow 消费
        cardinality: many
        effect: create
        fields:
          - line_key
          - dedup_key
          - nickname
          - douyin_id
          - profile_url
          - body
          - video_id
          - harvest_batch
          - recipient_evidence
      - type: Video
        destination: zenithjoy.leadgen_videos 的处理状态
        cardinality: many
        effect: update
        fields:
          - process_status
    preconditions:
      - MMV102原生收件人来源须使用首个设备动作前冻结到company_config_runs.task_inputs的本run profile/serial，实号核对后生成私有company-binding工件；capture/parse显式消费，PG提交只读原102快照重验唯一verified enabled抖音账号及公司/租户/平台，不能由原件自报profile授权；旧M4无新绑定保持原静态路径
      - 可选CommentSampleRequest由用户请求冻结到本run定义，仅102且source_run与101受信交接一致；整数1..50，可选collection_budget_s仅显式配置时冻结为1..6720整数，默认480和进程960保持，显式进程预算加480收尾并受Activity/真实全局剩余时间限制；配额按已核历史和新distinct评论覆盖，不按own/失败/未核历史表总数计；达配额为sampled，PG保未全采，实际footer另行记录
      - 仅matched视频可采评论
      - 恢复后的当前视频ID再次核验，评论坐标必须来自当前屏
      - 可选HistoricalComment是只读PG系统输入，持本run matched租约且source_run受信VID清单后queue
        comment_history读取，非用户CLI或qualification输出；当前唯一line+VID+exactURL绑定，旧短链仅标题窄候选后受信只读HEAD实际VID相同才纳入私有工件，unknown仍走原路径，schema或scope异常拒绝
      - 历史命中仍需当前评论人的新鲜actualOID和严格返回评论面板，完整正文相等后才免重复名片动作
      - NativeRecipientEvidence是现采集Step附带可选原件，不新增UI动作/不改12列LEAD；锁内person-profile/returned+after-card实际VID+重开评论成功后才产出，缺原件unknown不ready
    postconditions:
      - probe: coll_only_matched
        asserts: 已标记为评论采集完成的视频中，资格不为 matched 的 PG 独立读回条数为 0
      - probe: coll_video_binding_consistent
        asserts: 本批已采评论绑定的真实 VID 与其来源视频一致，PG 独立核验不一致条数为 0
      - probe: coll_rescan_rate
        asserts: 真实身份错位后的重定位次数与合格视频数之比 metrics.rescan_rate 不超过 0.3
      - probe: comments_readback
        asserts: 本批已提交评论在 zenithjoy.leadgen_comments 的独立读回条数不少于 metrics.comments_collected
      - probe: collection_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
      - probe: sampling_readback_verified
        asserts: 仅显式采样时每个qualified视频须达冻结配额或真实footer/no_comments，逐完整身份独立PG读回；默认无采样required=0不声称采样通过
      - probe: history_scope_verified
        asserts: 本次qualified实际required_count等于私有PG历史工件scope验证数量，0等于0为显式无样本，不当评分样本
      - probe: history_consumption_readback
        asserts: 每个已尝试合格视频的历史消费皆独立PG读回成功，schema或新鲜证据失败不算通过，unknown无skip
      - probe: history_no_failures
        asserts: 历史schema/租约/VIDURL/新鲜身份及独立读回无失败，不迁移旧评论批次和评分状态
    execution:
