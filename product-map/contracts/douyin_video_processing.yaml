  - key: collection
    name: 采集评论
    promise: 从合格视频采集并持久化身份可验证的评论，更新视频处理状态
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_processing
      activity_key: collection
      owner_labeled: false
      current_skill_verified: false
    order: 4
    version: 2.8.6
    required_host_tools: ["phone", "business", "fetch-native", "collection-evidence", "collection-readback"]
    delivery: *activity_handoff
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: CommentSampleRequest
        source: 本次任务冻结的采样请求
        cardinality: one
        optional: true
        fields: [ run_tag, source_run, profile, serial, line, comment_limit, collection_budget_s ]
      - type: Video
        source: 本轮宿主独立验收后的资格交接提供 video_id 和 judgment_status。以同 VID 的授权 PostgreSQL 快照提供 line_key 和 video_url，并以本轮原生分享回执核对规范链接。四项共同组成逻辑采集输入，不要求资格交接对象重复带上 PostgreSQL 两项。
        cardinality: many
        fields:
          - line_key
          - video_id
          - video_url
          - judgment_status
      - type: Device
        source: 采集预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Account
        source: 逻辑采集账号由宿主交接的 context.Account.sender_id 与本轮 preflight 的 phone/account-current 唯一成功终态原始回执共同组成。复用下方开工核验所读原件，确认 Task/run、操作、退出码，且 stdout 的 douyin_id= 与 sender_id 一致，取同一 stdout 的非空 nickname= 作为昵称。无需宿主对象重复包含昵称；若已包含则必须与原件相同。
        cardinality: one
        fields:
          - sender_id
          - nickname
      - type: Run
        source: 本次冻结运行定义
        cardinality: one
        fields:
          - run_tag
      - type: HistoricalComment
        source: 该公司原 PostgreSQL 评论历史及覆盖记录
        cardinality: many
        optional: true
        fields:
          - id
          - line_key
          - run_tag
          - source_run
          - video_id
          - video_url
          - schema_version
          - status
          - douyin_id
          - body
          - history_sha256
          - coverage
    outputs:
      - type: Comment
        destination: zenithjoy.leadgen_comments，供评论评分 Workflow 消费
        cardinality: many
        effect: create
        fields:
          - line_key
          - dedup_key
          - nickname
          - douyin_id
          - profile_url
          - body
          - video_id
          - harvest_batch
          - recipient_evidence
      - type: Video
        destination: zenithjoy.leadgen_videos 的处理状态
        cardinality: many
        effect: update
        fields:
          - process_status
    preconditions:
      - 开工只接收本轮已独立验收的合法matched及仍有效的本run处理租约。核对已由宿主交接的本轮 context.Video 与真实只读事实，不读执行者自报结论。用 run.progress 的 observations 核 qualification/end 的时间早于 collection/start，并与传入本轮的 Video VID和 matched 交叉核对；观察状态本身仅反映检查调用生命周期。用 pg.rows relation=videos 一次读取 connection.snapshot_at 和 rows.video_id, rows.line_key, rows.video_url, rows.judgment_status, rows.judgment_config.run_id, rows.updated_at, rows.process_status, rows.harvest_batch。以快照时间减本轮目标行 updated_at 核15分钟租约、状态与批次，一次 host.receipts 定位本轮 qualification 的 phone/current-video-link 成功终态回执，按实际 path 用 read_file 读取；核原件的 Task/run、操作、真实退出码和原生规范链接，复核同 VID；开工不要求尚未生成的采集执行回执。执行时按后置条款的页面连续性规则选择复用或重取，START 不要求尚未生成的采集当前 UI 或取链回执。合法缓存保留原判断run和证据。
      - 以 checker-input/identity.json 为首个设备动作之前宿主冻结的绑定，核其 run、公司、租户、业务线、设备、预期账号与本次输入；用 run.progress 首个 preflight 活动调用时点与 Brain Task 的 created_at、started_at 对照。复用本次 host.receipts 定位本轮 preflight 的 phone/account-current 唯一成功终态回执，按实际 path 用 read_file 读取；核原件的 Task/run、操作、退出码及 douyin_id=，与冻结账号及设备锁回执交叉核对，评论原件不得用于授予任何权限。
      - 一次 brain.get resource=task，args.fields=id、created_at、started_at、result.foundation_runner.run.run_id、result.foundation_runner.run.deadline_ms、result.foundation_runner.run.input.run_tag、result.foundation_runner.run.input.binding_key、result.foundation_runner.run.input.business.comment_limit、result.foundation_runner.run.input.business.scope.collection_scope、result.foundation_runner.run.input.business.scope.source_run、result.foundation_runner.run.input.business.scope.video_ids、result.foundation_runner.run.input.business.scope.upstream。用同一回执及冻结 checker 请求 context.budget.max_duration_s 和 remaining_duration_s 核验本轮采样目标、真实来源、数量上限与剩余窗口。普通 persisted_run 的 source_run 可以为 null，目标上游按 scope.upstream 对照。可选 HistoricalComment 只在本轮真实提供该对象或冻结输入显式启用历史消耗时要求输入条目；无历史输入不读取全库，采集后发现的历史命中仍须验收。不得增加配额或延长任何截止。
    postconditions:
      - probe: coll_only_matched
        asserts: 交付评论仅来自合法matched视频；合法缓存的原判断run及政策/原证据保持，不能改历史run以通过。
      - probe: coll_video_binding_consistent
        asserts: 每条实际评论的VID、原生UID、完整正文、真实主页URL、recipientEvidence和返回评论页原件与原来源一致，PG逐行读回无身份错配。可选profileLinkEvidence不是新评论必须已有PG ID的恢复凭据。 采集入口先核页面连续性，再复用已验收的视频身份原件：同一 Task/run、VID、设备与本轮锁 owner/有效租约均一致；通过宿主真实工具序列与当前原生 UI 核对，确认从资格取链后没有切换视频、外部接管或未知导航，当前仍为原视频详情或其评论页。仅同标题、昵称或 Agent 自述不能证明连续性。满足这些条件时，保留资格回执原路径及 SHA-256，交由 Checker 读取原件，不重复调用 current-video-link 或重开详情；不得复制改名、改 EID 或宣称是新采集回执。任一身份不符、原件缺失/摘要不符、锁发生交接或无法证明页面连续性时，按原路径重新核实和取链；不能仅用旧链接放行。此复用仅免去采集入口重复取链，不替代采集后逐评论的原生 UID、全文、真实主页 URL、返回评论页和同视频配对证据。
      - probe: coll_rescan_rate
        asserts: 真实身份错位后的重定位次数与实际合格视频数有原始记录，其比率不超过原0.3上限；无合格视频时说明不适用依据，不能编计数。
      - probe: comments_readback
        asserts: PG逐精确ID读取实际新提交评论及其完整recipientEvidence，与本次原生证据/主页URL相符；执行提案、计数或工具exit0不能替代持久行。 按当前原生作者UID及冻结自有账号清单过滤作者本人和自有账号，不用昵称猜测；已提交集合不得含被排除对象。
      - probe: sampling_readback_verified
        asserts: 本次最高限额、目标配额、实际distinct数、真实footer/no_comments及stop_reason分别有证据。未达目标的已提交成果为partial，不报全部完成；确切已提交且独立核验的评论可用committed_partial交103。视频只有真实穷尽才能评论已采，明确采样不伪称穷尽。
      - probe: history_scope_verified
        asserts: 可选历史集合限定同line/VID/真实URL及本次受信来源，未启用时提供本次未启用事实，不强造历史证据。
      - probe: history_consumption_readback
        asserts: 历史消费逐精确ID只读原PG事实并核验完整身份与当前原生证据；只有完整正文与新鲜原生身份一致才能免重复取链，不把未核历史表总数计入本次目标。
      - probe: history_no_failures
        asserts: 历史读回失败或身份未知保持unknown，不降级为已消费；103只消费已独立确认的精确持久ID。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-102-collection/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 7200
      heartbeat_s: 300
    resources:
      locks:
        - device:<serial>
      limits:
        - name: max_comments_big_video
          value: 50
        - name: stop_after_empty_screens
          value: 2
    idempotency:
      dedupe_key: Comment.line_key+Comment.dedup_key
      on_duplicate: skip
    failure:
      empty_ok:
        - 视频无新评论
