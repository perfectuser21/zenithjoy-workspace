version: 1
capability: keyword_acquisition
contract_key: douyin_video_processing
commander_skill:
  name: wf-douyin_video_processing
  version: 0.4.0
name: 抖音视频处理
workflow: douyin-video-processing
brain_workflow_key: douyin_video_processing
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-processing.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: pending_videos
trigger_inputs:
  - Video
  - Account
  - Device
  - HistoricalComment
  - CommentSampleRequest
inputs:
  - type: CommentSampleRequest
    cardinality: one
    optional: true
    fields:
      [
        run_tag,
        source_run,
        profile,
        serial,
        line,
        comment_limit,
        collection_budget_s
      ]
  - type: HistoricalComment
    cardinality: many
    optional: true
    fields:
      [
        id,
        line_key,
        run_tag,
        source_run,
        video_id,
        video_url,
        schema_version,
        status,
        douyin_id,
        body,
        history_sha256,
        coverage
      ]
known_gaps:
  - gap: Workflow 的 on_status/always_run 路由尚未在本合同及 Runner 中形成可验证接线；Activity 字段齐全不代表端到端自动编排验收通过。
    task: bdd9fb75
activities:
  - key: preflight
    name: 预检
    promise: 核验采集设备及抖音账号，取得本轮设备锁和可追溯的运行上下文
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_discovery
        - douyin_video_processing
      activity_key: preflight
      owner_labeled: false
      current_skill_verified: false
    order: 1
    version: 2.2.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        source: 设备台账及原生 ADB 在线核验
        cardinality: one
        fields:
          - serial
          - host
      - type: Account
        source: 该公司已启用账号配置与手机原生登录态
        cardinality: one
        fields:
          - platform
          - profile
          - sender_id
    outputs:
      - type: Device
        destination: 本轮设备锁和运行上下文
        cardinality: one
        effect: update
        fields:
          - online
          - call_state
          - lock_holder
      - type: Account
        destination: 本轮已核账号上下文
        cardinality: one
        effect: update
        fields:
          - logged_in
      - type: Run
        destination: 本轮运行账本，交给后续采集 Activity
        cardinality: one
        effect: create
        fields:
          - run_tag
          - profile
          - serial
    preconditions:
      - 仅旧定时采收入口 wf-run.sh 的发起闸在 8-22 点让路；手动或 Brain 派发的 101/102 Activity 预检不以此为条件
      - 仅旧定时采收入口 wf-run.sh 用 kpi-gate.js 判断当日 KPI，达标则退让、不可达则按默认词数继续；手动或 Brain 派发不以此为条件
    postconditions:
      - probe: pf_device_verified
        asserts: 本轮设备 serial 的原生在线与身份核验结果 metrics.device_verified 等于 1
      - probe: pf_account_verified
        asserts: 手机原生登录账号与本轮冻结 profile 相符，metrics.account_verified 等于 1
      - probe: pf_call_idle
        asserts: 手机不在通话中，metrics.call_state_idle 等于 1
      - probe: pf_lock_acquired
        asserts: 本轮执行者实际持有设备锁，metrics.lock_acquired 等于 1
      - probe: preflight_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      primary_kind: code
      location: phone
      via: leadgen-workflow.mjs → preflight独立活动 → 持久化队列读回
    budget:
      max_duration_s: 300
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: reject
    failure:
      empty_ok: []
      retryable:
        - lock_busy 设备锁被占
      needs_human:
        cases:
          - device_offline 设备离线
          - account_mismatch 手机登录号不符
          - call_busy 设备通话中（未挂断的电话）
        alert:
          channel: bark
          object: harvest-cron.sh:121-125 离线升级分身 → Bark
      fatal:
        - run_tag 重复
    side_effects: []
    invokers:
      - code
    runtime:
      phase: setup
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE
        RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
