        order: 5
        reads:
          - Video.video_id
          - HistoricalComment.coverage
        writes:
          - Video.process_status
          - Video.comment_count
        check: 仅真实footer/穷尽且评论事务已提交时标评论已采；采样或未达目标保partial和实际停止原因。
