    steps:
      - key: close_app
        name: 关App
        order: 1
        reads:
          - Device.serial
        writes: []
        check: 前台不再是 com.ss.android.ugc.aweme
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.close_app（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.close_app_attempts
            expect:
              op: ">="
              value: 1
      - key: release_lock
        name: 放锁
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: 锁文件不存在或 owner≠本 run；失败重试3次(同commenter-identity套路)，3次仍失败才留告警
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            cleanup.release_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_released
            expect:
              op: ==
              value: 1
      - key: return_safe_desktop
        name: 回安全桌面
        order: 3
        reads:
          - Device.serial
        writes: []
        check: 前台 = launcher（用 HOME intent resolve-activity 查设备自身默认桌面包名,不 hardcode
          厂商launcher）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            cleanup.return_safe_desktop（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.safe_desktop_visible
            expect:
              op: ==
              value: 1
      - key: finalize_run
        name: 终态回执
        order: 4
        reads:
          - Run.run_tag
        writes:
          - Run.status
        check: n_items>0 且 n_files>=n_items（workflow-result.sh:194）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            cleanup.finalize_run（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            field: items_total
            expect:
              op: ">="
              value: 1
    commander:
      entry: activity-commander.mjs
