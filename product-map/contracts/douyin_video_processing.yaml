    steps:
      - key: acquire_device_lock
        name: 拿设备锁
        order: 1
        reads:
          - Device.serial
        writes:
          - Device.lock_holder
        check: lock-acquire rc=0 且锁文件 owner=本 run（TTL 1800s）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            preflight.acquire_device_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_acquired
            expect:
              op: ==
              value: 1
      - key: refresh_lock_heartbeat
        name: 锁心跳续期
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: lock-refresh 后锁文件 mtime 更新
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            preflight.refresh_lock_heartbeat（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          at: cleanup
          readback:
            type: log
            regex: 锁心跳续期3次仍未确认成功
            expect:
              op: <=
              value: 0
      - key: verify_device_identity
        name: 验设备身份
        order: 3
        reads:
          - Device.serial
        writes:
          - Device.online
        check: adb get-state == device 且 serial 与声明一致
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            preflight.verify_device_identity（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.device_verified
            expect:
              op: ==
              value: 1
      - key: verify_call_idle
        name: 验通话空闲
        order: 4
        reads:
          - Device.serial
        writes:
          - Device.call_state
        check: telephony call_state == IDLE
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            preflight.verify_call_idle（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.call_state_idle
            expect:
              op: ==
              value: 1
      - key: read_account_mark
        name: 读账号标记(我页)
        order: 5
        reads:
          - Account.sender_id
        writes:
          - Account.logged_in
        check: 我页抖音号 in profile 的注册账号列表(account-current + account_registered)
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            preflight.read_account_mark（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-account-profile.xml"
            match: 抖音号：
            expect:
              op: ">="
              value: 1
      - key: open_run_ledger
        name: 开账本
        order: 6
        reads:
          - Account.profile
          - Device.serial
        writes:
          - Run.run_tag
          - Run.profile
          - Run.serial
        check: ledger init 成功且 preflight 工件通过闭集键校验；四项指标取 harvest-cron
          真实预检结果（DEVICE_VERIFIED/ACCOUNT_VERIFIED/CALL_STATE_IDLE/LOCK_ACQUIRED，读不到即
          0）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            preflight.open_run_ledger（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            stage: preflight
            field: status
            equals: completed
            expect:
              op: ==
              value: 1
    commander:
