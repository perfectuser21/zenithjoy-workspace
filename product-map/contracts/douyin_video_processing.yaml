  - key: qualification
    name: 判定视频
    promise: 对已认领视频取得可复核的内容证据，按该公司原政策交出有理由的资格结论
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_processing
      activity_key: qualification
      owner_labeled: false
      current_skill_verified: false
    order: 3
    version: 3.4.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 视频判定员
    inputs:
      - type: Video
        source: 本轮从 zenithjoy.leadgen_videos 认领的待判定视频
        cardinality: many
        fields:
          - line_key
          - video_id
          - video_url
          - title
          - comment_count
          - judgment_status
      - type: Device
        source: 采集预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
    outputs:
      - type: Video
        destination: zenithjoy.leadgen_videos，合格视频交给采集评论 Activity
        cardinality: many
        effect: update
        fields:
          - judgment_status
          - judgment_reason
          - transcript
    preconditions:
      - SDK≥33使用playback_dup；SDK31仅使用精确SHA固定的已验output_pcm_sdk31运行时，缺原件或SDK32保持pending
      - 从PG认领pending视频，租约绑定本run
      - 深链打开后current-video-link读到的实际video_id必须等于认领ID，不能认控制器回显的期望ID
    postconditions:
      - probe: qual_none_pending
        asserts: 本批已认领视频中 judgment_status 仍为 pending 的 PG 独立读回条数为 0
      - probe: qual_reason_present
        asserts: 本批已有资格结论的视频在 PG 中的 judgment_reason 全部非空
      - probe: qualification_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      primary_kind: code
      location: phone
      via: leadgen-workflow.mjs → qualification独立活动 → 持久化队列读回
    budget:
      max_duration_s: 1800
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: record_budget_s_per_video
          value: 10-105（(时长+2)/3+5）
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: skip
    failure:
      empty_ok:
        - 本批无 pending 视频
      retryable:
        - 转写调用失败留 pending 下轮重判（judge-video.js 转写 catch）
        - 判定 API 故障（OpenRouter 402/429/网络）留 pending，judgment_reason
          记「判定异常(待重判)」（judge-video.js markVideoJudgeError）
        - 录音死寂（harvest-keyword.sh 电平打点）
      needs_human:
        cases:
          - 整批转写/判定失败（DashScope/OpenRouter 鉴权或欠费）
        alert:
          channel: bark
          object: judge-video.js 整批失败 → Bark
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
        description: 写 judgment_status/judgment_reason/transcript
    invokers:
      - code
      - agent
    runtime:
