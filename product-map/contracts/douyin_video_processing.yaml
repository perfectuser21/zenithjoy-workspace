    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 评论图标兜底定位（douyin-phone-adb:2076）
    steps:
      - key: open_comment_section
        name: 开评论区
        order: 1
        reads:
          - Video.video_url
          - Video.judgment_status
        writes: []
        check: 本run逐VID有评论时必须原生评论header和输入面板，旧n条评论与新exact评论n均可见；
          仅已证零评论可用本run同VID的精确零占位before原XML及identity原件哈希证明替代该VID面板，未知/缺按钮不算零；实际VID仍须qv新鲜nonce与identity sidecar核验，可选历史不替代核验
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.open_comment_section（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-v*-collection-comments-panel.xml"
            zero_comment_alternative: verified_video_ui_v1
            match: '(?=[\s\S]*<node(?=[^>]*\bresource-id="com\.ss\.android\.ugc\.aweme:id/(?:ety|e19|eyi)")(?=[^>]*\bclass="android\.widget\.EditText")(?=[^>]*\bpackage="com\.ss\.android\.ugc\.aweme")[^>]*>)(?:<node(?=[^>]*\btext="[0-9万.]+条评论")(?=[^>]*\bresource-id="com\.ss\.android\.ugc\.aweme:id/title")(?=[^>]*\bclass="android\.widget\.TextView")(?=[^>]*\bpackage="com\.ss\.android\.ugc\.aweme")[^>]*>|<node(?=[^>]*\btext="评论
              [0-9万.]+")(?=[^>]*\bresource-id="com\.ss\.android\.ugc\.aweme:id/ez-")(?=[^>]*\bclass="android\.widget\.TextView")(?=[^>]*\bpackage="com\.ss\.android\.ugc\.aweme")[^>]*>)'
            expect:
              op: ">="
              ref: metrics.videos_processed
      - key: collect_comments
        name: 采集评论
        order: 2
        reads:
          - Video.video_id
          - Account.nickname
          - HistoricalComment.status
          - HistoricalComment.video_id
          - HistoricalComment.douyin_id
          - HistoricalComment.body
        writes:
          - Comment.body
          - Comment.nickname
          - Comment.video_id
          - Comment.dedup_key
          - Comment.harvest_batch
          - Comment.line_key
        check: 逐屏整行去重，连续 2
          屏无新增即停；过滤作者本人与自有账号；可选冻结采样配额1..50对所有tiers计已核历史加新distinct，达配额单独sampled且非全采；未设置时历史加新distinct已核覆盖累计large上限50，medium仍全采，历史命中按本屏新distinct观察记进展，unknown不跳过；仅本run同VID的精确零占位before原XML和identity原件hash证明齐全时，可替代该VID逐屏原件；零结果不计采得评论或配额
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.collect_comments（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}*-screen*-comments.xml"
            zero_comment_alternative: verified_video_ui_v1
            expect:
              op: ">="
              ref: metrics.videos_processed
      - key: verify_commenter_identity
        name: 评论人身份验证
        order: 3
        reads:
          - Comment.nickname
        writes:
          - Comment.douyin_id
        check: 主页强校验：抖音号合法 + 账号三态 + 非自有账号；验证失败抢救(back+重开评论区)后核对 current-video-link
          仍是本视频，漂移即本视频剩余评论作废(0929修，见下
          known_gaps)；历史匹配也必须新鲜actualOID逐字核验及严格评论面板返回，profile和returned原工件hash独立关联
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.verify_commenter_identity（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}*-person*-profile.xml"
            match: 抖音号：
            expect:
              op: ">="
              ref: metrics.comments_collected
      - key: resolve_profile_link
        name: 客户主页直链
        order: 4
        reads:
          - Comment.douyin_id
        writes:
          - Comment.profile_url
        check: 分享名片 →
          sec_uid，剪贴板守卫回读；失败重试3次(同commenter-identity套路)，3次仍失败才降级为线索保留但链接为空；仅可信同VID+actualOID+完整body历史经新鲜验证后免重复card，独立PG消费证据必须成立
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.resolve_profile_link（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: tsv
            regex: ^LEAD\t([^\t]*\t){7}{word}\t[^\t]*\t\t
            expect:
              op: <=
              value: 0
      - key: mark_video_collected
        name: 标记视频已采
        order: 5
        reads:
          - Video.video_id
          - HistoricalComment.coverage
        writes:
          - Video.process_status
          - Video.comment_count
        check: process_status=评论已采
          只写给matched且原默认完整采集或新鲜footer视频；采样quota_reached走collect_partial不写全采状态，fulfilled_sample_video_ids仅本run已核目标，不全局排除；评论提交事务重验历史PGid/OID/fullbody/视频归属，comment_count只写本次distinct已核历史加新覆盖，历史4条加新0条写4，不把未核旧UI总数当历史覆盖
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.mark_video_collected（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch =
              '$RUN_TAG' AND process_status = '评论已采'
            expect:
              op: ">="
              ref: metrics.videos_collected
      - key: return_to_results
        name: 归位回结果页
        order: 6
        reads:
          - Video.video_url
        writes: []
        check: 新0102保留身份错位兜底率质量代理。rescan_rate/identity_rescan_rate仅为真实身份失败重定位调用数除以合格视频数，
          正常空头像恢复另如实计avatar_recovery_count，不计为身份错位；原0.3阈值不变。此代理不构成搜索结果页实际归位证据。
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.return_to_results（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.rescan_rate
            expect:
              op: <=
              value: 0.3
      - key: push_raw_comments
        name: 评论落池
        order: 7
        reads:
          - Comment.dedup_key
          - Run.run_tag
          - HistoricalComment.history_sha256
        writes:
          - Comment.harvest_batch
          - Comment.dedup_key
          - Comment.line_key
          - Comment.recipient_evidence
        check: 评论池「运行批次」计数 ≥ leads_written（= push-raw-comments.js 本批实际落池数
          PUSH_COMMENTS_STATS.created，不含被历史全池去重掉的）；0929修：同push_videos，全军覆没时 exit
          1；保本次LEAD观察comments_collected及原PG门槛，新增comments_inserted/history_verified/coverage分列，历史不输出新LEAD或迁旧batch；可选recipient原件严格绑定line/run/source_run/profile/VID/UID/全文SHA、私有文件真实RUN_DIR和hash，异常拒绝
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            collection.push_raw_comments（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_comments WHERE harvest_batch =
              '$RUN_TAG'
            expect:
              op: ">="
              ref: metrics.comments_collected
    known_gaps:
      - gap: coll_video_binding_consistent
          只能核对孤儿归属（评论来源视频必须是本批落过库的视频），抓不住漂移到同批另一条真实视频的语义错配；行内防线是
