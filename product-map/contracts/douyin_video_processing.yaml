  - key: qualification
    name: 判定视频
    promise: 对已认领视频取得可复核的内容证据，按该公司原政策交出有理由的资格结论
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_processing
      activity_key: qualification
      owner_labeled: false
      current_skill_verified: false
    order: 3
    version: 3.6.2
    required_host_tools: ["phone", "business", "fetch-native", "proof", "qualify-prepare", "qualify-submit"]
    delivery: *activity_handoff
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 视频判定员
    inputs:
      - type: Video
        source: 本轮从 zenithjoy.leadgen_videos 认领的待判定视频
        cardinality: many
        fields:
          - line_key
          - video_id
          - video_url
          - title
          - comment_count
          - judgment_status
      - type: Device
        source: 采集预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
    outputs:
      - type: Video
        destination: zenithjoy.leadgen_videos，合格视频交给采集评论 Activity
        cardinality: many
        effect: update
        fields:
          - judgment_status
          - judgment_reason
          - transcript
    preconditions:
      - 开工证据按以下清单各取一次、跨条款复用。brain.get 参数 resource=task，args.fields 只取 id、result.foundation_runner.run.run_id、result.foundation_runner.run.input.business.scope.qualification_input，核本次 VID、捕获覆盖与次数。设备与锁使用 native.read，fields 取 preflight、local_lock、account、operations，及 brain.get resource=device_lock 。一次 host.receipts 定位本轮预检原始回执，选择 activity=preflight、kind=phone、operation=account-current、state=terminal、exit_code=0 的唯一记录。按其返回的 path 用 read_file 读取原件，核 binding.identity 的 run_id、task_id 与本轮一致、binding.args 首项为 account-current、result.exit_code 为 0，result.stdout 的 douyin_id= 行与冻结执行账号一致。使用操作和原件身份核对，名称由工具回执给出。原生 account 只是辅助快照，stderr 是设备日志。捕获计划只用于开始，实际原生身份、捕获路径与覆盖证据由本 Activity 执行后验收。
      - pg.rows 参数 relation=videos，args.fields 取 connection.snapshot_at、rows.line_key、rows.video_id、rows.video_url、rows.title、rows.comment_count、rows.updated_at、rows.process_status、rows.harvest_batch、rows.judgment_status。用该快照的 connection.snapshot_at 减目标行 updated_at 按 15 分钟普通认领有效期核租约，状态和批次属于本 run。复用本次 host.receipts 定位并读本轮判重原生 current-video-link 和认领回执，核相同 VID 和规范链接。取完这些事实即给出判定，每份证据原件只读一次，缺失项报 unknown。
      - pg.rows 参数 relation=policy，args.fields 取 rows.company_id、rows.tenant_id、rows.version、rows.run_id、rows.snapshot.policy_id。核本 run 冻结的公司、租户和版本，复用已取视频状态；仅 matched 缓存候选才需要核原判据材料。
    postconditions:
      - probe: qual_none_pending
        asserts: 每个交给collection的VID必须有合法matched判断及真实读回；技术捕获/ASR失败为unknown而非内容rejected。真实no_speech单独记录，冻结政策未明确替代处理时不自动作内容拒绝，未确认不得交下游。 先取目标行读回与本轮主判；本条的覆盖部分复用下一条验证的同一回执。 复用下面逐项核对的原始证据，避免重复调用。
      - probe: qual_reason_present
        asserts: 新判断绑定本次原生VID、实际授权捕获路径、真实内容覆盖、有效音频、ASR响应、公司政策与唯一主判原件；不以期望VID回显、墙钟时长或标题代替实际证据。缓存绑定同公司和租户的原judgment run及原媒体/ASR/政策证据，并有本轮原生VID身份；未核实不得复用，保持原判断run且不重复评分。新判断以同一资格 Activity Agent 的原准备和提交为唯一主判原件。核对宿主记录的 task/run/action/attempt、原冻结政策、原转写逐字引文、原画面帧标签、dossier 摘要、准备和提交摘要与持久结论、理由、转写均同源。使用实际提交回执和独立 PG 读回；历史缓存仍按原方法对应的真实 Judge 或 Agent 原件验收。Checker 在验收观察里依据实际画面、真实转写和本轮政策说明证据如何支持结论。读取 pg.rows relation=policy 时，args.fields 仅用 rows.company_id、rows.tenant_id、rows.version、rows.run_id、rows.snapshot.policy_id、rows.snapshot.runtime_config.video_judgment；已取字段在本次验收复用。批量读取限额时单独读取所需小回执；用 media.inspect 核媒体和 sha256，不把大型媒体、逐字时间轴或完整策略快照塞进批量响应。核对每条引用标签的可见文字；字幕遮挡时仅确认的内容可采信，并按交付中的同轮精确帧和 PTS 核对。证据不足或与结论明显冲突报未决，不补写来源理由，不重新调用主判。 首先用 read_file 读 receipts/coverage-five-frames.jpg（工具返回图像）和 receipts/coverage-five-frames.json。观察并在证据中写出 A 的播放器显示，循环时 B 和 E 的可见画面文字是否相同，C 和 D 的画面如何不同；结合 JSON 每个原帧 PTS 验证 A 归零、B 开头、C 中间、D 末尾、E 同一视频回到开头之间是连续完整周期；未循环时检查 E 的真实播放完成证据。由 media.inspect（只传 JSON recording.name 给 args.name）核原录像 sha256 和音视频流，图像回执 sha256 核 JSON sheet_sha256。核本轮授权捕获路径须读 receipts/qual-record-start.json、receipts/qual-record-stop.json 和 receipts/qual-extract-audio.json 的原始回执。从录制启动回执 stdout 取 capture_runtime_evidence_file 的 basename 和 sha256，读 native/加该 basename 的原运行 JSON 并核对 SHA。结合 capture_audio_sdk、原生录制客户端/服务端、UID及媒体引用，核本轮实际授权捕获路径；原生VID、主判、ASR继续沿当轮原件核对。缓存专属历史读取仅用于缓存。以证据本身作判，不能只用片长、预测值或匹配判定替代完整周期。 唯一 proof 在本轮唯一 qualify 调用前成功终态提交；比对两者时间及本轮原件绑定，模型响应和落库读回从各自真实操作取得，不要求这些后生成的回执提前出现在 proof。 proof 中 qualification_evidence.visual_observations 的 1～3 个 label/text 必须能逐项指回五帧 JSON 中同标号、实际 PTS 和同摘要原帧，回看每项文字或事实描述是否真实；再核唯一主判 journal 的 scope.visual_evidence_sha256 与 visual_evidence.sha256 及其原件引用一致，原始转写列仍为ASR原文字段。主判输入同时使用这个画面证据和原转写，背景歌词或标题不能代表实际画面内容。文件名从本轮已提交的 proof 操作回执取真实路径。调用 host.receipts 定位本轮 qualification 的 kind=proof 成功回执，用 read_file 读取该回执，从 binding.args 中的 qualification_evidence.video_identity、record_start、record_stop、capture_runtime、sdk、audio_start、audio_end、coverage_json、coverage_image、recording、audio 逐项获取原件。另从同一 host.receipts 列表定位本 VID 资格准备和提交的正式原回执，按 activity=qualification、kind=qualify-prepare 或 qualify-submit、operation=当前VID、state=terminal、exit_code=0 筛选，读取返回的真实 path。提交必须引用经宿主绑定的准备回执及实际提交和同一执行轮次。历史 Judge 证据只适用于有原始记录的缓存。ASR 原响应先用 qualification.origin，args 为 video_id=当前VID、document=asr-response.json，fields 取 origin.run_id、origin.video_id、document.sha256、document.data.http_status、document.data.provider_received、document.data.body.output.text。核实响应状态、转写与原件摘要，复用此结果，成功时不用整份含逐字时间轴的响应。核每个原件 Task/run、真实成功状态和摘要；若引用是本 run 根下的绝对路径，向 read_file 传本运行证据根下的相对路径。用 media.inspect 只传 recording/audio 的文件名，通过本轮原件核音视频时长与轨数；用五帧图和 JSON 的实际 PTS 对照合同其余要求。 幂等证据与本条复用。以 brain.get resource=task 的 result.foundation_runner.run.input.business.scope.video_ids、本轮成功主判 journal 及 host.receipts 中本轮同 VID 的操作数量核对。只有真实重复输入出现时核对跳过；单个唯一键从当前执行记录确认只有一次 ASR 和一次主判，无须实际制造重复输入。 如果合成图可读性不足，按刚读过的五帧 JSON 中 panels[].frame 的相对路径，用 read_file 查看所需原始单帧。优先核 A 的播放器时钟和 B/E 的相同内容；只在图像实际可读后判断视觉覆盖，仍用对应原帧 PTS 核对。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-102-qualification/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 1800
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: capture_budget
          value: 以本run冻结单次capture上限及绝对deadline为界，按真实内容覆盖验收，不按旧倍速公式推定
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: skip
    failure:
      empty_ok:
        - 本批无 pending 视频
        - 本轮已认领目标逐一具备真实持久读回和原始证据，全部按冻结政策判为 rejected 时，保留逐项真实结果。Checker 在 qualification/end 全部条款通过后必须以 empty 交付并保留 Video 证据，进入 cleanup；有 matched 则正常推进，存在 unknown 或其它未决项不能判 empty。
      retryable:
        - 录音或转写证据不完整时保留真实回执与 pending，仅沿原动作恢复可确认的步骤。
        - 提交材料不符合契约时按 Checker 原因补交；提交结果不明时按原动作读回并保留 pending。
      needs_human:
        cases:
          - 本次录音转写、契约材料或提交回执经允许的恢复仍无法确认。
        alert:
          channel: bark
          object: 沿资格 Activity 回执向 Commander 升级真实失败原因。
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
