          readback:
            type: none
      - key: mark_video_collected
        name: 标记视频已采
        order: 5
        reads:
          - Video.video_id
          - HistoricalComment.coverage
        writes:
          - Video.process_status
          - Video.comment_count
        check: 仅真实footer/穷尽且评论事务已提交时标评论已采；采样或未达目标保partial和实际停止原因。
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.mark_video_collected（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/4及原始证据验收。
          readback:
            type: none
      - key: return_to_results
        name: 归位回结果页
        order: 6
        reads:
          - Video.video_url
        writes: []
        check: 新0102保留身份错位兜底率质量代理。rescan_rate/identity_rescan_rate仅为真实身份失败重定位调用数除以合格视频数， 正常空头像恢复另如实计avatar_recovery_count，不计为身份错位；原0.3阈值不变。此代理不构成搜索结果页实际归位证据。
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.return_to_results（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
