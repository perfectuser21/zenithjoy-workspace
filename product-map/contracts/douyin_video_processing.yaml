        order: 4
        reads:
          - Comment.douyin_id
        writes:
          - Comment.profile_url
        check: 取得当前评论人的真实主页URL并绑定完整recipientEvidence；新评论无需预先已有comment_id。
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh collection.resolve_profile_link（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
