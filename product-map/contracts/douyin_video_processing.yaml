capability: keyword_acquisition
contract_key: douyin_video_processing
commander_skill:
  name: wf-douyin_video_processing
  version: 0.12.25
name: 抖音视频处理
workflow: douyin-video-processing
brain_workflow_key: douyin_video_processing
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-processing.yaml
dod_promotion:
  min_consecutive_pass: 20
on_status:
  done: next
  retry: retry
  failed: stop
  empty: next
  partial: stop
  needs_review: pause
always_run: [ cleanup ]
recovery:
  total_timeout_sec: 10020
  cleanup_timeout_sec: 120
trigger_inputs:
  - Video
  - Account
  - Device
  - HistoricalComment
  - CommentSampleRequest
inputs:
  - type: CommentSampleRequest
    cardinality: one
    optional: true
    fields: [ run_tag, source_run, profile, serial, line, comment_limit, collection_budget_s ]
  - type: HistoricalComment
    cardinality: many
    optional: true
    fields: [ id, line_key, run_tag, source_run, video_id, video_url, schema_version, status, douyin_id, body, history_sha256, coverage ]
activities:
  - key: preflight
    name: 预检
    promise: 核验采集设备及抖音账号，取得本轮设备锁和可追溯的运行上下文
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_discovery
        - douyin_video_processing
      activity_key: preflight
      owner_labeled: false
      current_skill_verified: false
    order: 1
    version: 2.6.3
    required_host_tools: ["phone", "brain", "business", "native-readback"]
    delivery:
      schema:
        type: object
        additionalProperties: false
        required: [outputs, evidence]
        properties:
          outputs: { type: object }
          evidence:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              minProperties: 1
              additionalProperties: { type: string, minLength: 1 }
      report:
        files:
          company:
            scope: identity
            role: company
            fields:
              - /result/stdout/result/company_id
              - /result/stdout/result/tenant_id
              - /result/stdout/result/version
              - /result/stdout/result/run_id
              - /result/stdout/result/device_binding
          frozen:
            scope: identity
            role: frozen
            fields:
              - /profile
              - /serial
              - /adb_serial
              - /expected_sender_id
              - /company_id
              - /tenant_id
          account:
            scope: handoff
            role: account
          local:
            scope: handoff
            role: local_acquire
          central_acquire:
            scope: handoff
            role: central_acquire
        facts:
          native:
            operation: native.read
            args:
              fields:
                - preflight
                - local_lock
                - account
          central:
            operation: brain.get
            args:
              resource: device_lock
          identity:
            operation: run.identity
            args: {}
          task:
            operation: brain.get
            args:
              resource: task
              fields:
                - id
                - status
                - result.foundation_runner.run_id
                - result.foundation_runner.task_id
          progress:
            operation: run.progress
            args:
              fields:
                - activity_calls
                - attempts
                - identity
        criteria:
          outputs_0:
            - native
            - local
          outputs_1:
            - account
            - company
          outputs_2:
            - frozen
            - identity
            - native
          postconditions_0:
            - frozen
            - native
          postconditions_1:
            - account
            - company
            - identity
            - frozen
          postconditions_2:
            - native
          postconditions_3:
            - central_acquire
            - local
            - central
            - native
          idempotency:
            - identity
            - progress
          failure:
            - task
            - company
            - native
            - central
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        source: 设备台账及原生 ADB 在线核验
        cardinality: one
        fields:
          - serial
          - host
      - type: Account
        source: 本轮冻结的公司已启用账号配置；预检执行时取手机原生账号，结束时比对
        cardinality: one
        fields:
          - platform
          - profile
          - sender_id
    outputs:
      - type: Device
        destination: 本轮设备锁和运行上下文
        cardinality: one
        effect: update
        fields:
          - online
          - call_state
          - lock_holder
      - type: Account
        destination: 本轮已核账号上下文
        cardinality: one
        effect: update
        fields:
          - logged_in
      - type: Run
        destination: 底座已分配并持久化的同一Run身份，供后续Activity交接
        cardinality: one
        effect: update
        fields:
          - run_tag
          - profile
          - serial
    preconditions:
      - run.identity 读回底座已经持久化的本轮Task/run，须与 checker-input/identity.json 的原任务和原Run一致。本活动交同一身份，不另建业务Run。冻结的预期账号与配置摘要由 identity.json 提供，同时核公司登记的启用账号；不读取包含凭据的完整宿主配置。
      - 读取 checker-input/identity.json 与 Brain 本轮 Task 核对 Task/run、公司、租户、业务线、设备和配置中预期账号；不要求已有本次原生账号工件，缺冻结身份不凭历史实例补造。
      - 读取 checker-input/identity.json 的冻结配置摘要、Brain 正式派单和原绝对 deadline，开始时必须还在截止内。此时无需证明 Agent 已执行；底座负责禁止超时运行，旧定时器时段和 KPI 不参与准入。
    postconditions:
      - probe: pf_device_verified
        asserts: 设备原生在线，硬件身份与受控ADB路由和本次设备绑定一致。
      - probe: pf_account_verified
        asserts: 手机原生登录账号与本次注册账号及公司/租户绑定一致，读取本run冻结政策版本，不借旧快照替代。
      - probe: pf_call_idle
        asserts: 当前手机不在通话中，未知状态不得等同idle。
      - probe: pf_lock_acquired
        asserts: 本轮执行者实际持有同一设备的本地锁和中央租约。先用 host.receipts 定位并读取本轮本地与中央锁的宿主工具取得回执，确认真实调用成功且绑定同一 Task/run/设备。再用 native.read 核对同一 profile、硬件 serial、实际本地 owner、锁有效且不陈旧，用 brain.get(device_lock) 核对同一硬件 serial、Task owner、租约版本及有效期。宿主取得回执和两路独立状态满足上述条件即可；手机网关回执正文中的绝对路径是来源信息，不是本 run 下的 native/ 文件，不用改写路径或补造附件。缺任一取得回执或独立状态、身份不符或锁已过期则不得通过。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-102-preflight/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 600
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: skip
    failure:
      empty_ok: []
      retryable:
        - lock_busy 设备锁被占
      needs_human:
        cases:
          - device_offline 设备离线
          - account_mismatch 手机登录号不符
          - call_busy 设备通话中（未挂断的电话）
        alert:
          channel: bark
          object: harvest-cron.sh:121-125 离线升级分身 → Bark
      fatal:
        - 冻结Task、Run和真实归属存在身份冲突；同一身份恢复只读回已有动作和结果
    side_effects: []
    invokers:
      - code
