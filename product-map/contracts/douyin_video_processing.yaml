  - key: collection
    name: 采集评论
    promise: 从合格视频采集并持久化身份可验证的评论，更新视频处理状态
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_processing
      activity_key: collection
      owner_labeled: false
      current_skill_verified: false
    order: 4
    version: 2.8.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: CommentSampleRequest
        source: 本次任务冻结的采样请求
        cardinality: one
        optional: true
        fields: [ run_tag, source_run, profile, serial, line, comment_limit, collection_budget_s ]
      - type: Video
        source: 本轮资格判定通过的视频及原生身份读回
        cardinality: many
        fields:
          - line_key
          - video_id
          - video_url
          - judgment_status
      - type: Device
        source: 采集预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Account
        source: 本轮原生核验的抖音账号
        cardinality: one
        fields:
          - sender_id
          - nickname
      - type: Run
        source: 本次冻结运行定义
        cardinality: one
        fields:
          - run_tag
      - type: HistoricalComment
        source: 该公司原 PostgreSQL 评论历史及覆盖记录
        cardinality: many
        optional: true
        fields:
          - id
          - line_key
          - run_tag
          - source_run
          - video_id
          - video_url
          - schema_version
          - status
          - douyin_id
          - body
          - history_sha256
          - coverage
    outputs:
      - type: Comment
        destination: zenithjoy.leadgen_comments，供评论评分 Workflow 消费
        cardinality: many
        effect: create
        fields:
          - line_key
          - dedup_key
          - nickname
          - douyin_id
          - profile_url
          - body
          - video_id
          - harvest_batch
          - recipient_evidence
      - type: Video
        destination: zenithjoy.leadgen_videos 的处理状态
        cardinality: many
        effect: update
        fields:
          - process_status
    preconditions:
      - 仅消费合法matched及本run处理租约；合法同政策缓存保留原judgment run和证据，不强改成本run；本次原生VID和来源另行核实。
      - 本run profile/serial/公司/租户/账号来自首个设备动作前冻结的真实输入，收件人证据不能自报授权。
      - 最高限额、目标配额与实际已提交数分别记录；显式目标及预算来自冻结输入，不自增上限或延长原deadline。
      - 评论身份、完整正文、真实profileUrl和recipientEvidence绑定当前VID/UID及现场返回评论页证据；可选profileLinkEvidence不是新评论必须已有PG ID的恢复凭据。
      - 历史去重只读原PG事实并核完整身份与本次来源；只有完整正文与新鲜原生身份一致才能免重复取链，未知不得冒历史命中。
      - 确切已提交评论可以committed_partial交103；不能因整个102未成功而隐瞒已提交事实，也不能把partial冒全部完成。
    postconditions:
      - probe: coll_only_matched
        asserts: 交付评论仅来自合法matched视频；合法缓存的原判断run及政策/原证据保持，不能改历史run以通过。
      - probe: coll_video_binding_consistent
        asserts: 每条实际评论的VID、原生UID、完整正文、主页URL与原来源一致，PG逐行读回无身份错配。
      - probe: coll_rescan_rate
        asserts: 真实身份错位后的重定位次数与实际合格视频数有原始记录，其比率不超过原0.3上限；无合格视频时说明不适用依据，不能编计数。
      - probe: comments_readback
        asserts: PG逐精确ID读取实际新提交评论及其完整recipientEvidence，与本次原生证据/主页URL相符；执行提案、计数或工具exit0不能替代持久行。 按当前原生作者UID及冻结自有账号清单过滤作者本人和自有账号，不用昵称猜测；已提交集合不得含被排除对象。
      - probe: sampling_readback_verified
        asserts: 本次最高限额、目标配额、实际distinct数、真实footer/no_comments及stop_reason分别有证据。未达目标的已提交成果为partial，不报全部完成；视频只有真实穷尽才能评论已采，明确采样不伪称穷尽。
      - probe: history_scope_verified
