        purpose: 文案×目标人群主判（judge-jev.js:16）
      - provider: openrouter
        model: google/gemini-2.5-flash
        purpose: 低置信（<0.6）复核（judge-jev.js:17-18）
    steps:
      - key: cheap_gate
        name: 便宜闸
        order: 1
        reads:
          - Video.comment_count
        writes:
          - Video.judgment_status
        check: 实际current-video-link回读content_type=video且video_id与认领ID完全一致，图文或空身份在录音前排除；零评论以开评论区真实结果处理
        implementation:
          status: implemented
          ref: queued-video-lib.sh qv_verify_video：原始控制器输出与期望/实际ID写入独立工件，失败覆盖旧成功
        uses_llm: false
        dod:
          mode: hard
          readback:
            type: evidence
            glob: "{tag}-identity-*.json"
            match: '"verified"\s*:\s*true[\s\S]*"content_type"\s*:\s*"video"'
            expect:
              op: ">="
              ref: metrics.videos_verified
      - key: unmute_before_record
        name: 录前取消静音
        order: 2
        reads:
          - Video.video_url
          - Device.lock_holder
        writes: []
        check: 本run逐VID实际record-start媒体音量回读为正整数；未知或零不得通过，音轨静音不能替代媒体音量证据
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            qualification.unmute_before_record（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.media_volume_failures
            expect:
              op: <=
              value: 0
      - key: record_triple_speed
        name: 采集口播音频
        order: 3
        reads:
          - Video.video_url
        writes: []
        check: 真实媒体时长 ≥ 预算的 80%；SDK31须唯一pcm_s16le音轨、无视频轨及首末固定运行时原件，SDK≥33保留原录屏音轨约束
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            qualification.record_triple_speed（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: audio_rejected reason=short_or_unknown_duration
            expect:
              op: <=
              value: 0
      - key: extract_audio
        name: 提取16k音频
        order: 4
        reads:
          - Video.video_id
        writes: []
        check: 送ASR的本轮音频必须有16kHz音轨且电平非死寂；实际静音仅允许本run租约PG拒绝与独立读回，不得标题或旧转写兜底matched
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            qualification.extract_audio（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.recording_outcomes_failures
            expect:
              op: <=
              value: 0
      - key: transcribe
        name: 通义ASR转写
        order: 5
        reads:
          - Video.video_id
        writes:
          - Video.transcript
        check: 可用本轮音轨正常转写；空/静音 → rejected。静音在ASR前用本轮录音核验拒绝事实终结，保旧transcript但不冒充本轮ASR完成
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            qualification.transcribe（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch =
              '$RUN_TAG' AND judgment_status <> 'pending' AND
              coalesce(transcript, '') = '' AND coalesce(judgment_reason, '')
              NOT LIKE '转写为空%' AND coalesce(judgment_reason, '') NOT LIKE
              'V2便宜闸%' AND coalesce(judgment_reason, '') NOT LIKE
              '本轮录音核验拒绝:静音音轨%'
            expect:
              op: <=
              value: 0
      - key: judge_content
        name: 意向判定
        order: 6
        reads:
          - Video.transcript
          - Video.title
        writes:
          - Video.judgment_status
          - Video.judgment_reason
        check: judgment_status ∈ {matched, rejected} 且 judgment_reason 非空
        implementation:
          status: implemented
          ref: process-queued-video.sh + queued-video-lib.sh
            qualification.judge_content（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch =
              '$RUN_TAG' AND judgment_status <> 'pending' AND
              coalesce(judgment_reason, '') = ''
            expect:
              op: <=
              value: 0
