# 四流程独立契约：同一智能获客能力，每活动Commander，PG交接。
version: 1
capability: keyword_acquisition
contract_key: douyin_comment_scoring
commander_skill:
  name: wf-douyin_comment_scoring
  version: 0.2.2
name: 抖音评论评分
workflow: douyin-comment-scoring
brain_workflow_key: douyin_comment_scoring
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-comment-scoring.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: pending_comments
trigger_inputs:
  - Comment
  - Video
known_gaps: []
activities:
  - key: scoring
    name: 评分
    order: 1
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 评论分拣员
    inputs:
      - type: Comment
        cardinality: many
        fields:
          - dedup_key
          - body
          - nickname
          - douyin_id
          - profile_url
          - process_status
      - type: Video
        cardinality: many
        fields:
          - title
          - transcript
    outputs:
      - type: Comment
        cardinality: many
        effect: update
        fields:
          - process_status
          - relevance
          - intent_grade
          - promoted
    preconditions:
      - 从PG认领待分拣评论，带关联视频标题与转写
      - 模型不可达或结果非法留待重判，不伪造C级成功
    postconditions:
      - probe: scores_readback
        asserts: 认领ID在PG独立读回，评论完成必须以线索已落实为前提
      - probe: scoring_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      location: mmv
      via: leadgen-workflow.mjs → scoring独立活动 → 持久化队列读回
    budget:
      max_duration_s: 1800
      heartbeat_s: 120
    resources:
      locks: []
      limits: []
    idempotency:
      dedupe_key: Lead.line_key+Lead.douyin_id
      on_duplicate: merge
    failure:
      empty_ok:
        - 本批无待分拣评论
      retryable:
        - 判定异常/搬运失败留待分拣，下轮重试（sort-comments.js:72-77,94-97）
      needs_human:
        cases:
          - 整批判定失败（模型鉴权/额度）
        alert:
          channel: bark
          object: sort-comments 整批失败 → Bark
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_comments
        description: 保存真实relevance与intent_grade，尚未落实线索前不推进完成状态
    invokers:
      - code
      - agent
    runtime:
      phase: batch_end
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE
        RUN_TAG（队列持久化交接，每活动Commander前后核验）
