    model:
      - provider: openrouter
        model: google/gemini-2.5-flash
        purpose: 评论单次结构化评分及原文依据（judgeCommentOnce）
    steps:
      - key: scan_pending
        name: 扫池取待分拣
        order: 1
        reads:
          - Comment.process_status
          - Comment.dedup_key
        writes: []
        check: 按冻结精确ID及真实来源读取待处理行；已有评分或未知动作只读恢复，不重新评分。
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js scoring.scan_pending（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
      - key: judge_grade
        name: 模型三合一判级
        order: 2
        reads:
          - Comment.body
          - Video.transcript
          - Video.title
        writes:
          - Comment.relevance
          - Comment.intent_grade
          - Comment.process_status
          - Comment.judgment_reason
          - Comment.judgment_config
        check: 单次有效评分保存A/B/C/不相关及原文依据，后续不增加模型复核；模型或引用无效则不写分、不误排除
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js scoring.judge_grade（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
    known_gaps:
      - gap: 关键词有效线索数回写（update-keyword-stats）在批次收工后才运行，scoring 是批级的，批内无法按词判定；改为下一批开头对上一批判定（待做）
        task: 34f69930
      - gap: scoring 工件的 peer、spam 两个闭集键这条链没有对应分类，恒为 0；strong_intent=A 级、weak_intent=B+C 级为当前映射，五档分级落地（决策 b93422c6）后重新定义
        task: 4ca3b584
      - gap: "0929实证: 决策b93422c6的五档分级(A~E)只在触达筛选层落地了(next-outreach-lib.js的GRADE_ORDER/outreachGrades)，评论判级层(judge-comment.js:19 GRADES=[A,B,C,不相关])从未升级到五档——D/E两档在触达筛选里永远筛不出东西，是死档。需要判级层同步升到五档才算真落地，不是两层各干各的"
        task: 4ca3b584
    commander:
      entry: activity-commander.mjs
  - key: mark_leads
    name: 标记人
    promise: 消费已保存的真实评分，核对原生UID和公司来源后交出线索及配送状态；不再次评估评分或受众意向
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_comment_scoring
      activity_key: mark_leads
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 3.10.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 评论分拣员
    inputs:
      - type: Comment
        source: 评分 Activity 处理的已提交评论与收件人原件
        cardinality: many
        fields:
          - dedup_key
          - body
          - nickname
          - douyin_id
          - profile_url
          - process_status
          - recipient_evidence
      - type: Video
        source: 该评论关联视频的标题与转写
        cardinality: many
        fields:
          - title
          - transcript
    outputs:
      - type: Comment
        destination: zenithjoy.leadgen_comments 的最终处理状态
        cardinality: many
        effect: update
        fields:
          - process_status
          - relevance
          - intent_grade
          - promoted
      - type: Lead
        destination: zenithjoy.leadgen_leads，供触达 Workflow 读取
        cardinality: many
        effect: upsert
        fields:
          - line_key
          - douyin_id
          - nickname
          - profile_url
          - intent_grade
          - repeat_hits
          - status
      - type: RecipientQualification
        destination: 该公司原 PostgreSQL 收件人资格记录
        cardinality: many
        effect: upsert
        fields:
          - line_key
          - comment_id
          - status
          - company_id
          - company_version
          - native_profile_sha256
          - reason
          - tenant_id
          - policy_id
      - type: OutreachBridgeIntent
        destination: 该公司原 PostgreSQL 配送意图及真实配送回执
        cardinality: many
        effect: upsert
        fields:
          - line_key
          - comment_id
          - lead_id
          - run_tag
          - source_run
          - qualification_status
          - state
          - payload_sha256
          - fields_sha256
          - feishu_record_id
    preconditions:
      - 普通committed_partial精确ID及原102来源、公司/租户/政策与原生身份完整；来源证明不改变历史harvest_batch，失败整个102不自动否定已独立核验的提交。
      - 消费已有唯一评分及原文/模型响应，不再次调用评分模型；技术失败或评分来源未知不能标记为已处理。
      - 只对政策相关的实际对象创建Lead和配送；不相关合法处理单列，不以空队列冒成功。
      - 收件人资格取真实原生主页及本次冻结公司政策；缺证unknown，不修改原评分来迎合资格。
      - 保原line订单锁/owner与幂等边界，未知或活owner不清理，不按TTL抢占。
    postconditions:
      - probe: pool_advanced
        asserts: 相关对象的Lead实际落地后才推进评论，原UID、评分和同事务outbox逐ID可读；不相关对象不得有Lead/outbox，合法排除单列完成。
      - probe: bridge_readback
        asserts: 实际outbox IDs及comment→lead映射可读；配送confirmed还需真实Feishu GET的原marker/UID/字段与持久payload一致。未知POST仅只读查原动作，绝不重发；bridge_readback按实际outbox ids查询。
    execution:
      primary_kind: agent
      location: mmv
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-103-mark-leads/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 1800
      heartbeat_s: 120
    resources:
      locks: [ outreach-order:<line_key> ]
      limits: []
    idempotency:
      dedupe_key: Lead.line_key+Lead.douyin_id
      on_duplicate: merge
    failure:
      empty_ok:
        - 本批无待分拣评论
      retryable:
        - 判定异常/搬运失败留待分拣，下轮重试（sort-comments.js:72-77,94-97）
      needs_human:
        cases:
          - 已存评分身份或原生来源不完整
        alert:
          channel: bark
          object: sort-comments 整批失败 → Bark
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_leads + leadgen_comments
        description: 按人身份去重保留人，重复出现计数；线索落地后才推进评论已分拣
