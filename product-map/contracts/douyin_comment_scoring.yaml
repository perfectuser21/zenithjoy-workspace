capability: keyword_acquisition
contract_key: douyin_comment_scoring
commander_skill:
  name: wf-douyin_comment_scoring
  version: 0.19.0
name: 抖音评论评分
workflow: douyin-comment-scoring
brain_workflow_key: douyin_comment_scoring
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-comment-scoring.yaml
dod_promotion:
  min_consecutive_pass: 20
on_status:
  done: next
  retry: retry
  failed: stop
  empty: next
  partial: stop
  needs_review: pause
always_run: []
trigger_inputs:
  - Comment
  - Video
activities:
  - key: scoring
    name: 评分
    promise: 按冻结公司政策对每条已提交评论评估一次并保存等级、理由与原文依据；不追加模型复核
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_comment_scoring
      activity_key: scoring
      owner_labeled: false
      current_skill_verified: false
    order: 1
    version: 2.9.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 评论分拣员
    inputs:
      - type: Comment
        source: zenithjoy.leadgen_comments 已提交且待分拣的评论
        cardinality: many
        fields:
          - dedup_key
          - body
          - nickname
          - douyin_id
          - profile_url
          - process_status
      - type: Video
        source: 评论关联的原视频标题与转写
        cardinality: many
        fields:
          - title
          - transcript
    outputs:
      - type: Comment
        destination: zenithjoy.leadgen_comments 的评分或独立排除终态；仅真评分交给标记人 Activity
        cardinality: many
        effect: update
        fields:
          - process_status
          - relevance
          - intent_grade
          - judgment_reason
          - judgment_config
          - promoted
    preconditions:
      - 精确评论ID、公司/租户与实际102来源可独立核验；普通committed_partial来源不要求整个102成功，但仅消费真实已提交且来源/资格/原生身份完整的行。
      - 评分输入包括原评论正文、对应视频标题与转写，来自真实持久来源；缺失不能由标题或猜测补造。
      - 按本次冻结公司政策执行唯一业务评分；已有评分或不确定动作先只读恢复，不重新评分。
      - 模型/HTTP/证据/输出异常保留未决，不伪造C级、不相关或人工评分。
    postconditions:
      - probe: scores_readback
        asserts: 精确ID的真实relevance/intent_grade、原文依据、模型响应及公司版本已持久化并读回；输入视频标题和转写来源可核。一次业务评分后不追加评分模型QC，Checker只读原结果与证据，本活动不创建Lead/outbox。
      - probe: exclusion_readback
        asserts: 不相关保存原政策要求的排除事实且无Lead/outbox，技术失败不写排除；旧行保历史来源，纯排除与空队列分别说明，不冒评分成功。
    execution:
      primary_kind: agent
      location: mmv
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-103-scoring/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 1800
      heartbeat_s: 120
    resources:
      locks: []
      limits: []
    idempotency:
      dedupe_key: Comment.line_key+Comment.id
      on_duplicate: skip
    failure:
      empty_ok:
        - 本批无待分拣评论
      retryable:
        - 模型HTTP/网络、鉴权/额度、证据非法或评分输出无效保留待分拣，后续有界重试；不得转成人工评分或误排除
      needs_human:
        cases: []
        alert:
          channel: bark
          object: 仅记录运行告警，不派人工评分
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_comments
        description: 单次评估后保存真实relevance/intent_grade、理由、模型身份及原文摘要；技术失败保持未决，不由本活动创建线索
    invokers:
      - code
      - agent
    runtime:
      phase: batch_end
      entry: services/phone-adb-controller/leadgen-foundation/worker.mjs
      executor_kind: agent
      protocol: json-stdio-v1
