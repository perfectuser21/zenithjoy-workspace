# 四流程独立契约：同一智能获客能力，每活动Commander，PG交接。
version: 1
capability: keyword_acquisition
contract_key: douyin_comment_scoring
commander_skill:
  name: wf-douyin_comment_scoring
  version: 0.10.1
name: 抖音评论评分
workflow: douyin-comment-scoring
brain_workflow_key: douyin_comment_scoring
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-comment-scoring.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: pending_comments
trigger_inputs:
  - Comment
  - Video
known_gaps:
  - gap: Workflow 的 on_status/always_run 路由尚未在本合同及 Runner 中形成可验证接线；Activity 字段齐全不代表端到端自动编排验收通过。
    task: bdd9fb75
activities:
  - key: scoring
    name: 评分
    promise: 按冻结原政策为已提交评论写出可读回评分；双独立复核一致缺个人意向或受众主题证据时自动排除并留原因
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_comment_scoring
      activity_key: scoring
      owner_labeled: false
      current_skill_verified: false
    order: 1
    version: 2.5.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 评论分拣员
    inputs:
      - type: Comment
        source: zenithjoy.leadgen_comments 已提交且待分拣的评论
        cardinality: many
        fields:
          - dedup_key
          - body
          - nickname
          - douyin_id
          - profile_url
          - process_status
      - type: Video
        source: 评论关联的原视频标题与转写
        cardinality: many
        fields:
          - title
          - transcript
    outputs:
      - type: Comment
        destination: zenithjoy.leadgen_comments 的评分或独立排除终态；仅真评分交给标记人 Activity
        cardinality: many
        effect: update
        fields:
          - process_status
          - relevance
          - intent_grade
          - judgment_reason
          - judgment_config
          - promoted
    preconditions:
      - 从PG认领待分拣评论，带关联视频标题与转写
      - 来源视频须为同102批次、matched且PG状态评论已采；隔离或未完成采集的评论不可领。唯一例外：金诺原102g失败run的VID7699489394579915663及三条固定原生评论，经用户决定、旧执行实时停止、v14冻结政策及无旧outbox核验并留下db_audit接纳回执后，只供回执绑定的单一103 run显式领取；原失败和视频隔离不改
      - 模型不可达、HTTP/网络异常、证据非法或双审不一致留待重试，不伪造C级成功，不转人工评分
    postconditions:
      - probe: scores_readback
        asserts: 认领评论 ID 的 relevance、intent_grade 与两份不同模型回执的政策证据在 PG 独立读回；两审一致后原子提交，任一审失败不得写分；本活动只交评分，完成状态由后续 mark_leads 核资格和配送后决定
      - probe: exclusion_readback
        asserts: 两份不同模型身份均判缺个人意向或受众主题证据且原因一致时，PG原子写已排除及安全双审摘要，relevance/intent_grade清空，原评论与冻结来源哈希、理由及无outbox独立读回；纯排除批次为完成，不以零评分误报partial
      - probe: scoring_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      primary_kind: code
      location: mmv
      via: leadgen-workflow.mjs → scoring独立活动 → 持久化队列读回
    budget:
      max_duration_s: 1800
      heartbeat_s: 120
    resources:
      locks: []
      limits: []
    idempotency:
      dedupe_key: Lead.line_key+Lead.douyin_id
      on_duplicate: merge
    failure:
      empty_ok:
        - 本批无待分拣评论
      retryable:
        - 模型HTTP/网络、鉴权/额度、证据非法或双审不一致保留待分拣，后续有界重试；不得转成人工评分或误排除
      needs_human:
        cases: []
        alert:
          channel: bark
          object: 仅记录运行告警，不派人工评分
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_comments
        description: 双审通过保存真实relevance/intent_grade；双审一致证据缺口则清空旧分并写已排除和安全原因；两者均不由本活动创建线索
    invokers:
      - code
      - agent
    runtime:
      phase: batch_end
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE
        RUN_TAG（队列持久化交接，每活动Commander前后核验）
