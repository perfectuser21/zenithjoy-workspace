    steps:
      - key: upsert_lead
        name: 合格行进线索表
        order: 1
        reads:
          - Comment.douyin_id
          - Comment.nickname
          - Comment.profile_url
          - Comment.intent_grade
          - Comment.recipient_evidence
        writes:
          - Lead.douyin_id
          - Lead.nickname
          - Lead.profile_url
          - Lead.intent_grade
          - Lead.repeat_hits
          - Lead.status
          - Lead.line_key
          - RecipientQualification.status
          - OutreachBridgeIntent.payload_sha256
          - OutreachBridgeIntent.state
        check: 仅待分拣且已保存合法单次评分的相关(A/B/C级)：新建（状态=待触达）或已有行 repeat_hits+1，按抖音号去重；不相关及已排除均不建Lead/outbox，含C级仍留档；真实lead UID读回防昵称别名，独立recipient资格不改grade；同事务保存outbox再推进，正常103消费原Feishu桥
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js mark_leads.upsert_lead（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
      - key: advance_pool
        name: 推进池状态
        order: 2
        reads:
          - Comment.dedup_key
        writes:
          - Comment.process_status
          - Comment.promoted
        check: 线索落地之后才推进 已分拣（永远最后一步）；outbox故障整体回滚，独立PG逐ID回读及bridge处置不通过不得报完成
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js mark_leads.advance_pool（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
