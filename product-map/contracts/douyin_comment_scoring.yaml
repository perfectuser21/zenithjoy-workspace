    model:
      - provider: openrouter
        model: typesafe/jev-1.13
        purpose: 评论 A/B/C/不相关分级（judge-comment.js:16）
      - provider: openrouter
        model: google/gemini-2.5-flash
        purpose: 复核（judge-comment.js:17）
    steps:
      - key: scan_pending
        name: 扫池取待分拣
        order: 1
        reads:
          - Comment.process_status
          - Comment.dedup_key
        writes: []
        check: 取到的行 process_status 全为 待分拣
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js
            scoring.scan_pending（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: "^SORT_STATS "
            expect:
              op: ">="
              value: 1
      - key: judge_grade
        name: 模型三合一判级
        order: 2
        reads:
          - Comment.body
          - Video.transcript
          - Video.title
        writes:
          - Comment.relevance
          - Comment.intent_grade
          - Comment.process_status
          - Comment.judgment_reason
          - Comment.judgment_config
        check: 双审通过才写A/B/C/不相关评分；双独立复核一致缺个人意向或受众主题证据写已排除且清空旧分；模型故障与复核不一致不写分、不排除
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js scoring.judge_grade（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-scoring-readback.json"
            match: '"verified"\s*:\s*true'
            expect:
              op: ">="
              value: 1
