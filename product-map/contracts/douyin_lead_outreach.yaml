dod_promotion:
  min_consecutive_pass: 20
on_status:
  done: next
  retry: retry
  failed: stop
  empty: next
  partial: stop
  needs_review: pause
always_run: [ cleanup ]
trigger_inputs:
  - Lead
  - Account
  - Device
  - RecipientQualification
  - OutreachOrder
  - OutreachScope
activities:
  - key: preflight
    name: 预检
    promise: 核对本轮触达授权、公司账号、设备、原政策及批准话术；本段不领取或创建订单
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_lead_outreach
      activity_key: preflight
      owner_labeled: false
      current_skill_verified: false
    order: 1
    version: 5.3.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        source: 本轮冻结设备台账与授权设备标识；本轮锁在预检执行时取得
        cardinality: one
        fields:
          - serial
          - host
      - type: Account
        source: 该公司已启用的发送账号配置
        cardinality: one
        fields:
          - platform
          - profile
          - sender_id
          - dm_paused
          - daily_cap
    outputs:
      - type: Device
        destination: 本轮触达设备锁及运行上下文
        cardinality: one
        effect: update
        fields:
          - online
          - call_state
          - lock_holder
      - type: Account
        destination: 本轮已核发送账号上下文
        cardinality: one
        effect: update
        fields:
          - logged_in
      - type: Run
        destination: 底座已分配并持久化的同一Run身份，供后续Activity交接
        cardinality: one
        effect: update
        fields:
          - run_tag
          - profile
          - serial
    preconditions:
      - run.identity 读回底座已经持久化的本轮Task/run，须与 checker-input/identity.json 的原任务和原Run一致。本活动交同一身份，不另建业务Run。冻结的预期账号与配置摘要由 identity.json 提供，同时核公司登记的启用账号；不读取包含凭据的完整宿主配置。
      - 从 checker-input/identity.json 的已绑定授权摘要和原单确认本轮公司、发送账号、目标和批准正文摘要；本轮发送上限和每日上限取批准资产及现行政策。
      - 开工前从公司配置确认发送账号的风险、暂停状态和原额度配置；设备上的当前登录、实际风险与剩余额度由预检执行后取证，不符合时禁止取单发送。
      - 只核本次上下文与政策；原订单与目标资格在领取时验证，不修改protected/已发或unknown订单。
    postconditions:
      - probe: pf_device_verified
        asserts: 设备原生在线且真实硬件/路由与授权设备一致。
      - probe: pf_account_verified
        asserts: 原生登录发送账号、公司/租户、批准正文和当前政策版本一致；资产授权及每日/本轮剩余额度有独立来源。
      - probe: pf_call_idle
        asserts: 手机当前不在通话中，未知不当idle。
      - probe: pf_lock_acquired
        asserts: 本run取得精确双锁并保来源回执，实际owner/租约一致；预检不领取旁单、不发送。 用 host.receipts 找到本轮真实取得回执路径并逐份读取，与当前设备/中央锁读回交叉核验；同一身份已安全取得的锁只读回。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-104-preflight/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 300
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: skip
    failure:
      empty_ok: []
      retryable:
        - lock_busy 设备锁被占
      needs_human:
        cases:
          - device_offline 设备离线
          - account_mismatch 手机登录号不符
          - call_busy 设备通话中（未挂断的电话）
        alert:
          channel: bark
          object: harvest-cron.sh:121-125 离线升级分身 → Bark
      fatal:
        - 冻结Task、Run和真实归属存在身份冲突；同一身份恢复只读回已有动作和结果
    side_effects: []
    invokers:
      - code
