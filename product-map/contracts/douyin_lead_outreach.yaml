version: 1
capability: keyword_acquisition
contract_key: douyin_lead_outreach
name: 抖音线索触达
workflow: douyin-lead-outreach
brain_workflow_key: douyin_lead_outreach
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-lead-outreach.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: pending_leads
trigger_inputs:
  - Lead
  - Account
  - Device
known_gaps: []
activities:
  - key: preflight
    name: 预检
    order: 1
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        cardinality: one
        fields:
          - serial
          - host
          - lock_holder
      - type: Account
        cardinality: one
        fields:
          - platform
          - profile
          - sender_id
          - dm_paused
          - daily_cap
      - type: Lead
        cardinality: many
        fields:
          - douyin_id
          - profile_url
          - intent_grade
          - repeat_hits
          - status
    outputs:
      - type: Device
        cardinality: one
        effect: update
        fields:
          - online
          - call_state
          - lock_holder
      - type: Account
        cardinality: one
        effect: update
        fields:
          - logged_in
      - type: Run
        cardinality: one
        effect: create
        fields:
          - run_tag
          - profile
          - serial
      - type: OutreachOrder
        cardinality: one
        effect: create
        fields:
          - sender_id
    preconditions:
      - work触达暂停flag保持原样，暂停时只核验零发送，不解除熔断
      - 真实读取限额与发送账号，不符合时禁止取单发送
    postconditions:
      - probe: pf_device_verified
        asserts: 保留原后置条件：pf_device_verified
      - probe: pf_account_verified
        asserts: 保留原后置条件：pf_account_verified
      - probe: pf_call_idle
        asserts: 保留原后置条件：pf_call_idle
      - probe: pf_lock_acquired
        asserts: 保留原后置条件：pf_lock_acquired
      - probe: preflight_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      location: phone
      via: leadgen-workflow.mjs → preflight独立活动 → 持久化队列读回
    budget:
      max_duration_s: 300
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: reject
    failure:
      empty_ok: []
      retryable:
        - lock_busy 设备锁被占
      needs_human:
        cases:
          - device_offline 设备离线
          - account_mismatch 手机登录号不符
          - call_busy 设备通话中（未挂断的电话）
        alert:
          channel: bark
          object: harvest-cron.sh:121-125 离线升级分身 → Bark
      fatal:
        - run_tag 重复
    side_effects: []
    invokers:
      - code
    runtime:
      phase: setup
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/douyin-phone-adb
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-lib.sh
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-helper.py
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/douyin-phone-adb
        revision: contract
        enabler_key: account_selfcheck
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
    steps:
      - key: acquire_device_lock
        name: 拿设备锁
        order: 1
        reads:
          - Device.serial
        writes:
          - Device.lock_holder
        check: lock-acquire rc=0 且锁文件 owner=本 run（TTL 1800s）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.acquire_device_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_acquired
            expect:
              op: ==
              value: 1
      - key: refresh_lock_heartbeat
        name: 锁心跳续期
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: lock-refresh 后锁文件 mtime 更新
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.refresh_lock_heartbeat（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          at: cleanup
          readback:
            type: log
            regex: 锁心跳续期3次仍未确认成功
            expect:
              op: <=
              value: 0
      - key: verify_device_identity
        name: 验设备身份
        order: 3
        reads:
          - Device.serial
        writes:
          - Device.online
        check: adb get-state == device 且 serial 与声明一致
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.verify_device_identity（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.device_verified
            expect:
              op: ==
              value: 1
      - key: verify_call_idle
        name: 验通话空闲
        order: 4
        reads:
          - Device.serial
        writes:
          - Device.call_state
        check: telephony call_state == IDLE
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.verify_call_idle（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.call_state_idle
            expect:
              op: ==
              value: 1
      - key: read_account_mark
        name: 读账号标记(我页)
        order: 5
        reads:
          - Account.sender_id
        writes:
          - Account.logged_in
        check: 我页抖音号 in profile 的注册账号列表(account-current + account_registered)
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.read_account_mark（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-account-profile.xml"
            match: 抖音号：
            expect:
              op: ">="
              value: 1
      - key: open_run_ledger
        name: 开账本
        order: 6
        reads:
          - Account.profile
          - Device.serial
        writes:
          - Run.run_tag
          - Run.profile
          - Run.serial
        check: ledger init 成功且 preflight 工件通过闭集键校验；四项指标取 harvest-cron
          真实预检结果（DEVICE_VERIFIED/ACCOUNT_VERIFIED/CALL_STATE_IDLE/LOCK_ACQUIRED，读不到即 0）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.open_run_ledger（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            stage: preflight
            field: status
            equals: completed
            expect:
              op: ==
              value: 1
      - key: check_breaker_and_cap
        name: 熔断与日限额闸
        order: 7
        reads:
          - Account.dm_paused
          - Account.daily_cap
        writes: []
        check: 选单时已排除熔断/当日停发/撞上限账号，全部不可用时 NO_SENDER 即停
        implementation:
          status: implemented
          ref: outreach-tick.sh:218-303
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 已熔断\(见|已因风控停发\(见|已达阶梯上限
            expect:
              op: <=
              value: 0
      - key: verify_sender_account
        name: 验发送账号
        order: 8
        reads:
          - Account.sender_id
        writes:
          - OutreachOrder.sender_id
        check: 我页抖音号 == sender_id，不符一次即熔断
        implementation:
          status: implemented
          ref: outreach-tick.sh account_mismatch
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 失败\(account_mismatch\)
            expect:
              op: <=
              value: 0
    commander:
      entry: activity-commander.mjs
  - key: send_dm
    name: 发私信
    order: 2
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 私信触达员
    inputs:
      - type: Lead
        cardinality: many
        fields:
          - douyin_id
          - profile_url
          - intent_grade
          - repeat_hits
          - status
      - type: Account
        cardinality: one
        fields:
          - profile
          - sender_id
          - dm_paused
          - daily_cap
      - type: Device
        cardinality: one
        fields:
          - serial
          - lock_holder
    outputs:
      - type: OutreachOrder
        cardinality: one
        effect: create
        fields:
          - lead_record_id
          - douyin_id
          - sender_id
          - script_id
          - message
          - result
      - type: Lead
        cardinality: one
        effect: update
        fields:
          - status
          - send_status
          - script_id
          - sender_id
          - reached_at
    preconditions:
      - 发送账号可用：未熔断（无 state/dm-paused-<profile>.flag，软熔断 soft_until 未到期也算熔断）、当日未风控停发（dm-halt）、当日真实发送数 <
        daily_cap（config/dm-rate-ramp.json）；不可用账号在取单前经 --exclude 排除
      - 触达等级 ∈ 该业务线 outreachGrades（选单时过滤，决策 67762358；老数据无等级前缀放行）
      - 线索有 https 主页链接与合法抖音号（next-outreach-lib.js:24-29）
      - 话术库有可用话术
    postconditions:
      - probe: out_zero_send_while_paused
        asserts: 暂停时零发送；未发送阶段只记skipped
      - probe: send_dm_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      location: phone
      via: leadgen-workflow.mjs → send_dm独立活动 → 持久化队列读回
    budget:
      max_duration_s: 1500
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
        - outreach-tick mkdir 锁（35 分钟尸锁）
      limits:
        - name: daily_cap_ceiling
          value: 60
        - name: max_attempts_per_order
          value: 10
    idempotency:
      dedupe_key: OutreachOrder.lead_record_id
      on_duplicate: reject
    failure:
      empty_ok:
        - NO_PENDING 无待触达单
        - restricted 对方仅互关（不计成功）
      retryable:
        - lock_busy 设备被采收占用 → 回队列
        - rate_limited 当天停发
        - requeue_transient 两轮后转受阻
        - device_ui 手机界面读取失败（回队列，不废线索；连续3次软熔断2小时自动恢复）
      needs_human:
        cases:
          - account_mismatch 登错号（一次即熔断）
          - other 连续 2 次未识别失败 → 熔断
          - TARGET_ABSENT
          - NO_SCRIPT 话术缺失
        alert:
          channel: bark
          object: 熔断即 Bark（notify-bark.js，去重 24h）
      fatal: []
    side_effects:
      - kind: external_visible
        target: 抖音私信
        description: 真实向潜在客户发送私信（douyin-phone-adb:2372）
    invokers:
      - code
    runtime:
      phase: batch_end
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
    steps:
      - key: pick_order
        name: 取单预写触达中
        order: 1
        reads:
          - Lead.status
          - Lead.repeat_hits
          - Lead.intent_grade
        writes:
          - OutreachOrder.lead_record_id
          - OutreachOrder.douyin_id
          - OutreachOrder.script_id
          - Lead.status
        check: 预写触达中后回读，状态/分发号/话术ID 三项一致，否则 CLAIM_FAILED 不发
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js send_dm.pick_order（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: "单#[0-9]+:"
            expect:
              op: ">="
              ref: metrics.orders_picked
      - key: send_private_message
        name: 发私信
        order: 2
        reads:
          - OutreachOrder.lead_record_id
          - Lead.profile_url
        writes:
          - OutreachOrder.message
        check: 输入框回读 == 审批话术，发送后气泡可见
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js send_dm.send_private_message（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: ✅ 单#[0-9]+ 送达|仅互关限制
            expect:
              op: ">="
              ref: metrics.messages_sent
      - key: verify_delivery
        name: 核验送达
        order: 3
        reads:
          - OutreachOrder.message
        writes:
          - OutreachOrder.result
        check: 现场无「暂无法给对方发送消息」「发送消息过于频繁」
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js send_dm.verify_delivery（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 送达核验在 private-message-send 现场读气泡与提示文案，结果只体现在 ✅/⚠️/🚦 分支；聊天界面没有持久化产物，事后读不回对方是否可收
          readback:
            type: none
    commander:
      entry: activity-commander.mjs
  - key: write_back
    name: 回填
    order: 3
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 私信触达员
    inputs:
      - type: Lead
        cardinality: many
        fields:
          - douyin_id
          - profile_url
          - intent_grade
          - repeat_hits
          - status
      - type: Account
        cardinality: one
        fields:
          - profile
          - sender_id
          - dm_paused
          - daily_cap
      - type: Device
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: OutreachOrder
        cardinality: one
        fields:
          - lead_record_id
          - result
    outputs:
      - type: OutreachOrder
        cardinality: one
        effect: create
        fields:
          - lead_record_id
          - douyin_id
          - sender_id
          - script_id
          - message
          - result
      - type: Lead
        cardinality: one
        effect: update
        fields:
          - status
          - send_status
          - script_id
          - sender_id
          - reached_at
    preconditions:
      - 发送账号可用：未熔断（无 state/dm-paused-<profile>.flag，软熔断 soft_until 未到期也算熔断）、当日未风控停发（dm-halt）、当日真实发送数 <
        daily_cap（config/dm-rate-ramp.json）；不可用账号在取单前经 --exclude 排除
      - 触达等级 ∈ 该业务线 outreachGrades（选单时过滤，决策 67762358；老数据无等级前缀放行）
      - 线索有 https 主页链接与合法抖音号（next-outreach-lib.js:24-29）
      - 话术库有可用话术
    postconditions:
      - probe: out_no_stuck_inflight
        asserts: 本run认领订单回读PG终态，无悬空触达中；未发送不造成功
      - probe: write_back_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      location: phone
      via: leadgen-workflow.mjs → write_back独立活动 → 持久化队列读回
    budget:
      max_duration_s: 1500
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
        - outreach-tick mkdir 锁（35 分钟尸锁）
      limits:
        - name: daily_cap_ceiling
          value: 60
        - name: max_attempts_per_order
          value: 10
    idempotency:
      dedupe_key: OutreachOrder.lead_record_id
      on_duplicate: reject
    failure:
      empty_ok:
        - NO_PENDING 无待触达单
        - restricted 对方仅互关（不计成功）
      retryable:
        - lock_busy 设备被采收占用 → 回队列
        - rate_limited 当天停发
        - requeue_transient 两轮后转受阻
        - device_ui 手机界面读取失败（回队列，不废线索；连续3次软熔断2小时自动恢复）
      needs_human:
        cases:
          - account_mismatch 登错号（一次即熔断）
          - other 连续 2 次未识别失败 → 熔断
          - TARGET_ABSENT
          - NO_SCRIPT 话术缺失
        alert:
          channel: bark
          object: 熔断即 Bark（notify-bark.js，去重 24h）
      fatal: []
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_leads
        description: 实际送达或受限结果回填，未执行发送记skipped；无悬空触达中
    invokers:
      - code
    runtime:
      phase: batch_end
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-queue.js
        revision: contract
    steps:
      - key: write_back_result
        name: 结果回写
        order: 1
        reads:
          - OutreachOrder.result
        writes:
          - Lead.status
          - Lead.send_status
          - Lead.reached_at
          - Lead.sender_id
          - Lead.script_id
        check: 线索表落 已触达/待触达/触达受阻 之一，不留 触达中
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js write_back.write_back_result（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-write_back-readback.json"
            match: '"verified"\s*:\s*true'
            expect:
              op: ">="
              value: 1
    commander:
      entry: activity-commander.mjs
  - key: cleanup
    name: 收尾
    order: 4
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        cardinality: one
        fields:
          - run_tag
    outputs:
      - type: Device
        cardinality: one
        effect: update
        fields:
          - lock_holder
      - type: Run
        cardinality: one
        effect: update
        fields:
          - status
    preconditions:
      - 本 run 各阶段已写工件或已判失败
    postconditions:
      - probe: cl_app_closed
        asserts: 保留原后置条件：cl_app_closed
      - probe: cl_lock_released
        asserts: 保留原后置条件：cl_lock_released
      - probe: cl_safe_desktop_visible
        asserts: 保留原后置条件：cl_safe_desktop_visible
    execution:
      location: phone
      via: leadgen-workflow.mjs → cleanup独立活动 → 持久化队列读回
    budget:
      max_duration_s: 120
      heartbeat_s: 30
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: skip
    failure:
      empty_ok: []
      retryable:
        - 工件 scp 到 mmv 失败（本地保留）
      needs_human:
        cases:
          - finalize 自检 artifact_count_mismatch
        alert:
          channel: brain_alert
          object: Brain 终态 failed 回执（workflow-result.sh:200）
      fatal: []
    side_effects: []
    invokers:
      - code
    runtime:
      phase: finalize
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/douyin-phone-adb
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-lib.sh
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-helper.py
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
    steps:
      - key: close_app
        name: 关App
        order: 1
        reads:
          - Device.serial
        writes: []
        check: 前台不再是 com.ss.android.ugc.aweme
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.close_app（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.close_app_attempts
            expect:
              op: ">="
              value: 1
      - key: release_lock
        name: 放锁
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: 锁文件不存在或 owner≠本 run；失败重试3次(同commenter-identity套路)，3次仍失败才留告警
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.release_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_released
            expect:
              op: ==
              value: 1
      - key: return_safe_desktop
        name: 回安全桌面
        order: 3
        reads:
          - Device.serial
        writes: []
        check: 前台 = launcher（用 HOME intent resolve-activity 查设备自身默认桌面包名,不 hardcode 厂商launcher）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.return_safe_desktop（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.safe_desktop_visible
            expect:
              op: ==
              value: 1
      - key: finalize_run
        name: 终态回执
        order: 4
        reads:
          - Run.run_tag
        writes:
          - Run.status
        check: n_items>0 且 n_files>=n_items（workflow-result.sh:194）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.finalize_run（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            field: items_total
            expect:
              op: ">="
              value: 1
    commander:
      entry: activity-commander.mjs
