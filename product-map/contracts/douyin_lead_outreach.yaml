    steps:
      - key: acquire_device_lock
        name: 拿设备锁
        order: 1
        reads:
          - Device.serial
        writes:
          - Device.lock_holder
        check: 取得本run精确双锁，租约按本次冻结配置，不能覆盖他人。
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js preflight.acquire_device_lock（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
      - key: refresh_lock_heartbeat
        name: 锁心跳续期
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: lock-refresh 后锁文件 mtime 更新
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js preflight.refresh_lock_heartbeat（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
      - key: verify_device_identity
        name: 验设备身份
        order: 3
        reads:
          - Device.serial
        writes:
          - Device.online
        check: adb get-state == device 且 serial 与声明一致
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js preflight.verify_device_identity（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
      - key: verify_call_idle
        name: 验通话空闲
        order: 4
        reads:
          - Device.serial
        writes:
          - Device.call_state
        check: telephony call_state == IDLE
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js preflight.verify_call_idle（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/2及原始证据验收。
          readback:
            type: none
      - key: read_account_mark
        name: 读账号标记(我页)
        order: 5
        reads:
          - Account.sender_id
        writes:
          - Account.logged_in
        check: 我页抖音号 in profile 的注册账号列表(account-current + account_registered)
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js preflight.read_account_mark（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: open_run_ledger
        name: 开账本
        order: 6
        reads:
          - Account.profile
          - Device.serial
        writes:
          - Run.run_tag
          - Run.profile
          - Run.serial
        check: 保存真实本次设备、账号、通话、锁及批准资产原件，不以旧cron日志或固定指标代替。
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js preflight.open_run_ledger（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/3及原始证据验收。
          readback:
            type: none
      - key: check_breaker_and_cap
        name: 熔断与日限额闸
        order: 7
        reads:
          - Account.dm_paused
          - Account.daily_cap
        writes: []
        check: 按真实批准资产/现行政策读取风险与额度，不使用旧60/10固定上限。
        implementation:
          status: implemented
          ref: outreach-tick.sh:218-303
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: verify_sender_account
        name: 验发送账号
        order: 8
        reads:
          - Account.sender_id
        writes: []
        check: 我页抖音号 == sender_id，不符一次即熔断
        implementation:
          status: implemented
          ref: outreach-tick.sh account_mismatch
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
    commander:
      entry: activity-commander.mjs
  - key: send_dm
    name: 发私信
    promise: 仅对已授权合格目标发送该公司批准话术，交出一次可核验的发送或未发送结果
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_lead_outreach
      activity_key: send_dm
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 6.1.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 私信触达员
    inputs:
      - type: Lead
        source: 该公司已交付且资格合格的待触达线索
        cardinality: many
        fields:
          - douyin_id
          - profile_url
          - intent_grade
          - repeat_hits
          - status
      - type: Account
        source: 预检通过的发送账号及限额
        cardinality: one
        fields:
          - profile
          - sender_id
          - dm_paused
          - daily_cap
      - type: Device
        source: 触达预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: OutreachOrder
        source: 该公司canonical队列中已存在的合格未发送订单；普通模式按公司资格队列，单条验收按精确范围领取
        cardinality: one
        fields:
          - lead_record_id
          - douyin_id
          - sender_id
          - script_id
          - message
          - result
      - type: OutreachScope
        source: 仅exact模式输入，本run从私有0600文件冻结的唯一飞书订单及原评论、公司、102/103来源和执行设备身份
        cardinality: one
        fields:
          - record_id
          - comment_id
          - company_id
          - source_run
          - mark_run
          - target_douyin_id
          - line_key
          - run_tag
          - profile
          - serial
      - type: RecipientQualification
        source: 原订单关联的该公司已通过原生身份核验的资格快照
        cardinality: one
        fields:
          - company_id
          - policy_id
          - native_profile_sha256
    outputs:
      - type: OutreachOrder
        destination: 该公司已有 canonical 订单的永久预留及本次发送回执
        cardinality: one
        effect: update
        fields:
          - lead_record_id
          - douyin_id
          - sender_id
          - script_id
          - message
          - result
    preconditions:
      - 发送账号风险与暂停状态允许，本run批准资产/intent的每日和本轮上限仍有余额；公司数值不写死在通用Contract。
      - 冻结政策允许目标等级且真实原单收件人资格有效，原UID与HTTPS主页链接一致。
      - 批准正文、发送账号、目标、公司及原订单/102/103来源与冻结范围完全一致。
      - ordinary公司队列与exact原单模式按各自冻结授权选单，不从exact失败回退旁单；先永久预留，再执行唯一手机发送。
      - 未知/已prepared/已发动作仅按原幂等状态读回，不能重发；Checker只读取证不授发送权。
    postconditions:
      - probe: out_zero_send_while_paused
        asserts: 暂停/未授权/额度不足阶段零发送；未发送如实标记，不造成功。
      - probe: out_order_scope_verified
        asserts: 实际领取原单与批准公司、目标及102/103来源一致，旁单零领取；发送不超过本轮与每日批准上限。
      - probe: out_delivery_result_verified
        asserts: 真实发送前后原生证据、当前收件人与发送账号、批准正文及限制提示完整。结果未知不报成功且不重发；出现气泡不宣称对方已送达。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-104-send-dm/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 1500
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
        - outreach-tick mkdir 锁（35 分钟尸锁）
      limits:
        - name: daily_cap
          value: 批准资产/intent与现行公司政策给定，每日真实发送数不得超过
        - name: run_cap
          value: 本次批准资产/intent给定，单动作状态机及未知不重发保持
    idempotency:
      dedupe_key: OutreachOrder.lead_record_id
      on_duplicate: reject
    failure:
      empty_ok:
        - NO_PENDING 无待触达单
        - restricted 对方仅互关（不计成功）
      retryable:
        - lock_busy等仅在已证未prepared且未发送的本人原单，按本run冻结runtime授权有界重试；不得另行扩次数。
        - rate_limited按现行政策停发；prepared、已发或未知只读原动作，不回队列重发。
      needs_human:
        cases:
          - account_mismatch账号身份不符停止
          - 原动作结果未知，保留原订单与证据，不重发
          - TARGET_ABSENT
          - NO_SCRIPT批准正文缺失
        alert:
          channel: bark
          object: 熔断即 Bark（notify-bark.js，去重 24h）
      fatal: []
    side_effects:
      - kind: external_visible
        target: 抖音私信
        description: 真实向潜在客户发送私信（douyin-phone-adb:2372）
    invokers:
      - code
    runtime:
      phase: batch_end
      entry: services/phone-adb-controller/leadgen-foundation/worker.mjs
      executor_kind: agent
      protocol: json-stdio-v1
