  queue: pending_leads
trigger_inputs:
  - Lead
  - Account
  - Device
  - RecipientQualification
  - OutreachOrder
known_gaps:
  - gap: Workflow 的 on_status/always_run 路由尚未在本合同及 Runner 中形成可验证接线；Activity 字段齐全不代表端到端自动编排验收通过。
    task: bdd9fb75
activities:
  - key: preflight
    name: 预检
    promise: 核对本轮触达授权、公司账号、设备、原政策及批准话术；本段不领取或创建订单
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_lead_outreach
      activity_key: preflight
      owner_labeled: false
      current_skill_verified: false
    order: 1
    version: 5.0.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        source: 设备台账及本轮原生设备锁
        cardinality: one
        fields:
          - serial
          - host
          - lock_holder
      - type: Account
        source: 该公司已启用的发送账号配置
        cardinality: one
        fields:
          - platform
          - profile
          - sender_id
          - dm_paused
          - daily_cap
    outputs:
      - type: Device
        destination: 本轮触达设备锁及运行上下文
        cardinality: one
        effect: update
        fields:
          - online
          - call_state
          - lock_holder
      - type: Account
        destination: 本轮已核发送账号上下文
        cardinality: one
        effect: update
        fields:
          - logged_in
      - type: Run
        destination: 本轮触达运行账本
        cardinality: one
        effect: create
        fields:
          - run_tag
          - profile
          - serial
    preconditions:
      - 显式LEADGEN_SEND=1授权本批触达；账号风险flag及当日日上限仍生效，无授权零发送
      - 真实读取限额与发送账号，不符合时禁止取单发送
      - 本段核冻结公司版本、发送账号、原政策与批准话术；原订单与收件人资格由下一段领取时校验，不修改旧 protected/已发单
    postconditions:
      - probe: pf_device_verified
        asserts: 本轮设备 serial 的原生在线与身份核验结果 metrics.device_verified 等于 1
      - probe: pf_account_verified
        asserts: 手机原生登录账号与本轮冻结 profile 相符，metrics.account_verified 等于 1
      - probe: pf_call_idle
        asserts: 手机不在通话中，metrics.call_state_idle 等于 1
      - probe: pf_lock_acquired
        asserts: 本轮执行者实际持有设备锁，metrics.lock_acquired 等于 1
      - probe: preflight_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      primary_kind: code
      location: phone
      via: leadgen-workflow.mjs → preflight独立活动 → 持久化队列读回
    budget:
      max_duration_s: 300
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: reject
    failure:
      empty_ok: []
      retryable:
        - lock_busy 设备锁被占
      needs_human:
        cases:
          - device_offline 设备离线
          - account_mismatch 手机登录号不符
          - call_busy 设备通话中（未挂断的电话）
        alert:
          channel: bark
          object: harvest-cron.sh:121-125 离线升级分身 → Bark
      fatal:
        - run_tag 重复
    side_effects: []
    invokers:
      - code
    runtime:
      phase: setup
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE
        RUN_TAG（队列持久化交接，每活动Commander前后核验）
