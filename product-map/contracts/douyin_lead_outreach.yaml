      retryable:
        - lock_busy 设备被采收占用 → 回队列
        - rate_limited 当天停发
        - requeue_transient 两轮后转受阻
        - device_ui 手机界面读取失败（回队列，不废线索；连续3次软熔断2小时自动恢复）
