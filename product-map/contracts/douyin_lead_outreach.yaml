    steps:
      - key: acquire_device_lock
        name: 拿设备锁
        order: 1
        reads:
          - Device.serial
        writes:
          - Device.lock_holder
        check: lock-acquire rc=0 且锁文件 owner=本 run（TTL 1800s）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js
            preflight.acquire_device_lock（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_acquired
            expect:
              op: ==
              value: 1
      - key: refresh_lock_heartbeat
        name: 锁心跳续期
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: lock-refresh 后锁文件 mtime 更新
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js
            preflight.refresh_lock_heartbeat（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          at: cleanup
          readback:
            type: log
            regex: 锁心跳续期3次仍未确认成功
            expect:
              op: <=
              value: 0
      - key: verify_device_identity
        name: 验设备身份
        order: 3
        reads:
          - Device.serial
        writes:
          - Device.online
        check: adb get-state == device 且 serial 与声明一致
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js
            preflight.verify_device_identity（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.device_verified
            expect:
              op: ==
              value: 1
      - key: verify_call_idle
        name: 验通话空闲
        order: 4
        reads:
          - Device.serial
        writes:
          - Device.call_state
        check: telephony call_state == IDLE
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js
            preflight.verify_call_idle（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.call_state_idle
            expect:
              op: ==
              value: 1
      - key: read_account_mark
        name: 读账号标记(我页)
        order: 5
        reads:
          - Account.sender_id
        writes:
          - Account.logged_in
        check: 我页抖音号 in profile 的注册账号列表(account-current + account_registered)
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js
            preflight.read_account_mark（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-account-profile.xml"
            match: 抖音号：
            expect:
              op: ">="
              value: 1
      - key: open_run_ledger
        name: 开账本
        order: 6
        reads:
          - Account.profile
          - Device.serial
        writes:
          - Run.run_tag
          - Run.profile
          - Run.serial
        check: ledger init 成功且 preflight 工件通过闭集键校验；四项指标取 harvest-cron
          真实预检结果（DEVICE_VERIFIED/ACCOUNT_VERIFIED/CALL_STATE_IDLE/LOCK_ACQUIRED，读不到即
          0）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-outreach-orders.js
            preflight.open_run_ledger（原约束保留，原订单/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            stage: preflight
            field: status
            equals: completed
            expect:
              op: ==
              value: 1
      - key: check_breaker_and_cap
        name: 熔断与日限额闸
        order: 7
        reads:
          - Account.dm_paused
          - Account.daily_cap
        writes: []
        check: 选单时已排除熔断/当日停发/撞上限账号，全部不可用时 NO_SENDER 即停
        implementation:
          status: implemented
          ref: outreach-tick.sh:218-303
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 已熔断\(见|已因风控停发\(见|已达阶梯上限
            expect:
              op: <=
              value: 0
      - key: verify_sender_account
        name: 验发送账号
        order: 8
        reads:
          - Account.sender_id
        writes: []
        check: 我页抖音号 == sender_id，不符一次即熔断
        implementation:
          status: implemented
          ref: outreach-tick.sh account_mismatch
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 失败\(account_mismatch\)
            expect:
              op: <=
              value: 0
    commander:
      entry: activity-commander.mjs
  - key: send_dm
    name: 发私信
    promise: 仅对已授权合格目标发送该公司批准话术，交出一次可核验的发送或未发送结果
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_lead_outreach
      activity_key: send_dm
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 5.0.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 私信触达员
    inputs:
      - type: Lead
        source: 该公司已交付且资格合格的待触达线索
        cardinality: many
        fields:
          - douyin_id
          - profile_url
          - intent_grade
          - repeat_hits
          - status
      - type: Account
        source: 预检通过的发送账号及限额
        cardinality: one
        fields:
          - profile
          - sender_id
          - dm_paused
          - daily_cap
      - type: Device
        source: 触达预检取得的本轮设备锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: OutreachOrder
        source: 该公司 canonical 队列中已存在的合格未发送订单；本段领取并永久预留
        cardinality: one
        fields:
          - lead_record_id
          - douyin_id
          - sender_id
          - script_id
          - message
          - result
      - type: RecipientQualification
        source: 原订单关联的该公司已通过原生身份核验的资格快照
        cardinality: one
        fields:
          - company_id
          - policy_id
          - native_profile_sha256
    outputs:
      - type: OutreachOrder
        destination: 该公司已有 canonical 订单的永久预留及本次发送回执
        cardinality: one
        effect: update
        fields:
          - lead_record_id
          - douyin_id
          - sender_id
          - script_id
          - message
          - result
    preconditions:
      - 发送账号可用：未熔断（无 state/dm-paused-<profile>.flag，软熔断 soft_until
        未到期也算熔断）、当日未风控停发（dm-halt）、当日真实发送数 <
        daily_cap（config/dm-rate-ramp.json）；不可用账号在取单前经 --exclude 排除
      - 触达等级 ∈ 该业务线 outreachGrades（选单时过滤，决策 67762358；老数据无等级前缀放行）
      - 线索有 https 主页链接与合法抖音号（next-outreach-lib.js:24-29）
      - 话术库有可用话术
      - 从该公司 canonical 队列领取已有订单，并校对发送账号、目标、原资格及批准话术快照；先永久预留，后执行一次手机发送
    postconditions:
      - probe: out_zero_send_while_paused
        asserts: 暂停时零发送；未发送阶段只记skipped
      - probe: out_delivery_result_verified
        asserts: 原生发送前后 XML、目标和发送账号身份、批准话术及限制结果独立核验通过；未知结果不算发送，亦不宣称对方送达
      - probe: send_dm_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      primary_kind: code
      location: phone
      via: leadgen-workflow.mjs → send_dm独立活动 → 持久化队列读回
    budget:
      max_duration_s: 1500
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
        - outreach-tick mkdir 锁（35 分钟尸锁）
      limits:
        - name: daily_cap_ceiling
          value: 60
        - name: max_attempts_per_order
          value: 10
    idempotency:
      dedupe_key: OutreachOrder.lead_record_id
      on_duplicate: reject
    failure:
      empty_ok:
        - NO_PENDING 无待触达单
        - restricted 对方仅互关（不计成功）
      retryable:
        - lock_busy 设备被采收占用 → 回队列
        - rate_limited 当天停发
        - requeue_transient 两轮后转受阻
        - device_ui 手机界面读取失败（回队列，不废线索；连续3次软熔断2小时自动恢复）
      needs_human:
        cases:
          - account_mismatch 登错号（一次即熔断）
          - other 连续 2 次未识别失败 → 熔断
          - TARGET_ABSENT
          - NO_SCRIPT 话术缺失
        alert:
          channel: bark
          object: 熔断即 Bark（notify-bark.js，去重 24h）
      fatal: []
    side_effects:
      - kind: external_visible
        target: 抖音私信
        description: 真实向潜在客户发送私信（douyin-phone-adb:2372）
    invokers:
      - code
    runtime:
      phase: batch_end
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE
        RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
