    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 视频 tab / 筛选按钮视觉定位兜底（douyin-phone-adb:905-909）
    steps:
      - key: open_search
        name: 打开搜索
        order: 1
        reads:
          - Keyword.word
          - Device.lock_holder
        writes: []
        check: 搜索框回读 == Keyword.word
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source：首来源搜索词与视频tab实际核验；其他来源在流式取链时独立核验
        uses_llm: false
        dod:
          mode: hard
          readback:
            type: evidence
            glob: '{tag}-source-*-readback.json'
            match: '"verified"\s*:\s*true'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: switch_video_tab
        name: 切视频tab
        order: 2
        reads:
          - Device.lock_holder
        writes: []
        check: 视频 tab 节点 selected=true
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.switch_video_tab（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-vtab-aftertab.xml'
            match: 视频[^>]*selected="true"
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: open_filter_panel
        name: 点筛选按钮开面板
        order: 3
        reads:
          - Device.lock_holder
        writes: []
        check: 筛选面板节点可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.open_filter_panel（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-filter-panel1.*'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: choose_filters
        name: 选筛选项
        order: 4
        reads:
          - Keyword.word
        writes: []
        check: 面板选中项 == 输入参数（时间窗six_months / 最新latest / 指定地域），不能沿用旧排序
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.choose_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-filter-selected.*'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: apply_filters
        name: 点查看结果
        order: 5
        reads:
          - Device.lock_holder
        writes: []
        check: 结果页刷新且筛选标签可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.apply_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-filter-results.*'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: extract_video_cards
        name: 抽视频卡片
        order: 6
        reads:
          - Device.lock_holder
        writes:
          - Video.title
        check: 视频tab和搜索词均已核验；明确空结果可返回0，不将未加载当空
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.extract_video_cards（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-cards-grid.xml'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: resolve_video_links
        name: 取视频链接
        order: 7
        reads:
          - Video.title
        writes:
          - Video.video_id
          - Video.video_url
          - Video.discovery_metrics
        check: 每张卡取得真实video_id，并绑定成功取链同次、离开详情前的原生XML指标；不可用结果页或旧重试原件代替
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.resolve_video_links（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 视频链接解析失败
            expect:
              op: <=
              value: 0
      - key: persist_candidates
        name: 写发现工件+落库
        order: 8
        reads:
          - Run.run_tag
          - Video.video_id
          - Keyword.line_key
        writes:
          - Video.harvest_batch
          - Video.keyword
          - Video.line_key
          - Video.discovery_metrics
        check: 本批每个实际VID的专用观测、run/attempt/来源与公司绑定完整PG独立读回；原件重算相符且旧观测不得当本次ACK
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.persist_candidates（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.discovery_metrics_verified
            expect:
              op: ==
              value: 1
      - key: push_videos
        name: 视频持久化读回
        order: 9
        reads:
          - Video.video_id
          - Video.harvest_batch
        writes:
          - Video.line_key
        check: PG本批新增行数 ≥ 实际inserted=true新增回执数；旧VID保持旧处理状态和批次，由完整VID清单核验
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.push_videos（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch =
              '$RUN_TAG'
            expect:
              op: '>='
              ref: metrics.videos_pushed
      - key: readback_line_key
        name: 业务线读回
        order: 10
        reads:
          - Video.line_key
        writes: []
        check: 本批 leadgen_videos.line_key 全非空
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.readback_line_key（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.manifest_verified
            expect:
              op: ==
              value: 1
    commander:
      entry: activity-commander.mjs
  - ref: douyin_video_processing.cleanup
inputs:
  - *id001
  - type: Device
    cardinality: one
    fields:
      - serial
      - host
  - type: Account
    cardinality: one
    fields:
      - platform
      - profile
      - sender_id
outputs: *id002
