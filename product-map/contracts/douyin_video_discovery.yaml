version: 1
capability: keyword_acquisition
contract_key: douyin_video_discovery
name: 抖音视频发现
workflow: douyin-video-discovery
brain_workflow_key: douyin_video_discovery
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-discovery.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: discovery_sources
trigger_inputs:
  - Keyword
  - Account
  - Device
  - SearchRequest
known_gaps:
  - gap: 对标主页网格当前不提供标题与作者，缺稳定身份时拒绝取链；旧对标流程退役后不得回退。
    task: dffd5885
activities:
  - ref: douyin_video_processing.preflight
  - key: collect_videos
    name: 搜索采集视频
    order: 2
    version: 4.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Keyword
        cardinality: many
        fields:
          - line_key
          - word
      - type: Device
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        cardinality: one
        fields:
          - run_tag
      - &id001
        type: SearchRequest
        cardinality: one
        fields:
          - keywords
          - sort
          - time_layer
          - location
          - target_count
          - max_duration_s
    outputs: &id002
      - type: Video
        cardinality: many
        effect: create
        fields:
          - line_key
          - video_id
          - video_url
          - title
          - keyword
          - comment_count
          - harvest_batch
          - author
      - type: Run
        cardinality: one
        effect: update
        fields:
          - status
          - stop_reason
          - all_results_scanned
    preconditions:
      - 设备预检通过，持有本run设备锁
      - 关键词、排序、时间、地区、数量和预算已明确；不执行历史或自家号资格过滤
    postconditions:
      - probe: source_completed
        asserts: 来源读取实际成功且无旧入口回退
      - probe: collect_videos_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
      - probe: disc_candidates_persisted
        asserts: 保留原后置条件：disc_candidates_persisted
      - probe: videos_readback
        asserts: 保留原后置条件：videos_readback
      - probe: line_key_not_null
        asserts: 保留原后置条件：line_key_not_null
    execution:
      location: phone
      via: leadgen-workflow.mjs → collect_videos：搜索筛选、逐屏取链、逐条落表及独立PG读回
    budget:
      max_duration_s: 2400
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: max_requested_videos
          value: 1000
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: skip
    failure:
      empty_ok:
        - no_cards 本词无视频卡片
      retryable:
        - lock_busy
        - WRONG_FOREGROUND
        - NO_ROOT
        - 候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判
      needs_human:
        cases:
          - TARGET_ABSENT 连续出现，疑抖音改版
        alert:
          channel: bark
          object: escort 升级（harvest-cron.sh 陪跑员）→ Bark
      fatal:
        - hash_mismatch 词单在 run 中被改
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
        description: 实际ID和有效链接验证后落库，收到pending/matched/rejected实际回执才计成功
    invokers:
      - code
      - agent
    runtime:
      phase: source
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-discovery.mjs
        revision: contract
    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 视频 tab / 筛选按钮视觉定位兜底（douyin-phone-adb:905-909）
    steps:
      - key: open_search
        name: 打开搜索
        order: 1
        reads:
          - Keyword.word
          - Device.lock_holder
        writes: []
        check: 搜索框回读 == Keyword.word
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source：首来源搜索词与视频tab实际核验；其他来源在流式取链时独立核验
        uses_llm: false
        dod:
          mode: hard
          readback:
            type: evidence
            glob: '{tag}-source-*-readback.json'
            match: '"verified"\s*:\s*true'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: switch_video_tab
        name: 切视频tab
        order: 2
        reads:
          - Device.lock_holder
        writes: []
        check: 视频 tab 节点 selected=true
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.switch_video_tab（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-vtab-aftertab.xml'
            match: 视频[^>]*selected="true"
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: open_filter_panel
        name: 点筛选按钮开面板
        order: 3
        reads:
          - Device.lock_holder
        writes: []
        check: 筛选面板节点可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.open_filter_panel（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-filter-panel1.*'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: choose_filters
        name: 选筛选项
        order: 4
        reads:
          - Keyword.word
        writes: []
        check: 面板选中项 == 输入参数（时间窗six_months / 最新latest / 指定地域），不能沿用旧排序
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.choose_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-filter-selected.*'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: apply_filters
        name: 点查看结果
        order: 5
        reads:
          - Device.lock_holder
        writes: []
        check: 结果页刷新且筛选标签可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.apply_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-filter-results.*'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: extract_video_cards
        name: 抽视频卡片
        order: 6
        reads:
          - Device.lock_holder
        writes:
          - Video.title
          - Video.comment_count
        check: 视频tab和搜索词均已核验；明确空结果可返回0，不将未加载当空
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.extract_video_cards（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: '{tag}-src*-cards-grid.xml'
            expect:
              op: '>='
              ref: metrics.sources_succeeded
      - key: resolve_video_links
        name: 取视频链接
        order: 7
        reads:
          - Video.title
        writes:
          - Video.video_id
          - Video.video_url
        check: 每张卡取得 video_id（剪贴板守卫：回读链接含 video_id）
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.resolve_video_links（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 视频链接解析失败
            expect:
              op: <=
              value: 0
      - key: persist_candidates
        name: 写发现工件+落库
        order: 8
        reads:
          - Run.run_tag
          - Video.video_id
          - Keyword.line_key
        writes:
          - Video.harvest_batch
          - Video.keyword
          - Video.line_key
        check: 本批所有保存VID逐个PG独立读回，含旧批次幂等更新的ID
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.persist_candidates（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.manifest_verified
            expect:
              op: ==
              value: 1
      - key: push_videos
        name: 视频持久化读回
        order: 9
        reads:
          - Video.video_id
          - Video.harvest_batch
        writes:
          - Video.line_key
        check: PG本批新增行数 ≥ 实际inserted=true新增回执数；旧VID保持旧处理状态和批次，由完整VID清单核验
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.push_videos（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch = '$RUN_TAG'
            expect:
              op: '>='
              ref: metrics.videos_pushed
      - key: readback_line_key
        name: 业务线读回
        order: 10
        reads:
          - Video.line_key
        writes: []
        check: 本批 leadgen_videos.line_key 全非空
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.readback_line_key（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.manifest_verified
            expect:
              op: ==
              value: 1
    commander:
      entry: activity-commander.mjs
  - ref: douyin_video_processing.cleanup
inputs:
  - *id001
  - type: Device
    cardinality: one
    fields:
      - serial
      - host
  - type: Account
    cardinality: one
    fields:
      - platform
      - profile
      - sender_id
outputs: *id002
