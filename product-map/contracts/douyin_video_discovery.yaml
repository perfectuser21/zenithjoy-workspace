    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 视频 tab / 筛选按钮视觉定位兜底（douyin-phone-adb:905-909）
    steps:
      - key: open_search
        name: 打开搜索
        order: 1
        reads:
          - Keyword.word
          - Device.lock_holder
        writes: []
        check: 搜索框回读 == Keyword.word
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source：首来源搜索词与视频tab实际核验；其他来源在流式取链时独立核验
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: switch_video_tab
        name: 切视频tab
        order: 2
        reads:
          - Device.lock_holder
        writes: []
        check: 视频 tab 节点 selected=true
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.switch_video_tab（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: open_filter_panel
        name: 点筛选按钮开面板
        order: 3
        reads:
          - Device.lock_holder
        writes: []
        check: 筛选面板节点可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.open_filter_panel（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: choose_filters
        name: 选筛选项
        order: 4
        reads:
          - Keyword.word
        writes: []
        check: 当前面板选择与本次输入参数一致，不能沿用历史关键词、排序或地区。
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.choose_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: apply_filters
        name: 点查看结果
        order: 5
        reads:
          - Device.lock_holder
        writes: []
        check: 结果页刷新且筛选标签可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.apply_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: extract_video_cards
        name: 抽视频卡片
        order: 6
        reads:
          - Device.lock_holder
        writes:
          - Video.title
        check: 视频tab和搜索词均已核验；明确空结果可返回0，不将未加载当空
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.extract_video_cards（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/1及原始证据验收。
          readback:
            type: none
      - key: resolve_video_links
        name: 取视频链接
        order: 7
        reads:
          - Video.title
        writes:
          - Video.video_id
          - Video.video_url
          - Video.discovery_metrics
        check: 每张卡取得真实video_id，并绑定成功取链同次、离开详情前的原生XML指标；不可用结果页或旧重试原件代替
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.resolve_video_links（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          reason: 旧脚本指标不作为独立业务裁判；本步骤真实交付由本Activity权威后置条款/postconditions/0及原始证据验收。
          readback:
            type: none
      - key: persist_candidates
        name: 写发现工件+落库
        order: 8
        reads:
          - Run.run_tag
          - Video.video_id
          - Keyword.line_key
        writes:
          - Video.harvest_batch
          - Video.keyword
          - Video.line_key
          - Video.discovery_metrics
        check: PG逐实际VID读回原始观察与本次来源；新增和重复写入结果分别保存。
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs collect_videos.persist_candidates（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
