      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
        description: 实际ID和有效链接验证后落库，收到pending/matched/rejected实际回执才计成功
    invokers:
      - code
      - agent
    runtime:
      phase: batch_end
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-discovery.mjs
        revision: contract
    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 视频 tab / 筛选按钮视觉定位兜底（douyin-phone-adb:905-909）
    steps:
      - key: resolve_video_links
        name: 取视频链接
        order: 1
        reads:
          - Video.title
        writes:
          - Video.video_id
          - Video.video_url
        check: 每张卡取得 video_id（剪贴板守卫：回读链接含 video_id）
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs write_videos.resolve_video_links（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: log
            regex: 视频链接解析失败
            expect:
              op: <=
              value: 0
      - key: persist_candidates
        name: 写发现工件+落库
        order: 2
        reads:
          - Run.run_tag
          - Video.video_id
          - Keyword.line_key
        writes:
          - Video.harvest_batch
          - Video.keyword
          - Video.line_key
        check: leadgen_videos 本词行数 ≥ 工件 candidates
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs write_videos.persist_candidates（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch = '$RUN_TAG'
            expect:
              op: ">="
              ref: metrics.candidates
      - key: push_videos
        name: 视频落池
        order: 3
        reads:
          - Video.video_id
          - Video.harvest_batch
        writes:
          - Video.feishu_record_id
        check: PG 本批行数 ≥ videos_pushed（= push-videos.js 本批新增视频数 PUSH_VIDEOS_STATS.created）；0929修：有新视频要推但一条都没成功(全军覆没)时
          exit 1，不再无声无息(push-stats-lib.js pushAllFailed，部分失败仍exit 0避免连累batch2.sh链式调用的下一步)
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs write_videos.push_videos（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT count(*) FROM zenithjoy.leadgen_videos WHERE harvest_batch = '$RUN_TAG'
            expect:
              op: ">="
              ref: metrics.videos_pushed
      - key: readback_line_key
        name: 业务线读回
        order: 4
        reads:
          - Video.line_key
        writes: []
        check: 本批 leadgen_videos.line_key 全非空
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs write_videos.readback_line_key（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: sql
            query: SELECT line_key FROM zenithjoy.leadgen_videos WHERE harvest_batch = '$RUN_TAG'
            expect:
              op: not_null_all
    commander:
      entry: activity-commander.mjs
  - key: cleanup
    name: 收尾
    order: 5
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        cardinality: one
        fields:
          - run_tag
    outputs:
      - type: Device
        cardinality: one
        effect: update
        fields:
          - lock_holder
      - type: Run
        cardinality: one
        effect: update
        fields:
          - status
    preconditions:
      - 本 run 各阶段已写工件或已判失败
    postconditions:
      - probe: cl_app_closed
        asserts: 保留原后置条件：cl_app_closed
      - probe: cl_lock_released
        asserts: 保留原后置条件：cl_lock_released
      - probe: cl_safe_desktop_visible
        asserts: 保留原后置条件：cl_safe_desktop_visible
    execution:
      location: phone
      via: leadgen-workflow.mjs → cleanup独立活动 → 持久化队列读回
    budget:
      max_duration_s: 120
      heartbeat_s: 30
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: skip
    failure:
      empty_ok: []
      retryable:
        - 工件 scp 到 mmv 失败（本地保留）
      needs_human:
        cases:
          - finalize 自检 artifact_count_mismatch
        alert:
          channel: brain_alert
          object: Brain 终态 failed 回执（workflow-result.sh:200）
      fatal: []
    side_effects: []
    invokers:
      - code
    runtime:
      phase: finalize
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/douyin-phone-adb
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-lib.sh
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-helper.py
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
    steps:
      - key: close_app
        name: 关App
        order: 1
        reads:
          - Device.serial
        writes: []
        check: 前台不再是 com.ss.android.ugc.aweme
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.close_app（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.close_app_attempts
            expect:
              op: ">="
              value: 1
      - key: release_lock
        name: 放锁
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: 锁文件不存在或 owner≠本 run；失败重试3次(同commenter-identity套路)，3次仍失败才留告警
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.release_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_released
            expect:
              op: ==
              value: 1
      - key: return_safe_desktop
        name: 回安全桌面
        order: 3
        reads:
          - Device.serial
        writes: []
        check: 前台 = launcher（用 HOME intent resolve-activity 查设备自身默认桌面包名,不 hardcode 厂商launcher）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.return_safe_desktop（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.safe_desktop_visible
            expect:
              op: ==
              value: 1
      - key: finalize_run
        name: 终态回执
        order: 4
        reads:
          - Run.run_tag
        writes:
          - Run.status
        check: n_items>0 且 n_files>=n_items（workflow-result.sh:194）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js cleanup.finalize_run（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            field: items_total
            expect:
              op: ">="
              value: 1
    commander:
      entry: activity-commander.mjs
