input_schema:
  $ref: services/phone-adb-controller/leadgen-foundation/schemas/101.json
implementation:
  foundation_registration:
    protocol: commander-foundation-v1
    profile: services/phone-adb-controller/leadgen-foundation/profiles/101.json
    input_schema: services/phone-adb-controller/leadgen-foundation/schemas/101.json
    publication: resolve_exact_revision_and_digest_from_clean_candidate
capability: keyword_acquisition
contract_key: douyin_video_discovery
commander_skill:
  name: wf-douyin_video_discovery
  version: 0.12.8
name: 抖音视频发现
workflow: douyin-video-discovery
brain_workflow_key: douyin_video_discovery
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-discovery.yaml
dod_promotion:
  min_consecutive_pass: 20
on_status:
  done: next
  retry: retry
  failed: stop
  empty: next
  partial: stop
  needs_review: pause
always_run: [ cleanup ]
recovery:
  total_timeout_sec: 2820
  cleanup_timeout_sec: 120
trigger_inputs:
  - Keyword
  - Account
  - Device
  - SearchRequest
known_gaps:
  - gap: 对标主页网格当前不提供标题与作者，缺稳定身份时拒绝取链；旧对标流程退役后不得回退。
    task: dffd5885
activities:
  - ref: douyin_video_processing.preflight
  - key: collect_videos
    name: 搜索采集视频
    promise: 按本轮关键词和筛选条件交出带原生身份、真实互动指标及持久化读回的视频集合
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_discovery
      activity_key: collect_videos
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 5.4.0
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Keyword
        source: 本次任务输入或该公司已启用关键词配置
        cardinality: many
        fields:
          - line_key
          - word
      - type: Device
        source: 本轮采集预检已核设备及锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        source: 本次冻结运行定义
        cardinality: one
        fields:
          - run_tag
      - &id001
        type: SearchRequest
        source: 本次任务冻结的搜索请求与筛选范围
        cardinality: one
        fields:
          - keywords
          - sort
          - time_layer
          - location
          - target_count
          - max_duration_s
    outputs: &id002
      - type: Video
        destination: zenithjoy.leadgen_videos，供抖音视频处理领取
        cardinality: many
        effect: create
        fields:
          - line_key
          - video_id
          - video_url
          - title
          - keyword
          - comment_count
          - discovery_metrics
          - harvest_batch
          - author
      - type: Run
        destination: 以本Activity的实际操作、提交和读回终态核对执行提案状态和停止原因；独立验收与整条Workflow终态由宿主在验收后计算。
        cardinality: one
        effect: update
        fields:
          - status
          - stop_reason
          - all_results_scanned
    preconditions:
      - 设备预检通过，持有本run设备锁
      - 关键词、排序、时间、地区、数量和预算已明确；不执行历史或自家号资格过滤
    postconditions:
      - probe: discovery_metrics_verified
        asserts: 每个实际VID以原生卡片作者、点开、同次取链及原始指标回执绑定本轮run/attempt和公司；用本轮真实回执路径逐项独立核对。原始指标缺失保留null，不伪造0。
      - probe: source_completed
        asserts: 用本轮原始搜索和筛选回执、选中及结果页面证明搜索词和筛选参数与冻结输入一致，来源读取成功且无旧入口回退。真实no_cards可empty，须保存原生空结果与停止原因；未加载不能当空。
      - probe: disc_candidates_persisted
        asserts: 在正式 outputs.Video 的每个对象中逐VID交齐全部合同字段，不能用附件代替字段。comment_count保留原PG实采值，author由原生卡片证实。discovery_metrics包含同VID持久指标的全部业务与来源字段和evidence.kind及evidence.sha256，仅原始XML evidence.xml可由原件引用交付。proposal.evidence逐VID指向本run的原XML及实际工具回执，Checker独立以原XML、SHA256、同次取链、原提交回执、真实读回和持久行核对。提交集合以本轮回执和数据库为准。
      - probe: videos_readback
        asserts: 按每个VID的原提交回执inserted区分新增或已存在，readback的recovered不代替原提交。重复发现须查同VID写前和写后原件。处理状态、转写、实采comment_count保留；写前 process_status 为“评论已采”时保留原harvest_batch，其余状态允许更新到本次发现批次。部分采集阶段的视频进度以该视频写前 process_status 为准。搜索Activity的stop_reason/all_results_scanned以原始搜索和本轮完成数量为据，达到上限不等于全结果扫描。
      - probe: line_key_not_null
        asserts: 本批每个实际持久化VID的line_key与本次业务线一致，未知或缺行不能交接。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-101-collect-videos/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 2400
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: max_requested_videos
          value: 1000
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: merge
    failure:
      empty_ok:
        - no_cards 本词无视频卡片
      retryable:
        - lock_busy
        - WRONG_FOREGROUND
        - NO_ROOT
        - 候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判
      needs_human:
        cases:
          - TARGET_ABSENT 连续出现，疑抖音改版
        alert:
          channel: bark
          object: escort 升级（harvest-cron.sh 陪跑员）→ Bark
      fatal:
        - hash_mismatch 词单在 run 中被改
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
        description: 实际ID和有效链接验证后落库，收到pending/matched/rejected且完整指标读回才计成功。同VID相同观测幂等，仅较新observed_at替换discovery_metrics，旧观测拒绝本次成功回执且不改旧行；写入表为 zenithjoy.leadgen_videos。根据同VID的提交和写前后回执，核对该视频原有102状态、转写和实采comment_count保留。写前 process_status 为“评论已采”时保留视频原harvest_batch，其余状态允许更新到本次发现批次。
    invokers:
      - code
      - agent
