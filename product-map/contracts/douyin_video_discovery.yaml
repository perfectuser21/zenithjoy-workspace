capability: keyword_acquisition
contract_key: douyin_video_discovery
commander_skill:
  name: wf-douyin_video_discovery
  version: 0.11.0
name: 抖音视频发现
workflow: douyin-video-discovery
brain_workflow_key: douyin_video_discovery
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-discovery.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: discovery_sources
on_status:
  done: next
  retry: retry
  failed: stop
  empty: next
  partial: stop
  needs_review: pause
always_run: [cleanup]
recovery:
  total_timeout_sec: 2820
  cleanup_timeout_sec: 120
trigger_inputs:
  - Keyword
  - Account
  - Device
  - SearchRequest
known_gaps:
  - gap: 对标主页网格当前不提供标题与作者，缺稳定身份时拒绝取链；旧对标流程退役后不得回退。
    task: dffd5885
activities:
  - ref: douyin_video_processing.preflight
  - key: collect_videos
    name: 搜索采集视频
    promise: 按本轮关键词和筛选条件交出带原生身份、真实互动指标及持久化读回的视频集合
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_discovery
      activity_key: collect_videos
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 5.1.1
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Keyword
        source: 本次任务输入或该公司已启用关键词配置
        cardinality: many
        fields:
          - line_key
          - word
      - type: Device
        source: 本轮采集预检已核设备及锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        source: 本次冻结运行定义
        cardinality: one
        fields:
          - run_tag
      - &id001
        type: SearchRequest
        source: 本次任务冻结的搜索请求与筛选范围
        cardinality: one
        fields:
          - keywords
          - sort
          - time_layer
          - location
          - target_count
          - max_duration_s
    outputs: &id002
      - type: Video
        destination: zenithjoy.leadgen_videos，供抖音视频处理领取
        cardinality: many
        effect: create
        fields:
          - line_key
          - video_id
          - video_url
          - title
          - keyword
          - comment_count
          - discovery_metrics
          - harvest_batch
          - author
      - type: Run
        destination: 本轮运行账本与停止原因
        cardinality: one
        effect: update
        fields:
          - status
          - stop_reason
          - all_results_scanned
    preconditions:
      - 设备预检通过，持有本run设备锁
      - 关键词、排序、时间、地区、数量和预算已明确；不执行历史或自家号资格过滤
    postconditions:
      - probe: discovery_metrics_verified
        asserts: 每个实际视频的同次原生详情XML、VID、run及attempt、公司和固定来源一致；指标重算与持久化完整观测独立读回相符，unknown保留null，不冒充0
      - probe: source_completed
        asserts: 来源读取实际成功且无旧入口回退
      - probe: disc_candidates_persisted
        asserts: 本批候选视频在 zenithjoy.leadgen_videos 独立读回条数不少于 metrics.persisted
      - probe: videos_readback
        asserts: 本批新推送视频在 zenithjoy.leadgen_videos 独立读回条数不少于 metrics.videos_pushed
      - probe: line_key_not_null
        asserts: 本批已持久化视频的 line_key 全部非空
    execution:
      primary_kind: code
      location: phone
      via: leadgen-workflow.mjs → collect_videos：搜索筛选、逐屏取链、逐条落表及独立PG读回
    budget:
      max_duration_s: 2400
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: max_requested_videos
          value: 1000
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: merge
    failure:
      empty_ok:
        - no_cards 本词无视频卡片
      retryable:
        - lock_busy
        - WRONG_FOREGROUND
        - NO_ROOT
        - 候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判
      needs_human:
        cases:
          - TARGET_ABSENT 连续出现，疑抖音改版
        alert:
          channel: bark
          object: escort 升级（harvest-cron.sh 陪跑员）→ Bark
      fatal:
        - hash_mismatch 词单在 run 中被改
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
        description: 实际ID和有效链接验证后落库，收到pending/matched/rejected且完整指标读回才计成功。同VID相同观测幂等，仅较新observed_at替换discovery_metrics，旧观测拒绝本次成功回执且不改旧行；保留102状态、转写、实采comment_count及历史来源，评论已采视频保留原harvest_batch。
    invokers:
      - code
      - agent
    runtime:
      phase: source
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE
        RUN_TAG（队列持久化交接，公共Runner独立核验，Commander观察与纠偏）
