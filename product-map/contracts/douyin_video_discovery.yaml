version: 1
capability: keyword_acquisition
contract_key: douyin_video_discovery
name: 抖音视频发现
workflow: douyin-video-discovery
brain_workflow_key: douyin_video_discovery
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-discovery.yaml
dod_promotion:
  min_consecutive_pass: 20
runner:
  entry: leadgen-workflow.mjs
  queue: discovery_sources
trigger_inputs:
  - Keyword
  - Account
  - Device
known_gaps:
  - gap: 对标主页网格当前不提供标题与作者，缺稳定身份时拒绝取链；旧对标流程退役后不得回退。
    task: dffd5885
activities:
  - key: preflight
    name: 预检
    order: 1
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Device
        cardinality: one
        fields:
          - serial
          - host
      - type: Account
        cardinality: one
        fields:
          - platform
          - profile
          - sender_id
    outputs:
      - type: Device
        cardinality: one
        effect: update
        fields:
          - online
          - call_state
          - lock_holder
      - type: Account
        cardinality: one
        effect: update
        fields:
          - logged_in
      - type: Run
        cardinality: one
        effect: create
        fields:
          - run_tag
          - profile
          - serial
    preconditions:
      - 不在触达时窗 8-22 点（采收给触达让路，harvest-cron.sh:139）
      - 当日 KPI 未达标（kpi-gate.js 经 ssh mmv，harvest-cron.sh:145-149）
    postconditions:
      - probe: pf_device_verified
        asserts: 保留原后置条件：pf_device_verified
      - probe: pf_account_verified
        asserts: 保留原后置条件：pf_account_verified
      - probe: pf_call_idle
        asserts: 保留原后置条件：pf_call_idle
      - probe: pf_lock_acquired
        asserts: 保留原后置条件：pf_lock_acquired
      - probe: preflight_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      location: phone
      via: leadgen-workflow.mjs → preflight独立活动 → 持久化队列读回
    budget:
      max_duration_s: 300
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits: []
    idempotency:
      dedupe_key: Run.run_tag
      on_duplicate: reject
    failure:
      empty_ok: []
      retryable:
        - lock_busy 设备锁被占
      needs_human:
        cases:
          - device_offline 设备离线
          - account_mismatch 手机登录号不符
          - call_busy 设备通话中（未挂断的电话）
        alert:
          channel: bark
          object: harvest-cron.sh:121-125 离线升级分身 → Bark
      fatal:
        - run_tag 重复
    side_effects: []
    invokers:
      - code
    runtime:
      phase: setup
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/douyin-phone-adb
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-lib.sh
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/phone-lock-helper.py
        revision: contract
        enabler_key: device_lock
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/douyin-phone-adb
        revision: contract
        enabler_key: account_selfcheck
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
    steps:
      - key: acquire_device_lock
        name: 拿设备锁
        order: 1
        reads:
          - Device.serial
        writes:
          - Device.lock_holder
        check: lock-acquire rc=0 且锁文件 owner=本 run（TTL 1800s）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.acquire_device_lock（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.lock_acquired
            expect:
              op: ==
              value: 1
      - key: refresh_lock_heartbeat
        name: 锁心跳续期
        order: 2
        reads:
          - Device.lock_holder
        writes:
          - Device.lock_holder
        check: lock-refresh 后锁文件 mtime 更新
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.refresh_lock_heartbeat（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          at: cleanup
          readback:
            type: log
            regex: 锁心跳续期3次仍未确认成功
            expect:
              op: <=
              value: 0
      - key: verify_device_identity
        name: 验设备身份
        order: 3
        reads:
          - Device.serial
        writes:
          - Device.online
        check: adb get-state == device 且 serial 与声明一致
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.verify_device_identity（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.device_verified
            expect:
              op: ==
              value: 1
      - key: verify_call_idle
        name: 验通话空闲
        order: 4
        reads:
          - Device.serial
        writes:
          - Device.call_state
        check: telephony call_state == IDLE
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.verify_call_idle（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: metric
            ref: metrics.call_state_idle
            expect:
              op: ==
              value: 1
      - key: read_account_mark
        name: 读账号标记(我页)
        order: 5
        reads:
          - Account.sender_id
        writes:
          - Account.logged_in
        check: 我页抖音号 in profile 的注册账号列表(account-current + account_registered)
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.read_account_mark（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-account-profile.xml"
            match: 抖音号：
            expect:
              op: ">="
              value: 1
      - key: open_run_ledger
        name: 开账本
        order: 6
        reads:
          - Account.profile
          - Device.serial
        writes:
          - Run.run_tag
          - Run.profile
          - Run.serial
        check: ledger init 成功且 preflight 工件通过闭集键校验；四项指标取 harvest-cron
          真实预检结果（DEVICE_VERIFIED/ACCOUNT_VERIFIED/CALL_STATE_IDLE/LOCK_ACQUIRED，读不到即 0）
        implementation:
          status: implemented
          ref: leadgen-workflow.mjs + leadgen-queue.js preflight.open_run_ledger（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: ledger
            stage: preflight
            field: status
            equals: completed
            expect:
              op: ==
              value: 1
    commander:
      entry: activity-commander.mjs
  - key: source
    name: 取源
    order: 2
    version: 2.0.0
    compatibility: breaking
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Keyword
        cardinality: many
        fields:
          - line_key
          - word
      - type: Device
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        cardinality: one
        fields:
          - run_tag
    outputs:
      - type: Video
        cardinality: many
        effect: create
        fields:
          - title
          - comment_count
          - keyword
    preconditions:
      - 设备锁由本run持有
      - 词或对标源来自用户配置，最多2个来源，最多20张候选卡片
    postconditions:
      - probe: source_completed
        asserts: 来源读取实际成功且无旧入口回退
      - probe: source_commander_verified
        asserts: 本活动Commander前后真实模型回执已独立留痕，鉴权失败不得自报上岗
    execution:
      location: phone
      via: leadgen-workflow.mjs → source独立活动 → 持久化队列读回
    budget:
      max_duration_s: 480
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: max_cards_per_source
          value: 20
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: skip
    failure:
      empty_ok:
        - no_cards 本词无视频卡片
      retryable:
        - lock_busy
        - WRONG_FOREGROUND
        - NO_ROOT
        - 候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判
      needs_human:
        cases:
          - TARGET_ABSENT 连续出现，疑抖音改版
        alert:
          channel: bark
          object: escort 升级（harvest-cron.sh 陪跑员）→ Bark
      fatal:
        - hash_mismatch 词单在 run 中被改
    side_effects: []
    invokers:
      - code
      - agent
    runtime:
      phase: source
      entry: leadgen-activity.sh
      args: WORKFLOW_KEY ACTIVITY_KEY PROFILE SERIAL LINE RUN_TAG（队列持久化交接，每活动Commander前后核验）
    implementation_bindings:
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-workflow.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-activity.sh
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/activity-commander.mjs
        revision: contract
      - kind: code
        repo: perfectuser21/zenithjoy-workspace
        path: services/phone-adb-controller/leadgen-discovery.mjs
        revision: contract
    model:
      - provider: openrouter
        model: bytedance/ui-tars-1.5-7b
        purpose: 视频 tab / 筛选按钮视觉定位兜底（douyin-phone-adb:905-909）
    steps:
      - key: open_search
        name: 打开搜索
        order: 1
        reads:
          - Keyword.word
          - Device.lock_holder
        writes: []
        check: 搜索框回读 == Keyword.word
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source：控制器search-kw-matches逐来源读取实际aftertab树；不一致或无树立即失败，记录原始回话
        uses_llm: false
        dod:
          mode: hard
          readback:
            type: evidence
            glob: "{tag}-source-*-readback.json"
            match: '"verified"\s*:\s*true'
            expect:
              op: ">="
              ref: metrics.sources_succeeded
      - key: switch_video_tab
        name: 切视频tab
        order: 2
        reads:
          - Device.lock_holder
        writes: []
        check: 视频 tab 节点 selected=true
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source.switch_video_tab（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-src*-vtab-aftertab.xml"
            match: 视频[^>]*selected="true"
            expect:
              op: ">="
              ref: metrics.sources_succeeded
      - key: open_filter_panel
        name: 点筛选按钮开面板
        order: 3
        reads:
          - Device.lock_holder
        writes: []
        check: 筛选面板节点可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source.open_filter_panel（原约束保留，真PG/证据读回）
        uses_llm: true
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-src*-filter-panel1.*"
            expect:
              op: ">="
              ref: metrics.sources_succeeded
      - key: choose_filters
        name: 选筛选项
        order: 4
        reads:
          - Keyword.word
        writes: []
        check: 面板选中项 == 输入参数（时间窗six_months / 最新latest / 指定地域），不能沿用旧排序
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source.choose_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-src*-filter-selected.*"
            expect:
              op: ">="
              ref: metrics.sources_succeeded
      - key: apply_filters
        name: 点查看结果
        order: 5
        reads:
          - Device.lock_holder
        writes: []
        check: 结果页刷新且筛选标签可见
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source.apply_filters（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-src*-filter-results.*"
            expect:
              op: ">="
              ref: metrics.sources_succeeded
      - key: extract_video_cards
        name: 抽视频卡片
        order: 6
        reads:
          - Device.lock_holder
        writes:
          - Video.title
          - Video.comment_count
        check: 卡片数 ≥1，否则判 empty_ok（no_cards）
        implementation:
          status: implemented
          ref: leadgen-discovery.mjs source.extract_video_cards（原约束保留，真PG/证据读回）
        uses_llm: false
        dod:
          mode: checkpoint
          readback:
            type: evidence
            glob: "{tag}-src*-cards-grid.xml"
            expect:
              op: ">="
              ref: metrics.sources_succeeded
    commander:
      entry: activity-commander.mjs
