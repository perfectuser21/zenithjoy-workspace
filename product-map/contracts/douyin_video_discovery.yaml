  version: 0.12.17
name: 抖音视频发现
workflow: douyin-video-discovery
brain_workflow_key: douyin_video_discovery
source_repo: perfectuser21/zenithjoy-workspace
checks: services/phone-adb-controller/checks/douyin-video-discovery.yaml
dod_promotion:
  min_consecutive_pass: 20
on_status:
  done: next
  retry: retry
  failed: stop
  empty: next
  partial: stop
  needs_review: pause
always_run: [ cleanup ]
recovery:
  total_timeout_sec: 3000
  cleanup_timeout_sec: 300
trigger_inputs:
  - Keyword
  - Account
  - Device
  - SearchRequest
known_gaps:
  - gap: 对标主页网格当前不提供标题与作者，缺稳定身份时拒绝取链；旧对标流程退役后不得回退。
    task: dffd5885
activities:
  - ref: douyin_video_processing.preflight
  - key: collect_videos
    name: 搜索采集视频
    promise: 按本轮关键词和筛选条件交出带原生身份、真实互动指标及持久化读回的视频集合
    sample_candidates:
      index: services/phone-adb-controller/__tests__/fixtures/leadgen-historical-evidence-index.json
      workflow_keys:
        - douyin_video_discovery
      activity_key: collect_videos
      owner_labeled: false
      current_skill_verified: false
    order: 2
    version: 5.6.4
    required_host_tools: ["phone", "business", "metrics", "fetch-native", "proof"]
    agent_recovery:
      max_additional_turns: 1
    compatibility: backward
    owner:
      department: line02 智能获客
      agent: 获客采收员
    inputs:
      - type: Keyword
        source: 本次任务输入或该公司已启用关键词配置
        cardinality: many
        fields:
          - line_key
          - word
      - type: Device
        source: 本轮采集预检已核设备及锁
        cardinality: one
        fields:
          - serial
          - lock_holder
      - type: Run
        source: 本次冻结运行定义
        cardinality: one
        fields:
          - run_tag
      - &id001
        type: SearchRequest
        source: 本次任务冻结的搜索请求与筛选范围
        cardinality: one
        fields:
          - keywords
          - sort
          - time_layer
          - location
          - target_count
          - max_duration_s
    outputs: &id002
      - type: Video
        destination: zenithjoy.leadgen_videos，供抖音视频处理领取。author 随交付对象提供，以本轮同 VID 原生卡片独立核验；其余持久字段从数据库读回。
        cardinality: many
        effect: create
        fields:
          - line_key
          - video_id
          - video_url
          - title
          - keyword
          - comment_count
          - discovery_metrics
          - harvest_batch
          - author
      - type: Run
        destination: 以本Activity的实际操作、提交和读回终态核对执行提案状态和停止原因；独立验收与整条Workflow终态由宿主在验收后计算。
        cardinality: one
        effect: update
        fields:
          - status
          - stop_reason
          - all_results_scanned
    delivery:
      schema:
        type: object
        properties:
          outputs:
            type: object
            properties:
              Run:
                type: object
                properties:
                  status:
                    type: string
                    minLength: 1
                  stop_reason:
                    type: string
                    minLength: 1
                  all_results_scanned:
                    type: boolean
                required:
                  - status
                  - stop_reason
                  - all_results_scanned
                additionalProperties: false
              Video:
                type: array
                items:
                  type: object
                  properties:
                    video_id:
                      type: string
                      pattern: ^[0-9]{19,20}$
                    video_url:
                      type: string
                      minLength: 1
                    title:
                      type: string
                      minLength: 1
                    author:
                      type: string
                      minLength: 1
                    keyword:
                      type: string
                      minLength: 1
                    line_key:
                      type: string
                      minLength: 1
                    comment_count:
                      type: integer
                      minimum: 0
                    harvest_batch:
                      type: string
                      minLength: 1
                    discovery_metrics:
                      type: object
                      properties:
                        digest:
                          type: string
                          minLength: 1
                        evidence:
                          type: object
                          properties:
                            sha256:
                              type: string
                              minLength: 1
                          required:
                            - sha256
                      required:
                        - digest
                        - evidence
                  required:
                    - video_id
                    - video_url
                    - title
                    - author
                    - keyword
                    - line_key
                    - comment_count
                    - harvest_batch
                    - discovery_metrics
                maxItems: 100
            required:
              - Run
              - Video
            additionalProperties: false
          evidence:
            type: object
            required:
              - run
            properties:
              run:
                type: object
                properties:
                  video_page_xml:
                    type: string
                    minLength: 1
                    maxLength: 512
                  cards_xml:
                    type: string
                    minLength: 1
                    maxLength: 512
                  video_page_screenshot:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: '\.png$'
                  cards_screenshot:
                    type: string
                    minLength: 1
                    maxLength: 512
                    pattern: '\.png$'
                  filters_receipt:
                    type: string
                    minLength: 1
                    maxLength: 512
                  selected_page:
                    type: string
                    minLength: 1
                    maxLength: 512
                  results_page:
                    type: string
                    minLength: 1
                    maxLength: 512
                required:
                  - filters_receipt
                  - selected_page
                  - results_page
                anyOf:
                  - properties: {video_page_xml: true, cards_xml: true}
                    required: [video_page_xml, cards_xml]
                  - properties: {video_page_screenshot: true, cards_screenshot: true}
                    required: [video_page_screenshot, cards_screenshot]
                additionalProperties: false
            patternProperties:
              ^[0-9]{19,20}$:
                type: object
                properties:
                  share_xml:
                    type: string
                    minLength: 1
                    maxLength: 512
                  link_receipt:
                    type: string
                    minLength: 1
                    maxLength: 512
                  copy_screen:
                    type: string
                    minLength: 1
                    maxLength: 512
                  paste_xml:
                    type: string
                    minLength: 1
                    maxLength: 512
                  reopen_receipt:
                    type: string
                    minLength: 1
                    maxLength: 512
                  write_receipt:
                    type: string
                    minLength: 1
                    maxLength: 512
                  readback_receipt:
                    type: string
                    minLength: 1
                    maxLength: 512
                  prior_state:
                    type: string
                    minLength: 1
                    maxLength: 512
                  written_state:
                    type: string
                    minLength: 1
                    maxLength: 512
                required:
                  - share_xml
                  - link_receipt
                  - write_receipt
                  - readback_receipt
                  - prior_state
                  - written_state
                additionalProperties: false
            additionalProperties: false
            maxProperties: 101
        required:
          - outputs
          - evidence
        additionalProperties: false
      item_scope:
        collection: Video
        id_field: video_id
      report:
        files:
          filters: { scope: run, role: filters_receipt }
          video_tab: { scope: run, role: video_page_xml, optional: true }
          cards: { scope: run, role: cards_xml, optional: true }
          video_tab_image: { scope: run, role: video_page_screenshot, optional: true }
          cards_image: { scope: run, role: cards_screenshot, optional: true }
          selected_page: { scope: run, role: selected_page }
          results_page: { scope: run, role: results_page }
          share: { scope: "*", role: share_xml, optional: true }
          link: { scope: "*", role: link_receipt, optional: true }
          copied: { scope: "*", role: copy_screen, optional: true }
          paste: { scope: "*", role: paste_xml, optional: true }
          reopened: { scope: "*", role: reopen_receipt, optional: true }
          write:
            scope: "*"
            role: write_receipt
            optional: true
            fields: [/binding/identity, /binding/args/0/op, /binding/args/0/video/video_id, /state, /result/exit_code, /result/stdout/result/status, /result/stdout/result/inserted, /result/stdout/result/has_transcript, /result/stdout/result/metrics_verified, /result/stdout/result/metrics_digest]
          readback:
            scope: "*"
            role: readback_receipt
            optional: true
            fields: [/binding/identity, /state, /result/exit_code, /result/stdout/result/status, /result/stdout/result/recovered, /result/stdout/result/has_transcript, /result/stdout/result/metrics_verified, /result/stdout/result/metrics_digest, /result/stdout/result/handoff/harvest_batch, /result/stdout/result/handoff/comment_count, /result/stdout/result/handoff/discovery_metrics/evidence/sha256]
          prior_state:
            scope: "*"
            role: prior_state
            optional: true
            fields: [/binding/identity, /started_at, /ended_at, /result/stdout/result]
          written_state:
            scope: "*"
            role: written_state
            optional: true
            fields: [/binding/identity, /started_at, /ended_at, /result/stdout/result]
        facts:
          source_task:
            operation: brain.get
            args:
              resource: task
              fields: [id, result.foundation_runner.run.input.business, result.foundation_runner.run.input.run_tag]
          persisted:
            operation: pg.rows
            args:
              relation: videos
              fields: [connection.transaction_read_only, scope.line, rows.line_key, rows.video_id, rows.video_url, rows.title, rows.keyword, rows.comment_count, rows.discovery_metrics.version, rows.discovery_metrics.run, rows.discovery_metrics.run_id, rows.discovery_metrics.profile, rows.discovery_metrics.source_commit, rows.discovery_metrics.line_key, rows.discovery_metrics.video_id, rows.discovery_metrics.video_url, rows.discovery_metrics.observed_at, rows.discovery_metrics.evidence_id, rows.discovery_metrics.likes, rows.discovery_metrics.comment_total, rows.discovery_metrics.comment_tier, rows.discovery_metrics.company_binding, rows.discovery_metrics.digest, rows.discovery_metrics.evidence.kind, rows.discovery_metrics.evidence.sha256, rows.harvest_batch, rows.author, rows.process_status, rows.transcript, rows.judgment_status]
          actions:
            operation: host.receipts
            args: { fields: [receipts.activity, receipts.kind, receipts.operation, receipts.video_id, receipts.state, receipts.exit_code] }
          progress:
            operation: run.progress
            args: { fields: [identity, activity_calls, attempts] }
        criteria:
          outputs_0: [persisted, cards, cards_image, link, write, readback]
          outputs_1: [progress, actions, filters, results_page, cards, cards_image]
          postconditions_0: [source_task, cards, cards_image, share, link, actions, persisted]
          postconditions_1: [source_task, filters, selected_page, results_page, video_tab, cards, video_tab_image, cards_image, actions]
          postconditions_2: [persisted, share, link, copied, paste, reopened, write, readback]
          postconditions_3: [persisted, write, readback, filters, results_page, actions, prior_state, written_state]
          postconditions_4: [source_task, persisted]
          side_effects_0: [persisted, write, readback, prior_state, written_state]
          idempotency: [persisted, write, readback, actions, prior_state, written_state]
          failure: [source_task, filters, results_page, cards, cards_image, progress, persisted]
    preconditions:
      - 设备预检通过，持有本run设备锁
      - 关键词、排序、时间、地区、数量和预算已明确；不执行历史或自家号资格过滤
    postconditions:
      - probe: discovery_metrics_verified
        asserts: 每个实际VID以原生卡片作者、点开、同次取链及原始指标回执绑定本轮run/attempt和公司；用本轮真实回执路径逐项独立核对。原始指标缺失保留null，不伪造0。
      - probe: source_completed
        asserts: 用本轮原始搜索和筛选回执、选中及结果页面证明搜索词和筛选参数与冻结输入一致。视频页签和筛选后首屏卡片可用同一轮原生截图成对交付，Checker核对前台抖音、搜索词、已选中的视频页签及本轮实际卡片，证据必须支持原槽位和业务结论；只显示加载、缺关键词或看不清页签均不得通过。真实no_cards可empty，须保存同一搜索范围的原生空结果与停止原因；未加载不能当空。
      - probe: disc_candidates_persisted
        asserts: 在正式 outputs.Video 的每个对象中逐VID交齐全部合同字段，不能用附件代替字段。comment_count保留原PG实采值，author由原生卡片证实。discovery_metrics包含同VID持久指标的全部业务与来源字段和evidence.kind及evidence.sha256，仅原始XML evidence.xml可由原件引用交付。proposal.evidence逐VID指向本run的原XML及实际工具回执，Checker独立以原XML、SHA256、同次取链、原提交回执、真实读回和持久行核对。逐步取链时，读取本轮明确复制成功的原始截图、无提交的聚焦输入框 XML、对应的抖音短链与解析身份，以及同一身份重新打开的原始回执。仅有打开回执、历史剪贴板值或相同标题均不能单独作为取链证明。提交集合以本轮回执和数据库为准。
      - probe: videos_readback
        asserts: 按每个VID的原提交回执inserted区分新增或已存在，readback的recovered不代替原提交。重复发现须查同VID写前和写后原件。处理状态、转写、实采comment_count保留；写前 process_status 为“评论已采”时保留原harvest_batch，其余状态允许更新到本次发现批次。部分采集阶段的视频进度以该视频写前 process_status 为准。搜索Activity的stop_reason/all_results_scanned以原始搜索和本轮完成数量为据，达到上限不等于全结果扫描。
      - probe: line_key_not_null
        asserts: 本批每个实际持久化VID的line_key与本次业务线一致，未知或缺行不能交接。
    execution:
      primary_kind: agent
      location: phone
      via: Foundation独立执行Agent按固定Activity Skill services/phone-adb-controller/skills/douyin-leadgen-activity-101-collect-videos/SKILL.md 执行；底座worker仅协议bootstrap，验收由独立通用Checker依据同一冻结Contract取证。
    budget:
      max_duration_s: 2400
      heartbeat_s: 60
    resources:
      locks:
        - device:<serial>
      limits:
        - name: max_requested_videos
          value: 1000
    idempotency:
      dedupe_key: Video.line_key+Video.video_id
      on_duplicate: merge
    failure:
      empty_ok:
        - no_cards 本词无视频卡片
      retryable:
        - lock_busy
        - WRONG_FOREGROUND
        - NO_ROOT
        - 候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判
      needs_human:
        cases:
          - TARGET_ABSENT 连续出现，疑抖音改版
        alert:
          channel: bark
          object: escort 升级（harvest-cron.sh 陪跑员）→ Bark
      fatal:
        - hash_mismatch 词单在 run 中被改
    side_effects:
      - kind: internal_write
        target: pg zenithjoy.leadgen_videos
        description: 实际ID和有效链接验证后落库，收到pending/matched/rejected且完整指标读回才计成功。同VID相同观测幂等，仅较新observed_at替换discovery_metrics，旧观测拒绝本次成功回执且不改旧行；写入表为 zenithjoy.leadgen_videos。根据同VID的提交和写前后回执，核对该视频原有102状态、转写和实采comment_count保留。写前 process_status 为“评论已采”时保留视频原harvest_batch，其余状态允许更新到本次发现批次。
    invokers:
      - code
      - agent
