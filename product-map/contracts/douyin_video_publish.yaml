version: 1
execution_profile: codex_agent
agent: skill-factory
skill: multi-platform-publish
resources: {machine: xian-m4, profile: xiaolongxia, device_serial: ANGYVB4311010223, account_ref: Ai办公室}
recovery: {max_attempts: 1, improvement_after_failures: 5, total_timeout_sec: 2400, cleanup_timeout_sec: 300, retry_safe: false, retry_on: []}
input_schema:
  type: object
  additionalProperties: false
  required: [title, body, media_path, media_sha256, allow_discard_existing_draft, authorized, privacy, content_type]
  properties:
    title: {type: string, minLength: 1}
    body: {type: string}
    media_path: {type: string, pattern: '^/'}
    media_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    allow_discard_existing_draft: {type: boolean}
    authorized: {const: true}
    privacy: {const: private}
    content_type: {const: video}
output_schema:
  type: object
  additionalProperties: false
  required: [publication, privacy, readback, media_sha256, evidence]
  properties:
    publication:
      type: object
      additionalProperties: false
      required: [platform, account, title, body]
      properties:
        platform: {const: douyin}
        account: {const: Ai办公室}
        title: {type: string, minLength: 1}
        body: {type: string}
        work_id: {type: string, minLength: 1}
    privacy: {const: private}
    media_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    readback:
      type: object
      additionalProperties: false
      required: [account_verified, content_verified, private_verified]
      properties:
        account_verified: {const: true}
        content_verified: {const: true}
        private_verified: {const: true}
    evidence: {type: array, minItems: 1, items: {type: string, minLength: 1}}
verification:
  required: true
  criteria:
  - 独立读取本人发布后的实屏原件，核对输入标题正文、私密权限、实际视频；work_id能读取则保留，不能读取用本人作品入口及原件定位，不伪造ID
  - prepare保存源文件SHA256实际命令原件，独立核验重算并与输入media_sha256对照；输出media_sha256与其一致
  - 外壳preflight/cleanup原生stat记录Commander执行包根及本run证据根的realpath/st_dev/st_ino，前后须保持；根换址或替换即拒绝，原件在对应阶段root-start/root-end回执
  - delivery后独立读取Brain设备锁free响应并归档，不能拿cleanup执行时仍由Brain持有的租约伪报free
  - 仅以上冻结合同条款与原件作为判据，业务报告额外自述不自动增列验收项
