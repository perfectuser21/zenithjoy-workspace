    writes:
    - PublishContext.task_id
    check: controller预检设备在线、本人账号与声明一致、run同owner控制器锁读回；原始预检与账号回执完整，执行包根和run证据根真实路径/dev/inode前后相同
    implementation:
      status: implemented
      ref: services/phone-adb-controller/commander/wf-v2-phone.py + wf-v2-shell.py
    uses_llm: false
