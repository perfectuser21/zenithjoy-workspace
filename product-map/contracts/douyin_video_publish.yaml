    repo: perfectuser21/zenithjoy-workspace
    path: .agents/skills/multi-platform-publish/scripts/publish_catalog.py
    revision: contract
  - kind: code
    repo: perfectuser21/zenithjoy-workspace
    path: .agents/skills/multi-platform-publish/scripts/test_publish_catalog.py
    revision: contract
  - kind: code
    repo: perfectuser21/zenithjoy-workspace
    path: .github/workflows/scripts/smoke/codex-publish-catalog-smoke.sh
    revision: contract
  steps:
  - key: preflight_evidence
    name: controller预检设备在线、本人账号与声明一致、run同owner控制器锁读回；原始预检与账号回执完整，执行包根和run证据根真实路径/dev/inode前后相同
    order: 1
