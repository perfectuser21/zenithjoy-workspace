- PublishRequest
activities:
- key: preflight
  name: 取得本人发布上下文
  order: 1
  version: 1.0.0
  compatibility: backward
  owner:
    department: 新媒体部
    agent: Codex发布执行者
  inputs:
  - type: PublishRequest
    cardinality: one
    fields:
    - task_id
    - platform
    - content_type
    - account
    - title
    - body
    - media_sha256
    - authorized
  outputs:
  - type: PublishContext
    cardinality: one
    effect: create
    fields: &id001
    - task_id
    - run_id
    - serial
    - owner
    - account
    - source_verified
  preconditions:
  - 用户发布授权存在且来源内容/账号/分支验收合同明确
  - 遵循当前真实设备owner/TTL和同run执行边界；未知不行动
  postconditions:
  - probe: publish_preflight_verified
    asserts: controller预检设备在线、本人账号与声明一致、run同owner控制器锁读回；原始预检与账号回执完整，执行包根和run证据根真实路径/dev/inode前后相同
  execution:
    location: xian-m4
    via: Codex multi-platform-publish + 本run受控controller原生路径
  budget:
    max_duration_s: 600
    heartbeat_s: 60
  resources:
    locks:
    - controller serial.guard + Brain同owner设备锁
    limits:
    - name: publish_attempts
      value: 0
  idempotency:
    dedupe_key: task_id/run_id/platform/content_type
    on_duplicate: reject
  failure: &publish_failure
    empty_ok: []
    retryable:
    - 仅只读可按合同有限重试；不得重复发表
    needs_human:
      cases:
      - 原证缺失或输入/权限/账号/锁/预算未知
      - 登录短信风控或付费
      alert:
        channel: brain_alert
        object: 本task真实result/handoff
    fatal:
    - 源身份或owner不一致立即停止
  side_effects: []
  invokers:
  - agent
  implementation_bindings:
  - {kind: code, repo: perfectuser21/zenithjoy-workspace, path: services/phone-adb-controller/commander/wf-v2-phone.py, revision: contract}
