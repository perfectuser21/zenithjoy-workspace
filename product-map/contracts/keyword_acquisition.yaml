  # ───────────────────────────── 7 触达 ─────────────────────────────
  - key: outreach
    name: 触达
    order: 7
    version: 1.0.0
    compatibility: backward
    owner: { department: line02 智能获客, agent: 私信触达员 }
    inputs:
      - { type: Lead, cardinality: many, fields: [douyin_id, profile_url, intent_grade, repeat_hits, status] }
