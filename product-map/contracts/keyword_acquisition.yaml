# 关键词获客 · 主干活动契约（决策 3240824c 步骤契约 / f18f56b8 设计顺序+每步拦截+key 规范）
#
# 契约 = 接口；脚本 / 技能 / n8n 节点 = 实现。组装器（scripts/product-map/contracts-lib.mjs）按 order 串活动，
# 每个活动的输入类型必须由 trigger_inputs 或前序活动交出；账本/探针里出现的 stage 必须在此有契约。
# 设计顺序：预检 → 发现 → 判定 → 采集 → 评分 → 配送 → 触达 → 归位（判定合格才采集）。
# 后置条件探针全部 severity=error，定义在 checks（social-keyword-leadgen.yaml）。
# 步骤 key = 能力.活动.步骤，snake_case 不带序号，顺序靠 order；中文名在 name。
# 步骤清单底稿 = Notion「Workflow 步骤表」3d9c40c2（1-preflight … 8-cleanup 主线 27 步），按设计语义重排补齐。

version: 1
capability: keyword_acquisition
name: 关键词获客
workflow: social-keyword-leadgen
checks: services/phone-adb-controller/checks/social-keyword-leadgen.yaml
ledger: services/phone-adb-controller/workflow-result.sh
trigger_inputs: [Keyword, Account, Device]

# 运行时拦截（任务 6b133a81）：每个活动结束时 workflow-result.sh 经 verify-step.mjs 读回本活动全部后置条件探针并判定；
# 不过按探针 failure_class（须在本活动 failure 闭集声明）处理——on_fail=stop_run 停后续活动（cleanup 照做）、
# needs_human/fatal 告警（harvest-cron 升级分身 + Bark）、工件与账本标 failed、Brain 回执 stage_status=failed。
known_gaps: []

activities:
  # ───────────────────────────── 1 预检 ─────────────────────────────
  - key: preflight
    name: 预检
    order: 1
    version: 1.0.0
    compatibility: backward
    owner: { department: line02 智能获客, agent: 获客采收员 }
    inputs:
      - { type: Device, cardinality: one, fields: [serial, host] }
      - { type: Account, cardinality: one, fields: [platform, profile, sender_id] }
    outputs:
      - { type: Device, cardinality: one, effect: update, fields: [online, call_state, lock_holder] }
      - { type: Account, cardinality: one, effect: update, fields: [logged_in] }
      - { type: Run, cardinality: one, effect: create, fields: [run_tag, profile, serial] }
    preconditions:
      - "不在触达时窗 8-22 点（采收给触达让路，harvest-cron.sh:139）"
      - "当日 KPI 未达标（kpi-gate.js 经 ssh mmv，harvest-cron.sh:145-149）"
    postconditions:
      - { probe: pf_device_verified, asserts: "设备在线且 serial 一致" }
      - { probe: pf_account_verified, asserts: "手机登录号 = 本 run 声明账号" }
      - { probe: pf_call_idle, asserts: "不在通话中" }
      - { probe: pf_lock_acquired, asserts: "本 run 持有设备锁" }
    execution: { location: xian-m4, via: "crontab → harvest-cron.sh <profile> <serial>（xian-m1 同形）" }
    budget: { max_duration_s: 300, heartbeat_s: 60 }
    resources:
      locks: ["device:<serial>"]
      limits: []
    idempotency: { dedupe_key: "Run.run_tag", on_duplicate: reject }
    failure:
      empty_ok: []
      retryable: ["lock_busy 设备锁被占"]
      needs_human:
        cases: ["device_offline 设备离线", "account_mismatch 手机登录号不符", "call_busy 设备通话中（未挂断的电话）"]
        alert: { channel: bark, object: "harvest-cron.sh:121-125 离线升级分身 → Bark" }
      fatal: ["run_tag 重复"]
    side_effects:
      - { kind: internal_write, target: "设备锁目录", description: "持锁期间其它任务（触达/前台派单）不得占用手机" }
    invokers: [code]
    runtime: { phase: setup, entry: wf-run.sh, args: "<能力> <profile> <serial> <biz> [n] [push] [--sources 文件] [--commander 标签]（preflight 内建于 wf-run.sh）" }
    steps:
      - { key: acquire_device_lock, name: 拿设备锁, order: 1, reads: [Device.serial], writes: [Device.lock_holder],
          check: "lock-acquire rc=0 且锁文件 owner=本 run（TTL 1800s）", implementation: { status: implemented, ref: "harvest-cron.sh preflight_lock_acquire（以本批 TAG 持锁，逐词 TAG-wN 同 run 幂等续用）→ douyin-phone-adb lock-acquire" }, uses_llm: false }
      - { key: refresh_lock_heartbeat, name: 锁心跳续期, order: 2, reads: [Device.lock_holder], writes: [Device.lock_holder],
          check: "lock-refresh 后锁文件 mtime 更新", implementation: { status: implemented, ref: "douyin-phone-adb:2177-2188" }, uses_llm: false }
      - { key: verify_device_identity, name: 验设备身份, order: 3, reads: [Device.serial], writes: [Device.online],
          check: "adb get-state == device 且 serial 与声明一致", implementation: { status: implemented, ref: "harvest-cron.sh:121-133" }, uses_llm: false }
      - { key: verify_call_idle, name: 验通话空闲, order: 4, reads: [Device.serial], writes: [Device.call_state],
          check: "telephony call_state == IDLE", implementation: { status: implemented, ref: "douyin-phone-adb:2116 preflight" }, uses_llm: false }
      - { key: read_account_mark, name: 读账号标记(我页), order: 5, reads: [Account.sender_id], writes: [Account.logged_in],
          check: "我页抖音号 in profile 的注册账号列表(account-current + account_registered)", implementation: { status: implemented, ref: "harvest-cron.sh account_registered() + account-current 调用（0929批次4接线）" }, uses_llm: false }
      - { key: open_run_ledger, name: 开账本, order: 6, reads: [Account.profile, Device.serial], writes: [Run.run_tag, Run.profile, Run.serial],
          check: "ledger init 成功且 preflight 工件通过闭集键校验；四项指标取 harvest-cron 真实预检结果（DEVICE_VERIFIED/ACCOUNT_VERIFIED/CALL_STATE_IDLE/LOCK_ACQUIRED，读不到即 0）", implementation: { status: implemented, ref: "workflow-result.sh init + harvest-cron.sh preflight_lock_acquire（6b133a81）" }, uses_llm: false }

  # ───────────────────────────── 2 发现 ─────────────────────────────
  - key: discovery
    name: 发现
    order: 2
    version: 1.0.0
    compatibility: backward
    owner: { department: line02 智能获客, agent: 获客采收员 }
    inputs:
      - { type: Keyword, cardinality: many, fields: [line_key, word] }
      - { type: Device, cardinality: one, fields: [serial, lock_holder] }
      - { type: Run, cardinality: one, fields: [run_tag] }
    outputs:
      - { type: Video, cardinality: many, effect: create, fields: [line_key, video_id, video_url, title, keyword, comment_count, harvest_batch] }
    preconditions:
      - "设备锁由本 run 持有"
      - "关键词未在本 run 处理过（ledger skip_words，ledger.mjs:84-94）"
      - "词单哈希与 init 一致（batch2.sh:49-56）"
    postconditions:
      - { probe: disc_candidates_persisted, asserts: "本词候选视频全部落 leadgen_videos" }
    execution: { location: phone, via: "xian-m4 batch2.sh:78 → harvest-keyword.sh:35-43 → douyin-phone-adb" }
    budget: { max_duration_s: 600, heartbeat_s: 60 }
    resources:
      locks: ["device:<serial>"]
      limits: [{ name: max_videos_per_word, value: 4 }]
    idempotency: { dedupe_key: "Video.line_key+Video.video_id", on_duplicate: skip }
    failure:
      empty_ok: ["no_cards 本词无视频卡片"]
      retryable: ["lock_busy", "WRONG_FOREGROUND", "NO_ROOT", "候选落库失败（库/ssh 不可达）：视频留 pending 本批不采，下批再遇到重判"]
      needs_human:
        cases: ["TARGET_ABSENT 连续出现，疑抖音改版"]
        alert: { channel: bark, object: "escort 升级（harvest-cron.sh 陪跑员）→ Bark" }
      fatal: ["hash_mismatch 词单在 run 中被改"]
    side_effects:
      - { kind: internal_write, target: "pg zenithjoy.leadgen_videos", description: "候选视频落库（judgment_status=pending）" }
    invokers: [code, agent]
    runtime: { phase: source, entry: discover-keyword.sh, args: "PROFILE SOURCE_ENC MAXV TAG LOC → stdout 每行 X\tY\tDUR\tTITLE；无卡 exit 0 空输出；失败 exit 1" }
    model:
      - { provider: openrouter, model: bytedance/ui-tars-1.5-7b, purpose: "视频 tab / 筛选按钮视觉定位兜底（douyin-phone-adb:905-909）" }
    steps:
      - { key: open_search, name: 打开搜索, order: 1, reads: [Keyword.word, Device.lock_holder], writes: [],
          check: "搜索框回读 == Keyword.word", implementation: { status: implemented, ref: "harvest-keyword.sh:35 open-search" }, uses_llm: false }
      - { key: switch_video_tab, name: 切视频tab, order: 2, reads: [Device.lock_holder], writes: [],
          check: "视频 tab 节点 selected=true", implementation: { status: implemented, ref: "douyin-phone-adb:905" }, uses_llm: true }
      - { key: open_filter_panel, name: 点筛选按钮开面板, order: 3, reads: [Device.lock_holder], writes: [],
          check: "筛选面板节点可见", implementation: { status: implemented, ref: "douyin-phone-adb:909" }, uses_llm: true }
      - { key: choose_filters, name: 选筛选项, order: 4, reads: [Keyword.word], writes: [],
          check: "面板选中项 == 输入参数（时间窗 six_months / 排序 most_liked）", implementation: { status: implemented, ref: "harvest-keyword.sh:38 search-time-layer" }, uses_llm: false }
      - { key: apply_filters, name: 点查看结果, order: 5, reads: [Device.lock_holder], writes: [],
          check: "结果页刷新且筛选标签可见", implementation: { status: implemented, ref: "harvest-keyword.sh:38" }, uses_llm: false }
      - { key: extract_video_cards, name: 抽视频卡片, order: 6, reads: [Device.lock_holder], writes: [Video.title, Video.comment_count],
          check: "卡片数 ≥1，否则判 empty_ok（no_cards）", implementation: { status: implemented, ref: "harvest-keyword.sh:40 search-video-cards" }, uses_llm: false }
      - { key: resolve_video_links, name: 取视频链接, order: 7, reads: [Video.title], writes: [Video.video_id, Video.video_url],
          check: "每张卡取得 video_id（剪贴板守卫：回读链接含 video_id）", implementation: { status: implemented, ref: "harvest-keyword.sh:45-70" }, uses_llm: false }
      - { key: persist_candidates, name: 写发现工件+落库, order: 8, reads: [Run.run_tag, Video.video_id, Keyword.line_key], writes: [Video.harvest_batch, Video.keyword, Video.line_key],
          check: "leadgen_videos 本词行数 ≥ 工件 candidates", implementation: { status: implemented, ref: "harvest-keyword.sh qual_remote discover → qualify-video.js discover → leadgen-db-lib.js discoverVideo（8bb3af55：发现即落库 pending/待判定，再遇到的视频归到本批）" }, uses_llm: false }

  # ───────────────────────────── 3 判定 ─────────────────────────────
  - key: qualification
    name: 判定
    order: 3
    version: 1.0.0
    compatibility: backward
    owner: { department: line02 智能获客, agent: 视频判定员 }
    inputs:
      - { type: Video, cardinality: many, fields: [line_key, video_id, video_url, title, comment_count, judgment_status] }
      - { type: Device, cardinality: one, fields: [serial, lock_holder] }
    outputs:
      - { type: Video, cardinality: many, effect: update, fields: [judgment_status, judgment_reason, transcript] }
    preconditions:
      - "视频已落库且 judgment_status=pending"
    postconditions:
      - { probe: qual_none_pending, asserts: "本批候选全部判完（matched/rejected）" }
      - { probe: qual_reason_present, asserts: "每个判定都带理由" }
    execution: { location: mmv, via: "harvest-keyword.sh 逐视频开评论区之前：手机录屏 → scp 音频到 mmv → ssh mmv qualify-video.js judge（judge-video.js judgeOneVideo）；只有 matched 才采集（8bb3af55 先判后采）" }
    budget: { max_duration_s: 1800, heartbeat_s: 60 }
    resources:
      locks: ["device:<serial>"]
      limits: [{ name: record_budget_s_per_video, value: "10-105（(时长+2)/3+5）" }]
    idempotency: { dedupe_key: "Video.line_key+Video.video_id", on_duplicate: skip }
    failure:
      empty_ok: ["本批无 pending 视频"]
      retryable: ["转写调用失败留 pending 下轮重判（judge-video.js 转写 catch）", "判定 API 故障（OpenRouter 402/429/网络）留 pending，judgment_reason 记「判定异常(待重判)」（judge-video.js markVideoJudgeError）", "录音死寂（harvest-keyword.sh 电平打点）"]
      needs_human:
        cases: ["整批转写/判定失败（DashScope/OpenRouter 鉴权或欠费）"]
        alert: { channel: bark, object: "judge-video.js 整批失败 → Bark" }
      fatal: []
    side_effects:
      - { kind: internal_write, target: "pg zenithjoy.leadgen_videos", description: "写 judgment_status/judgment_reason/transcript" }
    invokers: [code, agent]
    runtime: { phase: per_item, entry: harvest-keyword.sh, args: "PROFILE SOURCE_ENC MAXV TAG LOC LINE（逐视频先判后采，发现经 env DISCOVER_CMD 注入）" }
    model:
      - { provider: dashscope, model: qwen-audio-3.0-asr-flash, purpose: "视频口播转写（transcribe-qwen-audio.js:19）" }
      - { provider: openrouter, model: typesafe/jev-1.13, purpose: "文案×目标人群主判（judge-jev.js:16）" }
      - { provider: openrouter, model: google/gemini-2.5-flash, purpose: "低置信（<0.6）复核（judge-jev.js:17-18）" }
    steps:
      - { key: cheap_gate, name: 便宜闸, order: 1, reads: [Video.comment_count], writes: [Video.judgment_status],
          check: "comment_count==0 或图文 → rejected，不录不转写", implementation: { status: implemented, ref: "图文：harvest-keyword.sh current-video-link excluded_non_video 直接跳过；零评论：批量重判 judge-video-lib.js shouldSkipCheapGate。行内判定时评论数要开评论区才读得到，先判后采不走零评论闸（cheapGate:false），零评论视频判 matched 后 open-comments 回 no_comments 不采" }, uses_llm: false }
      - { key: unmute_before_record, name: 录前取消静音, order: 2, reads: [Video.video_url, Device.lock_holder], writes: [],
          check: "媒体音量回读 >0", implementation: { status: implemented, ref: "harvest-keyword.sh（PR #1964 录制集成）" }, uses_llm: false }
      - { key: record_triple_speed, name: 3倍速录屏, order: 3, reads: [Video.video_url], writes: [],
          check: "录屏文件存在且时长 ≥ 预算的 80%", implementation: { status: implemented, ref: "douyin-phone-adb:1638 set-playback-speed / record-start" }, uses_llm: false }
      - { key: extract_audio, name: 提取16k音频, order: 4, reads: [Video.video_id], writes: [],
          check: "ffprobe 有 16kHz 音频流且电平非死寂", implementation: { status: implemented, ref: "douyin-phone-adb record-extract-audio" }, uses_llm: false }
      - { key: transcribe, name: 通义ASR转写, order: 5, reads: [Video.video_id], writes: [Video.transcript],
          check: "transcript 非空；空/静音 → rejected", implementation: { status: implemented, ref: "transcribe-qwen-audio.js" }, uses_llm: true }
      - { key: judge_content, name: 意向判定, order: 6, reads: [Video.transcript, Video.title], writes: [Video.judgment_status, Video.judgment_reason],
          check: "judgment_status ∈ {matched, rejected} 且 judgment_reason 非空", implementation: { status: implemented, ref: "judge-jev.js / leadgen-db-lib.js:54" }, uses_llm: true }

  # ───────────────────────────── 4 采集 ─────────────────────────────
  - key: collection
    name: 采集
    order: 4
    version: 1.0.0
    compatibility: backward
    owner: { department: line02 智能获客, agent: 获客采收员 }
    inputs:
      - { type: Video, cardinality: many, fields: [line_key, video_id, video_url, judgment_status] }
      - { type: Device, cardinality: one, fields: [serial, lock_holder] }
      - { type: Account, cardinality: one, fields: [sender_id, nickname] }
    outputs:
      - { type: Comment, cardinality: many, effect: create, fields: [line_key, dedup_key, nickname, douyin_id, profile_url, body, video_id, harvest_batch] }
      - { type: Video, cardinality: many, effect: update, fields: [process_status] }
    preconditions:
      - "只处理 judgment_status=matched 的视频"
      - "设备锁由本 run 持有（每个视频 lock-refresh 一次，harvest-keyword.sh:53）"
    postconditions:
      - { probe: coll_only_matched, asserts: "未判合格的视频不被采评论" }
      - { probe: coll_video_binding_consistent, asserts: "每条评论归属的视频必须是本 run 验证过仍打开着的视频，不能是抢救后漂移到的别的视频" }
    execution: { location: phone, via: "xian-m4 harvest-keyword.sh:45-260 → douyin-phone-adb" }
    budget: { max_duration_s: 7200, heartbeat_s: 300 }
    resources:
      locks: ["device:<serial>"]
      limits: [{ name: max_comments_big_video, value: 50 }, { name: stop_after_empty_screens, value: 2 }]
    idempotency: { dedupe_key: "Comment.line_key+Comment.dedup_key", on_duplicate: skip }
    failure:
      empty_ok: ["视频无新评论"]
      retryable: ["评论区打不开重试 1 次（harvest-keyword.sh:115-125）", "commenter-identity 重试 3 次（harvest-keyword.sh:197-214）"]
      needs_human:
        cases: ["评论数>0 却整词 0 评论，疑改版"]
        alert: { channel: bark, object: "escort 升级 → Bark" }
      fatal: ["未判合格的视频被采了评论（先采后判复活）", "评论归属到本批没打开过的视频（视频漂移错配）"]
    side_effects:
      - { kind: internal_write, target: "执行机 ~/night-$TAG.tsv", description: "LEAD/VIDEO/AUDIO 行" }
    invokers: [code, agent]
    runtime: { phase: per_item, entry: harvest-keyword.sh, args: "PROFILE SOURCE_ENC MAXV TAG LOC LINE（判定 matched 才采评论）" }
    model:
      - { provider: openrouter, model: bytedance/ui-tars-1.5-7b, purpose: "评论图标兜底定位（douyin-phone-adb:2076）" }
    steps:
      - { key: open_comment_section, name: 开评论区, order: 1, reads: [Video.video_url, Video.judgment_status], writes: [],
          check: "评论区面板节点可见", implementation: { status: implemented, ref: "harvest-keyword.sh:115-125" }, uses_llm: true }
      - { key: collect_comments, name: 采集评论, order: 2, reads: [Video.video_id, Account.nickname], writes: [Comment.body, Comment.nickname, Comment.video_id, Comment.dedup_key, Comment.harvest_batch, Comment.line_key],
          check: "逐屏整行去重，连续 2 屏无新增即停；过滤作者本人与自有账号", implementation: { status: implemented, ref: "harvest-keyword.sh:154-240" }, uses_llm: false }
      - { key: verify_commenter_identity, name: 评论人身份验证, order: 3, reads: [Comment.nickname], writes: [Comment.douyin_id],
          check: "主页强校验：抖音号合法 + 账号三态 + 非自有账号；验证失败抢救(back+重开评论区)后核对 current-video-link 仍是本视频，漂移即本视频剩余评论作废(0929修，见下 known_gaps)", implementation: { status: implemented, ref: "harvest-keyword.sh:191-233" }, uses_llm: false }
      - { key: resolve_profile_link, name: 客户主页直链, order: 4, reads: [Comment.douyin_id], writes: [Comment.profile_url],
          check: "分享名片 → sec_uid，剪贴板守卫回读；失败重试3次(同commenter-identity套路)，3次仍失败才降级为线索保留但链接为空", implementation: { status: implemented, ref: "harvest-keyword.sh（PR #1952 逐屏处理 + 0929批次4加重试）" }, uses_llm: false }
      - { key: mark_video_collected, name: 标记视频已采, order: 5, reads: [Video.video_id], writes: [Video.process_status],
          check: "process_status=评论已采 只写给 matched 视频", implementation: { status: implemented, ref: "harvest-keyword.sh 采完 qual_remote collected → qualify-video.js collected → leadgen-db-lib.js markVideoCollected（WHERE judgment_status=matched 兜底，8bb3af55）" }, uses_llm: false }
    known_gaps:
      - { gap: "coll_video_binding_consistent 只能核对孤儿归属（评论来源视频必须是本批落过库的视频），抓不住漂移到同批另一条真实视频的语义错配；行内防线是 harvest-keyword.sh video_drifted（0929）。要抓同批错配需账本记每条评论采集时的视频身份序列做交叉核验", task: 878fe194 }

  # ───────────────────────────── 5 评分 ─────────────────────────────
  - key: scoring
    name: 评分
    order: 5
    version: 1.0.0
    compatibility: backward
    owner: { department: line02 智能获客, agent: 评论分拣员 }
    inputs:
      - { type: Comment, cardinality: many, fields: [dedup_key, body, nickname, douyin_id, profile_url, process_status] }
      - { type: Video, cardinality: many, fields: [title, transcript] }
    outputs:
      - { type: Comment, cardinality: many, effect: update, fields: [process_status, relevance, intent_grade, promoted] }
      - { type: Lead, cardinality: many, effect: upsert, fields: [line_key, douyin_id, nickname, profile_url, intent_grade, repeat_hits, status] }
    preconditions:
      - "评论 process_status=待分拣"
