      - { type: Lead, cardinality: many, fields: [douyin_id, status] }
      - { type: Run, cardinality: one, fields: [run_tag] }
    outputs:
      - { type: Video, cardinality: many, effect: update, fields: [feishu_record_id] }
      - { type: Comment, cardinality: many, effect: upsert, fields: [line_key, dedup_key, harvest_batch] }
    preconditions:
      - "批次 TSV 已 scp 到 mmv"
      - "业务线可由 profile 路由（line-routes.js routeOf）"
    postconditions:
      - { probe: videos_readback, asserts: "本批视频全部读回" }
      - { probe: comments_readback, asserts: "本批评论全部落池读回" }
      - { probe: line_key_not_null, asserts: "本批视频业务线全非空" }
    execution: { location: mmv, via: "batch2.sh:95-108 → push-videos.js + push-raw-comments.js" }
    budget: { max_duration_s: 600, heartbeat_s: 60 }
    resources:
      locks: []
      limits: []
    idempotency: { dedupe_key: "Comment.line_key+Comment.dedup_key", on_duplicate: skip }
