      - { type: OutreachOrder, cardinality: one, effect: create, fields: [lead_record_id, douyin_id, sender_id, script_id, message, result] }
      - { type: Lead, cardinality: one, effect: update, fields: [status, send_status, script_id, sender_id, reached_at] }
    preconditions:
      - "发送账号可用：未熔断（无 state/dm-paused-<profile>.flag，软熔断 soft_until 未到期也算熔断）、当日未风控停发（dm-halt）、当日真实发送数 < daily_cap（config/dm-rate-ramp.json）；不可用账号在取单前经 --exclude 排除"
      - "触达等级 ∈ 该业务线 outreachGrades（选单时过滤，决策 67762358；老数据无等级前缀放行）"
      - "线索有 https 主页链接与合法抖音号（next-outreach-lib.js:24-29）"
      - "话术库有可用话术"
    postconditions:
      - { probe: out_no_stuck_inflight, asserts: "tick 收工后无悬空「触达中」单" }
    execution: { location: xian-m4, via: "crontab 每 30 分 outreach-tick.sh → ssh mmv next-outreach.js 取单 → douyin-phone-adb；收工经 workflow-result.sh outreach-run 进账本并读回 out_no_stuck_inflight（6b133a81）" }
    budget: { max_duration_s: 1500, heartbeat_s: 60 }
    resources:
