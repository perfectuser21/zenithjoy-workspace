networks:
  zenithjoy-net:
    name: zenithjoy-net
    driver: bridge

services:
  autopilot-dashboard:
    image: nginx:alpine
    container_name: autopilot-dashboard
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/zenithjoy/autopilot-dashboard/dist:/usr/share/nginx/html:ro
      - /opt/zenithjoy/autopilot-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Staff Hub — 员工内部前端，只绑 Tailscale IP(100.86.118.99)，公网不可达
  # 跟客户前端(autopilot-dashboard)物理隔离：独立容器/独立端口/独立nginx.conf
  # 9443 = https://staff.zenjoymedia.media:9443（灰云DNS指向Tailscale IP，证书走acme.sh DNS-01）
  #        443/8443 已被 cn-https(通配0.0.0.0:443会独占整个端口)/xray-reality 占用，改用9443
  # 8090 = 裸IP兼容访问，两者安全模型一致，都只在Tailscale IP上可达
  staff-hub:
    image: nginx:alpine
    container_name: staff-hub
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "100.86.118.99:8090:80"
      - "100.86.118.99:9443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/zenithjoy/staff-hub/dist:/usr/share/nginx/html:ro
      - /opt/zenithjoy/staff-hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/zenithjoy/staff-hub/common.conf:/etc/nginx/staff-hub-common.conf:ro
      - /opt/zenithjoy/staff-hub/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
