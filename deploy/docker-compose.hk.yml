networks:
  zenithjoy-net:
    name: zenithjoy-net
    driver: bridge

services:
  autopilot-dashboard:
    image: nginx:alpine
    container_name: autopilot-dashboard
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/zenithjoy/autopilot-dashboard/dist:/usr/share/nginx/html:ro
      - /opt/zenithjoy/autopilot-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
