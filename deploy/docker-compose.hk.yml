networks:
  zenithjoy-net:
    name: zenithjoy-net
    driver: bridge

services:
  zenithjoy-postgres:
    image: postgres:17-alpine
    container_name: zenithjoy-postgres
    ports:
      - "100.86.118.99:5432:5432"
    restart: unless-stopped
    networks:
      - zenithjoy-net
    environment:
      POSTGRES_USER: cecelia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cecelia
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='cp %p /var/lib/postgresql/wal_archive/%f'
      -c archive_timeout=300
    volumes:
      - zenithjoy-pg-data:/var/lib/postgresql/data
      - /opt/zenithjoy-wal-archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cecelia"]
      interval: 10s
      timeout: 5s
      retries: 5

  zenithjoy-api:
    image: zenithjoy-api:latest
    container_name: zenithjoy-api
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "127.0.0.1:5200:5200"
    depends_on:
      zenithjoy-postgres:
        condition: service_healthy
    env_file:
      - /opt/zenithjoy/api/.env
    volumes:
      - /opt/zenithjoy/install-pack:/opt/zenithjoy/install-pack
      - /opt/zenithjoy/content-output:/opt/zenithjoy/content-output
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5200/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  autopilot-dashboard:
    image: nginx:alpine
    container_name: autopilot-dashboard
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "80:80"
      - "5211:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/zenithjoy/autopilot-dashboard/dist:/usr/share/nginx/html:ro
      - /opt/zenithjoy/autopilot-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - zenithjoy-api

volumes:
  zenithjoy-pg-data:
    name: zenithjoy-pg-data
