# Dedicated CONNECT path for staging video API; never a global system proxy.
# TLS terminates at Alibaba, not at this relay.
Listen 100.69.180.117
Port 18241
Timeout 120
MaxClients 24
LogLevel Warning
Syslog On
Allow 100.86.118.99
ConnectPort 443
Filter "/opt/zenithjoy/video-api-relay/hosts.filter"
FilterExtended On
FilterCaseSensitive No
FilterDefaultDeny Yes
FilterURLs Yes
DisableViaHeader Yes
