# ───────────────────────────────────────────────────────────────────────────
# Dashboard STAGING 实例（2026-06-25）
#   生产 dashboard = autopilot-dashboard 容器（:80）→ autopilot.zenjoymedia.media
#   STAGING dashboard = 本文件的 autopilot-staging 容器（:521）
#     → staging-autopilot.zenjoymedia.media（Cloudflare tunnel ingress）
#
#   关键区别：staging 用独立的 nginx.staging.conf——其中所有 :5200（生产 API）
#   已改成 :5201（常驻 staging API，连 zenithjoy_test 库、无客户流量）。
#   dist 也是用 staging build env 单独 build 的（见 deploy-dashboard-staging.yml）。
#
#   死规矩：AI 只发到 staging，生产 autopilot 由用户手点放行。本 compose 绝不碰生产容器。
# ───────────────────────────────────────────────────────────────────────────
networks:
  zenithjoy-net:
    name: zenithjoy-net
    external: true

services:
  autopilot-staging:
    image: nginx:alpine
    container_name: autopilot-staging
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "521:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/zenithjoy/autopilot-staging/dist:/usr/share/nginx/html:ro
      - /opt/zenithjoy/autopilot-staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
