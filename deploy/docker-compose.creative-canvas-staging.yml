# One employee per instance. This file defines exactly one private candidate.
# Set ZENITHJOY_CANVAS_TOKEN in the deployment environment; never commit it.
# Provision the matching API identity mapping separately before enabling a user.
services:
  creative-canvas-staging:
    container_name: zenithjoy-creative-canvas-staging-1
    build:
      context: ..
      dockerfile: infrastructure/comfyui/Dockerfile
    image: zenithjoy-creative-canvas-staging:local
    restart: unless-stopped
    networks:
      - canvas-staging-net
    environment:
      ZENITHJOY_CANVAS_API: http://zenithjoy-api-staging:5200
      ZENITHJOY_CANVAS_TOKEN: ${ZENITHJOY_CANVAS_TOKEN:?Set a unique private token for this employee instance}
    volumes:
      - creative-canvas-staging-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
volumes:
  creative-canvas-staging-data:
    name: zenithjoy-creative-canvas-staging-1-data
networks:
  canvas-staging-net:
    name: zenithjoy-canvas-staging-net
    external: true
