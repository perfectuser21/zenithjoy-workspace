# BEGIN CANVAS CACHE MAP
# Only successful fingerprinted frontend assets with matching MIME types.
map $uri $canvas_asset_kind {
    default "other";
    ~\.js$ "js";
    ~\.css$ "css";
    ~\.woff2$ "woff2";
}
map "$status:$request_method:$canvas_asset_kind:$upstream_http_content_type" $canvas_asset_cache {
    default "no-store";
    "~*^200:(GET|HEAD):js:(text|application)/(javascript|x-javascript)(;.*)?$" "private, max-age=604800, immutable";
    "~*^200:(GET|HEAD):css:text/css(;.*)?$" "private, max-age=604800, immutable";
    "~*^200:(GET|HEAD):woff2:(font/woff2|application/(font-woff2|octet-stream))(;.*)?$" "private, max-age=604800, immutable";
}
# END CANVAS CACHE MAP

# BEGIN CANVAS STARTUP DIAGNOSTIC MAP
map $status $canvas_diagnostic_head {
    default "<head>";
    200 '<head><script src="/canvas-startup-diagnostic.js"></script>';
}
# END CANVAS STARTUP DIAGNOSTIC MAP

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/_releases/current;
    index index.html;


    # 内容图片代理 — 转发到 Mac mini 图片服务器（Tailscale）
    location /content-images/ {
        proxy_pass http://100.71.151.105:9998/images/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # 飞书登录 API — 路由到 feishu-login 容器（host port 5690）
    location = /api/feishu-login {
        proxy_pass http://172.22.0.4:5690/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30;
    }

    # Brain API
    location /api/brain/ {
        proxy_pass http://100.71.151.105:5221/api/brain/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    # Python content service (Mac via Tailscale) — topics/pacing/pipelines
    location /api/topics { proxy_pass http://100.71.151.105:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/pacing { proxy_pass http://100.71.151.105:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /api/pipelines { proxy_pass http://100.71.151.105:8899; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # ── SSE 专属 location（必须在通用 /api/ 和 /api/ai-video/ 之前，regex 优先级最高）──
    location ~ ^/api/acquisition/collect/[^/]+/sse$ {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Agent 端采集任务推送 SSE（路径无资源 ID，独立于上面 collect/:id/sse）
    location = /api/acquisition/agent/task-stream {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/api/ai-video/task/[^/]+/sse$ {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/api/ai-video/jobs/[^/]+/sse$ {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 素材上传 — 大文件 + 长超时。默认 client_max_body_size 是 1MB，iPhone 随手一张
    # 照片就超（实测 2MB 直接 413），视频更不用说。这个 location 必须显式放开，
    # 否则 /api/ 通用路径会在 nginx 层就把请求截掉，Express 端根本收不到。
    # proxy_request_buffering off：大视频边收边转，不在 nginx 落一份临时文件。
    #
    # 精确匹配 /api/materials（不带尾斜杠）——listMaterials() 等列表/详情类请求走这条。
    # 没有这条时 `location /api/materials/` 会对不带斜杠的请求触发 nginx 自动 301
    # 补斜杠，Location 头用的是本层已知的 http scheme（本文件只 listen 80，不知道外层
    # 是 https），浏览器当 mixed content 拦掉，axios 端表现为无信息量的 "Network Error"。
    location = /api/materials {
        proxy_pass http://zenithjoy-api-staging:5200/api/materials;  # gitleaks:allow 这是容器名+端口+路径，不是密钥
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4096m;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_request_buffering off;
    }

    location /api/materials/ {
        proxy_pass http://zenithjoy-api-staging:5200/api/materials/;  # gitleaks:allow 这是容器名+端口+路径，不是密钥
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4096m;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_request_buffering off;
    }

    # AI视频 jobs/upload — 大文件 + 长超时 → US VPS zenithjoy-api (Tailscale)
    location /api/ai-video/jobs {
        proxy_pass http://zenithjoy-api-staging:5200/api/ai-video/jobs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4096m;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_request_buffering off;
    }

    location /api/ai-video/upload {
        proxy_pass http://zenithjoy-api-staging:5200/api/ai-video/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4096m;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_request_buffering off;
    }

    # install-pack download — 需要较长超时
    location /api/agent/install-pack/download {
        proxy_pass http://zenithjoy-api-staging:5200/api/agent/install-pack/download;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # AI视频子路径 — transcribe/design/compose-html 等需 OpenRouter
    location /api/ai-video/ {
        proxy_pass http://zenithjoy-api-staging:5200/api/ai-video/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120;
        proxy_send_timeout 120;
    }

    # Wan / 超分工具：应用限单文件 100 MB，预留 multipart 开销；只转发到 staging API。
    location ^~ /api/video-tools/ {
        proxy_pass http://zenithjoy-api-staging:5200/api/video-tools/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 110m;
        client_body_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # BEGIN CANVAS STARTUP DIAGNOSTIC
    location = /api/creative-canvas/ {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
        sub_filter_once on;
        sub_filter '<head>' $canvas_diagnostic_head;
    }
    # END CANVAS STARTUP DIAGNOSTIC

    # ZenithJoy REST API → US VPS zenithjoy-api (Tailscale)
    location ^~ /api/creative-canvas/ {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 110m;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
        # BEGIN CANVAS ASSET CACHE
        location ~ "^/api/creative-canvas/assets/[a-zA-Z0-9_.-]+-[a-zA-Z0-9_-]{8,}\.(js|css|woff2)$" {
            proxy_pass http://zenithjoy-api-staging:5200;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $canvas_asset_cache always;
            add_header Vary "Cookie, Authorization" always;
        }
        # END CANVAS ASSET CACHE
    }

    location /api/ {
        proxy_pass http://zenithjoy-api-staging:5200/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30;
    }

    # Agent WebSocket → US VPS zenithjoy-api (Tailscale)
    location /agent-ws {
        proxy_pass http://zenithjoy-api-staging:5200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Douyin OAuth callback → US VPS zenithjoy-api (Tailscale)
    location /auth/ {
        proxy_pass http://zenithjoy-api-staging:5200/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30;
    }

    # sw.js / index.html — no-cache so browsers always fetch the latest entry point.
    # Other assets under /assets/ are content-hashed and get 1y immutable (see below).
    # try_files returns 404 (not /index.html) to avoid serving SPA HTML as a service worker.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets {
        root /usr/share/nginx/html/_shared_assets;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
