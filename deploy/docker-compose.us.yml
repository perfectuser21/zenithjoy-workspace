networks:
  zenithjoy-net:
    name: zenithjoy-net
    driver: bridge

services:
  zenithjoy-postgres:
    image: postgres:17-alpine
    container_name: zenithjoy-postgres
    restart: unless-stopped
    networks:
      - zenithjoy-net
    environment:
      POSTGRES_USER: cecelia
      POSTGRES_PASSWORD: 239af9cf9a25d2d1940c90ea839d472c9a00c15dd32dc5ef
      POSTGRES_DB: cecelia
    volumes:
      - zenithjoy-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cecelia"]
      interval: 10s
      timeout: 5s
      retries: 5

  zenithjoy-api:
    image: zenithjoy-api:latest
    container_name: zenithjoy-api
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      # Bind on Tailscale interface so HK VPS (100.86.118.99) can proxy here
      - "100.79.41.61:5200:5200"
      - "127.0.0.1:5200:5200"
    depends_on:
      zenithjoy-postgres:
        condition: service_healthy
    env_file:
      - /opt/zenithjoy/api/.env
    volumes:
      - /opt/zenithjoy/install-pack:/opt/zenithjoy/install-pack
      - /opt/zenithjoy/content-output:/opt/zenithjoy/content-output
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5200/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  zenithjoy-pg-data:
    name: zenithjoy-pg-data
