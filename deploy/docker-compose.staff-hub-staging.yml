# ───────────────────────────────────────────────────────────────────────────
# Staff Hub Staging — 员工前端候选环境（对齐 apps/api 已有的
# docker-compose.staging-api.yml / docker-compose.prod-api.yml 分离模式）。
#
#   push main（apps/staff-hub/** 或 deploy/staff-hub/**）→ deploy-staff-hub-staging.yml
#   自动 rsync + docker compose up 到本容器，绝不碰生产 staff-hub（deploy/docker-compose.hk.yml）。
#   生产更新走人工闸门 promote-staff-hub-prod-hk.yml（workflow_dispatch）。
#
#   /api/ 代理目标是 zenithjoy-api-staging（见 common-staging.conf），
#   跟生产 staff-hub 代理 zenithjoy-api-prod 物理隔离。
# ───────────────────────────────────────────────────────────────────────────
networks:
  zenithjoy-net:
    name: zenithjoy-net
    external: true

services:
  staff-hub-staging:
    image: nginx:alpine
    container_name: staff-hub-staging
    restart: unless-stopped
    networks:
      - zenithjoy-net
    ports:
      - "100.86.118.99:8091:80"
      - "100.86.118.99:9444:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/zenithjoy/staff-hub-staging/dist:/usr/share/nginx/html:ro
      - /opt/zenithjoy/staff-hub-staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/zenithjoy/staff-hub-staging/common.conf:/etc/nginx/staff-hub-staging-common.conf:ro
      - /opt/zenithjoy/staff-hub/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
