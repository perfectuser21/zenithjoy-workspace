# Staff Hub Staging — 员工内部前端候选环境，只绑 Tailscale IP（100.86.118.99），公网不可达
# 跟生产(staff-hub, 8090/9443)物理隔离：独立容器/独立端口/独立nginx.conf/独立后端(zenithjoy-api-staging)
# 80 容器内部：裸 IP 兼容访问（http://100.86.118.99:8091）
# 443 容器内部：https://staff.zenjoymedia.media:9444（同一张证书，SNI 对同域名的不同端口无影响）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/staff-hub-staging-common.conf;
}

server {
    listen 443 ssl;
    server_name staff.zenjoymedia.media;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/staff.key;

    include /etc/nginx/staff-hub-staging-common.conf;
}
