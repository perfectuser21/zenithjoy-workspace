# Staff Hub — 员工内部前端，只绑 Tailscale IP（100.86.118.99），公网不可达
# 80：裸 IP 兼容访问（http://100.86.118.99:8090）
# 443：https://staff.zenjoymedia.media 域名访问，证书走 Cloudflare DNS-01（acme.sh）签发，
#      DNS 记录是灰云 A 记录指向 Tailscale IP——域名只是好记的别名，不在 tailnet 内的人
#      查得到这条 DNS 记录但连不上这个 IP，安全模型跟裸 IP 完全一致
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/staff-hub-common.conf;
}

server {
    listen 443 ssl;
    server_name staff.zenjoymedia.media;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.cer;
    ssl_certificate_key /etc/nginx/certs/staff.key;

    include /etc/nginx/staff-hub-common.conf;
}
