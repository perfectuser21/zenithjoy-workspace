# Staff Hub 共享 location 配置，被 80(裸IP兼容)和 443(域名) 两个 server 块 include 复用

# Wan / 超分工具：100 MB 单文件上传和成片下载，避免通用 API 的 1 MB 限制。
location ^~ /api/video-tools/ {
    proxy_pass http://zenithjoy-api-prod:5200/api/video-tools/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 110m;
    client_body_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_request_buffering off;
    proxy_buffering off;
}

# ZenithJoy 后端 API（同 zenithjoy-net 网络，走容器名解析）
location ^~ /api/creative-canvas/ {
    proxy_pass http://zenithjoy-api-prod:5200;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 110m;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_buffering off;
}

location /api/ {
    proxy_pass http://zenithjoy-api-prod:5200/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30;
}

location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}

location /assets {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA 路由
location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
