# Staff Hub Staging 共享 location 配置，被 80(裸IP兼容)和 443(域名) 两个 server 块 include 复用
# 与 common.conf 唯一差异：/api/ 代理目标是 zenithjoy-api-staging（不是 zenithjoy-api-prod）

# Wan / 超分工具：100 MB 单文件上传和成片下载，只转发到 staging API。
location ^~ /api/video-tools/ {
    proxy_pass http://zenithjoy-api-staging:5200/api/video-tools/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 110m;
    client_body_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_request_buffering off;
    proxy_buffering off;
}

location /api/ {
    proxy_pass http://zenithjoy-api-staging:5200/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30;
}

location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}

location /assets {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA 路由
location / {
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
